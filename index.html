<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15121c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Liturgia OSM — Servos de Maria</title>
<style>
:root{
  --bg-deep:#15121c;
  --bg-panel:#1c1826;
  --bg-panel-2:#221d30;
  --line:#33293f;
  --gold:#c49a4a;
  --gold-soft:#e3c988;
  --wine:#8a2f3d;
  --wine-soft:#b85566;
  --paper:#f4eee0;
  --paper-dim:#e7ddc6;
  --text:#ece4d3;
  --text-muted:#a89a86;
  --text-faint:#786a5c;
  --shadow: 0 18px 40px -18px rgba(0,0,0,.65);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:Georgia, 'Times New Roman', serif;
  min-height:100vh;
  overflow-x:hidden;
}

#app{
  position:relative;
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== ambient background ===== */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 700px 380px at 15% -5%, rgba(196,154,74,.13), transparent 60%),
    radial-gradient(ellipse 600px 500px at 100% 30%, rgba(138,47,61,.16), transparent 60%),
    linear-gradient(180deg, #15121c 0%, #120f18 55%, #100d15 100%);
}

/* ===== header ===== */
.topbar{
  position:relative; z-index:2;
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(28,24,38,.9), rgba(28,24,38,.4));
  backdrop-filter: blur(6px);
}
.topbar-inner{display:flex; align-items:center; gap:14px;}
.crest{color:var(--gold-soft); flex:none; filter:drop-shadow(0 0 6px rgba(196,154,74,.35));}
.eyebrow{
  margin:0 0 2px; font-family:Georgia, 'Times New Roman', serif; font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--wine-soft); font-weight:600;
}
.topbar h1{
  margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:20px; font-weight:600;
  color:var(--gold-soft); letter-spacing:.02em; line-height:1.15;
}

/* ===== main view ===== */
main#view{
  position:relative; z-index:1;
  flex:1;
  padding:18px 18px 100px;
}

.section-title{
  font-family:Georgia, 'Times New Roman', serif; font-size:12px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--text-faint); margin:26px 0 10px; padding-left:2px;
}
.section-title:first-child{margin-top:0;}

/* ===== cards ===== */
.card{
  background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  position:relative;
}
.card::before{
  content:"";
  position:absolute; inset:0; border-radius:14px; padding:1px;
  background:linear-gradient(160deg, rgba(196,154,74,.35), transparent 40%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}

/* ---- date hero ---- */
.hero-date{
  text-align:center;
  padding:26px 18px 22px;
}
.hero-date .weekday{
  font-family:Georgia, 'Times New Roman', serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:6px;
}
.hero-date .day{
  font-family:Georgia, 'Times New Roman', serif; font-size:56px; line-height:1; color:var(--gold-soft);
  font-weight:600; text-shadow:0 0 24px rgba(196,154,74,.25);
}
.hero-date .month{
  font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:19px; color:var(--text-muted);
  margin-top:6px;
}
.hero-divider{
  width:64px; height:1px; margin:16px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ---- saint of the day card ---- */
.saint-card .rank{
  display:inline-block; font-family:Georgia, 'Times New Roman', serif; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--bg-deep); background:var(--gold-soft);
  padding:3px 9px; border-radius:20px; margin-bottom:10px; font-weight:600;
}
.saint-card h2{
  font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:25px; margin:0 0 4px;
  color:var(--paper); line-height:1.2;
}
.saint-card .date-line{
  color:var(--text-muted); font-style:italic; font-size:15px; margin-bottom:14px;
}
.empty-note{
  color:var(--text-muted); font-size:16px; line-height:1.6; font-style:italic;
}
.link-row{
  margin-top:14px; display:flex; justify-content:flex-end;
}
.btn-link{
  font-family:Georgia, 'Times New Roman', serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-soft); background:none; border:1px solid var(--line); border-radius:20px;
  padding:9px 16px; cursor:pointer; transition:.2s;
}
.btn-link:active{ background:rgba(196,154,74,.12); }

/* ---- angelus toggle card ---- */
.toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
.toggle-btn{
  flex:1; font-family:Georgia, 'Times New Roman', serif; font-size:11px; letter-spacing:.06em;
  background:var(--bg-panel); border:1px solid var(--line); color:var(--text-muted);
  padding:10px 6px; border-radius:10px; cursor:pointer; text-transform:uppercase;
}
.toggle-btn.active{ background:rgba(196,154,74,.14); border-color:var(--gold); color:var(--gold-soft); }

.prayer-block{
  font-family:Georgia, 'Times New Roman', serif; font-size:18px; line-height:1.7; color:var(--paper-dim);
  white-space:pre-wrap;
}
.prayer-block .rubric{ color:var(--wine-soft); font-weight:600; }

/* ===== santoral list ===== */
.search-wrap{ margin-bottom:18px; }
.search-input{
  width:100%; background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  color:var(--text); font-family:'EB Garamond',serif; font-size:16px; padding:12px 16px;
  outline:none;
}
.search-input::placeholder{ color:var(--text-faint); }
.search-input:focus{ border-color:var(--gold); }

.month-group{ margin-bottom:6px; }
.month-label{
  font-family:Georgia, 'Times New Roman', serif; font-size:12px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--wine-soft); margin:22px 2px 8px;
}
.saint-row{
  display:flex; align-items:center; gap:14px;
  padding:13px 4px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.saint-row:active{ background:rgba(196,154,74,.06); }
.saint-row .daynum{
  font-family:Georgia, 'Times New Roman', serif; font-size:20px; color:var(--gold-soft); width:30px; text-align:center; flex:none;
}
.saint-row .rowtext{ flex:1; min-width:0; }
.saint-row .rowtitle{ font-size:17px; color:var(--paper); }
.saint-row .rowrank{ font-size:12.5px; color:var(--text-faint); font-style:italic; }
.saint-row .chev{ color:var(--text-faint); flex:none; }
.no-results{ color:var(--text-faint); font-style:italic; padding:24px 4px; text-align:center; }

/* ===== detail view ===== */
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--gold-soft); font-family:Georgia, 'Times New Roman', serif;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:8px 2px; margin-bottom:14px; cursor:pointer;
}
.detail-header{ text-align:center; padding:6px 6px 22px; }
.detail-header .rank{
  display:inline-block; font-family:Georgia, 'Times New Roman', serif; font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold-soft); margin-bottom:10px;
}
.detail-header h2{
  font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:30px; color:var(--paper);
  margin:0 0 8px; line-height:1.15;
}
.detail-header .date-line{ color:var(--text-muted); font-style:italic; font-size:16px; }
.detail-divider{
  width:80px; height:1px; margin:18px auto; background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
.bio-text{
  font-size:18px; line-height:1.75; color:var(--paper-dim); white-space:pre-wrap; margin-bottom:6px;
}
.prayer-card{
  margin-top:10px;
  background:linear-gradient(180deg, rgba(138,47,61,.14), rgba(138,47,61,.04));
  border:1px solid rgba(138,47,61,.35);
  border-radius:14px; padding:20px;
}
.prayer-card .label{
  font-family:Georgia, 'Times New Roman', serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:10px;
}
.prayer-card .text{
  font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:19px; line-height:1.75; color:var(--paper);
  white-space:pre-wrap;
}

/* ===== about ===== */
.about-text{ font-size:17px; line-height:1.75; color:var(--paper-dim); }
.about-text p{ margin:0 0 14px; }
.about-quote{
  font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:19px; text-align:center;
  color:var(--gold-soft); padding:22px 10px; line-height:1.6;
}
.credit-list{ font-size:15px; color:var(--text-muted); line-height:1.9; }
.credit-list b{ color:var(--text); font-weight:600; }

/* ===== tabbar ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  max-width:560px; margin:0 auto;
  display:flex;
  background:rgba(20,17,28,.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-faint); cursor:pointer;
  padding:6px 2px; font-family:Georgia, 'Times New Roman', serif; font-size:10px; letter-spacing:.04em;
}
.tab-btn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.tab-btn.active{ color:var(--gold-soft); }
.tab-btn.active svg{ fill:rgba(196,154,74,.18); }

/* ===== fade transition ===== */
.fade-in{ animation:fadeIn .28s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

@media (min-width:560px){
  .ambient{ }
}


/* ===== usability enhancements ===== */
:root{ --reader-scale:1; }
body.light-mode{
  --bg-deep:#f5f0e6; --bg-panel:#fffaf1; --bg-panel-2:#fffdf8; --line:#d9ccb5;
  --gold:#9a6e25; --gold-soft:#765019; --wine:#8a2f3d; --wine-soft:#9b4050;
  --paper:#2e271f; --paper-dim:#453c31; --text:#2e271f; --text-muted:#6e6254; --text-faint:#8b7d6b;
  --shadow:0 12px 30px -20px rgba(58,42,22,.35);
}
body.light-mode .ambient{background:radial-gradient(ellipse 700px 380px at 15% -5%,rgba(196,154,74,.13),transparent 60%),linear-gradient(180deg,#f7f2e9,#efe6d8);}
body.light-mode .topbar{background:rgba(255,250,241,.94);}
body.light-mode .tabbar{background:rgba(255,250,241,.96);}
.topbar{position:sticky;top:0;padding:14px 16px 12px;}
.topbar-inner{gap:11px;}
.crest svg{width:30px;height:30px;}
.topbar h1{font-size:17px;}
.eyebrow{font-size:9px;}
.topbar-tools{margin-left:auto;display:flex;gap:6px;align-items:center;}
.tool-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg-panel);color:var(--gold-soft);font-family:Georgia, 'Times New Roman', serif;font-size:11px;display:grid;place-items:center;cursor:pointer;}
.tool-btn:active{transform:scale(.96);background:rgba(196,154,74,.12);}
main#view{padding-top:14px;}
.hero-date{padding:10px 12px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:'day weekday' 'day month' 'divider divider';column-gap:14px;text-align:left;align-items:end;}
.hero-date .day{grid-area:day;font-size:46px;}
.hero-date .weekday{grid-area:weekday;margin:0 0 1px;align-self:end;}
.hero-date .month{grid-area:month;margin:0;}
.hero-divider{grid-area:divider;width:100%;margin:12px 0 0;}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 20px;}
.quick-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--bg-panel-2),var(--bg-panel));border-radius:12px;padding:13px 12px;color:var(--paper);text-align:left;cursor:pointer;box-shadow:var(--shadow);}
.quick-card b{display:block;font-family:Georgia, 'Times New Roman', serif;color:var(--gold-soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.quick-card span{font-size:14px;color:var(--text-muted);line-height:1.3;}
.prayer-block,.bio-text,.about-text{font-size:calc(1em * var(--reader-scale));}
.reader-note{font-size:12px;color:var(--text-faint);text-align:right;margin:-4px 2px 10px;}
@media (max-width:360px){.topbar-tools .tool-btn:first-child{display:none}.topbar h1{font-size:16px}.quick-grid{grid-template-columns:1fr;}}


/* ===== Liturgia OSM 4.0 — identidade servita e biblioteca ===== */
:root{--servita:#8b1e2d;--servita-soft:rgba(139,30,45,.12);--blue-mary:#294d72;--fav:#b58a2a;}
.liturgical-hero{position:relative;overflow:hidden;padding:22px 20px 18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,var(--bg-panel-2),var(--bg-panel));box-shadow:var(--shadow);margin-bottom:14px;}
.liturgical-hero:after{content:'M';position:absolute;right:-3px;top:-34px;font-family:Georgia, 'Times New Roman', serif;font-size:132px;font-weight:700;color:var(--gold);opacity:.055;line-height:1;}
.liturgical-kicker{font-family:Georgia, 'Times New Roman', serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine-soft);margin-bottom:7px;}
.liturgical-title{font-family:Georgia, 'Times New Roman', serif;font-size:27px;line-height:1.08;font-weight:700;color:var(--paper);max-width:82%;}
.liturgical-sub{margin-top:7px;color:var(--text-muted);font-style:italic;font-size:15px;}
.global-search{position:relative;margin:12px 0 16px}.global-search input{width:100%;padding:13px 44px 13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);color:var(--text);font-family:'EB Garamond',serif;font-size:16px;outline:none}.global-search input:focus{border-color:var(--gold)}.global-search .glass{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
.library-pills{display:flex;gap:7px;overflow:auto;padding:0 1px 4px;scrollbar-width:none}.library-pills::-webkit-scrollbar{display:none}.library-pill{white-space:nowrap;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-muted);border-radius:18px;padding:7px 11px;font-family:Georgia, 'Times New Roman', serif;font-size:9.5px;letter-spacing:.04em;cursor:pointer}.library-pill.active{border-color:var(--gold);color:var(--gold-soft);background:rgba(196,154,74,.10)}
.favorite-btn{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-faint);display:grid;place-items:center;cursor:pointer;z-index:3;font-size:19px}.favorite-btn.active{color:var(--fav);border-color:var(--fav);background:rgba(181,138,42,.09)}
.alpha-index{display:flex;gap:5px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.alpha-index::-webkit-scrollbar{display:none}.alpha-btn{flex:none;width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-muted);font-family:Georgia, 'Times New Roman', serif;font-size:10px;cursor:pointer}.alpha-btn.active{background:var(--gold-soft);color:var(--bg-deep);border-color:var(--gold-soft)}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-title{font-family:Georgia, 'Times New Roman', serif;font-size:14px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.08em}.cal-nav{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel);color:var(--gold-soft);cursor:pointer}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head{text-align:center;font-family:Georgia, 'Times New Roman', serif;font-size:8.5px;color:var(--text-faint);padding:4px 0}.cal-day{min-height:47px;border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:5px;position:relative;font-size:12px;color:var(--text-muted);cursor:pointer}.cal-day.empty{opacity:.25;cursor:default}.cal-day.today{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}.cal-day.has-feast{background:linear-gradient(180deg,rgba(196,154,74,.13),var(--bg-panel));color:var(--paper)}.cal-dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--wine-soft)}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.category-card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--bg-panel-2),var(--bg-panel));padding:14px 12px;cursor:pointer;box-shadow:var(--shadow)}.category-card .cat-icon{font-size:22px;margin-bottom:5px}.category-card b{display:block;font-family:Georgia, 'Times New Roman', serif;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:3px}.category-card span{font-size:13.5px;color:var(--text-muted);line-height:1.25}
.library-section{margin-bottom:20px}.result-kind{font-family:Georgia, 'Times New Roman', serif;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine-soft);margin-bottom:2px}.empty-state{text-align:center;padding:28px 14px;color:var(--text-faint);font-style:italic}.recent-meta{font-size:12px;color:var(--text-faint)}
.tabbar{padding-left:2px;padding-right:2px}.tab-btn{font-size:8.8px}.tab-btn svg{width:19px;height:19px}

.cal-day{font-family:inherit;text-align:left;appearance:none;-webkit-appearance:none;}
.cal-day.selected{outline:2px solid var(--gold-soft);outline-offset:1px;color:var(--paper);}


.daily-panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--bg-panel-2),var(--bg-panel));padding:15px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.daily-panel h3{font-family:Georgia,'Times New Roman',serif;color:var(--paper);font-size:18px;margin:0 0 5px}
.daily-kicker{font-family:Georgia,'Times New Roman',serif;color:var(--gold-soft);font-size:9px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}
.daily-meta{font-size:13px;color:var(--text-muted);line-height:1.45}
.daily-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.daily-actions button{border:1px solid var(--line);background:transparent;color:var(--gold-soft);border-radius:16px;padding:7px 10px;font-family:Georgia,'Times New Roman',serif;font-size:9px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.action-btn{border:1px solid var(--line);background:var(--bg-panel-2);color:var(--gold-soft);border-radius:18px;padding:8px 12px;font-family:Georgia,'Times New Roman',serif;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.action-btn:active{transform:translateY(1px)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:99;background:var(--paper);color:var(--bg-deep);padding:9px 13px;border-radius:18px;font-size:13px;box-shadow:var(--shadow);max-width:86%;text-align:center}

.today-chip{display:block;margin:0 auto 12px;border:1px solid var(--line);background:var(--bg-panel-2);color:var(--gold-soft);border-radius:18px;padding:6px 12px;font-family:Georgia,'Times New Roman',serif;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.season-note{display:flex;gap:10px;align-items:flex-start;margin:10px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-panel);}
.season-note b{flex:none;font-family:Georgia,'Times New Roman',serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-soft);padding-top:2px;}
.season-note span{font-size:13.5px;line-height:1.35;color:var(--text-muted);}
@media(max-width:380px){.category-grid{grid-template-columns:1fr}.liturgical-title{font-size:24px}.tab-btn span{font-size:8px}}


/* ===== Android / accessibility hardening 4.1 ===== */
body{padding-top:env(safe-area-inset-top);}
.topbar{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right));}
main#view{padding-left:max(18px, env(safe-area-inset-left));padding-right:max(18px, env(safe-area-inset-right));}
button,input{font:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}
.skip-link{position:fixed;left:10px;top:10px;z-index:20;padding:8px 12px;border-radius:8px;background:var(--paper);color:var(--bg-deep);transform:translateY(-160%);}

<script>
const SANTORAL = [{"date": "12 de janeiro", "day": 12, "month": 1, "name": "SANTO ANTÔNIO MARIA PUCCI", "bio": "Antônio Maria Pucci nasceu em\n 1819, no povoado de Poggiole,\n diocese de Pistoia, Itália. Aos 18\n anos, ingressou na Ordem dos Servos\n de Maria.\n Terminados os estudos de\n filosofia e teologia, emitiu os votos\n religiosos e foi ordenado sacerdote.\n Foi em seguida nomeado pároco\n na igreja de Santo André, na cidade\n litorânea de Viareggio, missão que\n ele desempenhou zelosamente por\n 45 anos, até a morte.\n Foi também prior conventual e provincial,\nportando-se nesses cargos mais como irmão que serve\naos irmãos do que como superior. Dedicou-se\ninteiramente ao serviço de Deus e da Virgem Maria e foi\nsempre pronto a ajudar a todos, principalmente os\npobres, enfermos e crianças.\n Morreu a 12 de janeiro de 1892. Foi proclamado\nsanto pelo papa João XXIII aos 8 de dezembro de 1962.", "prayer": "Ó Deus, que tornastes admirável Santo Antônio\nMaria como servo da Virgem Gloriosa e como pastor\n\ndo vosso povo, concedei que, inspirando-nos na mesma\nVirgem Mãe, empenhemos nossas vidas na propagação\ndo reino de Cristo, vosso Filho. Ele que convosco vive\ne reina na unidade do Espírito Santo. Amém!", "title": "Santo Antônio Maria Pucci", "rank": "Santo"}, {"date": "15 de janeiro", "day": 15, "month": 1, "name": "B. TIAGO DE \"CITTÀ DELLE PIEVE\"", "bio": "Tiago nasceu em Città della Pieve, povoado da\nregião italiana da Úmbria, por volta de 1270. Amante\nda pobreza evangélica, recebeu o hábito da então\nOrdem Terceira dos Servos de Maria.\n Formado em direito, fez-se advogado dos\npobres. Restaurou às suas expensas a igreja e o asilo\ncontíguos ao convento dos frades. Ali acolhia e\nsocorria, com grande caridade, os pobres e os doentes,\ncujos direitos ele defendeu com êxito nos tribunais\ncontra a ganância do bispo da vizinha cidade de Chiusi.\nEste, ferido em sua honra, mandou matá-lo em 1304.\n Seu corpo foi encontrado num bosque ao longo da\nestrada. Transportado para o hospital, foi alvo de\ngrande veneração por parte dos seus concidadãos, que\nlhe deram o nome de \"santo esmoleiro\" e construíram\numa igreja em sua honra.\n Pio VII aprovou o seu culto em 1806.", "prayer": "Ó Deus, impelido por vosso amor, o bem-\naventurado Tiago não hesitou enfrentar a morte para\n\ndefender os direitos dos pobres. Concedei que nada nos\nintimide na defesa da justiça e da caridade. Por Cristo\nnosso Senhor. Amém!", "title": "B. Tiago de \"Città della Pieve\"", "rank": "Beato(a)"}, {"date": "3 de fevereiro", "day": 3, "month": 2, "name": "B. JOAQUIM DE SENA", "bio": "Joaquim nasceu em Sena\n (Toscana, Itália), em 1258. Aos\n 13 anos, ingressou no convento\n dos Servos de Maria de sua\n cidade, onde foi acolhido por São\n Filipe Benizi, prior geral da\n Ordem.\n Viveu sempre em Sena, com\n exceção de um ano em que\n esteve no convento de Arezzo.\n Distinguiu-se na devoção a\n Virgem Maria, na humildade e\nna caridade.\n A tal ponto amou o próximo que, certa vez, ao\nprocurar em vão consolar um epiléptico, pediu a Deus\nque a doença dele caísse sobre si, a fim de trazer em\nseu corpo as marcas da paixão de Cristo. O doente ficou\ncurado e Joaquim tornou-se epiléptico. Além disso,\nmais tarde foi acometido por uma doença de pele que\nlhe causava ulcerações pelo corpo.\n O último gesto de sua vida comprova o espírito de\nfraternidade e de amizade que o unia aos confrades: no\ndia antes de morrer pediu licença para tomar um copo\nde vinho com eles.\n\n Morreu na sexta-feira santa do ano de 1305. Seu\ncorpo é venerado em Sena, na igreja de São Clemente,\ndos Servos de Maria. Ainda hoje as mães levam as\ncrianças recém-nascidas ao altar do bem-aventurado\nJoaquim, colocando-as sob a sua proteção. Em 1609, o\npapa Paulo V aprovou a Missa e o Ofício próprios.", "prayer": "Ó Deus, ensinastes o bem-aventurado Joaquim,\ndiscípulo do vosso Filho e de sua humilde Mãe, a servir\ncom amor os irmãos, assumindo até suas enfermidades.\nConcedei-nos, por sua intercessão, suportar as dores da\nvida presente e compadecer-nos do sofrimento dos\nirmãos. Por Cristo nosso Senhor. Amém!", "title": "B. Joaquim de Sena", "rank": "Beato(a)"}, {"date": "17 de fevereiro", "day": 17, "month": 2, "name": "SETE SANTOS FUNDADORES", "bio": "Solenidade\n Bonfilho, Bonajunta, Maneto, Amadeu, Hugo,\nSóstenes, Aleixo: estes são os nomes com os quais\nLeão XIII canonizou os sete homens que, por volta da\nmetade do século XIII, deram início à Ordem dos\nFrades Servos de Santa Maria, na cidade de Florença,\nItália.\n A Igreja e a Ordem veneram-nos sob o nome\ncoletivo de Sete Santos Fundadores. Eram leigos. De\nprofissão, comerciantes. Alguns casados, outros\nsolteiros ou viúvos, todos animados por uma vontade\nfirme de alcançar a perfeição cristã. Pertenciam à\n\"Associação-Mor de Santa Maria\" e, como membros\ndessa associação, postos a serviço de Deus e da Virgem\nMaria, dedicavam-se às obras de caridade e de\npenitência.\n Segundo a tradição, dia 15 de agosto de 1233,\ndeixaram suas famílias e atividades comerciais e\nretiraram-se para uma localidade chamada \"Cafaggio\",\nna periferia da cidade de Florença, para ali levarem\nvida de oração e de penitência.\n Por volta de 1245, mudaram-se para Monte\nSenário, cerca de dezoito quilômetros fora de\nFlorença, onde construíram uma igreja e uma\n\npequena casa. Logo, se juntaram a eles outros\nhomens que também aspiravam à vida de solidão e\ncontemplação.\n Por sua vida santa, pela seriedade do seu\ncompromisso religioso e pela estima de que gozavam\njunto ao povo, obtiveram a aprovação Sé Apostólica e\no apoio do bispo de Florença.\n De Monte Senário, os Sete e seus companheiros\ndesceram à cidade de Florença para dedicar-se às obras\ndo apostolado. Em \"Cafaggio\", construíram uma igreja\nno local onde hoje se encontra a basílica de Santíssima\nAnunciada.\n Poucos são os dados históricos referentes aos Sete\nSantos Fundadores. Com exceção de dois (São\nBonfilho e Santo Aleixo), até seus nomes são\nhistoricamente incertos. Mas certo e seguro é seu perfil\nespiritual, descrito na \"Legenda sobre as origens da\nOrdem\", o documento mais antigo sobre a vida dos\nSete Santos. Na \"Legenda\", seu perfil espiritual\nconfunde-se com o próprio carisma da Ordem e chegou\naté nós através de uma tradição fidedigna e\nininterrupta.\n Os Sete distinguiram-se no ardente amor a Deus e\na Virgem Maria, na humildade, no espírito de serviço,\nna abertura à concórdia e ao perdão e na vontade firme\nde promover a paz. Por isso são definidos pela liturgia\ncomo “ministros da unidade e da paz” (cf. Prefácio da\nmissa).\n\n Foram canonizados juntos, como se fossem um\nsó, pelo papa Leão XIII, em 1888. Seus restos mortais\nsão venerados na basílica de Monte Senário.", "prayer": "Ó Deus misericordioso, por vossa inefável\nprovidência, a Virgem gloriosa suscitou a Ordem dos\nseus Servos, por intermédio dos nossos Sete Santos\nPais. Concedei, vos pedimos, que servindo fielmente à\nmesma Virgem Mãe, possamos mais intensamente\nservir a vós e aos irmãos. Por Cristo nosso Senhor.\nAmém!", "title": "Sete Santos Fundadores", "rank": "Solenidade"}, {"date": "19 de fevereiro", "day": 19, "month": 2, "name": "B. ISABEL PICENARDI", "bio": "A bem-aventurada Isabel Picenardi nasceu em\nCremona (Lombardia, Itália), em 1428. Mais tarde, seu\npai, administrador do Marquês Gonzaga, mudou-se\ncom a família para Mântua e foi morar perto do\nconvento e igreja de São Barnabé, dos Servos de Maria.\n Foi com a ajuda dos frades que Isabel moldou\nsua espiritualidade, caracterizada pela guarda da\nvirgindade, pela penitência, pelo amor à Eucaristia e\npor uma filial devoção a Nossa Senhora. Era assídua à\noração litúrgica e recitava diariamente o Ofício divino.\n Esses dados biográficos estão registrados nas\ncrônicas do convento de São Barnabé e numa\nimportante biografia, chamada \"Legenda\", escrita\n\npoucos anos depois de sua morte. A \"Legenda\" narra\nque, após a morte do pai, Isabel foi morar com uma\nirmã, casada com um nobre de Mântua, em cuja casa\nocupava um pequeno quarto separado - como se fosse\numa cela monástica - contíguo à igreja de São Barnabé.\nFoi então que ela recebeu o hábito dos Servos de Maria.\n Isabel tinha o dom do conselho e era\nfrequentemente consultada por seus concidadãos. Em\nfavor deles obteve da Virgem Maria muitas graças e\nfavores, sendo conhecida como intercessora junto à\nMãe do Senhor. Atraídas por suas palavras e exemplos,\nalgumas jovens uniram-se ao seu redor e deram início\na um grupo da Ordem Secular (então Ordem Terceira),\nligado à igreja de São Barnabé.\n Isabel morreu em 1468 e foi beatificada em\n1804. Seu corpo encontra-se na localidade de Tor de’\nPicenardi, perto de Cremona.", "prayer": "Senhor, nosso Deus, a bem-aventurada Isabel,\ndurante sua vida terrena, tornou-se agradável a vós por\nsua devoção a Virgem Maria. Fazei que nós, a seu\nexemplo e por sua intercessão, possamos levar uma\nvida digna de vós e agradar-vos sempre. Por Cristo\nnosso Senhor. Amém!", "title": "B. Isabel Picenardi", "rank": "Beato(a)"}, {"date": "8 de abril (dies natalis)", "day": 8, "month": 4, "name": "SERVO DE DEUS FREI PAOLINO MARIA BALDASSARI", "bio": "* 02 de abril de 1926 em Quizano, Itália † 08 de abril de 2016 em Rio Branco, AC\n\nPadre Paolino Baldassari, nascido\n na Itália em 1926, ingressou na\n Ordem dos Servos de Maria e foi\n enviado ao Brasil em 1955. No\n Acre, em Sena Madureira, se\n dedicou mais de 50 anos à\n evangelização e ao trabalho social.\n Enfrentou as dificuldades da\n Amazônia com determinação,\n realizando as \"desobrigas\" —\n longas missões pelos rios, onde\n levava sacramentos, apoio\n espiritual e medicamentos às\n comunidades ribeirinhas mais\n isoladas.\nConhecido como o \"médico da floresta\", Padre Paolino\naprendeu medicina popular com seringueiros e\nindígenas, usando plantas nativas para tratar os\ndoentes. Ele construiu mais de 40 escolas na floresta e\nprotegeu contra o desmatamento, sempre ao lado dos\n\nmais humildes. Sua presença era sinônimo de\nesperança, não apenas como líder espiritual, mas\ntambém como defensor incansável das causas sociais e\nambientais da região.\nMesmo com a saúde debilitada e em idade avançada,\ncontinuou suas atividades pastorais e missionárias até\nseu falecimento em 8 de abril de 2016, aos 90 anos. Sua\nvida foi marcada pela humildade, serviço ao próximo e\ndedicação aos mais necessitados, deixando um legado\nprofundo de amor e fé no coração do povo acreano.", "prayer": "ORAÇÃO PELA BEATIFICAÇÃO E\nCANONIZAÇÃO\nPai de misericórdia, te agradecemos porque doastes à\nSanta Igreja no Acre e ao mundo, o Servo de Deus\npadre Paolino M. Baldassari. Ele, com sua vida\napaixonada, nos inspirou para o anseio missionário,\npara o cuidado com a floresta, e para a cura dos corpos\ne das almas do povo de Deus. Ó Pai, concedei-nos,\natravés da intercessão de padre Paolino, e segundo a\nTua vontade, a graça que imploramos (dizer a graça),\nna esperança que ele seja o quanto antes reconhecido\nentre Teus santos. Santa Maria interceda por nós. Por\nJesus Cristo, Nosso Senhor. Amém", "special": true, "title": "Servo de Deus Frei Paolino Maria Baldassari", "rank": "Servo de Deus"}, {"date": "4 de maio", "day": 4, "month": 5, "name": "SÃO PEREGRINO DE FORLI", "bio": "Peregrino nasceu em\n 1265, em Forlì, cidade da\n região italiana da Romanha.\n Na época, Forlì estava sob a\n jurisdição do Estado\n Pontifício, embora nela\n predominassem os Gibelinos,\n opositores do papa. Estes, em\n 1282, levaram a população a\n rebelar-se contra a autoridade\n papal. Por isso, o papa lançou\n o interdito contra a cidade,\n fechando as igrejas e\n proibindo a celebração do\n culto.\n São Filipe Benizi, então prior geral da Ordem, em\nvisita a os frades do convento de Forlì, tentou\nreconduzir os habitantes da cidade à obediência papal,\nmas foi mal recebido. Um grupo de fanáticos exaltados,\nentre os quais o jovem Peregrino, investiram contra São\nFilipe, bateram nele e o expulsaram da cidade. Mas\nPeregrino logo se arrependeu do mal feito e pediu\nperdão ao Santo.\n Anos depois, ingressou na Ordem e foi o próprio\nSão Filipe que o recebeu no convento de Sena, onde\nPeregrino conviveu com dois frades de insigne\nsantidade: os bem-aventurados Joaquim e Francisco de\n\nSena. Depois voltou para Forlì e aí ficou até a morte,\nocorrida em 1345.\n Peregrino, como frade, distinguiu-se no amor à\noração, na devoção a Virgem Maria e na prática da\npenitência e da caridade. Acudia aos irmãos mais\npobres, em favor dos quais Deus lhe concedeu o dom\ndos milagres.\n Acometido por uma ferida cancerosa numa\nperna, foi milagrosamente curado enquanto se\nencontrava em oração diante da imagem do\nCrucificado. Por isso, é invocado como protetor dos\ndoentes, principalmente dos que sofrem de câncer.\nPeregrino foi canonizado em 1726. Seu corpo é\nvenerado na igreja do convento dos Servos de Maria,\nem Forlì.\n Nós, Servos de Maria, vemos concretizado em São\nPeregrino o nosso ideal de vida, ou seja: serviço, oração,\npiedade mariana, amor ao próximo.", "prayer": "Senhor, nosso Deus, vós nos destes em São\nPeregrino um admirável exemplo de penitência e\npaciência. Concedei, benigno, que, seguindo seu\nexemplo e por sua intercessão, suportemos com\ncoragem os sofrimentos da vida presente e alegres\ncaminhemos para a recompensa eterna. Por Cristo\nnosso Senhor. Amém!", "title": "São Peregrino de Forlì", "rank": "São"}, {"date": "11 de maio", "day": 11, "month": 5, "name": "B. BENINCASA DE MONTEPULCIANO", "bio": "Benincasa nasceu em Montepulciano (Toscana,\nItália), por volta de 1375. Ainda jovem, ingressou na\nOrdem dos Servos de Maria e, com 25 anos de idade,\nretirou-se como eremita numa gruta do Monte Amiata,\nperto do lugar onde São Filipe Benizi teria transcorrido\num tempo de sua vida em penitência e oração. O local\nse chama \"Bagni di San Filippo\". Nessa gruta,\nBenincasa morreu em 9 de maio de 1426, quando tinha\n50 anos de idade.\n Benincasa transcorreu a maior parte de sua vida\nem oração, em rígidas práticas penitenciais e na\nsolidão, mantendo, porém, estreita ligação com a\nOrdem e acolhendo com alegria os que o visitavam em\nbusca de aconselhamento e de conforto espiritual. É um\nexemplo vivo da dimensão contemplativa sempre\npresente ao longo dos séculos na espiritualidade da\nOrdem dos Servos de Maria.\n Relatam seus biógrafos que ele trocava o que\nrecebia dos visitantes por pequenos objetos que ele\nmesmo fabricava. Isso mostra o valor do trabalho\nmanual na vida religiosa, que as Constituições da nossa\nOrdem também enfatizam.\n Por sua vida santa e pelos milagres operados\ndurante a vida e após a morte, foi beatificado pelo papa\nPio VII em 1829. Seu corpo é venerado na igreja\nparoquial de Montechiello (Sena).", "prayer": "Senhor Deus, vós chamastes o bem-aventurado\nBenincasa para ser testemunha viva do vosso Filho\nmediante uma vida de solidão e de silêncio, voltada\npara o trabalho e a oração. Concedei que, fortalecidos\npela oração e a penitência, possamos cumprir fielmente\nos deveres da vida cristã. Por Cristo nosso Senhor.\nAmém!", "title": "B. Benincasa de Montepulciano", "rank": "Beato(a)"}, {"date": "12 de maio", "day": 12, "month": 5, "name": "B. FRANCISCO DE SENA", "bio": "Francisco nasceu em Sena (Toscana, Itália), em\n1266. Sua vida é narrada na \"Legenda\" (= biografia)\nescrita por frei Cristóvão de Parma, seu contemporâneo\ne confidente.\n Desde jovem, Francisco sentiu-se atraído pela\nvida religiosa, mas não pôde seguir logo sua vocação,\nporque devia assistir sua mãe que era cega. Quando ela\nmorreu, Francisco, com 22 anos de idade, ingressou no\nconvento dos Servos de Maria de Sena e, três anos\ndepois, foi ordenado presbítero.\n Distinguiu-se na obediência, na pregação da\nPalavra de Deus e, principalmente, na caridade, no amor\nà Eucaristia e na filial devoção a Virgem Maria.\nFrancisco sempre foi atencioso com os confrades, os\npobres e os doentes, aos quais acudia, compartilhando\nseus sofrimentos e ajudando-os com suas obras e\nconselhos.\n\n Celebrava diariamente, com grande devoção, a\nEucaristia, honrava a Virgem Maria - sua \"Senhora\",\ncomo ele costumava dizer - com atos de particular\nveneração, e a ela dedicava toda a sua atividade de frade\ne de presbítero.\n Seu último dia de vida revela, em síntese, as\nprincipais características de sua espiritualidade.\nPressentindo a morte iminente, visitou amigos e\ndevotos; tomou a última refeição com os confrades,\nmostrando assim o afeto que o unia a eles; celebrou\ndevotamente a Eucaristia, por ser a Vigília da\nAscensão; e quis cumprir até o fim o seu compromisso\nde obediência e de zelo apostólico. De fato, embora\ndoente e já sem forças, partiu para um povoado vizinho,\nonde devia fazer uma pregação. Mas, no caminho, ao\ncolocar um buquê de flores diante da imagem de Nossa\nSenhora, caiu de joelhos, extenuado. Levado de volta\nao convento, faleceu. Era o dia 26 de maio de 1328.\n Francisco foi beatificado pelo papa Bento XIV\nem 1743. Seu corpo é venerado em Sena, na basílica\ndos Servos de Maria.", "prayer": "Senhor, nosso Deus, infundi em nós o espírito de\nmansidão e de humildade com que o bem-aventurado\nFrancisco honrou a mãe do vosso Filho e conduziu o\nvosso povo para os bens eternos. Por Cristo nosso\nSenhor. Amém!", "title": "B. Francisco de Sena", "rank": "Beato(a)"}, {"date": "30 de maio", "day": 30, "month": 5, "name": "B. TIAGO FILIPE DE FAENZA", "bio": "Tiago Filipe Bertoni nasceu em Faenza (Emília-\nRomanha, Itália), em 1454. Ainda adolescente,\ningressou no convento dos Servos de Maria de sua\ncidade. Quando pequeno sofria de epilepsia e seu pai fez\na promessa de consagrá-lo ao Senhor, se ficasse curado.\n Tiago Filipe foi ordenado presbítero. No\nconvento, ocupou vários cargos, inclusive de ecônomo.\nDado à leitura dos autores clássicos e dos Padres da\nIgreja, principalmente de São Jerônimo, aplicou-se\ncom afinco no estudo da Sagrada Escritura. Celebrava\na santa Eucaristia com grande fervor. Levou vida\npenitente e ascética. Tinha um caráter manso e\nmaneiras gentis, embora fosse de poucas palavras. Foi\nsempre prudente e reservado no falar.\n Morreu com a idade de 29 anos de idade, em\n1483, vitimado talvez pela tuberculose, como parece\nmostrar a iconografia, que sempre o retrata com o rosto\nmacilento e a pele aderente aos ossos. Fatos\nextraordinários ocorreram junto a seu esquife.\n Seu culto, que começou logo após a morte,\nrecebeu a aprovação formal do papa Clemente XIII em\n1761. Seu corpo é venerado na catedral de Faenza.\n A primeira biografia do bem-aventurado Tiago\nFilipe foi escrita por Nicolau Borghese, humanista e\npolítico da cidade de Sena, que foi agraciado com um\nmilagre obtido pela sua intercessão.", "prayer": "Ó Deus, ornastes o bem-aventurado Tiago Filipe\ncom a riqueza da doutrina sagrada e lhe destes celebrar\ncom fervor os divinos mistérios. Concedei que\ndesejemos somente a vós, única fonte da verdadeira\nsabedoria e autor do divino amor. Por Cristo nosso\nSenhor. Amém!", "title": "B. Tiago Filipe de Faenza", "rank": "Beato(a)"}, {"date": "19 de junho", "day": 19, "month": 6, "name": "SANTA JULIANA DE FLORENÇA", "bio": "Juliana nasceu em Florença na segunda metade\ndo século XIII. Segundo a tradição, era da mesma\nfamília \"Falconieri\", à qual pertencia Santo Aleixo, um\ndos Sete Fundadores dos Servos de Maria.\n O acontecimento mais importante de sua vida -\npor sinal, pouco conhecido - foi sua conversão quando\ntinha 15 anos de idade, depois de ouvir uma pregação\nde Santo Aleixo sobre o Juízo Final. A partir daí,\nJuliana orientou o coração e a mente unicamente para\no Senhor e, embora residindo com a família, levou vida\nde penitência e contemplação, seguindo o exemplo dos\nprimeiros frades da nossa Ordem. Frequentava a igreja\nde Santa Maria de Cafaggio, futura basílica da\nSantíssima Anunciada. Junto com os frades,\nparticipava dos ofícios litúrgicos e cantava os louvores\nda Mãe do Senhor.\n Depois de muito insistir com os pais e de\nimplorar a Virgem Maria, obteve a graça de receber o\nhábito da Ordem. Logo, outras jovens juntaram-se a ela\nna vida de penitência e de piedade e na partilha do ideal\nde vida dos Servos de Maria.\n A espiritualidade de Santa Juliana caracteriza-\nse por um ardente amor à Eucaristia. No leito de\nmorte, não podendo receber o Corpo do Senhor\ndevido ao seu estado de saúde, pediu que a santa\nHóstia lhe fosse colocada sobre o peito. Diz uma\npiedosa tradição que a santa Hóstia penetrou\n\nmilagrosamente no seu peito e não foi mais\nencontrada.\n Presume-se que Santa Juliana tenha morrido em\n1341. Venerada na Ordem como \"bem-aventurada\"\npelo menos desde o século XV, foi canonizada pelo\npapa Clemente XII em 1737.\n Juliana, a bem da verdade, não fundou nenhuma\ncongregação religiosa. Apesar disso, as mulheres -\nleigas, religiosas e monjas - que ao longo dos séculos\ndedicaram-se ao serviço da Virgem Maria no âmbito da\nFamília Servita, sempre a reconheceram como mãe e\nmestra. Seu mais antigo biógrafo, frei Paulo Attavanti,\na definiu como \"magnum caput\", isto é, como grande\ninspiradora das congregações femininas da Ordem.\n Os membros da Ordem Secular Servita colocam\nSanta Juliana em primeiro lugar na longa lista de leigos\nque viveram como amigos dos Servos de Maria e\ncompartilharam o seu ideal de serviço a Deus, a\nVirgem Maria e aos irmãos.", "prayer": "Ó Deus, por intermédio de Santa Juliana,\nexemplo de castidade e de penitência, suscitastes na\nOrdem dos Servos de Maria uma família de virgens a\nvós consagradas. Fazei que a vossa Igreja, esposa de\nCristo, mantenha sempre viva a chama da virgindade\nfecunda. Por Cristo nosso Senhor. Amém!", "title": "Santa Juliana de Florença", "rank": "Santa"}, {"date": "27 de junho", "day": 27, "month": 6, "name": "B. TOMÁS DE ORVIETO", "bio": "Tomás de Orvieto (Úmbria, Itália), movido por\nsingular amor a Virgem Maria e desejando chegar mais\nseguramente à pátria celeste, ingressou na Ordem dos\nServos de Maria, na qual, por sua grande humildade, foi\nrecebido como irmão leigo.\n Era frequentemente mandado de casa em casa\npara pedir esmola, o que ele fazia cm grande espírito de\ncaridade. É por isso que as imagens que o representam -\ne algumas são muito antigas - o mostram sempre com\numa sacola às costas, trazendo na mão um ramo de\nfigueira ou então oferecendo-o a uma mulher grávida,\nem pleno inverno.\n Morreu em Orvieto por volta de 1343 e foi\nsepultado na igreja dos Servos de Maria. O papa\nClemente XIII aprovou seu culto em 1768.", "prayer": "Ó Deus misericordioso, que, em vossa infinita\nbondade, inclinais os ouvidos às súplicas dos humildes,\npelas preces do bem-aventurado Tomás, concedei à\nFamília dos Servos e Servas de Santa Maria\nexperimentar aqui na terra a vossa presença\nconsoladora e obter na vida futura a felicidade eterna.\nPor Cristo nosso Senhor. Amém!", "title": "B. Tomás de Orvieto", "rank": "Beato(a)"}, {"date": "1º de julho", "day": 1, "month": 7, "name": "B. FERNANDO MARIA BACCILIERI", "bio": "Fernando Maria Baccilieri nasceu em\nCampodoso, na paróquia de Reno Finalese, em\nMódena, Itália, aos 14 de maio de 1821. Desde jovem,\nsentiu o desejo de partir para anunciar o evangelho em\nterras de missão. Ingressou na Companhia de Jesus,\nmas teve que deixar a Congregação por problemas de\nsaúde.\n Ordenado sacerdote diocesano, em 1852 foi\nnomeado pároco de Galeazza Pepoli, na diocese de\nBolonha, comunidade paroquial que ele por 41 anos\nconduziu com abnegação e generosidade pastoral.\n Por sua grande devoção a Nossa Senhora,\ninscreveu-se na Ordem Secular dos Servos de Maria,\nentão chamada Ordem Terceira. E para melhor\nresponder às necessidades mais urgentes do povo,\nfundou a Congregação das irmãs Servas de Maria de\nGaleazza.\n Morreu a 13 de julho de 1893. Em 1º de julho de\n1999 seu corpo foi transladado para a igreja de\nGaleazza Peopoli, onde hoje se encontra. Foi\nbeatificado em 3 de outubro de 1999 pelo papa João\nPaulo II.", "prayer": "Ó Deus, que nos destes no bem-aventurado\nFernando Maria destes uma testemunha admirável de\n\nvida evangélica, a seu exemplo e por sua intercessão,\ndai-nos seguir os passos de Cristo e servir os nossos\nirmãos e irmãs com amor. Por Cristo nosso Senhor.\nAmém", "title": "B. Fernando Maria Baccilieri", "rank": "Beato(a)"}, {"date": "4 de julho", "day": 4, "month": 7, "name": "B. UBALDO DE SANSEPOLCRO", "bio": "Ubaldo nasceu em \"Borgo San Sepolcro\"\n(Toscana, Itália) em meados do século XIII. Ingressou\nna Ordem dos Servos de Maria e foi ordenado\npresbítero, distinguindo-se por uma vida santa e\nlaboriosa. Foi para todos exemplo de bondade e de\ncastidade.\n Era amigo íntimo de São Filipe, o qual, estando\nno leito de morte, ao perceber a chegada de frei Ubaldo,\nrecobrou novo alento e acabou morrendo em seus\nbraços.\n Ubaldo morreu no convento de Monte Senário\npor volta de 1315. Seu culto foi confirmado pelo papa\nPio VII em 1821.", "prayer": "Ó Deus, fonte de castidade e de amor, pelas\npreces e exemplos do bem-aventurado Ubaldo,\nconcedei que vossos servos e servas vos glorifiquem\ncom a santidade de sua vida e com o testemunho de sua\nunidade. Por Cristo nosso Senhor. Amém!", "title": "B. Ubaldo de Sansepolcro", "rank": "Beato(a)"}, {"date": "13 de julho", "day": 13, "month": 7, "name": "SANTA CLÉLIA BARBIERI", "bio": "Nasceu em Le Budrie\n de San Giovanni in Persiceto,\n diocese de Bolonha (Itália),\n aos 13 de fevereiro de 1847.\n De família muito pobre,\n quando criança e adolescente,\n enfrentou sérias dificuldades\n de sobrevivência.\n Em 1868, com mais\n três companheiras, iniciou\n uma comunidade que tomou\n sob seus cuidados as jovens\n abandonadas, cuidando de\n sua educação. Dessa pequena\n comunidade inicial originou-\n se a Congregação das irmãs\n Mínimas de Nossa Senhora\n das Dores.\n Morreu aos 23 anos de idade no dia 13 de julho\nde l870, em Le Budrie, onde seu corpo é venerado. Foi\nbeatificada pelo papa Paulo VI em 27 de outubro de\n1968 e canonizada por João Paulo II em 9 de abril de\n1989.", "prayer": "Ó Deus, glória e prêmio dos humildes de coração,\npor intermédio de Santa Clélia, fundastes uma nova\nfamília de virgens consagradas. Concedei, vos pedimos,\nque vivendo nesta terra a humildade e a pequenez,\nmereçamos ser conduzidos às mansões eternas. Por\nCristo nosso Senhor. Amém!", "title": "Santa Clélia Barbieri", "rank": "Santa"}, {"date": "23 de agosto", "day": 23, "month": 8, "name": "SÃO FILIPE BENÍCIO", "bio": "Solenidade\n Filipe nasceu em Florença (Toscana, Itália), no\ninício do século XIII. Entrou na Ordem dos Servos de\nMaria como irmão leigo. Mais tarde, por um\nprovidencial desígnio de Deus, sua sabedoria tornou-se\nconhecida. Em seguida, foi ordenado presbítero.\n Eleito prior geral em 1267, permaneceu no cargo\naté a morte, ocorrida em 1285. Governou a Ordem com\nprudência, fortaleceu-a com uma sábia legislação,\nsoube defendê-la com determinação diante da ameaça\nda extinção e tornou-a célebre por sua santidade.\n Recebeu na Ordem muitos confrades, eles\ntambém homens de grande zelo na vida religiosa. Para\ntodos, São Filipe foi mestre e modelo de vida\nevangélica e de serviço a Virgem Maria. Com muita\nrazão, portanto, é tido como \"Pai\" da nossa Ordem.\n Morreu em 1285 em Todi (Perúsia), onde ainda\nhoje seu corpo venerado. Foi canonizado em 1671 pelo\npapa Clemente X.", "prayer": "Ó Deus, glória dos humildes, por meio de São\nFilipe, protegestes com amor a família dos Servos de\nSanta Maria, amplamente a propagastes e consolidastes\ncom santas leis. Concedei, benigno, que à imitação de\ntão grande Pai, sirvamos fielmente a Virgem Maria, e\npropaguemos com ardor apostólico o evangelho do\nvosso Filho, Jesus Cristo, que convosco vive e reina na\nunidade do Espírito Santo. Amém!", "title": "São Filipe Benício", "rank": "São"}, {"date": "25 de agosto (dies natalis)", "day": 25, "month": 8, "name": "SERVO DE DEUS FREI EGÍDIO MARIA MOSCINI", "bio": "* fevereiro de 1884 em Valentano, Itália † 25 de agosto de 1976 em Turvo, SC\n\nFrei Egídio Maria Moscini nasceu em fevereiro de\n1884, em Valentano, Itália. Aos 21 anos, em 1905,\ningressou na Ordem dos Servos de Maria, movido por\num profundo desejo de servir a Deus e à Virgem Maria.\nEm 1921, foi enviado ao Brasil como missionário, após\numa longa viagem de três meses. Ao chegar, serviu\ninicialmente na cidade do Rio de Janeiro, dedicando-se\nà vida comunitária e pastoral com grande zelo.\nEm 1947, foi transferido para Araranguá, em Santa\nCatarina, e em 1952, passou a residir no Seminário de\nTurvo. Frei Egídio viveu uma vida simples e dedicada\nao trabalho. Com frequência, era visto com uma enxada\nnas mãos, cuidando da terra e servindo à comunidade\nlocal. Sua vida de oração e serviço era reconhecida e\napreciada por todos, que viam nele um homem de\nprofunda fé e humildade.\n\nFrei Egídio faleceu em 25 de agosto de 1976, aos 92\nanos, deixando um legado de simplicidade, devoção e\nserviço. Mesmo após décadas de sua morte, sua\nmemória permanece viva, sendo lembrado como um\nfiel intercessor, que, em sua humildade e trabalho,\nrefletia a presença de Deus na vida das pessoas que o\ncercavam. Seu exemplo continua a inspirar aqueles que\nbuscam viver uma vida de fé e serviço ao próximo.", "prayer": "ORAÇÃO PELA BEATIFICAÇÃO E CANONIZAÇÃO\nPai de misericórdia, nós vos damos graças\nporque destes à vossa igreja no Brasil,\nespecialmente em Santa Catarina, o Servo de\nMaria e agora também de Deus, frei Egídio\nMaria Moscini. Com sua vida santa ele nos\nensinou: a persistência na oração, a humildade\nno serviço aos irmãos e a paciência nos\nsofrimentos concedei-nos, ó Pai, por intercessão\nde frei Egídio, a graça que imploramos (dizer a\ngraça). Pedimos e esperamos, ó Pai, que frei\nEgídio seja o quanto antes colocado no número\ndos vossos santos. Por Cristo Nosso Senhor.\nAmém!", "special": true, "title": "Servo de Deus Frei Egídio Maria Moscini", "rank": "Servo de Deus"}, {"date": "31 de agosto", "day": 31, "month": 8, "name": "B. ANDRÉ DE SANSEPOLCRO", "bio": "Atraído pelas palavras e pelo exemplo de São\nFilipe, em 1278 André ingressou no convento dos\nServos de Maria de Sansepolcro (Toscana, Itália), onde\nrecebeu o hábito da Ordem.\n Amante da vida penitente e contemplativa, retirou-\nse num eremitério situado nos arredores da sua cidade\nnatal, atraindo para lá outros eremitas, que se puseram\nsob a sua orientação e se agregaram à Ordem.\n Morreu em 1315 e seu corpo foi levado pelos\neremitas para a igreja dos Servos de Maria da cidade.\nEm 1806, o papa Pio VII aprovou seu culto.", "prayer": "Ó Deus, por intermédio do bem-aventurado\nAndré, agregastes à Ordem dos Servos de Maria muitos\n\neremitas, unindo-os na mesma devoção à Virgem Mãe\ne no amor fraterno. Fazei que nós também, servindo\nfielmente a mesma Virgem Maria, possamos pensar e\nagir concordemente. Por Cristo nosso Senhor. Amém!", "title": "B. André de Sansepolcro", "rank": "Beato(a)"}, {"date": "1º de setembro", "day": 1, "month": 9, "name": "B. JOANA DE FLORENÇA", "bio": "Joana de Florença viveu no primeiro século da\nnossa Ordem. Desde jovem, desprezando os atrativos\ndeste mundo, recebeu o hábito da Ordem Terceira dos\nServos de Maria e consagrou-se totalmente a Nossa\nSenhora, tornando-se exemplo de vida casta e\npenitente.\n Algumas imagens muito antigas apresentam-na\nentre os santos mais ilustres da Ordem, às vezes ao lado\nde São Filipe, outras vezes com um lírio e um livro na\nmão. Seu culto foi aprovado pelo papa Leão XII em\n1828.", "prayer": "Ó Deus, concedestes à bem-aventurada virgem\nJoana a graça de guardar a inocência com uma vida\naustera e penitente. Concedei-nos, por sua intercessão,\nproduzir frutos de penitência e servir-vos de coração\npuro. Por Cristo nosso Senhor. Amém!", "title": "B. Joana de Florença", "rank": "Beato(a)"}, {"date": "5 de setembro", "day": 5, "month": 9, "name": "B. MARIA MADALENA DA PAIXÃO", "bio": "Madalena Starace nasceu aos 5 de setembro de\n1845 em Castellammare di Stabia, Nápoles, Itália. Foi\nbatizada no mesmo dia com o nome de Constança e foi\nconsagrada pela mãe à Nossa Senhora das Dores.\n\nDesde a adolescência alimentou o desejo de ser\nreligiosa, mas não pode concretizá-lo por motivos de\nsaúde.\n Em 1865 ingressou na Ordem Terceira dos Servos\nde Maria, tomando o nome de Maria Madalena da\nPaixão. Dedicou-se com zelo à assistência de órfãos e\nde meninas abandonadas. Nesse serviço juntaram-se a\nela algumas jovens piedosas que formaram o primeiro\nnúcleo do Instituto das irmãs Compassionistas Servas\nde Maria, erigido canonicamente em 27 de maio de\n1871 pelo bispo diocesano de Castellammare, dom\nFrancisco Xavier Petagna. Em 1º de novembro de\n1893, o Instituto foi agregado à Ordem dos Servos de\nMaria. Maria Madalena morreu em 13 de dezembro de\n1921. Foi beatificada em 15 de abril de 2007 pelo papa\nBento XVI. Seu corpo é venerado no santuário do\nSagrado Coração de Jesus e de Nossa Senhora das\nDores, em Castellammare di Stabia.", "prayer": "Deus onipotente e misericordioso, vós quisestes\nque a bem-aventurada Maria Madalena se colocasse\nsempre ao lado da Mãe das Dores junto a Cruz e\nservisse a Cristo nos pobres, nos doentes e nos\nmarginalizados: fazei que, seguindo o seu exemplo,\ncompartilhemos as dores, esperanças e alegrias dos\nnossos irmãos para merecermos ser um dia recebidos\nno vosso Reino. Por Nosso Senhor...", "title": "B. Maria Madalena da Paixão", "rank": "Beato(a)"}, {"date": "6 de setembro", "day": 6, "month": 9, "name": "B. BOAVENTURA DE FORLI", "bio": "Boaventura nasceu em Forlì (Romanha, Itália),\npor volta de 1410. Entrando na Ordem dos Servos de\nMaria, dedicou-se com amor aos estudos e tornou-se\nmestre em teologia.\n Foi célebre orador e percorreu várias cidades,\npregando a palavra de Deus com coragem e sabedoria.\nFoi também prior provincial da Província da Romanha\ne vigário geral da Congregação da Observância, um\nmovimento de reforma da Ordem. Promoveu nas\ncomunidades a observância regular. Amava a\npenitência e a solidão.\nMorreu em 1491 em Údine, onde seu corpo é venerado\nno Santuário de Nossa Senhora das Graças, dos Servos\nde Maria. Pio X aprovou seu culto em 1911.", "prayer": "Ó Deus, iluminados pelo exemplo e pela\npregação evangélica do bem-aventurado Boaventura,\nhumildemente vos pedimos: dobrai a dureza da nossa\ncerviz pela conversão do coração e pela penitência. Por\nCristo nosso Senhor. Amém!", "title": "B. Boaventura de Forlì", "rank": "Beato(a)"}, {"date": "17 de setembro", "day": 17, "month": 9, "name": "B. CECÍLIA EUSEPI", "bio": "Nasceu aos 17 de\n fevereiro de 1910 em Monte\n Romano, província de\n Viterbo, na região italiana do\n Lácio. Com poucos meses de\n idade, ficou órfã do pai e,\n junto com a mãe, foi acolhida\n na casa do tio materno, em\n Nepi, que a confiou às\n monjas cistercienses, em cujo\n mosteiro fez o curso primário\n e foi iniciada na vida cristã.\n Foi ali que conheceu os\n frades Servos de Maria que\n eram confessores das monjas.\n Em 17 de setembro de 1922 fez a promessa na\nOrdem Secular dos Servos de Maria e, em 1923, foi\nadmitida como postulante na Congregação das Servas\nde Maria de Pistoia, mas depois de três anos, por\nmotivos de saúde, voltou para a casa do tio em Nepi.\nAcometida de grande enfermidade, suportou muitos\nsofrimentos, crescendo no amor a Deus e à Virgem das\nDores. Morreu em 1º de outubro de 1928 e seu culto foi\naprovado pelo papa São João Paulo II em 2012.", "prayer": "Pai Santo, que revelastes os mistérios do vosso\nFilho à Bem-aventurada Cecília, vossa humilde serva,\ne lhe concedestes a graça de vivê-los fielmente, dai-\nnos, por sua intercessão, a sabedoria do coração para\ncrescermos cada dia no amor a Cristo e segui-lo, a\nexemplo da Virgem Maria, até a cruz. Ele que\nconvosco vive reina na unidade do Espírito Santo.\nAmém", "title": "B. Cecília Eusepi", "rank": "Beato(a)"}, {"date": "3 de outubro", "day": 3, "month": 10, "name": "B. MARIA GUADALUPE RICART OLMOS", "bio": "Maria Guadalupe\n Ricart Olmos nasceu em\n Albal (Valência,\n Espanha) aos 23 de\n fevereiro de 1881, filha\n de Francisco Ricart e de\n Maria Olmos, modestos\n agricultores. No batismo\n recebeu o nome de Maria\n Francisca. Aos 4 anos,\n ficou órfã de pai.\n\n Desejosa de consagrar-se ao Senhor, aos 11 de\njunho de 1896, ingressou no mosteiro “Pie de la Cruz”\nde Valência, das monjas Servas de Maria, onde emitiu\nos votos perpétuos em 19 de junho de 1900.\n Ocupou no mosteiro vários cargos: desde roupeira\naté mestra de noviças e priora. Distinguiu-se por uma\nvida simples, fiel aos compromissos, solícita com as\ncoirmãs, principalmente com as mais jovens, e\nciosamente apegada à espiritualidade da Ordem.\n Em 1936, em plena guerra civil espanhola, um\ngrupo de milicianos invadiu o mosteiro. Ela e suas\ncoirmãs foram obrigadas a refugiar-se em casa de\nparentes.\n Na noite de 2 de outubro de 1936, quatro\nmilicianos armados invadiram a casa onde ela se\nencontrava e lhe perguntaram se era religiosa. “Sim -\nrespondeu ela - sou monja e, se tivesse que nascer mil\nvezes, voltaria a sê-lo no mosteiro de «Pie de la Cruz»”.\nFoi então presa pelos milicianos e arrastada para um\nlugar deserto, onde a trucidaram sem piedade. Seu\ncorpo, totalmente desfigurado pelos algozes, foi\nsepultado numa fossa comum do cemitério de Silla, em\nValência. Em fevereiro de 1940, foi trasladado para o\ncemitério de “Pie de la Cruz”. Finalmente, em 1959,\ncom a transferência do mosteiro de Valência para\nMislata, seus restos mortais foram solenemente\nsepultados ao lado do altar-mor da igreja deste\nmosteiro.\n O processo de beatificação e canonização foi\niniciado em 20 de junho de 1959 e seu martírio foi\n\noficialmente reconhecido pela Sé Apostólica em 1999.\nDia 11 de março de 2000 foi beatificada pelo papa João\nPaulo II.", "prayer": "Ó Pai, em cujas mãos está nossa vida, por um\ninsondável desígnio do vosso amor, a bem-aventurada\nMaria Guadalupe, discípula fiel e monja Serva de Santa\nMaria, associou-se à paixão de Cristo. Dai-nos\ncompreender o mistério do Filho do Homem e\npercorrer o caminho estreito que conduz à vida. Por\nCristo nosso Senhor. Amém!", "title": "B. Maria Guadalupe Ricart Olmos", "rank": "Beato(a)"}, {"date": "25 de outubro", "day": 25, "month": 10, "name": "B. JOÃO ÂNGELO DE MILÃO", "bio": "João Ângelo nasceu em Milão em 1451.\nIngressou jovem no convento milanês de Santa Maria\ne depois mudou-se para o convento da Santíssima\nAnunciada, em Florença, onde foi ordenado presbítero.\n Atraído pelo ideal de vida penitente e\ncontemplativa, viveu quase vinte anos no eremitério de\nMonte Senário. Voltou em seguida para Milão, onde\ndedicou-se inteiramente na educação cristã das\ncrianças.\n Morreu aos 23 de outubro de 1505. Seu corpo é\nvenerado na basílica de São Carlos, em Milão. Foi\nbeatificado por Clemente XII em 1737.", "prayer": "Senhor, interceda por nós o bem-aventurado\nJoão Ângelo, que se tornou admirável na prática da\nvida monástica e no ensino da vossa doutrina, a fim de\nque, sempre mais unidos a vós, sejamos perseverantes\nna vida evangélica e dedicados no serviço apostólico.\nPor Cristo nosso Senhor. Amém!", "title": "B. João Ângelo de Milão", "rank": "Beato(a)"}, {"date": "16 de novembro", "day": 16, "month": 11, "name": "TODOS OS SANTOS E SANTAS DA ORDEM", "bio": "[Como a Igreja universal celebra todos os Santos,\ntambém a Família Servita recorda anualmente todos os\nsantos frades, monjas, freiras, irmãos e irmãs da Ordem\nSecular que, em seu tempo, tornaram agradável ao\n\nSenhor e a Virgem Maria a nossa Ordem e que são um\nestímulo de serviço perene].", "prayer": "Ó Deus todo-poderoso, o espírito de amoroso\nserviço que abundantemente derramastes nos santos e\nsantas da Ordem de Nossa Senhora, conservai-o\nsempre vivo em nós, seus filhos e irmãos. Por Cristo\nnosso Senhor. Amém!", "title": "Todos os Santos e Santas da Ordem", "rank": "Solenidade"}, {"date": "10 de dezembro", "day": 10, "month": 12, "name": "B. JERÔNIMO DE SANT'ANGELO IN VADO", "bio": "Jerônimo nasceu no início do século XV na\npequena cidade de Sant’Angelo in Vado (Marcas,\nItália). Ingressou jovem no convento local dos Servos\nde Maria, onde recebeu o hábito da Ordem.\n Passou algum tempo fora do convento de\norigem, mas, terminados os estudos e ordenado\npresbítero, para lá voltou novamente.\n Distinguiu-se no amor ao silêncio, à solidão e à\ncontemplação. Foi agraciado por Deus com os dons do\nconselho e da prudência.\n Morreu por volta de 1468. Pio VI aprovou seu\nculto em 1773.\n O", "prayer": "Senhor, humildemente vos pedimos que\ninterceda por nós o bem-aventurado Jerônimo, a quem\nornastes com os dons do vosso Espírito, a fim de que,\nrepletos da sabedoria de Cristo, possamos agir em tudo\ncom maturidade e prudência. Por Cristo nosso Senhor.\nAmém!", "title": "B. Jerônimo de Sant'Angelo in Vado", "rank": "Beato(a)"}, {"date": "14 de dezembro", "day": 14, "month": 12, "name": "B. BOAVENTURA DE PISTOIA", "bio": "Boaventura nasceu na cidade toscana de Pistoia\n(Toscana, Itália), por volta de 1250. Atraído pelas\npalavras e exemplos de São Filipe Benizi, de quem se\ntornou amigo íntimo, ingressou na Ordem dos Servos de\nMaria e foi ordenado presbítero.\n Foi prior em vários conventos, revelando-se\nsempre muito prudente e humano no desempenho do\ncargo. Quando prior em Montepulciano, presidiu à\nprofissão dos votos de Santa Inês, natural dessa cidade,\ne ajudou-a a fundar o mosteiro.\n Morreu em Orvieto em 1315. Seu corpo repousa\nna nossa igreja da Santíssima Anunciada de Pistoia. Pio\nVII aprovou seu culto em 1822.", "prayer": "Deus todo-poderoso, derramai sobre os vossos\nservos o espírito de prudência e de sabedoria, que\niluminou admiravelmente o bem-aventurado\nBoaventura na orientação dos irmãos e irmãs a vós\nconsagrados. Por Cristo nosso Senhor. Amém!", "title": "B. Boaventura de Pistoia", "rank": "Beato(a)"}];
const PRAYERS = {"daily": {"anjo": "D. O anjo do Senhor anunciou a Maria.\nT. E Ela concebeu do Espírito Santo.\n   Ave Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós pecadores, agora e na hora da nossa morte. Amém.\n\nD. Eis aqui a serva do Senhor.\nT. Faça-se em mim segundo a vossa Palavra.\n   Ave Maria...\n\nD. E o Verbo Divino se fez carne.\nT. E habitou entre nós.\n   Ave Maria...\n\nD. Rogai por nós, Santa Mãe de Deus.\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Derramai, Senhor, a vossa graça em nossas almas, a fim de que nós que, pela anunciação do anjo, viemos ao conhecimento da Encarnação do vosso Filho, cheguemos, por sua paixão e morte, à glória da ressurreição. Pelo mesmo Cristo Senhor nosso.\nT. Amém!\n\nD. Glória ao Pai, ao Filho e ao Espírito Santo.\nT. Como era no princípio, agora e sempre. Amém.", "rainha": "D. Rainha do céu, alegrai-vos, aleluia!\nT. Pois o Senhor que merecestes trazer em vosso seio, aleluia!\n\nD. Ressuscitou como disse, aleluia!\nT. Rogai a Deus por nós, aleluia!\n\nD. Alegrai-vos e exultai, ó Virgem Maria, aleluia!\nT. Porque o Senhor ressuscitou verdadeiramente, aleluia!\n\nOremos\n\nD. Ó Deus que, na gloriosa ressurreição do vosso Filho, destes alegria ao mundo inteiro, por intercessão da Virgem Maria, concedei-nos gozar a alegria perene da vida eterna. Por Cristo nosso Senhor.\nT. Amém!"}, "devotions": {"vigilia": {"formula1": "Primeira fórmula\n Santa Maria,\n Senhora Dos Seus Servos\nSalmodia\n\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n\n SALMO 8\n Majestade de Deus e dignidade do homem\n\"O Todo-Poderoso fez grandes coisas por mim\" (Lc\n1,49).\n– 2Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n– Desdobrastes nos céus vossa glória *\ncom grandeza, esplendor, majestade.\n= 3O perfeito louvor vos é dado †\npelos lábios dos mais pequeninos, *\nde crianças que a mãe amamenta.\n– Eis a força que opondes aos maus, *\nreduzindo o inimigo ao silêncio.\n– 4Contemplando estes céus que plasmastes *\ne formastes com dedos de artista;\n\n– vendo a lua e estrelas brilhantes, *\n perguntamos: ‘Senhor, que é o homem,\n– para dele assim vos lembrardes *\ne o tratardes com tanto carinho?’\n– 6Pouco abaixo de Deus o fizestes, *\ncoroando-o de glória e esplendor;\n– 7vós lhe destes poder sobre tudo, *\nvossas obras aos pés lhe pusestes:\n– 8as ovelhas, os bois, os rebanhos, *\ntodo o gado e as feras da mata;\n– 9passarinhos e peixes dos mares, *\ntodo ser que se move nas águas.\n– 10Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume.\n\n SALMO 18\n Hino ao Criador do universo e Senhor da lei\n\n\"Quando o Verbo se fez carne, como um esposo, uniu-\nse à natureza humana: tálamo das núpcias foram as\nentranhas da Virgem Maria\" (Santo Agostinho)\n– 2Os céus proclamam a glória do Senhor, *\ne o firmamento, a obra de suas mãos;\n– 3o dia ao dia transmite esta mensagem, *\na noite à noite publica esta notícia.\n– 4Não são discursos nem frases ou palavras, *\nnem são vozes que possam ser ouvidas;\n– 5seu som ressoa e se espalha em toda a terra, *\nchega aos confins do universo a sua voz.\n– 6Armou no alto uma tenda para o sol; *\nele desponta no céu e se levanta\n– como um esposo do quarto nupcial, *\ncomo um herói exultante em seu caminho.\n– 7De um extremo do céu põe-se a correr *\ne vai traçando o seu rastro luminoso,\n– até que possa chegar ao outro extremo, *\ne nada pode fugir ao seu calor.\n\n– 8A lei do Senhor Deus é perfeita, *\nconforto para a alma!\n– O testemunho do Senhor é fiel, *\nsabedoria dos humildes.\n\n– 9Os preceitos do Senhor são precisos, *\nalegria ao coração.\n– O mandamento do Senhor é brilhante, *\npara os olhos é uma luz.\n– 10É puro o temor do Senhor, *\nimutável para sempre.\n– Os julgamentos do Senhor são corretos *\ne justos igualmente.\n– 11Mais desejáveis do que o ouro são eles, *\ndo que o ouro refinado.\n– Suas palavras são mais doces que o mel, *\nque o mel que sai dos favos.\n– 12E vosso servo, instruído por elas, *\nse empenha em guardá-las.\n– 13Mas quem pode perceber suas faltas? *\nPerdoai as que não vejo!\n\n– 14E preservai o vosso servo do orgulho: *\nnão domine sobre mim!\n– E assim puro, eu serei preservado *\ndos delitos mais perversos.\n– 15Que vos agrade o cantar dos meus lábios *\ne a voz da minha alma;\n– que ela chegue até vós, ó Senhor, *\n\nmeu Rochedo e Redentor!\n\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume!\n\n3ª Ant. Ao prodígio da tua virgindade elevemos com\n júbilo um hino de alegria!\n\n SALMO 23\n O Senhor entra no seu Templo\n\"As portas do céu abriram-se ao Cristo quando\nassumiu a natureza humana\" (Santo Irineu)\n– 1Ao Senhor pertence a terra e o que ela encerra, *\no mundo inteiro com os seres que o povoam;\n– 2porque ele a tornou firme sobre os mares, *\ne sobre as águas a mantém inabalável.\n\n– 3“Quem subirá até o monte do Senhor, *\nquem ficará em sua santa habitação?”\n= 4“Quem tem mãos puras e inocente coração, †\nquem não dirige sua mente para o crime, *\nnem jura falso para o dano de seu próximo.\n– 5Sobre este desce a bênção do Senhor *\ne a recompensa de seu Deus e Salvador”.\n– 6“É assim a geração dos que o procuram, *\ne do Deus de Israel buscam a face”.\n\n= 7“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 8Dizei-nos: “Quem é este Rei da glória?” †\n“É o Senhor, o valoroso, o onipotente, *\no Senhor, o poderoso nas batalhas!”\n\n= 9“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 10Dizei-nos: “Quem é este Rei da glória?” †\n“O Rei da glória é o Senhor onipotente, *\no Rei da glória é o Senhor Deus do universo!”\n3ª Ant. Ao prodígio da tua virgindade, elevemos com\n júbilo um hino de alegria!\nIntrodução às leituras\nD. Ave Maria, cheia de graça, o Senhor é convosco.\nT. Bendita sois vós entre as mulheres e bendito é o fruto\n do vosso ventre, Jesus!\nAbsolvição\n\nD. Pelas preces e méritos da bem-aventurada Virgem\n Maria e de todos os santos, o Senhor nos conduza ao\n Reino dos céus.\nT. Amém!\n\nPrimeira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Com seu divino Filho proteja-nos a Virgem Mãe.\nT. Amém!\n\nL. Santa Maria, Virgem das virgens, Mãe e Filha do\n Rei dos reis, dá-nos teu conforto nas dificuldades da\n vida. Por tua misericordiosa intercessão, o Senhor\n nos conceda o prêmio do céu e o reino eterno junto\n com seus eleitos. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nResponsório\nT. Como poderei louvar-te, Santa Virgem Maria? *\n Aquele que os céus não podem conter, o encerraste\n em teu seio!\nL. Bendita és tu entre as mulheres e bendito é o fruto\n do teu ventre!\nT. Aquele que os céus não podem conter, o encerraste\n em teu seio!\n\nSegunda leitura\nL. Invoca sobre mim a bênção do Senhor.\n\nD. A Virgem imaculada interceda por nós junto ao\n Senhor.\nT. Amém!\nL. Santa Maria, Mãe piedosa, intercede por nós,\n Virgem santa! Apresenta nossas súplicas ao teu Filho\n que, nascido para a nossa salvação, reina agora nos\n céus. Sua misericordiosa graça apague os nossos\n pecados. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\nResponsório\nT. Feliz és tu, Virgem Maria, pois trouxeste o Criador\n do mundo! * Deste à luz aquele que te criou e\n permaneceste sempre virgem!\nL. Ave, ó cheia de graça, o Senhor é contigo.\nT. Deste à luz aquele que te criou e permaneceste\n sempre virgem!\nTerceira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Pela intercessão da Virgem Maria, o Senhor nos\n conceda a paz e a salvação.\nT. Amém!\nL. Santa Mãe de Deus, tu que foste digna de trazer em\n teu seio aquele que o universo não pode conter, acolhe\n a nossa súplica! Tua misericordiosa intercessão nos\n\n obtenha o perdão das culpas e tua maternal presença\n nos conduza à morada da luz, onde com teu Filho\n reinas eternamente. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nSalve Rainha\n\n Salve, Rainha, Mãe de misericórdia, vida, doçura e\nesperança nossa, salve! A vós bradamos os degredados\nfilhos de Eva. A vós suspiramos, gemendo e chorando\nneste vale de lágrimas. Eia, pois, advogada nossa, esses\nvossos olhos a nós volvei! E depois deste desterro,\nmostrai-nos Jesus, bendito fruto do vosso ventre. Ó\nclemente, ó piedosa, ó doce sempre Virgem Maria!\n\nD. Rogai por nós, santa Mãe de Deus!\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Deus onipotente e eterno, que pela cooperação do\n Espírito Santo, preparastes, no corpo e na alma da\n bem-aventurada Virgem Maria, uma habitação digna\n do vosso Filho, fazei que celebrando com alegria sua\n memória, ela nos livre, por sua maternal intercessão,\n de todos os males da vida presente e da morte eterna.\n Por Cristo nosso Senhor.\nT. Amém!\n\n Oração pela Igreja pela Ordem\n Ó Senhor, por vossa misericórdia, dissolvei os\nvínculos dos nossos pecados e, pela intercessão da\nbem-aventurada Virgem Maria, Mãe de Deus, dos\nnossos Sete Santos Pais, do vosso servo São Filipe e de\ntodos os santos, guardai e santificai o papa NN, o nosso\nprior geral NN, a nós vossos servos, nossas\ncomunidades e benfeitores.\n Afastai do mal nossos pais, parentes e amigos e\nenriquecei-os de virtude. Concedei-nos saúde e paz.\nAfastai os inimigos visíveis e invisíveis e purificai-nos\nde todo desejo mundano. Dai serenidade aos ares e\nfertilidade aos campos.\n Libertai o mundo da fome, da guerra e de qualquer\noutro flagelo. Preservai ilesa de toda calamidade esta\ncidade e seus habitantes. Dai vosso amor a nossos\namigos e também a nossos inimigos, e concedei aos\nfiéis defuntos o eterno repouso. Amém!", "formula2": "Segunda fórmula\n Santa Maria\n Serva Do Senhor\nIntrodução\n\nD. Bendita sois vós entre as mulheres\nT. E bendito é o fruto do vosso ventre.\n\nD. Louvai comigo o Senhor pelas maravilhas que fez\n em Maria.\nT. Grandes e admiráveis são as tuas obras, Senhor\n Deus todo-poderoso! Justos e verdadeiros os teus\n caminhos, ó Rei do universo!\n\nHino\n \"Serva humilde eu sou do Senhor,\n em mim se faça segundo disseste\".\n Terra obediente tu és, ó Maria,\n terra que acolhe, que ama e adora.\n Filha querida do povo escolhido,\n santo rebento que brota em flor,\n flor desejada, esperada por todos,\n flor que embeleza o deserto do mundo.\n\n Dia após dia a Igreja repita\n as santas palavras da serva fiel:\n tudo haverá de voltar como outrora,\n quando Deus Pai caminhava no Éden.\n Glória à Trindade, Pai, Filho e Espírito,\n que desde sempre renovam o mundo:\n pois que nos deram uma Virgem e Mãe,\n beleza intacta de toda a criação.\n1ª Ant. Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\n SALMO 110\n Grandes são as obras do Senhor\n\"A minh'alma engrandece o Senhor, pois o Todo-\npoderoso fez em mim grandes coisas\" (Lc 1,46. 49).\n\n– 1Eu agradeço a Deus de todo o coração *\njunto com todos os seus justos reunidos!\n– 2Que grandiosas são as obras do Senhor, *\nelas merecem todo o amor e admiração!\n\n– 3Que beleza e esplendor são os seus feitos! *\nSua justiça permanece eternamente!\n– 4O Senhor bom e clemente nos deixou *\na lembrança de suas grandes maravilhas.\n\n– 5Ele dá o alimento aos que o temem *\ne jamais esquecerá sua Aliança.\n– 6Ao seu povo manifesta seu poder, *\ndando a ele a herança das nações.\n\n– 7Suas obras são verdade e são justiça, *\nseus preceitos, todos eles, são estáveis,\n– 8confirmados para sempre e pelos séculos, *\nrealizados na verdade e retidão.\n\n= 9Enviou libertação para o seu povo, †\nconfirmou sua Aliança para sempre. *\nSeu nome é santo e é digno de respeito.\n\n= 10Temer a Deus é o princípio do saber, †\ne é sábio todo aquele que o pratica. *\nPermaneça eternamente o seu louvor.\n\n1ª Ant. - Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\nOração sálmica\n Nós vos agradecemos, Senhor, porque por meio de\nMaria, vossa serva fiel, nos destes o Mediador da nova\nAliança. Concedei, vos pedimos, cumprir com amor os\n\nvossos preceitos e ser fiéis à vossa Palavra e ao nosso\ncompromisso de serviço. Por Cristo nosso Senhor.\nAmém!\n2ª Ant. Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\n SALMO 112\n A glória e a misericórdia do Senhor\n\"Olhou para a humildade de sua serva... Exaltou os\nhumildes\" (Lc 1, 48. 52).\n\n– 1Louvai, louvai, ó servos do Senhor, *\nlouvai, louvai o nome do Senhor!\n– 2Bendito seja o nome do Senhor, *\nagora e por toda a eternidade!\n– 3Do nascer do sol até o seu ocaso, *\nlouvado seja o nome do Senhor!\n– 4O Senhor está acima das nações, *\nsua glória vai além dos altos céus.\n= 5Quem pode comparar-se ao nosso Deus, †\nao Senhor, que no alto céu temo seu trono *\n e se inclina para olhar o céu e a terra?\n– 7Levanta da poeira o indigente *\ne do lixo ele retira o pobrezinho,\n– 8para fazê-lo assentar-se com os nobres, *\nassentar-se com os nobres do seu povo.\n\n– 9Faz a estéril, mãe feliz em sua casa, *\nvivendo rodeada de seus filhos.\n2ª Ant. - Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\nOração sálmica\n\nDo nascer ao pôr do sol, louvado seja o vosso nome,\nSenhor, porque escolhestes Maria, mulher humilde e\npobre, para ser a Mãe gloriosa do vosso Filho. Primeira\nentre os remidos, vós a colocastes na Igreja como Mãe\nfeliz de muitos filhos. Por Cristo nosso Senhor. Amém!\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\n SALMO 145\n Bem-aventurado aquele que espera no Senhor\n\"Sua misericórdia perdura de geração em geração\npara aqueles que o temem\" (Lc 1, 50).\n\n= 1Bendize, minh’alma, ao Senhor! †\n Bendirei ao Senhor toda a vida, *\ncantarei ao meu Deus sem cessar!\n\n– 3Não ponhais vossa fé nos que mandam, *\nnão há homem que possa salvar.\n\n = 4Ao faltar-lhe o respiro ele volta †\npara a terra de onde saiu; *\nnesse dia seus planos perecem.\n= 5É feliz todo homem que busca †\nseu auxílio no Deus de Jacó, *\ne que põe no Senhor a esperança.\n– 6O Senhor fez o céu e a terra, *\nfez o mar e o que neles existe.\n\n– O Senhor é fiel para sempre, *\n faz justiça aos que são oprimidos;\n – ele dá alimento aos famintos, *\né o Senhor quem liberta os cativos.\n\n= 8O Senhor abre os olhos aos cegos, †\no Senhor faz erguer-se o caído, *\no Senhor ama aquele que é justo.\n\n= 9É o Senhor quem protege o estrangeiro, †\nquem ampara a viúva e o órfão, *\nmas confunde os caminhos dos maus.\n\n=10O Senhor reinará para sempre! †\nÓ Sião, o teu Deus reinará *\npara sempre e por todos os séculos!\n\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\nOração sálmica\n\n Ó Senhor, suba até vós o louvor perene dos Servos\nde Santa Maria, porque enviastes o vosso Filho para\nanunciar a Boa Nova aos pobres e proclamar a\nliberdade aos cativos. Reavivai em nós o compromisso\nde socorrer aos mais necessitados com amor fraterno e\nde defender os oprimidos com coragem evangélica. Por\nCristo nosso Senhor. Amém!\n\nIntrodução à leitura\n\nD. Bem-aventurada aquela que acreditou.\nT. Nela encarnou-se o Filho de Deus.\n\nPrimeira leitura\n\n À VIRGEM DO SIM\n\nL. Santa Maria, serva humilde do Senhor, gloriosa Mãe\n de Cristo, salve! Virgem fiel, ventre consagrado ao\n Verbo, ensina-nos a ser dóceis à voz do Espírito, a\n viver na escuta da Palavra, atentos a seus apelos no\n segredo do coração, vigilantes em suas\n manifestações na vida dos irmãos, nos\n acontecimentos da história, nos sofrimentos e nas\n\n alegrias da criação. Virgem da escuta, criatura\n
