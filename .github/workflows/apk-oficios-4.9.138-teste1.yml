name: Compilar Liturgia OSM 4.9.138-teste1 — Ofício Próprio

on:
  push:
    branches: ['build/oficios-4.9.138-teste1']
    paths: ['.github/workflows/apk-oficios-4.9.138-teste1.yml']

permissions:
  contents: read

concurrency:
  group: apk-oficios-4.9.138-teste1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências sem alterar o lock aprovado
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Conferir correções da fonte canônica
        run: |
          python3 - <<'PYSOURCE'
          import json, hashlib
          from pathlib import Path
          b = Path('www/data/oficios-osm.json').read_bytes()
          assert hashlib.sha256(b).hexdigest() == 'a31bb4f1425bdd226f6a0db3ae664a60d78308635644f53d5d2958af8aa38d7a'
          d = json.loads(b)['celebracoes']
          for date in ['05-04','06-19','08-23','08-28','09-15','11-16','11-17']:
              h = d[date]['material']['horas']['hora_media']
              assert h['texto'].strip(), date
          print('Sete Horas Médias presentes; fonte canônica conferida por SHA-256.')
          PYSOURCE

      - name: Conferir navegação, dados pessoais e recursos offline
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm test
          npm run test:personal
          npm run test:reader-stability
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          node scripts/verify-reader-actions-layout.mjs
          node scripts/verify-accessibility.mjs

      - name: Identificar compilação de teste sem alterar conteúdo litúrgico
        run: |
          python3 - <<'PYVERSION'
          from pathlib import Path
          for name in ['package.json', 'package-lock.json', 'www/app.js', 'www/sw.js']:
              p = Path(name)
              original = p.read_text()
              assert '4.9.137' in original, name
              p.write_text(original.replace('4.9.137', '4.9.138-teste1'))
          PYVERSION

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar assinatura estável
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/liturgia-osm-release.jks
          chmod 600 android/app/liturgia-osm-release.jks
          keytool -list -keystore android/app/liturgia-osm-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias liturgia-osm >/dev/null
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file('liturgia-osm-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'liturgia-osm'
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs block; inspect before patching')
          if 'android {' not in s or 'buildTypes {' not in s:
              raise SystemExit('Unexpected Capacitor Gradle template')
          s = s.replace('android {', 'android {\n' + signing, 1)
          p.write_text(s)
          PY

      - name: Definir versão e segurança
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 41066/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9.138-teste1"/' android/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          start = s.find('release {')
          if start < 0:
              raise SystemExit('Could not locate the release build type in generated Gradle file')
          end = s.find('}', start) + 1
          if end <= start:
              raise SystemExit('Could not parse the release build type in generated Gradle file')
          block = s[start:end]
          block = block.replace('minifyEnabled false', 'minifyEnabled true')
          additions = []
          for key, value in [('minifyEnabled', 'true'), ('shrinkResources', 'true'), ('signingConfig', 'signingConfigs.stable')]:
              if key not in block:
                  additions.append(key + ' ' + value)
          if 'proguard-rules.pro' not in block:
              additions.append("proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
          if additions:
              block = block.replace('{', '{ ' + '; '.join(additions) + '; ', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          cat >> android/app/proguard-rules.pro <<'EOF'
          -keep class com.getcapacitor.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          EOF
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar o Capacitor
        run: |
          npx cap sync android
          node scripts/verify-cleanup.mjs --android

      - name: Configurar notificações inexatas
        run: node scripts/patch-android-notifications.mjs

      - name: Integrar leitor PDF Android offline
        run: node scripts/patch-android-pdf.mjs

      - name: Aplicar ícone Servita
        run: |
          mkdir -p icones-extraidos
          unzip -oq icone-android-liturgia-osm.zip -d icones-extraidos
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          cp -R icones-extraidos/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Manifesto sem o ícone principal @mipmap/ic_launcher')
          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          elif '<application' in s:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          else:
              raise SystemExit('Manifesto sem elemento application')
          p.write_text(s)
          PY
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Liturgia-OSM-4.9.138-teste1.apk

      - name: Conferir assinatura e todos os arquivos offline
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs Liturgia-OSM-4.9.138-teste1.apk > assinatura.txt
          grep -q 'certificate SHA-256 digest: 5b2b3319cc9f9bb61a14fb8a30e63044db225f7b930fca9568c82854f38b4fe0' assinatura.txt
          AAPT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/aapt"
          "$AAPT" dump badging Liturgia-OSM-4.9.138-teste1.apk > identidade.txt
          grep -q "package: name='com.liturgia_osm.app' versionCode='41066' versionName='4.9.138-teste1'" identidade.txt
          "$AAPT" dump xmltree Liturgia-OSM-4.9.138-teste1.apk AndroidManifest.xml > manifesto.txt
          if grep -Eqi 'appwidget|Servita(Square)?Widget' manifesto.txt; then
            echo "::error::O APK ainda declara um widget"
            exit 1
          fi
          python3 - <<'PYCHECK'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('Liturgia-OSM-4.9.138-teste1.apk') as apk:
              for p in Path('www').rglob('*'):
                  if p.is_file():
                      assert apk.read('assets/public/'+p.relative_to('www').as_posix())==p.read_bytes(), str(p)
              app = apk.read('assets/public/app.js').decode('utf-8')
              assert "const APP_VERSION = '4.9.138-teste1';" in app
              assert 'OSMPdf.formatIntercessions' in app
              shared = apk.read('assets/public/pdf-links.js').decode('utf-8')
              assert 'function formatIntercessions' in shared
              assert 'OSMPdf.formatIntercessions' in apk.read('assets/public/servite-3.js').decode('utf-8')
              assert 'liturgia-osm-v4.9.138-teste1-' in apk.read('assets/public/sw.js').decode('utf-8')
              assert not {'assets/public/widget-links.js', 'assets/santoral-widget.json'}.intersection(apk.namelist())
              reader = apk.read('assets/public/personal-reader.js').decode('utf-8')
              assert all(marker not in reader for marker in ('personalNoteText', 'Cópia de segurança', 'PersonalBackup'))
              assert all(b'PersonalBackupPlugin' not in apk.read(name) for name in apk.namelist() if name.endswith('.dex'))
          print('Todos os arquivos web/offline preservados byte a byte no APK; identidade e remoções confirmadas.')
          PYCHECK

      - name: Calcular resumo do APK
        run: sha256sum Liturgia-OSM-4.9.138-teste1.apk > SHA256SUMS.txt

      - name: Guardar APK assinado de teste
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.138-teste1-assinado
          path: |
            Liturgia-OSM-4.9.138-teste1.apk
            assinatura.txt
            identidade.txt
            SHA256SUMS.txt
          if-no-files-found: error
