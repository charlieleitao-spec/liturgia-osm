name: Integrar afrescos de Lavello ao Santoral
on:
  push:
    branches: [feat/afrescos-lavello-webp]
    paths:
      - 'scripts/integrar-afrescos-lavello.py'
      - '.github/workflows/integrar-afrescos-lavello.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/afrescos-lavello-webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Gerar imagens e atualizar fontes
        run: python scripts/integrar-afrescos-lavello.py
      - name: Registrar imagens e catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/boaventura-de-pistoia.webp www/media/francisco-de-sena.webp www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-pendentes.json www/data/fontes-imagens-santoral-lote5.json
          git diff --cached --quiet || (git commit -m "Integrar afrescos de Boaventura e Francisco em WebP" && git push)
