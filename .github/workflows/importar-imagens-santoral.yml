name: Incorporar imagens do Santoral - lote 1
on:
  push:
    branches:
      - images/santoral-lote1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Obter imagens oficiais e converter para WebP
        run: python scripts/importar-imagens-santoral-lote1.py
      - name: Validar arquivos
        run: |
          test -s www/media/santo-agostinho.webp
          test -s www/media/nossa-senhora-das-dores.webp
          python -m json.tool www/data/santoral.json >/dev/null
      - name: Salvar imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/santo-agostinho.webp www/media/nossa-senhora-das-dores.webp www/data/santoral.json
          git diff --cached --quiet || (git commit -m "Incorpora imagens offline de Santo Agostinho e Nossa Senhora das Dores" && git push)
