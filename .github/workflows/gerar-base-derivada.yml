name: Gerar base derivada OSM

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no Hoje após validação prática do APK
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "www/data/santoral.json"
      - "www/data/oficios-osm.json"
      - "www/data/memoria-liturgica.json"
      - "scripts/gerar-servita.js"
      - "scripts/audit-generated-servita.mjs"
      - ".github/workflows/gerar-base-derivada.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar e validar a partir das fontes canônicas
        run: |
          node scripts/gerar-servita.js derived/servita.generated.json
          node scripts/audit-generated-servita.mjs derived/servita.generated.json

      - name: Publicar no Hoje na Família Servita
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.HOJE_FAMILIA_SERVITA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure o secret HOJE_FAMILIA_SERVITA_TOKEN com permissão de escrita no repositório hoje-familia-servita."
            exit 1
          fi
          git clone https://x-access-token:${GH_TOKEN}@github.com/charlieleitao-spec/hoje-familia-servita.git target
          cp derived/servita.generated.json target/servita.json
          cd target
          if git diff --quiet -- servita.json; then
            echo "Base derivada já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servita.json
          git commit -m "Atualiza base derivada a partir do Liturgia OSM"
          git push
