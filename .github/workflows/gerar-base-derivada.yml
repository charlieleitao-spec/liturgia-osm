name: Gerar base derivada OSM

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "www/data/santoral.json"
      - "www/data/oficios-osm.json"
      - "www/data/memoria-liturgica.json"
      - "scripts/gerar-servita.js"
      - "scripts/validar-base-derivada.js"
      - ".github/workflows/gerar-base-derivada.yml"
  push:
    branches: [main]
    paths:
      - "www/data/santoral.json"
      - "www/data/oficios-osm.json"
      - "www/data/memoria-liturgica.json"
      - "scripts/gerar-servita.js"
      - "scripts/validar-base-derivada.js"
      - ".github/workflows/gerar-base-derivada.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a partir das fontes canônicas
        run: node scripts/gerar-servita.js derived/servita.generated.json

      - name: Validar resultado contra as fontes
        run: node scripts/validar-base-derivada.js derived/servita.generated.json

      - name: Publicar no Hoje na Família Servita
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.HOJE_FAMILIA_SERVITA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure o secret HOJE_FAMILIA_SERVITA_TOKEN com permissão de escrita no repositório hoje-familia-servita."
            exit 1
          fi
          git clone https://x-access-token:${GH_TOKEN}@github.com/charlieleitao-spec/hoje-familia-servita.git target
          cp derived/servita.generated.json target/servita.json
          cp www/data/santoral.json target/santoral.json
          cd target
          if git diff --quiet -- servita.json santoral.json; then
            echo "Base diária e santoral local já estão atualizados."
            exit 0
          fi
          node scripts/check-web.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servita.json santoral.json
          git commit -m "Atualiza base diária e santoral local a partir do Liturgia OSM"
          git push
