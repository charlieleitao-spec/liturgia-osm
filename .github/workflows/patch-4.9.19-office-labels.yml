name: Patch 4.9.19 office classification

on:
  push:
    branches: [liturgia-4.9.19-conteudo]
    paths:
      - '.github/workflows/patch-4.9.19-office-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liturgia-4.9.19-conteudo
      - name: Classificar ofícios e sincronizar Boaventura de Pistoia
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          old='"b. boaventura de pistoia": 31, "14/12": 31'
          new='"b. boaventura de pistoia": 31, "15/12": 31'
          if old not in s:
              raise SystemExit('Mapa de Boaventura de Pistoia não encontrado')
          s=s.replace(old,new,1)
          marker='function saintHasOffice(s){ return officeIdForSaint(s)!==null; }'
          addition='''function saintHasOffice(s){ return officeIdForSaint(s)!==null; }\nconst OFFICE_CLASSIFICATION={\n  0:'Ofício próprio',3:'Ofício próprio',6:'Ofício próprio',11:'Ofício próprio',16:'Ofício próprio',18:'Ofício próprio',23:'Ofício próprio',28:'Ofício próprio',29:'Ofício próprio',\n  1:'Comum com elementos próprios',8:'Comum com elementos próprios',12:'Comum com elementos próprios',13:'Comum com elementos próprios',14:'Comum com elementos próprios',15:'Comum com elementos próprios',19:'Comum com elementos próprios',20:'Comum com elementos próprios',21:'Comum com elementos próprios',24:'Comum com elementos próprios',26:'Comum com elementos próprios',30:'Comum com elementos próprios',\n  2:'Elementos próprios + Comum',4:'Elementos próprios + Comum',7:'Elementos próprios + Comum',9:'Elementos próprios + Comum',10:'Elementos próprios + Comum',22:'Elementos próprios + Comum',25:'Elementos próprios + Comum',27:'Elementos próprios + Comum',31:'Elementos próprios + Comum'\n};\nfunction officeClassificationForSaint(s){\n  const id=officeIdForSaint(s);\n  return id===null?'':(OFFICE_CLASSIFICATION[id]||'Liturgia das Horas desta celebração');\n}'''
          if marker not in s:
              raise SystemExit('Função saintHasOffice não encontrada')
          s=s.replace(marker,addition,1)
          old_intro='<div class="office-hours-intro">Ofício próprio desta celebração</div>'
          new_intro='<div class="office-hours-intro">${officeClassificationForSaint(s)}</div>'
          count=s.count(old_intro)
          if count < 1:
              raise SystemExit('Rótulo de Ofício não encontrado')
          s=s.replace(old_intro,new_intro)
          p.write_text(s,encoding='utf-8')
          print('rótulos substituídos:',count)
          PY
      - name: Validar
        run: |
          grep -q '"15/12": 31' www/index.html
          grep -q 'officeClassificationForSaint' www/index.html
          ! grep -q 'Ofício próprio desta celebração' www/index.html
          npm ci
          npm test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html
          git commit -m 'feat: classify OSM offices in celebration view'
          git push origin HEAD:liturgia-4.9.19-conteudo
