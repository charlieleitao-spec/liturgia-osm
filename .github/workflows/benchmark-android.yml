name: Benchmark Android 4.9.2 vs 4.9.3

on:
  push:
    branches: [benchmark-493]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar versão 4.9.2 instrumentada
        run: |
          mkdir app492
          unzip -q Liturgia-OSM-4.9.2-GitHub.zip -d app492
          node <<'NODE'
          const fs=require('fs');const file='app492/www/index.html';let html=fs.readFileSync(file,'utf8');
          const metric=`<script id="startupMetricBenchmark">window.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const nav=performance.getEntriesByType('navigation')[0];const paint=performance.getEntriesByName('first-contentful-paint')[0]||performance.getEntriesByName('first-paint')[0];console.info('[Liturgia OSM startup]',JSON.stringify({version:'4.9.2',domContentLoadedMs:Math.round(nav?.domContentLoadedEventEnd||performance.now()),firstPaintMs:paint?Math.round(paint.startTime):null,indexBytes:${Buffer.byteLength(html)}}));})));</script>`;
          fs.writeFileSync(file,html.replace('</body>',metric+'</body>'));
          NODE
          cd app492
          npm ci
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar versão 4.9.3 instrumentada
        run: |
          mkdir app493
          unzip -q Liturgia-OSM-4.9.3-GitHub.zip -d app493
          cd app493
          npm ci
          npm test
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar script de medição
        run: |
          cat > benchmark.sh <<'SCRIPT'
          #!/usr/bin/env sh
          set -eu
          mkdir -p benchmark-results
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          {
            echo "device=$(adb shell getprop ro.product.model | tr -d '\r')"
            echo "android=$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "webview=$(adb shell dumpsys package com.google.android.webview | grep versionName | head -1 | xargs)"
          } > benchmark-results/device.txt
          benchmark_version() {
            version="$1"; apk="$2"; output="benchmark-results/${version}.log"; package="com.liturgia_osm.app"
            adb install -r "$apk" >/dev/null
            component="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$package" | tr -d '\r' | tail -1)"
            echo "${version} launcher=${component:-não encontrado}"
            : > "$output"
            for run in 1 2 3 4 5; do
              echo "Iniciando ${version} rodada ${run}"
              adb shell am force-stop "$package"
              adb logcat -c
              if [ -n "$component" ] && [ "$component" != "No activity found" ]; then
                launch_output="$(timeout 10s adb shell am start -n "$component" 2>&1 || true)"
              else
                launch_output="$(timeout 10s adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 2>&1 || true)"
              fi
              printf 'run=%s launcher=%s launch=%s\n' "$run" "${component:-null}" "$launch_output" >> "$output"
              for wait_try in $(seq 1 60); do
                line="$(timeout 3s adb logcat -d -v brief 2>/dev/null | grep -F '[Liturgia OSM startup]' | tail -1 || true)"
                if [ -n "$line" ]; then break; fi
                sleep 0.5
              done
              printf 'run=%s metric=%s\n' "$run" "${line:-null}" >> "$output"
              echo "Concluída ${version} rodada ${run}: métrica=$([ -n "$line" ] && echo encontrada || echo ausente)"
            done
            adb uninstall "$package" >/dev/null
          }
          benchmark_version 4.9.2 app492/android/app/build/outputs/apk/debug/app-debug.apk
          benchmark_version 4.9.3 app493/android/app/build/outputs/apk/debug/app-debug.apk
          cat benchmark-results/device.txt benchmark-results/4.9.2.log benchmark-results/4.9.3.log
          SCRIPT

      - name: Executar cinco partidas a frio por versão
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: sh benchmark.sh

      - name: Disponibilizar resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-android-4.9.3
          path: benchmark-results
          if-no-files-found: error
