name: Build APK Liturgia OSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Descompactar projeto Android
        run: |
          mkdir projeto
          unzip -o Liturgia_OSM_4.4.0_Android_corrigido.zip -d projeto

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projeto/liturgia-osm-main/package-lock.json

      - name: Instalar dependências
        working-directory: projeto/liturgia-osm-main
        run: npm ci

      - name: Preparar aplicação web
        working-directory: projeto/liturgia-osm-main
        run: npm run build

      - name: Sincronizar Android
        working-directory: projeto/liturgia-osm-main
        run: npx cap sync android

      - name: Gerar APK
        working-directory: projeto/liturgia-osm-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-APK
          path: projeto/liturgia-osm-main/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Liturgia OSM v${{ github.run_number }}
          generate_release_notes: true
          files: projeto/liturgia-osm-main/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Criar Release automática
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Liturgia OSM v${{ github.run_number }}"
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar APK de debug
        run: cd android && ./gradlew assembleDebug

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-osm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
