name: Build APK Liturgia OSM 4.5.4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projeto

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Abrir pacote 4.5.4
        working-directory: .
        run: |
          mkdir -p projeto
          unzip -q Liturgia-OSM-4.5.4-GitHub.zip -d projeto

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto/package-lock.json

      - name: Ajustar dependências do Capacitor
        run: |
          npm pkg set "dependencies.@capacitor/android=8.5.1"
          npm pkg set "dependencies.@capacitor/core=8.5.1"
          npm pkg set "devDependencies.@capacitor/cli=8.5.1"

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: projeto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Nomear APK
        working-directory: .
        run: cp projeto/android/app/build/outputs/apk/debug/app-debug.apk Liturgia-OSM-4.5.4.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.5.4
          path: Liturgia-OSM-4.5.4.apk
          if-no-files-found: error

      - name: Publicar versão 4.5.4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5.4
          name: Liturgia OSM 4.5.4
          generate_release_notes: true
          files: Liturgia-OSM-4.5.4.apk
