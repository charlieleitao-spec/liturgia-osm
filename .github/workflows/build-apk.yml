name: Build APK Liturgia OSM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Validar aplicativo web
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Gerar APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-osm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
