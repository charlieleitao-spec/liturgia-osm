name: Build APK Liturgia OSM 4.9.36

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Auditar conteúdo e funcionamento offline
        run: npm test

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar assinatura estável
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/liturgia-osm-release.jks
          chmod 600 android/app/liturgia-osm-release.jks
          keytool -list -keystore android/app/liturgia-osm-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias liturgia-osm >/dev/null
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file('liturgia-osm-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'liturgia-osm'
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs block; inspect before patching')
          if 'android {' not in s or 'buildTypes {' not in s:
              raise SystemExit('Unexpected Capacitor Gradle template')
          s = s.replace('android {', 'android {\n' + signing, 1)
          p.write_text(s)
          PY

      - name: Definir versão e segurança
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 40936/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9.36"/' android/app/build.gradle
          sed -i 's/buildTypes {/buildTypes {\n        debug { debuggable false; signingConfig signingConfigs.stable }/' android/app/build.gradle
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Aplicar ícone Servita
        run: |
          mkdir -p icones-extraidos
          unzip -oq icone-android-liturgia-osm.zip -d icones-extraidos
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icones-extraidos/mipmap-${density}-v4/ic_launcher*.png android/app/src/main/res/mipmap-${density}/
          done

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Liturgia-OSM-4.9.36.apk

      - name: Verificar APK
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "${APKSIGNER}" verify --verbose --print-certs Liturgia-OSM-4.9.36.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.36
          path: Liturgia-OSM-4.9.36.apk
          if-no-files-found: error

      - name: Empacotar projeto Android Gradle sem credenciais
        run: |
          mkdir -p artifacts/gradle-project
          cp package.json package-lock.json capacitor.config.json BUILD-ANDROID.md .gitignore artifacts/gradle-project/
          cp -R www scripts android artifacts/gradle-project/
          cat > artifacts/gradle-project/ANDROID-GRADLE.md <<'EOF'
          # Projeto Android Gradle — Liturgia OSM 4.9.36

          Este pacote contém o projeto Android gerado pelo Capacitor, os arquivos Gradle e o código web.

          ## Requisitos
          - Node.js 22 e npm
          - JDK 21
          - Android Studio e Android SDK

          ## Preparar e compilar
          Na pasta raiz do pacote, execute `npm ci` e `npx cap sync android`.
          Abra a pasta `android/` no Android Studio ou compile com `cd android && ./gradlew assembleDebug`.

          A chave de assinatura foi removida do pacote. Para gerar um APK de distribuição, configure uma chave própria e permanente no Gradle.
          EOF
          rm -f artifacts/gradle-project/android/app/liturgia-osm-release.jks
          rm -f artifacts/gradle-project/android/local.properties
          find artifacts/gradle-project/android -type d \( -name build -o -name .gradle \) -prune -exec rm -rf {} +
          find artifacts/gradle-project/android -type f \( -name '*.jks' -o -name '*.keystore' \) -delete
          (cd artifacts/gradle-project && zip -qr ../Liturgia-OSM-4.9.36-projeto-Gradle.zip .)

      - name: Disponibilizar projeto Android Gradle
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.36-projeto-Gradle
          path: artifacts/Liturgia-OSM-4.9.36-projeto-Gradle.zip
          if-no-files-found: error

      - name: Publicar versão 4.9.36
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.36
          name: Liturgia OSM 4.9.36
          generate_release_notes: true
          overwrite_files: true
          files: Liturgia-OSM-4.9.36.apk
