name: Build APK Liturgia OSM 4.9.51

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Atualizar lock do plugin App e instalar dependências
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci

      - name: Auditar conteúdo e funcionamento offline
        run: npm test

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar assinatura estável
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/liturgia-osm-release.jks
          chmod 600 android/app/liturgia-osm-release.jks
          keytool -list -keystore android/app/liturgia-osm-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias liturgia-osm >/dev/null
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file('liturgia-osm-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'liturgia-osm'
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs block; inspect before patching')
          if 'android {' not in s or 'buildTypes {' not in s:
              raise SystemExit('Unexpected Capacitor Gradle template')
          s = s.replace('android {', 'android {\n' + signing, 1)
          p.write_text(s)
          PY

      - name: Definir versão e segurança
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 40955/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9.51"/' android/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          start = s.find('release {')
          if start < 0:
              raise SystemExit('Could not locate the release build type in generated Gradle file')
          end = s.find('}', start) + 1
          if end <= start:
              raise SystemExit('Could not parse the release build type in generated Gradle file')
          block = s[start:end]
          block = block.replace('minifyEnabled false', 'minifyEnabled true')
          additions = []
          for key, value in [('minifyEnabled', 'true'), ('shrinkResources', 'true'), ('signingConfig', 'signingConfigs.stable')]:
              if key not in block:
                  additions.append(key + ' ' + value)
          if 'proguard-rules.pro' not in block:
              additions.append("proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
          if additions:
              block = block.replace('{', '{ ' + '; '.join(additions) + '; ', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          cat >> android/app/proguard-rules.pro <<'EOF'
          -keep class com.getcapacitor.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          EOF
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Aplicar ícone Servita
        run: |
          mkdir -p icones-extraidos
          unzip -oq icone-android-liturgia-osm.zip -d icones-extraidos
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          cp -R icones-extraidos/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Manifesto sem o ícone principal @mipmap/ic_launcher')
          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          elif '<application' in s:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          else:
              raise SystemExit('Manifesto sem elemento application')
          p.write_text(s)
          PY
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Liturgia-OSM-4.9.51.apk

      - name: Verificar assinatura e compatibilidade do APK
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/aapt"
          APK=Liturgia-OSM-4.9.51.apk
          PREVIOUS=Liturgia-OSM-4.9.45.apk
          curl -fsSL https://github.com/charlieleitao-spec/liturgia-osm/releases/download/v4.9.45/Liturgia-OSM-4.9.45.apk -o "$PREVIOUS"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > atual.txt
          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS" > anterior.txt
          cat atual.txt
          ATUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' atual.txt | head -1)
          ANTERIOR_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' anterior.txt | head -1)
          test -n "$ATUAL_CERT" && test "$ATUAL_CERT" = "$ANTERIOR_CERT"
          ATUAL_BADGING=$("$AAPT" dump badging "$APK" | head -1)
          ANTERIOR_BADGING=$("$AAPT" dump badging "$PREVIOUS" | head -1)
          ATUAL_CODE=$(echo "$ATUAL_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          ANTERIOR_CODE=$(echo "$ANTERIOR_BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          echo "$ATUAL_BADGING"
          echo "Baseline: $ANTERIOR_BADGING"
          test "$ATUAL_CODE" = 40955
          test "$ANTERIOR_CODE" = 40949
          test "$ATUAL_CODE" -gt "$ANTERIOR_CODE"
          "$AAPT" dump resources "$APK" > apk-resources.txt
          for resource in ic_launcher ic_launcher_round ic_launcher_monochrome; do grep -q "mipmap/$resource" apk-resources.txt; done
          grep -E "mipmap/ic_launcher(_round|_monochrome)?" apk-resources.txt | head -12
          echo "Assinatura SHA-256 igual à versão instalada distribuída: $ATUAL_CERT"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.51
          path: Liturgia-OSM-4.9.51.apk
          if-no-files-found: error

      - name: Disponibilizar lock atualizado (temporário)
        uses: actions/upload-artifact@v5
        with:
          name: lock-temporario-4.9.51
          path: package-lock.json
          if-no-files-found: error

      - name: Publicar versão 4.9.51
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.51
          name: Liturgia OSM 4.9.51
          generate_release_notes: true
          overwrite_files: true
          files: Liturgia-OSM-4.9.51.apk

