name: Build APK Liturgia OSM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: projeto/liturgia-osm-main

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Abrir pacote offline
        working-directory: .
        run: unzip -q Liturgia_OSM_4.5.0_OFFLINE_GitHub.zip -d projeto

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto/liturgia-osm-main/package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Preparar aplicativo offline
        run: npm run build

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Gerar APK de debug
        working-directory: projeto/liturgia-osm-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Liturgia-OSM-4.5.0-OFFLINE
          path: projeto/liturgia-osm-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
