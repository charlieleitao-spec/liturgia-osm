name: Build APK Liturgia OSM 4.9.25

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Auditar conteúdo e funcionamento offline
        run: npm test

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar assinatura estável
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/liturgia-osm-release.jks
          chmod 600 android/app/liturgia-osm-release.jks
          keytool -list -keystore android/app/liturgia-osm-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias liturgia-osm >/dev/null
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file('liturgia-osm-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'liturgia-osm'
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs block; inspect before patching')
          if 'android {' not in s or 'buildTypes {' not in s:
              raise SystemExit('Unexpected Capacitor Gradle template')
          s = s.replace('android {', 'android {\n' + signing, 1)
          p.write_text(s)
          PY

      - name: Definir versão e segurança
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 40925/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9.25"/' android/app/build.gradle
          sed -i 's/buildTypes {/buildTypes {\n        debug { debuggable false; signingConfig signingConfigs.stable }/' android/app/build.gradle
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar o Capacitor
        run: npx cap sync android

      - name: Aplicar ícone Servita
        run: |
          mkdir -p icones-extraidos
          unzip -oq icone-android-liturgia-osm.zip -d icones-extraidos
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icones-extraidos/mipmap-${density}-v4/ic_launcher*.png android/app/src/main/res/mipmap-${density}/
          done

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Liturgia-OSM-4.9.25.apk

      - name: Verificar APK
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "${APKSIGNER}" verify --verbose --print-certs Liturgia-OSM-4.9.25.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.25
          path: Liturgia-OSM-4.9.25.apk
          if-no-files-found: error

      - name: Publicar versão 4.9.25
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9.25
          name: Liturgia OSM 4.9.25
          generate_release_notes: true
          overwrite_files: true
          files: Liturgia-OSM-4.9.25.apk

