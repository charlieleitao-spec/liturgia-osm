name: Validar índice dos Ofícios marianos (PR 153)
on:
  push:
    branches:
      - revisao-minuciosa-oficios-marianos
    paths:
      - .github/workflows/validar-indice-oficios-marianos.yml
permissions:
  contents: write
jobs:
  indice-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar extrator de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Regenerar índice de pesquisa offline
        run: npm run search:build
      - name: Registrar somente índice atualizado na branch de revisão
        run: |
          if ! git diff --quiet -- www/data/search-index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add www/data/search-index.json
            git commit -m "Atualizar índice offline após revisão dos Ofícios marianos [skip ci]"
            git push
          fi
      - name: Instalar dependências
        run: npm ci
      - name: Executar regressões
        run: |
          npm test
          npm run test:reader-stability
          npm run test:personal
