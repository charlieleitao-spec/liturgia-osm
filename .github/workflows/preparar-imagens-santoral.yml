name: Preparar imagens do Santoral OSM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-imagens-santoral.yml'

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Baixar e converter imagens verificadas
        run: python scripts/preparar-imagens-santoral.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santoral-webp-revisao
          path: santoral-imagens-revisao/
          if-no-files-found: warn
