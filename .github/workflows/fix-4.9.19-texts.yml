name: Fix 4.9.19 text corrections
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply safe textual corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('www/data/hoje-familia-servita.json')
          s = p.read_text(encoding='utf-8')
          fixes = {
            'em visita a os frades': 'em visita aos frades',
            'serviço perene].': 'serviço perene.',
            'Pio VI aprovou seu culto em 1773. O': 'Pio VI aprovou seu culto em 1773.'
          }
          for old, new in fixes.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old!r}; found {s.count(old)}')
              s = s.replace(old, new)
          json.loads(s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/data/hoje-familia-servita.json
          git diff --cached --check
          git commit -m 'fix: correct Familia Servita textual issues'
          git push
