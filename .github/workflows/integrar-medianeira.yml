name: Integrar imagem de Maria Medianeira
on:
  push:
    branches: [feat/medianeira-cc0]
    paths:
      - 'scripts/integrar-medianeira.py'
      - '.github/workflows/integrar-medianeira.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/medianeira-cc0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/integrar-medianeira.py
      - name: Registrar imagem e créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/maria-mae-medianeira.webp www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-pendentes.json www/data/fontes-imagens-santoral-lote9.json
          git diff --cached --quiet || (git commit -m "Integrar imagem CC0 de Maria Medianeira" && git push)
