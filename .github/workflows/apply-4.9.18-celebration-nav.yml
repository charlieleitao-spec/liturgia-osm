name: Apply 4.9.18 celebration navigation

on:
  push:
    branches: [liturgia-4.9.18-auditoria]
    paths:
      - 'scripts/patch-4.9.18-celebration-nav.mjs'
      - '.github/workflows/apply-4.9.18-celebration-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: liturgia-4.9.18-auditoria
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply celebration navigation patch
        run: node scripts/patch-4.9.18-celebration-nav.mjs
      - name: Audit app
        run: npm test
      - name: Commit validated celebration navigation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html
          git commit -m 'feat: stabilize previous and next celebration navigation for 4.9.18'
          git push
