name: Importar imagens servitas das Filipinas
on:
  push:
    branches: [feat/imagens-santoral-filipinas-lote3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Importar quatro imagens identificadas
        run: python scripts/importar-imagens-santoral-lote3.py
      - name: Validar e salvar lote
        run: |
          python -m json.tool www/data/santoral.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-lote3.json www/media/*.webp
          git diff --cached --quiet || (git commit -m "Inclui quatro imagens iconográficas OSM" && git push)
