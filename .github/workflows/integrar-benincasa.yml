name: Integrar imagem de Benincasa de Montepulciano
on:
  push:
    branches: [feat/benincasa-ademollo]
    paths:
      - 'scripts/integrar-benincasa.py'
      - '.github/workflows/integrar-benincasa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/benincasa-ademollo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/integrar-benincasa.py
      - name: Registrar imagem e créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/benincasa-montepulciano.webp www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-pendentes.json www/data/fontes-imagens-santoral-lote11.json
          git diff --cached --quiet || (git commit -m "Integrar imagem histórica de Benincasa de Montepulciano" && git push)
