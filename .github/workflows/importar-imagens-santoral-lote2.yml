name: Importar imagens do Santoral lote 2
on:
  push:
    branches: [feat/imagens-santoral-lote2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Buscar e converter imagens verificadas
        run: python scripts/importar-imagens-santoral-lote2.py
      - name: Registrar apenas arquivos validados
        run: |
          python -m json.tool www/data/santoral.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-lote2.json www/media/*.webp
          git diff --cached --quiet || (git commit -m "Adiciona lote de imagens verificadas ao Santoral" && git push)
