name: APK teste — busca nas anotações

on:
  push:
    branches: ['feat/busca-anotacoes-pessoais']
    paths: ['www/**', 'scripts/**', 'package*.json', 'capacitor.config.json', '.github/workflows/**', 'icone-android-liturgia-osm.zip', 'docs/biblioteca-pdfs/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: test-personal-notes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências sem alterar o lock aprovado
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Conferir o código aprovado e as alterações de versão
        run: |
          find www -name "*.js" -exec node --check {} \;
          node --check scripts/cleanup-android-assets.mjs
          test "$(node -p "require('./package.json').version")" = '4.9.134'
          node -e "const fs=require('fs'); const v=require('./package.json').version; const app=fs.readFileSync('www/app.js','utf8'); if(!app.includes(\"const APP_VERSION = '\"+v+\"';\")) throw Error('Versão exibida diferente da versão do pacote');"

      - name: Conferir anotações no navegador e apresentação dos leitores
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npm run test:reader-stability
          npm run test:personal
          node scripts/verify-personal-notes.mjs
          node scripts/verify-unified-readers.mjs

      - name: Guardar evidências visuais
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conferencia-anotacoes
          path: |
            validation-personal-notes/
            validation-layout/
          if-no-files-found: warn

      - name: Conferir versão, conteúdo e navegação
        run: npm test

      - name: Validar origem imutável dos downloads
        run: python3 scripts/verify-download-origin.py

      - name: Identificar como compilação de teste
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import json
          version = '4.9.134-anotacoes-teste1'
          p = Path('www/app.js'); s = p.read_text()
          assert "const APP_VERSION = '4.9.134';" in s
          p.write_text(s.replace("const APP_VERSION = '4.9.134';", "const APP_VERSION = '"+version+"';", 1))
          p = Path('www/sw.js'); p.write_text(p.read_text().replace('liturgia-osm-v4.9.134-', 'liturgia-osm-v'+version+'-', 1))
          p = Path('package.json'); d = json.loads(p.read_text()); d['version'] = version
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PYTEST

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar assinatura estável
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/liturgia-osm-release.jks
          chmod 600 android/app/liturgia-osm-release.jks
          keytool -list -keystore android/app/liturgia-osm-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias liturgia-osm >/dev/null
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = """    signingConfigs {
                  stable {
                      storeFile file('liturgia-osm-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias 'liturgia-osm'
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs {' in s:
              raise SystemExit('Unexpected existing signingConfigs block; inspect before patching')
          if 'android {' not in s or 'buildTypes {' not in s:
              raise SystemExit('Unexpected Capacitor Gradle template')
          s = s.replace('android {', 'android {\n' + signing, 1)
          p.write_text(s)
          PY

      - name: Definir versão e segurança
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode 41053/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.9.134-anotacoes-teste1"/' android/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          start = s.find('release {')
          if start < 0:
              raise SystemExit('Could not locate the release build type in generated Gradle file')
          end = s.find('}', start) + 1
          if end <= start:
              raise SystemExit('Could not parse the release build type in generated Gradle file')
          block = s[start:end]
          block = block.replace('minifyEnabled false', 'minifyEnabled true')
          additions = []
          for key, value in [('minifyEnabled', 'true'), ('shrinkResources', 'true'), ('signingConfig', 'signingConfigs.stable')]:
              if key not in block:
                  additions.append(key + ' ' + value)
          if 'proguard-rules.pro' not in block:
              additions.append("proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
          if additions:
              block = block.replace('{', '{ ' + '; '.join(additions) + '; ', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          cat >> android/app/proguard-rules.pro <<'EOF'
          -keep class com.getcapacitor.** { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          EOF
          sed -i 's/<application /<application android:allowBackup="false" /' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar o Capacitor
        run: |
          npx cap sync android
          node scripts/verify-cleanup.mjs --android

      - name: Configurar notificações inexatas
        run: node scripts/patch-android-notifications.mjs

      - name: Integrar leitor PDF Android offline
        run: node scripts/patch-android-pdf.mjs

      - name: Gerar widgets Android
        run: node scripts/patch-android-widget.mjs

      - name: Aplicar ícone Servita
        run: |
          mkdir -p icones-extraidos
          unzip -oq icone-android-liturgia-osm.zip -d icones-extraidos
          find android/app/src/main/res -type f -name 'ic_launcher*' -delete
          cp -R icones-extraidos/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit('Manifesto sem o ícone principal @mipmap/ic_launcher')
          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          elif '<application' in s:
              s = s.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
          else:
              raise SystemExit('Manifesto sem elemento application')
          p.write_text(s)
          PY
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_monochrome.png
      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Liturgia-OSM-4.9.134-anotacoes-teste1.apk

      - name: Conferir assinatura e todos os arquivos offline
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs Liturgia-OSM-4.9.134-anotacoes-teste1.apk > assinatura.txt
          grep -q 'certificate SHA-256 digest: 5b2b3319cc9f9bb61a14fb8a30e63044db225f7b930fca9568c82854f38b4fe0' assinatura.txt
          AAPT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/aapt"
          "$AAPT" dump badging Liturgia-OSM-4.9.134-anotacoes-teste1.apk > identidade.txt
          grep -q "package: name='com.liturgia_osm.app' versionCode='41053' versionName='4.9.134-anotacoes-teste1'" identidade.txt
          python3 - <<'PYCHECK'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('Liturgia-OSM-4.9.134-anotacoes-teste1.apk') as apk:
              app = apk.read('assets/public/app.js').decode('utf-8')
              assert "const APP_VERSION = '4.9.134-anotacoes-teste1';" in app, 'Versão interna incorreta no APK'
              assert 'OSMPdf.formatIntercessions' in app
              assert 'function formatIntercessions' in apk.read('assets/public/pdf-links.js').decode('utf-8')
              assert 'OSMPdf.formatIntercessions' in apk.read('assets/public/servite-3.js').decode('utf-8')
              assert 'liturgia-osm-v4.9.134-anotacoes-teste1-' in apk.read('assets/public/sw.js').decode('utf-8'), 'Cache desatualizado'
              assert 'personalNoteSearch' in apk.read('assets/public/personal-reader.js').decode('utf-8')
              for name in ['cordova.js', 'cordova_plugins.js']:
                  assert 'assets/public/'+name not in apk.namelist()
              for p in Path('www').rglob('*'):
                  if p.is_file():
                      assert apk.read('assets/public/'+p.relative_to('www').as_posix())==p.read_bytes(), str(p)
          print('Todos os arquivos web/offline preservados byte a byte no APK.')
          PYCHECK

      - name: Calcular identificação do APK
        run: sha256sum Liturgia-OSM-4.9.134-anotacoes-teste1.apk > SHA256SUMS.txt

      - name: Guardar APK candidato
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM-4.9.134-anotacoes-teste1
          path: |
            Liturgia-OSM-4.9.134-anotacoes-teste1.apk
            assinatura.txt
            identidade.txt
            SHA256SUMS.txt
            validation-results/
            validation-layout/
          if-no-files-found: error
