name: Apply 4.9.17 content patch

on:
  push:
    branches: [liturgia-4.9.17-conteudo]
    paths:
      - 'scripts/patch-4.9.17.mjs'
      - 'scripts/audit-app.mjs'
      - '.github/workflows/apply-4.9.17-content.yml'

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liturgia-4.9.17-conteudo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved 4.9.17 patch
        run: node scripts/patch-4.9.17.mjs
      - name: Audit app
        run: node scripts/audit-app.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: promote Liturgia OSM to 4.9.17'
          git push
