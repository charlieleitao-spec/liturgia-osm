name: Integrar afresco de Ubaldo ao Santoral
on:
  push:
    branches: [feat/ubaldo-afresco-santoral]
    paths:
      - 'scripts/integrar-ubaldo.py'
      - '.github/workflows/integrar-ubaldo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ubaldo-afresco-santoral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Converter imagem e atualizar referências
        run: python scripts/integrar-ubaldo.py
      - name: Registrar imagem e créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/ubaldo-de-sansepolcro.webp www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-pendentes.json www/data/fontes-imagens-santoral-lote7.json
          git diff --cached --quiet || (git commit -m "Integrar afresco licenciado de Ubaldo ao Santoral" && git push)
