name: Gate otimização offline
on:
  pull_request:
    branches: ['main', 'release/**', 'optimize/**']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run search:build
      - run: git diff --exit-code -- www/data/search-index.json
      - run: npm test
      - run: node scripts/verify-search-equivalence.cjs
      - run: node scripts/benchmark-search-4.9.134.cjs
      - run: npx cap add android && npx cap sync android && node scripts/verify-cleanup.mjs --android
      - uses: actions/upload-artifact@v5
        with:
          name: equivalencia-busca
          path: validation-results/
