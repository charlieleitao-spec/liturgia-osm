name: Integrar gravura dos Defuntos da Ordem
on:
  push:
    branches: [feat/defuntos-tempesta-cc0]
    paths:
      - 'scripts/integrar-defuntos.py'
      - '.github/workflows/integrar-defuntos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/defuntos-tempesta-cc0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Converter gravura e atualizar referências
        run: python scripts/integrar-defuntos.py
      - name: Registrar imagem e créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/media/defuntos-da-ordem.webp www/data/santoral.json www/data/README.md www/data/fontes-imagens-santoral-pendentes.json www/data/fontes-imagens-santoral-lote8.json
          git diff --cached --quiet || (git commit -m "Integrar gravura CC0 para Defuntos da Ordem" && git push)
