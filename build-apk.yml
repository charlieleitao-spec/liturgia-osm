name: Build APK Liturgia OSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK Liturgia OSM
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissão de execução ao Gradle
        run: chmod +x gradlew

      - name: Verificar versão do Gradle
        run: ./gradlew --version

      - name: Limpar compilação anterior
        run: ./gradlew clean

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Verificar APK gerado
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v5
        with:
          name: Liturgia-OSM
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Liturgia-OSM-v${{ github.run_number }}.apk

      - name: Criar Release automática
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Liturgia OSM v${{ github.run_number }}"
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Liturgia-OSM-v${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar APK de debug
        run: cd android && ./gradlew assembleDebug

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-osm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Gerar APK de debug
        run: cd android && ./gradlew assembleDebug

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-osm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
