<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){
  try{
    var t = localStorage.getItem('santoral-osm-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var fs = localStorage.getItem('santoral-osm-fontsize');
    if(fs){ document.documentElement.style.fontSize = fs + 'px'; }
  }catch(e){}
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santoral OSM — Servos de Maria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#EFE4BC;
  --bg-panel:#F8F1D9;
  --bg-panel-2:#FCF8E9;
  --line:#D9C68F;
  --gold:#8A6A1E;
  --gold-soft:#6E5416;
  --wine:#9A2620;
  --wine-soft:#9A2620;
  --paper:#211A10;
  --paper-dim:#211A10;
  --text:#211A10;
  --text-muted:#7A6A46;
  --text-faint:#93815A;
  --shadow: 0 10px 22px -14px rgba(110,84,22,.35);
  --topbar-bg1: rgba(248,241,217,.92);
  --topbar-bg2: rgba(248,241,217,.55);
  --tabbar-bg: rgba(248,241,217,.92);
  --card-corner: rgba(138,106,30,.35);
  --prayer-card-bg1: rgba(154,38,32,.09);
  --prayer-card-bg2: rgba(154,38,32,.03);
  --prayer-card-border: rgba(154,38,32,.30);
  --ambient-1: rgba(154,38,32,.05);
  --ambient-2: rgba(138,106,30,.10);
  --ambient-3: rgba(154,38,32,.04);
  --ambient-bg: linear-gradient(180deg, #F1E6C1 0%, #EFE3BA 45%, #EADBA9 100%);
  --noise-color:0.36, 0.29, 0.13;
  --noise-opacity:.5;
  --noise-blend:multiply;
  --rank-text:#F6EAD2;
}

[data-theme="dark"]{
  --bg-deep:#0B1626;
  --bg-panel:#101E33;
  --bg-panel-2:#14263F;
  --line:#243652;
  --gold:#D9B65C;
  --gold-soft:#E8CD87;
  --wine:#E2645A;
  --wine-soft:#E2857C;
  --paper:#F1EEE3;
  --paper-dim:#F1EEE3;
  --text:#F1EEE3;
  --text-muted:#9FB0C9;
  --text-faint:#71839E;
  --shadow: 0 12px 26px -14px rgba(0,0,10,.6);
  --topbar-bg1: rgba(11,22,38,.92);
  --topbar-bg2: rgba(11,22,38,.55);
  --tabbar-bg: rgba(11,22,38,.92);
  --card-corner: rgba(217,182,92,.28);
  --prayer-card-bg1: rgba(226,100,90,.14);
  --prayer-card-bg2: rgba(226,100,90,.04);
  --prayer-card-border: rgba(226,100,90,.32);
  --ambient-1: rgba(217,182,92,.07);
  --ambient-2: rgba(70,110,180,.16);
  --ambient-3: rgba(226,100,90,.05);
  --ambient-bg: linear-gradient(180deg, #0D1B2E 0%, #0B1626 45%, #081120 100%);
  --noise-color:0.55, 0.65, 0.85;
  --noise-opacity:.06;
  --noise-blend:screen;
  --rank-text:#1A1008;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'EB Garamond', Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}

#app{
  position:relative;
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== ambient background ===== */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 700px 420px at 12% -5%, var(--ambient-1), transparent 60%),
    radial-gradient(ellipse 620px 520px at 105% 25%, var(--ambient-2), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 110%, var(--ambient-3), transparent 65%),
    var(--ambient-bg);
  transition:background .25s ease;
}
.ambient::after{
  content:"";
  position:absolute; inset:0;
  opacity:var(--noise-opacity);
  mix-blend-mode:var(--noise-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.13  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ===== header ===== */
.topbar{
  position:relative; z-index:2;
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--topbar-bg1), var(--topbar-bg2));
  backdrop-filter: blur(6px);
}
.topbar-inner{display:flex; align-items:center; gap:10px;}
.topbar-text{ min-width:0; flex:1 1 auto; }
.topbar-text .eyebrow, .topbar-text h1{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crest{flex:none; width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
.crest img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(110,84,22,.35));}
.eyebrow{
  margin:0 0 2px; font-family:'Cinzel',serif; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--wine-soft); font-weight:600;
}
.topbar h1{
  margin:0; font-family:'Cinzel',serif; font-size:18px; font-weight:600;
  color:var(--gold-soft); letter-spacing:.02em; line-height:1.15;
}
.theme-toggle{
  flex:none; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.header-controls{ margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; }
.font-toggle{
  display:flex; align-items:center; border:1px solid var(--line); border-radius:20px;
  overflow:hidden; background:var(--bg-panel);
}
.font-btn{
  border:none; background:none; color:var(--gold-soft); cursor:pointer;
  font-family:'Cinzel',serif; font-size:11px; font-weight:600; padding:8px 9px; line-height:1;
}
.font-btn:first-child{ border-right:1px solid var(--line); }
.font-btn:active{ background:rgba(138,106,30,.14); }

.settings-btn{
  flex:none; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.settings-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.settings-btn.active{ color:var(--wine); border-color:var(--wine); }

.settings-panel{
  position:relative; z-index:2;
  padding:16px 20px 18px;
  border-bottom:1px solid var(--line);
  background:var(--bg-panel);
  display:flex; flex-direction:column; gap:12px;
}
.settings-panel[hidden]{ display:none; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.settings-label{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); flex:none;
}
.chip-group{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.chip{
  font-family:'EB Garamond',serif; font-size:13px; border:1px solid var(--line); background:var(--bg-panel-2);
  color:var(--text-muted); border-radius:16px; padding:6px 12px; cursor:pointer;
}
.chip.active{ background:rgba(138,106,30,.16); border-color:var(--gold); color:var(--gold-soft); font-weight:600; }

.lang-note{
  font-style:italic; font-size:.85rem; color:var(--text-faint); margin:-6px 0 14px;
}
.theme-toggle svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.theme-toggle .icon-moon{ display:none; }
[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

/* ===== main view ===== */
main#view{
  position:relative; z-index:1;
  flex:1;
  padding:18px 18px 100px;
}

.section-title{
  font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--gold-soft); margin:26px 0 10px; padding-left:2px;
}
.section-title:first-child{margin-top:0;}

/* ===== cards ===== */
.card{
  background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  position:relative;
}
.card::before{
  content:"";
  position:absolute; inset:0; border-radius:14px; padding:1px;
  background:linear-gradient(160deg, var(--card-corner), transparent 40%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}

/* ---- date hero ---- */
.hero-date{
  text-align:center;
  padding:26px 18px 22px;
}
.hero-date .weekday{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:6px;
}
.hero-date .day{
  font-family:'Cinzel',serif; font-size:3.5rem; line-height:1; color:var(--gold-soft);
  font-weight:600;
}
.hero-date .month{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1875rem; color:var(--text-muted);
  margin-top:6px;
}
.hero-divider{
  width:64px; height:1px; margin:16px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ---- saint of the day card ---- */
.saint-card .rank{
  display:inline-block; font-family:'Cinzel',serif; font-size:0.625rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--rank-text); background:var(--wine);
  padding:3px 9px; border-radius:20px; margin-bottom:10px; font-weight:600;
}
.saint-card h2{
  font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.5625rem; margin:0 0 4px;
  color:var(--paper); line-height:1.2;
}
.saint-card .date-line{
  color:var(--text-muted); font-style:italic; font-size:0.9375rem; margin-bottom:14px;
}
.empty-note{
  color:var(--text-muted); font-size:1rem; line-height:1.6; font-style:italic;
}
.link-row{
  margin-top:14px; display:flex; justify-content:flex-end;
}
.btn-link{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-soft); background:none; border:1px solid var(--line); border-radius:20px;
  padding:9px 16px; cursor:pointer; transition:.2s;
}
.btn-link:active{ background:rgba(138,106,30,.10); }

/* ---- angelus toggle card ---- */
.toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
.toggle-btn{
  flex:1; font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.06em;
  background:var(--bg-panel); border:1px solid var(--line); color:var(--text-muted);
  padding:10px 6px; border-radius:10px; cursor:pointer; text-transform:uppercase;
}
.toggle-btn.active{ background:rgba(138,106,30,.14); border-color:var(--gold); color:var(--gold-soft); }

.prayer-block{
  font-family:'Cormorant Garamond',serif; font-size:1.125rem; line-height:1.7; color:var(--text);
  white-space:pre-wrap;
}
.prayer-block .rubric{ color:var(--wine); font-weight:700; }

.hour-tabs{
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;
  border-bottom:1px solid var(--line); padding-bottom:14px;
}
.hour-tab-btn{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); background:transparent; border:1px solid var(--line);
  border-radius:16px; padding:7px 14px; cursor:pointer; transition:all .2s ease;
}
.hour-tab-btn:hover{ color:var(--wine-soft); border-color:var(--wine-soft); }
.hour-tab-btn.active{
  color:#fff; background:var(--wine); border-color:var(--wine); font-weight:600;
}
.hour-tab-content{}
.hour-sublabel{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); margin:12px 0 4px;
}
.hour-sublabel:first-child{ margin-top:0; }
.hour-divider{
  height:1px; margin:14px 0; background:linear-gradient(90deg, var(--line), transparent);
}

/* ===== santoral list ===== */
.search-wrap{ margin-bottom:18px; }
.search-input{
  width:100%; background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  color:var(--text); font-family:'EB Garamond',serif; font-size:1rem; padding:12px 16px;
  outline:none;
}
.search-input::placeholder{ color:var(--text-faint); }
.search-input:focus{ border-color:var(--gold); }

.month-group{ margin-bottom:6px; }
.month-label{
  font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--wine-soft); margin:22px 2px 8px;
}
.saint-row{
  display:flex; align-items:center; gap:14px;
  padding:13px 4px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.saint-row:active{ background:rgba(138,106,30,.07); }
.saint-row .daynum{
  font-family:'Cinzel',serif; font-size:1.25rem; color:var(--gold-soft); width:30px; text-align:center; flex:none;
}
.saint-row .rowtext{ flex:1; min-width:0; }
.saint-row .rowtitle{ font-size:1.0625rem; color:var(--paper); }
.saint-row .rowrank{ font-size:0.7812rem; color:var(--text-faint); font-style:italic; }
.saint-row .chev{ color:var(--text-faint); flex:none; }
.no-results{ color:var(--text-faint); font-style:italic; padding:24px 4px; text-align:center; }

/* ===== detail view ===== */
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--gold-soft); font-family:'Cinzel',serif;
  font-size:0.6875rem; letter-spacing:.1em; text-transform:uppercase; padding:8px 2px; margin-bottom:14px; cursor:pointer;
}
.detail-header{ text-align:center; padding:6px 6px 22px; }
.detail-header .rank{
  display:inline-block; font-family:'Cinzel',serif; font-size:0.6562rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--wine); margin-bottom:10px; font-weight:600;
}
.detail-header h2{
  font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.875rem; color:var(--paper);
  margin:0 0 8px; line-height:1.15;
}
.detail-header .date-line{ color:var(--text-muted); font-style:italic; font-size:1rem; }
.detail-divider{
  width:80px; height:1px; margin:18px auto; background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
.bio-text{
  font-size:1.125rem; line-height:1.75; color:var(--paper); white-space:pre-wrap; margin-bottom:6px;
}
.prayer-card{
  margin-top:10px;
  background:linear-gradient(180deg, var(--prayer-card-bg1), var(--prayer-card-bg2));
  border:1px solid var(--prayer-card-border);
  border-radius:14px; padding:20px;
}
.prayer-card .label{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:10px;
}
.prayer-card .text{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1875rem; line-height:1.75; color:var(--text);
  white-space:pre-wrap;
}

/* ===== about ===== */
.about-text{ font-size:1.0625rem; line-height:1.75; color:var(--paper); }
.about-text p{ margin:0 0 14px; }
.about-quote{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1875rem; text-align:center;
  color:var(--gold-soft); padding:22px 10px; line-height:1.6;
}
.credit-list{ font-size:0.9375rem; color:var(--text-muted); line-height:1.9; }
.credit-list b{ color:var(--text); font-weight:600; }

/* ===== tabbar ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  max-width:560px; margin:0 auto;
  display:flex;
  background:var(--tabbar-bg); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-faint); cursor:pointer;
  padding:6px 2px; font-family:'Cinzel',serif; font-size:10px; letter-spacing:.04em;
}
.tab-btn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.tab-btn.active{ color:var(--gold-soft); }
.tab-btn.active svg{ fill:rgba(138,106,30,.16); }

/* ===== fade transition ===== */
.fade-in{ animation:fadeIn .28s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

</style>
</head>
<body>

<div id="app">

  <!-- ===== Ambient background ornament ===== -->
  <div class="ambient" aria-hidden="true">
    <svg class="star-field" viewBox="0 0 400 800" preserveAspectRatio="none"></svg>
  </div>

  <!-- ===== Header ===== -->
  <header class="topbar">

const SANTORAL = [{"date": "12 de janeiro", "day": 12, "month": 1, "name": "SANTO ANTÔNIO MARIA PUCCI", "bio": "Antônio Maria Pucci nasceu em\n 1819, no povoado de Poggiole,\n diocese de Pistoia, Itália. Aos 18\n anos, ingressou na Ordem dos Servos\n de Maria.\n Terminados os estudos de\n filosofia e teologia, emitiu os votos\n religiosos e foi ordenado sacerdote.\n Foi em seguida nomeado pároco\n na igreja de Santo André, na cidade\n litorânea de Viareggio, missão que\n ele desempenhou zelosamente por\n 45 anos, até a morte.\n Foi também prior conventual e provincial,\nportando-se nesses cargos mais como irmão que serve\naos irmãos do que como superior. Dedicou-se\ninteiramente ao serviço de Deus e da Virgem Maria e foi\nsempre pronto a ajudar a todos, principalmente os\npobres, enfermos e crianças.\n Morreu a 12 de janeiro de 1892. Foi proclamado\nsanto pelo papa João XXIII aos 8 de dezembro de 1962.", "prayer": "Ó Deus, que tornastes admirável Santo Antônio\nMaria como servo da Virgem Gloriosa e como pastor\n\ndo vosso povo, concedei que, inspirando-nos na mesma\nVirgem Mãe, empenhemos nossas vidas na propagação\ndo reino de Cristo, vosso Filho. Ele que convosco vive\ne reina na unidade do Espírito Santo. Amém!", "title": "Santo Antônio Maria Pucci", "rank": "Santo", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor: ele fez maravilhas nos Servos de sua Mãe.\nSalmo invitatório, como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nComo é possível, Antônio, irmão santo?\npor tantos anos o Cristo proclamas\nao mesmo povo que em ti sempre crê:\ndum só rebanho pastor toda a vida!\nCom teu amor a rotina superas,\ncom tua fé o cansaço dominas:\ntu sempre amas co'amor renovado,\nnova esperança aos pequenos inspiras.\nO teu modelo é de certo Maria:\nem ti também tu vês Cristo crescer,\ndia após dia reinar em tu'alma,\ntodas as coisas tu nele renovas.\nÉ seu silêncio tua norma primeira:\nrezas o terço dos santos mistérios,\ntodos os dias transborda teu cálice,\nnele recolhes o pranto dos pobres.\nQue tua vida se torne um tesouro\npara nós todos e nossos conventos:\nporto seguro eles voltem a ser,\nonde os profetas unidos se encontrem.\nQue todos voltem a ter esperança\ne novos santos floresçam, ó Mãe.\nEsperem os pobres, alegre-se a Igreja,\ntodos os Servos a Deus glorifiquem.\n\nSALMODIA\nEscolhe-se uma das séries de antífonas seguintes. Salmos do Comum dos Santos e Bem-aventurados da\nnossa Ordem, p. 490, ou do Comum dos Pastores, p. 510.\n\nSalmos do Comum dos Pastores (Ofício das Leituras):\nSalmo 20 (2-8.14) — Súplica em favor do Rei\nÓ Senhor, em vossa força o rei se alegra; * quanto exulta de alegria em vosso auxílio!\nO que sonhou seu coração, lhe concedestes; * não recusastes os pedidos de seus lábios.\nCom bênção generosa o preparastes; * de ouro puro coroastes sua fronte.\nA vida ele pediu e vós lhe destes, * longos dias, vida longa pelos séculos.\nÉ grande a sua glória em vosso auxílio; * de esplendor e majestade o revestistes.\nTransformastes o seu nome numa bênção, * e o cobristes de alegria em vossa face.\nPor isso o rei confia no Senhor, * e, por seu amor fiel, não cairá.\nLevantai-vos com poder, ó Senhor Deus, * e cantaremos celebrando a vossa força.\n\nSalmo 91 (I) — Louvor ao Senhor pelas suas obras\nComo é bom agradecermos ao Senhor * e cantar salmos de louvor ao Deus Altíssimo!\nAnunciar pela manhã vossa bondade, * e o vosso amor fiel a noite inteira,\nao som da lira de dez cordas e da harpa, * com canto acompanhado ao som da cítara.\nPois me alegrastes, ó Senhor, com vossos feitos, * e rejubilo de alegria em vossas obras.\nQuão imensas, ó Senhor, são vossas obras, * quão profundos são os vossos pensamentos!\nSó o homem insensato não entende, * só o estulto não percebe nada disso!\nMesmo que os ímpios floresçam como a erva * e prosperem igualmente os malfeitores,\nsão destinados a perder-se para sempre; * vós, porém, sois o Excelso eternamente!\n\nSalmo 91 (II)\nEis que os vossos inimigos, ó Senhor, † eis que os vossos inimigos vão perder-se, * e os malfeitores serão todos dispersados.\nVós me destes toda a força de um touro, * e sobre mim um óleo puro derramastes;\ntriunfante posso olhar meus inimigos, * vitorioso escuto a voz de seus gemidos.\nO homem justo crescerá como a palmeira, * florirá igual ao cedro que há no Líbano;\nna casa do Senhor estão plantados, * nos átrios de meu Deus florescerão.\nMesmo no tempo da velhice darão frutos, * cheios de seiva e de folhas verdejantes;\ne dirão: \"É justo mesmo o Senhor Deus: * meu Rochedo, não existe nele o mal!\"\n\nSérie A\nAnt. 1 Quem vos der um copo d'água em meu nome, não ficará sem recompensa.\nAnt. 2 Quem tiver duas túnicas dê uma a quem não tem, e quem tem o que comer faça o mesmo.\nAnt. 3 Dá a quem te pede, e não vires as costas a quem te pede emprestado.\nSérie B\nAnt. 1 Quando tu oravas em lágrimas e sepultavas os mortos, eu apresentava as tuas orações ao Senhor.\nAnt. 2 Corrigi os irrequietos, confortai os tímidos, sustentai os fracos, sede pacientes com todos.\nAnt. 3 Não deixeis de consolar os que choram; aproximai-vos dos que estão aflitos.\nSérie C\nAnt. 1 Fiz-me servo de todos, a fim de ganhar o maior número possível para Cristo.\nAnt. 2 Tudo suporto, a fim de que todos obtenham a salvação.\nAnt. 3 Tudo isto eu faço para que se consolide a palavra de Cristo e eu possa assim proclamar a sua mensagem.\nV. Sê vigilante contigo e com a doutrina que ensinas.\nR. Assim salvarás a ti mesmo e aos que te escutam.\n\nPRIMEIRA LEITURA\nDa segunda carta de São Paulo a Timóteo 1,6-14\nSofre comigo pelo evangelho\nFilho caríssimo, eu te exorto a reavivares a chama do dom de Deus que recebeste pela imposição das minhas mãos. Pois Deus não nos deu um espírito de timidez, mas de fortaleza, de amor e sobriedade. Não te envergonhes do testemunho de nosso Senhor nem de mim, seu prisioneiro, mas sofre comigo pelo evangelho, fortificado pelo poder de Deus. Deus nos salvou e chamou para a santidade, não em atenção a nossas obras, mas em virtude de seu desígnio e de sua graça. Esta nos foi dada em Cristo Jesus desde toda a eternidade e agora nos foi manifestada pela aparição de nosso Salvador, Cristo Jesus, que aniquilou a morte e fez resplandecer a vida e a incorrupção por meio do evangelho, do qual me tornei pregador, apóstolo e doutor. É este também o motivo por que estou sofrendo a presente provação. Mas não me queixo. Sei em quem pus minha confiança e estou certo de que é bastante poderoso para guardar meu depósito até aquele dia. Mantém o modelo das palavras salutares que de mim recebeste, inspiradas na fé e na caridade em Cristo Jesus. Guarda o depósito precioso pela virtude do Espírito Santo, que habita em nós.\n\nRESPONSÓRIO 2Tm 2,3; 1,8b. 14\nR. Suporta comigo os sofrimentos como bom soldado de Cristo. * Sofre comigo pelo evangelho, fortalecido pelo poder de Deus.\nV. Conserva íntegra a mensagem do evangelho com a ajuda do Espírito Santo que habita em nós.\nR. Sofre comigo pelo evangelho, fortalecido pelo poder de Deus.\n\nSEGUNDA LEITURA\nDas \"Homilias\" de Santo Antônio Maria Pucci, presbítero dos Servos de Maria (Homilia in Lc 10,23-37; vol. II, ff. 192-195v)\nAmar a Deus e amar o próximo\nO fim último da perfeição cristã é amar a Deus e ao próximo. Nesses dois mandamentos encontramos todo o programa de vida do cristão que quer alcançar a felicidade eterna. Se alguém ama verdadeiramente a Deus, se afastará do pecado, pois o amor a Deus e o pecado não podem andar juntos. Ao contrário, por sua natureza, opõem-se um ao outro. Quem ama o próximo, não só guarda-se de ofender ou de prejudicar seu semelhante, mas procura fazer o bem a todos indistintamente e, segundo as possibilidades, socorre os mais necessitados. Portanto, a salvação eterna depende do cumprimento desses dois mandamentos. O próprio Cristo assim ensinou, quando disse ao doutor da lei: \"Faze isto e viverás!\" (Lc 10,28).\nHá muitos cristãos hoje que, como o doutor da lei, interessam-se em aprender a lei de Deus. Com gosto, escutam a sua Palavra, aconselham-se com os sacerdotes, pedem e insistem para que se lhes ensine a viver como bons cristãos, a fim de alcançarem a vida eterna. Quando, porém, se trata de pôr em prática o que aprenderam, mostram-se preguiçosos e negligentes. Não se esforçam, não mortificam as suas paixões, não lutam contra os desejos da carne e, muitas vezes, são levados pela raiva a recriminar o próprio Deus, a quem deveriam amar de todo o coração, de toda a alma e com todas as forças (Lc 10,27). Esses cristãos são apenas ouvintes e não praticantes da lei (Tg 1,22-23); não amam a Deus, mas o desprezam.\nO segundo mandamento, \"amar o próximo como a si mesmo\", é igual ao primeiro. O próximo não se ama com palavras, mas com fatos; não com a língua, mas com o coração. A compaixão que o samaritano teve com o homem que, descendo de Jerusalém a Jericó, caíra nas mãos dos assaltantes, mostra todo seu amor sincero e real para com o infeliz, e nos recorda o que está escrito no livro do Eclesiástico: \"Ajuda o teu próximo conforme as tuas posses\" (Eclo 29,20), segundo as posses que recebeste da Divina Providência.\nPor isso, se tendes dinheiro, socorrei os pobres, afastai os infelizes do pecado e guardai-vos de usar as riquezas para corromper pessoas desesperadas, obrigando-as a praticar o que ofende a Deus. Tal comportamento é próprio dos maus cristãos. Se gozais de estima e apreço, defendei a inocência e a pureza dos outros, livrai a viúva, o órfão e a criança das mãos dos prepotentes.\nSe não tiverdes nem riquezas e nem autoridade, mas tiverdes tempo e cultura, servi-vos deles para ensinar os ignorantes, consolar os aflitos, visitar os doentes, enfim, praticar tudo o que a caridade exige que se faça para o bem dos outros.\nSe alguém quer alcançar a vida eterna, ame a Deus e ao próximo por amor a Deus. Mas quem é o próximo? Quem está em necessidade. Que devemos fazer pelo próximo? Tudo o que fez o bom samaritano.\n\nRESPONSÓRIO Mt 22,37-39; Rm 13,9\nR. Amarás o Senhor teu Deus com todo o teu ser: este é o primeiro e maior mandamento. O segundo é semelhante a este: \"amarás o próximo como a ti mesmo.\"\nV. Todos os outros mandamentos se resumem neste:\nR. Amarás o próximo como a ti mesmo.\n\nORAÇÃO\nÓ Deus, tornastes admirável Santo Antônio Maria Pucci como servo da Mãe do vosso Filho e pastor do vosso rebanho: fazei que nós também, inspirando-nos na Virgem Maria, dediquemos nossas vidas à propagação do reino de Cristo, vosso Filho, que convosco vive e reina na unidade do Espírito Santo.\n\nLaudes\nHINO\nDeus, que de Antônio foste força e vida,\nenquanto o sol já vem trazendo o dia,\nacolhe o hino que hoje a ti cantamos\ncom alegria.\nQual bom pastor, se alguém no vício tomba,\nvai logo erguê-lo, e o toma nos seus braços,\nou então se esforça por prendê-lo ao Cristo\npor fortes laços.\nBrilha em seu peito o imenso amor do Cristo,\npara o rebanho é luz e claridade;\na todos busca conduzir às fontes\nda santidade.\nA qualquer pobre logo presta ajuda,\ndá o que tem, nenhum cuidado o impede:\nchega a despir-se e dar as próprias vestes,\nse alguém lhe pede.\nPara os meninos pobres ele encontra\nbem junto ao mar Tirreno as praias calmas;\naos corpos cura, e a santa lei de Cristo\nensina às almas.\nGrassando horrível peste em todo o povo,\npor todo o canto geme algum doente;\nporém Antônio, a todos confortando,\nvê-se presente.\nPor meio dele dá que nós tendamos\na ti, ó Trino Deus, suma unidade,\ne a nossa voz te louve com teus santos\nna eternidade. Amém!\n\nSALMODIA\nAnt. 1 Se dás do teu pão ao faminto, se alimentas o pobre, tua luz levantar-se-á na escuridão e tua noite resplandecerá como em pleno dia.\nAnt. 2 A vereda do justo é como a aurora: seu brilho cresce até o dia pleno.\nAnt. 3 Aqueles que atraem outros para os caminhos da justiça brilharão como estrelas para sempre.\n\nSalmos do dia da semana corrente — exemplo: Domingo, 1ª semana:\nSalmo 62,2-9 — Sede de Deus\nSois vós, ó Senhor, o meu Deus! * Desde a aurora ansioso vos busco!\nA minh'alma tem sede de vós, † minha carne também vos deseja, * como terra sedenta e sem água!\nVenho, assim, contemplar-vos no templo, * para ver vossa glória e poder.\nVosso amor vale mais do que a vida: * e por isso meus lábios vos louvam.\nQuero, assim, vos louvar pela vida, * e elevar para vós minhas mãos.\nA minh'alma será saciada, * como em grande banquete de festa;\ncantará a alegria em meus lábios, * ao cantar para vós meu louvor!\nPenso em vós no meu leito, de noite, * nas vigílias suspiro por vós!\nPara mim fostes sempre um socorro; * de vossas asas à sombra eu exulto!\nMinha alma se agarra em vós; * com poder vossa mão me sustenta.\n\nCântico (Dn 3,57-88.56) — Louvor das criaturas ao Senhor\nObras do Senhor, bendizei o Senhor, * louvai-o e exaltai-o pelos séculos sem fim!\nAnjos do Senhor, bendizei o Senhor! * Céus do Senhor, bendizei o Senhor!\nÁguas do alto céu, bendizei o Senhor! * Potências do Senhor, bendizei o Senhor!\nLua e sol, bendizei o Senhor! * Astros e estrelas, bendizei o Senhor!\nChuvas e orvalhos, bendizei o Senhor! * Brisas e ventos, bendizei o Senhor!\nFogo e calor, bendizei o Senhor! * Frio e ardor, bendizei o Senhor!\nOrvalhos e garoas, bendizei o Senhor! * Geada e frio, bendizei o Senhor!\nGelos e neves, bendizei o Senhor! * Noites e dias, bendizei o Senhor!\nLuzes e trevas, bendizei o Senhor! * Raios e nuvens, bendizei o Senhor!\nIlhas e terra, bendizei o Senhor! * Louvai-o e exaltai-o pelos séculos sem fim!\nMontes e colinas, bendizei o Senhor! * Plantas da terra, bendizei o Senhor!\nMares e rios, bendizei o Senhor! * Fontes e nascentes, bendizei o Senhor!\nBaleias e peixes, bendizei o Senhor! * Pássaros do céu, bendizei o Senhor!\nFeras e rebanhos, bendizei o Senhor! * Filhos dos homens, bendizei o Senhor!\nFilhos de Israel, bendizei o Senhor! * Louvai-o e exaltai-o pelos séculos sem fim!\nSacerdotes do Senhor, bendizei o Senhor! * Servos do Senhor, bendizei o Senhor!\nAlmas dos justos, bendizei o Senhor! * Santos e humildes, bendizei o Senhor!\nJovens Misael, Ananias e Azarias, * louvai-o e exaltai-o pelos séculos sem fim!\nAo Pai e ao Filho e ao Espírito Santo * louvemos e exaltemos pelos séculos sem fim!\nBendito sois, Senhor, no firmamento dos céus! * Sois digno de louvor e de glória eternamente!\n\nSalmo 149 — A alegria e o louvor dos santos\nCantai ao Senhor Deus um canto novo, * e o seu louvor na assembleia dos fiéis!\nAlegre-se Israel em Quem o fez, * e Sião se rejubile no seu Rei!\nCom danças glorifiquem o seu nome, * toquem harpa e tambor em sua honra!\nPorque, de fato, o Senhor ama seu povo * e coroa com vitória os seus humildes.\nExultem os fiéis por sua glória, * e cantando se levantem de seus leitos,\ncom louvores do Senhor em sua boca, * e espadas de dois gumes em sua mão,\npara exercer sua vingança entre as nações * e infligir o seu castigo entre os povos,\ncolocando nas algemas os seus reis, * e seus nobres entre ferros e correntes,\npara aplicar-lhes a sentença já escrita: * Eis a glória para todos os seus santos.\n\nLEITURA BREVE 1Ts 5,14-18\nNós vos exortamos, irmãos: admoestai os indisciplinados, reconfortai os pusilânimes; suportai os fracos; sede pacientes para com todos. Cuidai que ninguém retribua a quem quer que seja, o mal com o mal, mas que, em todo tempo, façais bem uns aos outros e a todos. Vivei sempre alegres. Orai sem cessar. Em todas as circunstâncias dai graças porque esta é a vontade de Deus em Jesus Cristo.\n\nRESPONSÓRIO BREVE\nR. O Bom Pastor chama cada uma de suas ovelhas pelo nome * e as ovelhas o seguem porque reconhecem a sua voz.\nV. O Bom Pastor dá a vida por suas ovelhas.\nR. E as ovelhas o seguem porque reconhecem a sua voz.\n\nCântico evangélico (Benedictus)\nAnt. Suscitarei para o meu povo um Pastor que o reconduza de todos os lugares e o apascente em verdes pastagens.\n\nPRECES\nDeus nosso Pai quis que sua Igreja, guiada pelo Espírito Santo, mostrasse a este mundo conturbado o caminho para o reino dos céus. Cheios de confiança, digamos:\nR. Guiai-nos, Senhor, segundo a verdade!\nPastor eterno, dia após dia renovais a vossa Igreja com o espírito de Cristo, para que saiba discernir os sinais dos tempos; dai-nos experimentar sua força inesgotável na transformação da realidade e das mentalidades.\nPastor eterno, vós nos destes Jesus Cristo como bom pastor, exemplo para todos os pastores; fazei que vossos sacerdotes exerçam o ministério não por vil interesse, nem por desejo de mando, mas como guias fiéis a vós.\nPastor eterno, por vosso amor, dais sentido e incremento à obra dos pastores; concedei-nos ser sempre fiéis a Cristo, não desesperando nos momentos difíceis, nem deixando-nos iludir nos momentos felizes.\nPastor eterno, enviastes o vosso Filho para pregar a boa-nova aos pobres e nele nos destes um exemplo de pobreza total; concedei-nos ser sensíveis diante dos que passam necessidade e acolher com alegria o vosso apelo à pobreza radical.\nPastor eterno, suscitais constantemente em vossa Igreja novos caminhos apostólicos; fazei que tradições já superadas não impeçam que se abram caminhos inovadores, e que o apego ao passado não apague o espírito do amor.\nPai nosso...\n\nORAÇÃO\nÓ Deus, tornastes admirável Santo Antônio Maria Pucci como servo da Mãe do vosso Filho e pastor do vosso rebanho: fazei que nós também, inspirando-nos na Virgem Maria, dediquemos nossas vidas à propagação do reino de Cristo, vosso Filho, que convosco vive e reina na unidade do Espírito Santo.\n\nHora Média\nAntífonas e salmos do dia da semana corrente. Hinos como no Ordinário, p. 40.\nOração das Nove Horas\nSalmodia complementar:\nSalmo 119 — Desejo da paz\nClamei pelo Senhor na minha angústia, * ele me escutou, quando eu dizia:\n\"Senhor, livrai-me desses lábios mentirosos, * e da língua enganadora libertai-me!\nQual será a tua paga, o teu castigo, * ó língua enganadora, qual será?\nSerão flechas aguçadas de guerreiros, * acesas em carvões incandescentes.\nAi de mim! sou exilado em Mosoc, * devo acampar em meio às tendas de Cedar!\nJá se prolonga por demais o meu desterro * entre este povo que não quer saber de paz!\nQuando eu falo de paz, quando a promovo, * é a guerra que eles tramam contra mim!\"\n\nSalmo 120 — Deus protetor do seu povo\nEu levanto os meus olhos para os montes: * de onde pode vir o meu socorro?\n\"Do Senhor é que me vem o meu socorro, * do Senhor que fez o céu e fez a terra!\"\nEle não deixa tropeçarem os teus pés, * e não dorme quem te guarda e te vigia.\nOh! não! Ele não dorme nem cochila, * aquele que é o guarda de Israel!\nO Senhor é o teu guarda, o teu vigia, * é uma sombra protetora à tua direita.\nNão vai o sol durante o dia te ferir, * nem a lua através de toda a noite.\nO Senhor te guardará de todo o mal, * ele mesmo vai cuidar da tua vida!\nDeus te guarda na partida e na chegada. * Ele te guarda desde agora e para sempre!\n\nSalmo 121 — Jerusalém, cidade santa\nQue alegria, quando ouvi que me disseram: * \"Vamos à casa do Senhor!\"\nE agora nossos pés já se detêm, * Jerusalém, em tuas portas.\nJerusalém, cidade bem edificada * num conjunto harmonioso;\npara lá sobem as tribos de Israel, * as tribos do Senhor.\nPara louvar, segundo a lei de Israel, * o nome do Senhor.\nA sede da justiça lá está * e o trono de Davi.\nRogai que viva em paz Jerusalém, * e em segurança os que a amam!\nQue a paz habite dentro de teus muros, * tranquilidade em teus palácios!\nPor amor a meus irmãos e meus amigos, * peço: \"A paz esteja em ti!\"\nPelo amor que tenho à casa do Senhor, * eu te desejo todo bem!\n\nLEITURA BREVE Cl 3,23-24\nIrmãos, tudo que fizerdes, fazei de coração como quem obedece ao Senhor e não aos homens, certos de que das mãos do Senhor recebereis a herança como recompensa. É a Cristo, o Senhor, que servis.\nV. Tudo o que fizerdes por palavras ou obras,\nR. fazei-o em nome do Senhor Jesus.\nOração das Doze Horas\nSalmodia complementar:\nSalmo 122 — Deus, esperança do seu povo\nEu levanto os meus olhos para vós, * que habitais nos altos céus.\nComo os olhos dos escravos estão fitos * nas mãos do seu senhor, como os olhos das escravas estão fitos * nas mãos de sua senhora,\nassim os nossos olhos, no Senhor, * até de nós ter piedade.\nTende piedade, ó Senhor, tende piedade; * já é demais esse desprezo!\nEstamos fartos do escárnio dos ricaços * e do desprezo dos soberbos!\n\nSalmo 123 — O nosso auxílio está no nome do Senhor\nSe o Senhor não estivesse ao nosso lado, * que o diga Israel neste momento:\nse o Senhor não estivesse ao nosso lado, * quando os homens investiram contra nós,\ncom certeza nos teriam devorado * no furor de sua ira contra nós.\nEntão as águas nos teriam submergido, * a correnteza nos teria arrastado,\ne então, por sobre nós teriam passado * essas águas sempre mais impetuosas.\nBendito seja o Senhor, que não deixou * cairmos como presa de seus dentes!\nNossa alma como um pássaro escapou * do laço que lhe armara o caçador;\no laço arrebentou-se de repente, * e assim nós conseguimos ficar livres.\nO nosso auxílio está no nome do Senhor, * do Senhor que fez o céu e fez a terra!\n\nSalmo 124 — Deus protetor do seu povo\nQuem confia no Senhor é como o monte de Sião: * nada pode abalar, porque é firme para sempre.\nTal e qual Jerusalém, toda cercada de montanhas, † assim Deus cerca seu povo de carinho e proteção, * desde agora e para sempre, pelos séculos afora.\nO Senhor não vai deixar prevalecer por muito tempo † o domínio dos malvados sobre a sorte dos seus justos, * para os justos não mancharem suas mãos na iniquidade.\nFazei o bem, Senhor, aos bons e aos que têm reto coração, † mas os que seguem maus caminhos, castigai-os com os maus! * Que venha a paz a Israel! Que venha a paz ao vosso povo!\n\nLEITURA BREVE cf. Dt 15,11\nUma vez que nunca deixará de haver pobres na terra, eu te dou este mandamento: abre a mão para o irmão, para o necessitado e para o pobre de tua terra.\nV. Sê generoso para com o pobre,\nR. e tua esmola te preservará de todo mal.\nOração das Quinze Horas\nSalmodia complementar:\nSalmo 125 — Alegria e esperança em Deus\nQuando o Senhor reconduziu nossos cativos, * parecíamos sonhar;\nencheu-se de sorriso nossa boca, * nossos lábios, de canções.\nEntre os gentios se dizia: \"Maravilhas fez com eles o Senhor!\"\nSim, maravilhas fez conosco o Senhor, * exultemos de alegria!\nMudai a nossa sorte, ó Senhor, * como torrentes no deserto.\nOs que lançam as sementes entre lágrimas, * ceifarão com alegria.\nChorando de tristeza sairão, * espalhando suas sementes;\ncantando de alegria voltarão, * carregando seus feixes!\n\nSalmo 126 — O trabalho sem Deus é inútil\nSe o Senhor não construir a nossa casa, * em vão trabalharão seus construtores;\nse o Senhor não vigiar nossa cidade, * em vão vigiarão as sentinelas!\nÉ inútil levantar de madrugada, * ou à noite retardar vosso repouso,\npara ganhar o pão sofrido do trabalho, * que a seus amados Deus concede enquanto dormem.\nOs filhos são uma bênção do Senhor, * o fruto das entranhas, sua dádiva.\nComo flechas que um guerreiro tem na mão, * são os filhos de um casal de esposos jovens.\nFeliz aquele pai que com tais flechas * consegue abastecer a sua aljava!\nNão será envergonhado ao enfrentar * seus inimigos junto às portas da cidade.\n\nSalmo 127 — A paz do Senhor na família\nFeliz és tu se temes o Senhor * e trilhas seus caminhos!\nDo trabalho de tuas mãos hás de viver, * serás feliz, tudo irá bem!\nA tua esposa é uma videira bem fecunda * no coração da tua casa;\nos teus filhos são rebentos de oliveira * ao redor de tua mesa.\nSerá assim abençoado todo homem * que teme o Senhor.\nO Senhor te abençoe de Sião, * cada dia de tua vida;\npara que vejas prosperar Jerusalém * e os filhos dos teus filhos.\nÓ Senhor, que venha a paz a Israel, * que venha a paz ao vosso povo!\n\nLEITURA BREVE Tg 2,24.26\nVede como pelas obras e não pela fé o homem se justifica! Pois assim como o corpo, sem espírito, está morto, assim também a fé sem as obras.\nV. Ninguém retribua o mal com o mal.\nR. Procurai sempre o bem uns dos outros e de todos.\n\nVésperas\nHINO\nDos Servos de Maria\nao céu sobe o louvor:\nAntônio hoje celebram\nna glória e no fulgor.\nA Mãe de Deus amando\nde todo o coração,\na Ela ele consagra\na sua vida e ação.\nDo bom Pastor, que o chama,\no exemplo ele aprendeu:\nzelar pelo rebanho,\nbuscar quem se perdeu.\nCom grande amor abraça\nao pobre pecador:\nque o Cristo nele reine,\nde todos Redentor.\nQue Antônio nos conduza,\ndo céu onde se apraz:\nna Igreja um só rebanho,\nno mundo inteiro a paz!\nLouvor ao Pai e ao Filho,\nque veio nos salvar;\nao que dos dois procede,\nlouvemos sem cessar!\n\nSALMODIA\nAnt. 1 Tive fome e me destes de comer; tive sede e me destes de beber.\nAnt. 2 Estive doente e me visitastes; preso, e viestes ver-me.\nAnt. 3 Em verdade vos digo: cada vez que o fizestes a um desses meus irmãos mais pequeninos, a mim o fizestes.\n\nSalmos do Comum dos Pastores (Vésperas):\nSalmo 14 — Quem habitará no monte santo do Senhor\n\"Senhor, quem morará em vossa casa, * e em vosso monte santo habitará?\"\nÉ aquele que caminha sem pecado * e pratica a justiça fielmente;\nque pensa a verdade no seu íntimo, * e não solta em calúnias sua língua;\nque em nada prejudica o seu irmão, * nem cobre de insultos seu vizinho;\nque não dá valor algum ao homem ímpio, * mas honra os que respeitam o Senhor;\nque sustenta o que jurou, mesmo com dano; * não empresta seu dinheiro com usura,\nnem se deixa subornar contra o inocente. * Jamais vacilará quem vive assim!\n\nSalmo 111 — Feliz o homem que teme o Senhor\nFeliz o homem que respeita o Senhor * e que ama com carinho a sua lei!\nSua descendência será forte sobre a terra, * abençoada a geração dos homens retos!\nHaverá glória e riqueza em sua casa, * e permanece para sempre o bem que fez.\nEle é correto, generoso e compassivo, * como luz brilha nas trevas para os justos.\nFeliz o homem caridoso e prestativo, * que resolve seus negócios com justiça.\nPorque jamais vacilará o homem justo, * sua lembrança permanece eternamente!\nEle não teme receber notícias más: * confiando em Deus, seu coração está seguro.\nSeu coração está tranquilo e nada teme, * e confusos há de ver seus inimigos.\nEle reparte com os pobres os seus bens, † permanece para sempre o bem que fez, * e crescerão a sua glória e o seu poder.\nO ímpio, vendo isto, se enfurece, † range os dentes e de inveja se consome; * mas os desejos do malvado dão em nada.\n\nCântico (Ap 15,3-4) — Hino de adoração\nComo são grandes e admiráveis vossas obras, * ó Senhor e nosso Deus onipotente!\nVossos caminhos são verdade, são justiça, * ó Rei dos povos todos do universo!\nQuem, Senhor, não haveria de temer-vos † e quem não honraria o vosso nome? * Pois somente vós, Senhor, é que sois santo!\nAs nações todas hão de vir perante vós † e prostradas haverão de adorar-vos, * pois vossas justas decisões são manifestas!\n\nLEITURA BREVE Rm 12,9-16\nIrmãos, seja sincera vossa caridade. Aborrecei o mal, atende-vos ao bem. Sede cordiais no amor fraterno entre vós. Rivalizai em honrar-vos reciprocamente. Não relaxeis no zelo. Sede fervorosos de espírito. Servi ao Senhor. Sede alegres na esperança, pacientes na tribulação e perseverantes na oração. Socorrei às necessidades dos fiéis. Esmerai-vos na prática da hospitalidade. Abençoai os que vos perseguem, abençoai-os e não praguejeis. Alegrai-vos com os que se alegram. Chorai com os que choram. Vivei em boa harmonia uns com os outros. Não vos deixeis levar pelo gosto das grandezas. Afeiçoai-vos às coisas modestas. Não sejais sábios a vossos próprios olhos.\n\nRESPONSÓRIO BREVE Cf. Is 61,1-2\nR. O Espírito do Senhor repousa sobre mim, * para curar os corações esmagados pelo sofrimento.\nV. Enviou-me para consolar os aflitos.\nR. Para curar os corações esmagados pelo sofrimento.\n\nCântico evangélico (Magnificat)\nAnt. O glorioso servo da bem-aventurada Virgem Maria, tanto meditaste as dores da Mãe na paixão do Filho, que te tornaste seu incansável apóstolo e consolador dos aflitos.\n\nPRECES\nNesta hora vespertina, em que Jesus nos mandou celebrar a eucaristia em sua memória, rezemos com fé:\nR. Senhor, fortalecei o vosso povo no amor!\nCristo, destes a vida por vossos amigos; concedei a todos os pastores da Igreja que não hesitem em dar a vida pelo rebanho que lhes foi confiado.\nSenhor Jesus, sempre fizestes a vontade do Pai e frequentemente buscáveis lugares afastados para rezar; dai-nos descobrir na oração perseverante as exigências do mandamento do amor.\nSenhor Jesus, da nossa condição humana quisestes experimentar também a fadiga do operário; dai-nos promover a dignidade do mundo do trabalho e cooperar com todas as forças para a libertação do homem.\nCristo, que dissestes: eis que vos envio como cordeiros no meio dos lobos, fazei que o amor dos vossos discípulos não se deixe amedrontar nem condicionar por qualquer tipo de violência e discriminação.\nCristo ressuscitado, que voltastes para junto do Pai para preparar-nos um lugar ao vosso lado, enchei de alegria nossos irmãos e irmãs defuntos que, por vossa causa, se consagraram ao serviço do amor fraterno.\nPai Nosso...\n\nORAÇÃO\nÓ Deus, tornastes admirável Santo Antônio Maria Pucci como servo da Mãe do vosso Filho e pastor do vosso rebanho: fazei que nós também, inspirando-nos na Virgem Maria, dediquemos nossas vidas à propagação do reino de Cristo, vosso Filho, que convosco vive e reina na unidade do Espírito Santo."}, {"date": "15 de janeiro", "day": 15, "month": 1, "name": "B. TIAGO DE \"CITTÀ DELLE PIEVE\"", "bio": "Tiago nasceu em Città della Pieve, povoado da\nregião italiana da Úmbria, por volta de 1270. Amante\nda pobreza evangélica, recebeu o hábito da então\nOrdem Terceira dos Servos de Maria.\n Formado em direito, fez-se advogado dos\npobres. Restaurou às suas expensas a igreja e o asilo\ncontíguos ao convento dos frades. Ali acolhia e\nsocorria, com grande caridade, os pobres e os doentes,\ncujos direitos ele defendeu com êxito nos tribunais\ncontra a ganância do bispo da vizinha cidade de Chiusi.\nEste, ferido em sua honra, mandou matá-lo em 1304.\n Seu corpo foi encontrado num bosque ao longo da\nestrada. Transportado para o hospital, foi alvo de\ngrande veneração por parte dos seus concidadãos, que\nlhe deram o nome de \"santo esmoleiro\" e construíram\numa igreja em sua honra.\n Pio VII aprovou o seu culto em 1806.", "prayer": "Ó Deus, impelido por vosso amor, o bem-\naventurado Tiago não hesitou enfrentar a morte para\n\ndefender os direitos dos pobres. Concedei que nada nos\nintimide na defesa da justiça e da caridade. Por Cristo\nnosso Senhor. Amém!", "title": "B. Tiago de \"Città della Pieve\"", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos do dia da semana corrente.\n\nRESPONSÓRIO Mt 5,10; cf. 1Pd 4,14a\nR. Bem-aventurados os que são perseguidos por causa da justiça, * porque deles é o reino dos céus.\nV. Bem-aventurados os que sofrem injúrias por causa do nome de Cristo.\nR. Porque deles é o reino dos céus.\n\nORAÇÃO\nÓ Deus, nosso Pai, impelido por vosso amor, o Bem-aventurado Tiago não hesitou enfrentar a própria morte para defender os direitos dos pobres: fazei que nada nos intimide na defesa da justiça e da caridade. Por nosso Senhor."}, {"date": "3 de fevereiro", "day": 3, "month": 2, "name": "B. JOAQUIM DE SENA", "bio": "Joaquim nasceu em Sena\n (Toscana, Itália), em 1258. Aos\n 13 anos, ingressou no convento\n dos Servos de Maria de sua\n cidade, onde foi acolhido por São\n Filipe Benizi, prior geral da\n Ordem.\n Viveu sempre em Sena, com\n exceção de um ano em que\n esteve no convento de Arezzo.\n Distinguiu-se na devoção a\n Virgem Maria, na humildade e\nna caridade.\n A tal ponto amou o próximo que, certa vez, ao\nprocurar em vão consolar um epiléptico, pediu a Deus\nque a doença dele caísse sobre si, a fim de trazer em\nseu corpo as marcas da paixão de Cristo. O doente ficou\ncurado e Joaquim tornou-se epiléptico. Além disso,\nmais tarde foi acometido por uma doença de pele que\nlhe causava ulcerações pelo corpo.\n O último gesto de sua vida comprova o espírito de\nfraternidade e de amizade que o unia aos confrades: no\ndia antes de morrer pediu licença para tomar um copo\nde vinho com eles.\n\n Morreu na sexta-feira santa do ano de 1305. Seu\ncorpo é venerado em Sena, na igreja de São Clemente,\ndos Servos de Maria. Ainda hoje as mães levam as\ncrianças recém-nascidas ao altar do bem-aventurado\nJoaquim, colocando-as sob a sua proteção. Em 1609, o\npapa Paulo V aprovou a Missa e o Ofício próprios.", "prayer": "Ó Deus, ensinastes o bem-aventurado Joaquim,\ndiscípulo do vosso Filho e de sua humilde Mãe, a servir\ncom amor os irmãos, assumindo até suas enfermidades.\nConcedei-nos, por sua intercessão, suportar as dores da\nvida presente e compadecer-nos do sofrimento dos\nirmãos. Por Cristo nosso Senhor. Amém!", "title": "B. Joaquim de Sena", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nOfício das Leituras\nRESPONSÓRIO Cl 3,12-14; Gl 6,2\nR. Vós como eleitos, santos e amados de Deus, revesti-vos de sentimentos de carinhosa compaixão, bondade, humildade, mansidão e paciência. Suportai-vos uns aos outros e perdoai-vos mutuamente. * Acima de tudo, revesti-vos da caridade que é o vínculo da perfeição.\nV. Carregai os fardos uns dos outros e assim cumprireis a lei de Cristo.\nR. Acima de tudo, revesti-vos da caridade, que é o vínculo da perfeição.\n\nRESPONSÓRIO cf. Is 53,4; 1Jo 3,18\nR. A exemplo de Cristo, que tomou sobre si as nossas enfermidades e carregou os nossos sofrimentos, * o Bem-aventurado Joaquim tomou sobre si as dores de um epilético.\nV. Filhinhos, não amemos com palavras, nem com a língua, mas com obras e de verdade.\nR. O Bem-aventurado Joaquim tomou sobre si as dores de um epilético.\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. Prefiro gloriar-me de minhas fraquezas para que habite em mim a força de Cristo.\n\nORAÇÃO\nÓ Deus, ensinastes o Bem-aventurado Joaquim, discípulo de Cristo e de sua humilde Mãe, a servir com tal dedicação os irmãos, a ponto de assumir sobre si suas doenças; por sua intercessão, dai-nos saber suportar nossas enfermidades e compartilhar o sofrimento dos irmãos. Por nosso Senhor.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Alegro-me em minhas fraquezas, nas perseguições e nas angústias sofridas por amor de Cristo. Pois, quando sou fraco, então é que sou forte."}, {"date": "17 de fevereiro", "day": 17, "month": 2, "name": "SETE SANTOS FUNDADORES", "bio": "Solenidade\n Bonfilho, Bonajunta, Maneto, Amadeu, Hugo,\nSóstenes, Aleixo: estes são os nomes com os quais\nLeão XIII canonizou os sete homens que, por volta da\nmetade do século XIII, deram início à Ordem dos\nFrades Servos de Santa Maria, na cidade de Florença,\nItália.\n A Igreja e a Ordem veneram-nos sob o nome\ncoletivo de Sete Santos Fundadores. Eram leigos. De\nprofissão, comerciantes. Alguns casados, outros\nsolteiros ou viúvos, todos animados por uma vontade\nfirme de alcançar a perfeição cristã. Pertenciam à\n\"Associação-Mor de Santa Maria\" e, como membros\ndessa associação, postos a serviço de Deus e da Virgem\nMaria, dedicavam-se às obras de caridade e de\npenitência.\n Segundo a tradição, dia 15 de agosto de 1233,\ndeixaram suas famílias e atividades comerciais e\nretiraram-se para uma localidade chamada \"Cafaggio\",\nna periferia da cidade de Florença, para ali levarem\nvida de oração e de penitência.\n Por volta de 1245, mudaram-se para Monte\nSenário, cerca de dezoito quilômetros fora de\nFlorença, onde construíram uma igreja e uma\n\npequena casa. Logo, se juntaram a eles outros\nhomens que também aspiravam à vida de solidão e\ncontemplação.\n Por sua vida santa, pela seriedade do seu\ncompromisso religioso e pela estima de que gozavam\njunto ao povo, obtiveram a aprovação Sé Apostólica e\no apoio do bispo de Florença.\n De Monte Senário, os Sete e seus companheiros\ndesceram à cidade de Florença para dedicar-se às obras\ndo apostolado. Em \"Cafaggio\", construíram uma igreja\nno local onde hoje se encontra a basílica de Santíssima\nAnunciada.\n Poucos são os dados históricos referentes aos Sete\nSantos Fundadores. Com exceção de dois (São\nBonfilho e Santo Aleixo), até seus nomes são\nhistoricamente incertos. Mas certo e seguro é seu perfil\nespiritual, descrito na \"Legenda sobre as origens da\nOrdem\", o documento mais antigo sobre a vida dos\nSete Santos. Na \"Legenda\", seu perfil espiritual\nconfunde-se com o próprio carisma da Ordem e chegou\naté nós através de uma tradição fidedigna e\nininterrupta.\n Os Sete distinguiram-se no ardente amor a Deus e\na Virgem Maria, na humildade, no espírito de serviço,\nna abertura à concórdia e ao perdão e na vontade firme\nde promover a paz. Por isso são definidos pela liturgia\ncomo “ministros da unidade e da paz” (cf. Prefácio da\nmissa).\n\n Foram canonizados juntos, como se fossem um\nsó, pelo papa Leão XIII, em 1888. Seus restos mortais\nsão venerados na basílica de Monte Senário.", "prayer": "Ó Deus misericordioso, por vossa inefável\nprovidência, a Virgem gloriosa suscitou a Ordem dos\nseus Servos, por intermédio dos nossos Sete Santos\nPais. Concedei, vos pedimos, que servindo fielmente à\nmesma Virgem Mãe, possamos mais intensamente\nservir a vós e aos irmãos. Por Cristo nosso Senhor.\nAmém!", "title": "Sete Santos Fundadores", "rank": "Solenidade", "oficio": "I Vésperas\nHINO\nRugindo a guerra por toda a parte,\nno solo escorre sangue fraterno;\nentão nos trazes, ó Virgem santa,\nteu dom materno.\nPois eis que chamas teus Sete Servos,\ngrande tarefa pões em seus braços:\naos irmãos juntem no amor do Cristo,\nda paz nos laços.\nLogo abandonam mansões de luxo,\nnovos guerreiros da grande Dama;\ne de Maria Servos fiéis\no povo os chama.\nFogem ao mundo e a seus negócios,\na Deus somente servir desejam;\ngalgam o Monte, já em Florença\nnão mais os vejam.\nQuantos pecados por todo o mundo!\nCom duras penas seus corpos gastam!\nCom prantos e preces, de um Deus clemente\na ira afastam.\nVivem na sombra, vivem tão puros\nquais sete lírios de branca neve.\nOh, com que afetos a Virgem santa\nolhá-los deve!\nAo Pai louvemos, também ao Filho,\ne a ti, de ambos proveniente,\nforça do alto, Espírito Santo,\neternamente. Amém!\n\nSALMODIA\nAnt. 1 O Senhor que do pó levanta o indigente, olhou para a humildade dos seus servos.\nSalmo 112 — A Igreja, mãe feliz pela santidade de seus filhos\nLouvai, louvai, ó servos do Senhor, * louvai, louvai o nome do Senhor!\nBendito seja o nome do Senhor, * agora e por toda a eternidade!\nDo nascer do sol até o seu ocaso, * louvado seja o nome do Senhor.\nO Senhor está acima das nações, * sua glória vai além dos altos céus.\nQuem pode comparar-se ao nosso Deus, † ao Senhor, que no alto céu tem o seu trono * e se inclina para olhar o céu e a terra?\nLevanta da poeira o indigente * e retira o pobrezinho do monturo,\npara fazê-lo assentar-se com os nobres, * assentar-se com os nobres do seu povo.\nFaz a estéril mãe feliz em sua casa, * vivendo rodeada de seus filhos.\nAnt. 1 O Senhor que do pó levanta o indigente, olhou para a humildade de seus servos.\nOração sálmica: Suba até vós, ó Pai, o louvor ao vosso nome bendito; vós, que nos chamastes na santa Igreja como Servos da Virgem Maria, fazei que, fortalecidos por vosso amor, nos sirvamos alegremente uns aos outros. Por Cristo nosso Senhor.\n\nAnt. 2 Felizes os nossos Pais, que puseram sua esperança no Senhor e sentiram-se honrados em servir a Virgem Maria.\nSalmo 145 — O justo põe sua esperança no Senhor\nBendize, minh'alma, ao Senhor, † bendirei ao Senhor toda a vida, * cantarei ao meu Deus sem cessar.\nNão ponhais vossa fé nos que mandam, * não há homem que possa salvar.\nAo faltar-lhe o respiro, ele volta † para a terra de onde saiu; * nesse dia seus planos perecem.\nÉ feliz todo o homem que busca † seu auxílio no Deus de Jacó * e que põe no Senhor a esperança.\nO Senhor fez o céu e a terra, * fez o mar e o que neles existe.\nO Senhor é fiel para sempre, * faz justiça aos que são oprimidos;\nele dá alimento aos famintos, * é o Senhor quem liberta os cativos.\nO Senhor abre os olhos aos cegos, † o Senhor faz erguer-se o caído, * o Senhor ama aquele que é justo.\nE o Senhor que protege o estrangeiro, † quem ampara a viúva e o órfão, * mas confunde os caminhos dos maus.\nO Senhor reinará para sempre! † Ó Sião, o teu Deus reinará * para sempre e por todos os séculos!\nAnt. 2 Felizes os nossos pais, que puseram sua esperança no Senhor e sentiram-se honrados em servir a Virgem Maria.\nOração sálmica: Ó Deus, que exaltastes os nossos Sete Santos Pais e vos deleitastes com sua santidade, fazei que, a seu exemplo, possamos sempre louvar-vos com nosso generoso serviço. Por Cristo nosso Senhor.\n\nAnt. 3 Bendito seja Deus, que fez de nossos Pais testemunhas de amor mútuo e de concórdia fraterna.\nCântico (Ef 1,3-10) — Deus renovou em Cristo todas as coisas\nBendito e louvado seja Deus, * o Pai de Jesus Cristo, Senhor nosso,\nque em Cristo abençoou-nos do alto céu * com bênção espiritual de toda sorte!\nFoi em Cristo que Deus Pai nos escolheu, * já bem antes de o mundo ser criado,\npara que fôssemos perante a sua face, sem máculas e santos pelo amor.\nPor livre decisão de sua vontade, † predestinou-nos, através de Jesus Cristo, * a sermos nele os seus filhos adotivos,\npara o louvor e para a glória de sua graça, * que em seu Filho bem-amado nos doou.\nÉ nele que nós temos redenção, * dos pecados remissão pelo seu sangue.\nSua graça transbordante e inesgotável † Deus derrama sobre nós com abundância, * de saber e inteligência nos dotando.\nE assim, ele nos deu a conhecer * o mistério de seu plano e sua vontade,\nque propusera em seu querer benevolente, * na plenitude dos tempos realizar:\no desígnio de, em Cristo, reunir * todas as coisas: as da terra e as do céu.\nAnt. 3 Bendito seja Deus, que fez de nossos Pais testemunhas de amor mútuo e de concórdia fraterna.\nOração sobre o cântico: Senhor, que enriquecestes nossos santos Pais com toda sorte de bênçãos, derramai sobre nós vosso inefável amor, para sermos santos e imaculados diante de Cristo, vosso Filho, que convosco vive e reina na unidade do Espírito Santo.\n\nLEITURA BREVE Cl 3,12-15\nIrmãos, como eleitos, santos e amados de Deus, revesti-vos de sentimentos de carinhosa compaixão, bondade, humildade, mansidão, paciência. Suportai-vos uns aos outros e perdoai-vos mutuamente toda vez que tiverdes queixa contra outrem. Como o Senhor vos perdoou, assim perdoai também vós. Mas, acima de tudo, revesti-vos da caridade, que é vínculo de perfeição. E a paz de Cristo reine em vossos corações.\n\nRESPONSÓRIO BREVE cf. Ef 4,1-2; 5,2\nR. Comportai-vos de modo digno da vocação a que fostes chamados, * com toda humildade e mansidão.\nV. Andai na caridade, assim como Cristo também nos amou.\nR. Com toda humildade e mansidão.\n\nCântico evangélico (Magnificat)\nAnt. Nossos santos Pais invocavam constantemente a Rainha dos céus como sua protetora, Mãe e Senhora.\n\nORAÇÃO\nÓ Deus misericordioso, por vossa inefável Providência, a gloriosa Virgem Maria, por meio dos nossos Sete Santos Pais, instituiu a família dos seus Servos; concedei, vos pedimos, que servindo intensamente a mesma Virgem Mãe, possamos servir-vos melhor em nossos irmãos. Por nosso Senhor.\n\nInvitatório\nAnt. Vinde, adoremos o Senhor, que escolheu nossos Santos Pais para o serviço da Virgem Maria.\n\nOfício das Leituras\nHINO\nA ti, Deus Pai, este hino cantamos\nao celebrarmos dos Pais a memória,\nos quais a exemplo dos santos apóstolos,\nao teu chamado, ao Monte subiram.\nFilhos de Abraão tu suscitas, ó Deus,\naté de pedras, e nunca abandonas\nesta tua Igreja, figura do reino:\ne tal prodígio aqui hoje renovas.\nVolta tua Mãe a assistir o milagre,\ncomo na vinda do teu Fogo santo,\nque renovou o semblante da terra,\nde cada um ele fez um profeta!\nSete eles eram, mercadores ricos,\nlá em Florença, cidade das artes:\npelo evangelho eles tudo deixaram,\nseguindo o apelo do Ressuscitado.\nDe sua cruz o estandarte tomaram,\nquais companheiros de sua paixão;\nnus como Cristo que nu foi pregado,\nde todo pobre tornaram-se irmãos.\nE com a Virgem que sempre os guiou,\njuntos queremos cantar teu louvor,\npois toda a graça de ti recebemos,\nTrindade Santa, que és fonte de amor.\n\nSALMODIA\nAnt. 1 Grande era a caridade dos nossos Sete Pais e a paz de Cristo reinava em seus corações.\nSalmo 1 — Os dois caminhos do homem\nFeliz aquele homem que não anda conforme os caminhos dos perversos; † que não entra no caminho dos malvados, * nem junto aos zombadores vai sentar-se;\nmas encontra seu prazer na lei de Deus * e a medita, dia e noite sem cessar.\nEis que ele é semelhante a uma árvore que à beira da torrente está plantada; † ela sempre dá seus frutos a seu tempo, * e jamais as suas folhas vão murchar.\nEis que tudo o que ele faz vai prosperar, * mas bem outra é a sorte dos perversos.\nAo contrário, são iguais à palha seca espalhada e dispersada pelo vento; † por isso os ímpios não resistem ao juízo, * nem os perversos na assembleia dos fiéis.\nPois Deus vigia o caminho dos eleitos, * mas a estrada dos malvados leva à morte.\nAnt. 1 Grande era a caridade dos nossos Sete Pais e a paz de Cristo reinava em seus corações.\nOração sálmica: Ao celebrar a memória dos nossos Santos Pais, eminentes filhos de vossa Igreja, humildemente vos pedimos, Senhor, que, fortalecidos por vossa graça, nós também, servindo à Virgem Nossa Senhora, possamos fazer germinar a semente da vossa palavra. Por Cristo nosso Senhor.\n\nAnt. 2 Porque se amavam uns aos outros, Deus permanecia neles e seu amor era perfeito.\nSalmo 8 — Majestade de Deus e dignidade do homem\nÓ Senhor nosso Deus, como é grande * vosso nome por todo o universo!\nDesdobrastes nos céus a vossa glória, * com grandeza, esplendor, majestade.\nO perfeito louvor vos é dado † pelos lábios dos mais pequeninos, * de crianças que a mãe amamenta.\nEis a força que opondes aos maus, * reduzindo o inimigo ao silêncio.\nContemplando estes céus que plasmastes * e formastes com dedos de artista;\nvendo a lua e estrelas brilhantes, * perguntamos: \"Senhor, que é o homem, para dele assim vos lembrardes * e o tratardes com tanto carinho?\"\nPouco abaixo de Deus o fizestes, * coroando-o de glória e esplendor;\nvós lhe destes poder sobre tudo, * vossas obras aos pés lhe pusestes:\nas ovelhas, os bois, os rebanhos, * todo o gado e as feras da mata;\npassarinhos e peixes dos mares, * todo ser que se move nas águas.\nÓ Senhor nosso Deus, como é grande * vosso nome por todo o universo!\nAnt. 2 Porque se amavam uns aos outros, Deus permanecia neles e seu amor era perfeito.\nOração sálmica: Ó Deus, de honra e glória coroastes nossos Santos Pais e os fizestes iniciadores de uma família que tem o amor como lei soberana: humildemente vos pedimos, mantende vivo em nós seu espírito de fraterna caridade e de fiel serviço à Virgem Maria. Por Cristo nosso Senhor.\n\nAnt. 3 Eram um só coração e uma só alma e tinham tudo em comum.\nSalmo 115 — A vida do justo é um hino de ação de graças a Deus\nGuardei a minha fé, mesmo dizendo: * \"É demais o sofrimento em minha vida!\"\nConfiei, quando dizia na aflição: * \"Todo homem é mentiroso! Todo homem!\"\nQue poderei retribuir ao Senhor Deus * por tudo aquilo que ele fez em meu favor?\nElevo o cálice da minha salvação, * invocando o nome santo do Senhor.\nVou cumprir minhas promessas ao Senhor * na presença de seu povo reunido.\nÉ sentida demais pelo Senhor * a morte de seus santos, seus amigos.\nEis que sou o vosso servo, ó Senhor, † vosso servo que nasceu de vossa serva; * mas me quebrastes os grilhões da escravidão!\nPor isso oferto um sacrifício de louvor, * invocando o nome santo do Senhor.\nVou cumprir minhas promessas ao Senhor * na presença de seu povo reunido; nos átrios da casa do Senhor, * em teu meio, ó cidade de Sião!\nAnt. 3 Eram um só coração e uma só alma e tinham tudo em comum.\nOração sálmica: Senhor, purificai de todo egoísmo os filhos de vossa Serva, reunidos para celebrar a morte gloriosa dos Sete Santos Pais, para que possam dignamente oferecer-vos um sacrifício de louvor e invocar vosso santo nome. Por Cristo nosso Senhor.\n\nRESPONSÓRIO\nR. Em Monte Senário, nossos Santos Pais construíram três tabernáculos: para si, uma casa pobre; para Cristo, uma esplêndida morada em seu coração; * para os irmãos, um místico refúgio: nossa Ordem.\nV. A muitos atraíram com seu exemplo.\nR. Para os irmãos, um místico refúgio: nossa Ordem.\nHino Te Deum, p. 36.\n\nLaudes\nHINO\nSão Sete servos que surgem,\nda Virgem trazem o nome;\nos bens eternos preferem\naos bens que o tempo consome.\nMaria os chama, e seus Servos\ndo Monte a encosta subiam;\nde novo ordena, e o evangelho\na todo pobre anunciam.\nDos servos cresce o pugilo,\ncresce o louvor de Maria;\nentre os louvores maternos,\ndo Filho o reino se amplia.\nTão santamente viveram,\nque santa morte os coroa;\nno céu a Virgem os recebe,\nsua vitória ressoa.\nDo alto reino onde se encontram,\nà terra volvam os olhos;\ndos que na terra inda lutam\nafastem todos os escolhos.\nGlória e louvor tributemos\nao Pai e a seu Filho amado;\ntambém ao Espírito Santo\nigual louvor seja dado. Amém!\n\nSALMODIA\nAnt. 1 Felizes sois vós, santos Pais: o Senhor vos encontrou vigilantes em seu serviço.\nAnt. 2 Dai glória ao nosso Deus, vós todos os seus servos e vós que o temeis, pequenos e grandes.\nAnt. 3 Felizes os vossos servos, Rainha do universo! Felizes os servos que habitam a vossa casa.\n\nLEITURA BREVE Ef 4,32; 5,2\nSede bondosos uns para com os outros, compassivos, perdoando-vos mutuamente, como Deus vos perdoou em Cristo. Sede, pois, imitadores de Deus, como filhos amados. Progredi na caridade segundo o exemplo de Cristo, que nos amou e por nós se entregou a Deus como oferenda e sacrifício de agradável odor.\n\nRESPONSÓRIO BREVE\nR. Quem ama seu irmão, * permanece na luz.\nV. Quem persevera na caridade, vive o evangelho.\nR. Permanece na luz.\n\nCântico evangélico (Benedictus)\nAnt. Consagrando-se ao serviço da Virgem gloriosa, nossos Sete Santos Pais sentiram-se honrados de ser chamados Servos de Santa Maria.\n\nORAÇÃO\nÓ Deus misericordioso, por vossa inefável Providência, a gloriosa Virgem Maria, por meio dos nossos Sete Santos Pais, instituiu a Família dos seus Servos; concedei, vos pedimos, que servindo intensamente a mesma Virgem Mãe, possamos servir-vos em nossos irmãos. Por nosso Senhor.\n\nHora Média\nOração das Nove Horas\nAnt. O Espírito conduziu nossos Santos Pais pelos caminhos da paz e da verdade.\nLEITURA BREVE Eclo 44,1.6-8 — Façamos o elogio dos homens ilustres, nossos antepassados através das gerações. Homens ricos de virtude e que viviam em paz em suas casas.\nOração das Doze Horas\nAnt. Em nome de Cristo, tinham todos os mesmos sentimentos e com um só coração e uma só alma davam glória a Deus.\nLEITURA BREVE Eclo 44,10-13a — Eles foram homens de bem, cujos atos de justiça não caíram no esquecimento.\nOração das Quinze Horas\nAnt. Quem ama é respeitoso e não busca o próprio interesse.\nLEITURA BREVE Eclo 44,13b-15 — Sua descendência permanecerá para sempre e sua glória não se apagará jamais.\n\nII Vésperas\nHINO\nAbre a videira seus ramos viçosos,\nseguindo o exemplo do pequeno resto\ndo fiel povo que nunca esmorece,\nmesmo disperso na treva e na luta.\nSomos agora seus filhos e herdeiros\ndo que, Senhor, nos ficou por herança:\nvida fraterna e serviço constante,\ntal é o primeiro dos nossos deveres.\nFaze, Senhor, que também nós sejamos\nsinais de unidade e ministros de paz,\npara que em todos os nossos conventos\nseguro abrigo teus pobres encontrem.\nE com a Virgem que sempre os guiou\njuntos queremos cantar teu louvor,\npois toda a graça de ti recebemos,\nTrindade santa, que és fonte de amor.\n\nSALMODIA\nAnt. 1 Resplendentes de santidade e de graça, por meio deles e por divina vontade, a Virgem santa iniciou sua Ordem.\nAnt. 2 Junto com a Mãe, eram perseverantes e unânimes na escuta da Palavra de Deus e no partir do pão.\nAnt. 3 Com sua vida e seu exemplo, atraíram muitos irmãos ao serviço de Deus e da Virgem Maria.\n\nLEITURA BREVE Cl 3,16-17\nA Palavra de Cristo permaneça em vós com toda sua riqueza, de sorte que com toda sabedoria possais instruir e exortar-vos mutuamente. Sob a inspiração da graça, cantai a Deus de todo o coração salmos, hinos e cânticos espirituais.\n\nRESPONSÓRIO BREVE\nR. Isto é amor: * viver segundo o ensinamento de Cristo.\nV. O Pai enviou seu Filho para mostrar-nos o caminho da salvação.\nR. Viver segundo o ensinamento de Cristo.\n\nCântico evangélico (Magnificat)\nAnt. Vinde, servos bons e fiéis, tomai posse do reino junto com a Virgem Maria, vós que fostes perseverantes no seu serviço.\n\nORAÇÃO\nÓ Deus misericordioso, por vossa inefável Providência, a gloriosa Senhora, por meio dos nossos Sete Santos Pais, instituiu a Família dos seus Servos; concedei-nos, vos pedimos, que servindo intensamente a mesma Virgem Mãe, possamos servir-vos melhor em nossos irmãos. Por nosso Senhor."}, {"date": "19 de fevereiro", "day": 19, "month": 2, "name": "B. ISABEL PICENARDI", "bio": "A bem-aventurada Isabel Picenardi nasceu em\nCremona (Lombardia, Itália), em 1428. Mais tarde, seu\npai, administrador do Marquês Gonzaga, mudou-se\ncom a família para Mântua e foi morar perto do\nconvento e igreja de São Barnabé, dos Servos de Maria.\n Foi com a ajuda dos frades que Isabel moldou\nsua espiritualidade, caracterizada pela guarda da\nvirgindade, pela penitência, pelo amor à Eucaristia e\npor uma filial devoção a Nossa Senhora. Era assídua à\noração litúrgica e recitava diariamente o Ofício divino.\n Esses dados biográficos estão registrados nas\ncrônicas do convento de São Barnabé e numa\nimportante biografia, chamada \"Legenda\", escrita\n\npoucos anos depois de sua morte. A \"Legenda\" narra\nque, após a morte do pai, Isabel foi morar com uma\nirmã, casada com um nobre de Mântua, em cuja casa\nocupava um pequeno quarto separado - como se fosse\numa cela monástica - contíguo à igreja de São Barnabé.\nFoi então que ela recebeu o hábito dos Servos de Maria.\n Isabel tinha o dom do conselho e era\nfrequentemente consultada por seus concidadãos. Em\nfavor deles obteve da Virgem Maria muitas graças e\nfavores, sendo conhecida como intercessora junto à\nMãe do Senhor. Atraídas por suas palavras e exemplos,\nalgumas jovens uniram-se ao seu redor e deram início\na um grupo da Ordem Secular (então Ordem Terceira),\nligado à igreja de São Barnabé.\n Isabel morreu em 1468 e foi beatificada em\n1804. Seu corpo encontra-se na localidade de Tor de’\nPicenardi, perto de Cremona.", "prayer": "Senhor, nosso Deus, a bem-aventurada Isabel,\ndurante sua vida terrena, tornou-se agradável a vós por\nsua devoção a Virgem Maria. Fazei que nós, a seu\nexemplo e por sua intercessão, possamos levar uma\nvida digna de vós e agradar-vos sempre. Por Cristo\nnosso Senhor. Amém!", "title": "B. Isabel Picenardi", "rank": "Beato(a)", "oficio": "Do Comum das Virgens ou das Santas religiosas, ou do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO\nR. Isabel, virgem prudente, foi santa no corpo e no espírito. * Chegando o Senhor, entrou com ele para as núpcias eternas.\nV. Cuidou das coisas do Senhor e manteve sua lâmpada sempre acesa.\nR. Chegando o Senhor, entrou com ele para as núpcias eternas.\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. Pedi e recebereis; buscai e achareis; batei e ser-vos-á aberto.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Humilhou-se diante de todos e achou misericórdia em Deus: foi-lhe dado o dom de perscrutar os espíritos.\n\nORAÇÃO\nSenhor, a Bem-aventurada Isabel de tal modo amou a Virgem Maria que fez de sua vida uma oferta agradável a vós. Fazei que nós também, a seu exemplo e por suas preces, possamos levar uma vida digna e agradar-vos sempre. Por nosso Senhor."}, {"date": "8 de abril (dies natalis)", "day": 8, "month": 4, "name": "SERVO DE DEUS FREI PAOLINO MARIA BALDASSARI", "bio": "* 02 de abril de 1926 em Quizano, Itália † 08 de abril de 2016 em Rio Branco, AC\n\nPadre Paolino Baldassari, nascido\n na Itália em 1926, ingressou na\n Ordem dos Servos de Maria e foi\n enviado ao Brasil em 1955. No\n Acre, em Sena Madureira, se\n dedicou mais de 50 anos à\n evangelização e ao trabalho social.\n Enfrentou as dificuldades da\n Amazônia com determinação,\n realizando as \"desobrigas\" —\n longas missões pelos rios, onde\n levava sacramentos, apoio\n espiritual e medicamentos às\n comunidades ribeirinhas mais\n isoladas.\nConhecido como o \"médico da floresta\", Padre Paolino\naprendeu medicina popular com seringueiros e\nindígenas, usando plantas nativas para tratar os\ndoentes. Ele construiu mais de 40 escolas na floresta e\nprotegeu contra o desmatamento, sempre ao lado dos\n\nmais humildes. Sua presença era sinônimo de\nesperança, não apenas como líder espiritual, mas\ntambém como defensor incansável das causas sociais e\nambientais da região.\nMesmo com a saúde debilitada e em idade avançada,\ncontinuou suas atividades pastorais e missionárias até\nseu falecimento em 8 de abril de 2016, aos 90 anos. Sua\nvida foi marcada pela humildade, serviço ao próximo e\ndedicação aos mais necessitados, deixando um legado\nprofundo de amor e fé no coração do povo acreano.", "prayer": "ORAÇÃO PELA BEATIFICAÇÃO E\nCANONIZAÇÃO\nPai de misericórdia, te agradecemos porque doastes à\nSanta Igreja no Acre e ao mundo, o Servo de Deus\npadre Paolino M. Baldassari. Ele, com sua vida\napaixonada, nos inspirou para o anseio missionário,\npara o cuidado com a floresta, e para a cura dos corpos\ne das almas do povo de Deus. Ó Pai, concedei-nos,\natravés da intercessão de padre Paolino, e segundo a\nTua vontade, a graça que imploramos (dizer a graça),\nna esperança que ele seja o quanto antes reconhecido\nentre Teus santos. Santa Maria interceda por nós. Por\nJesus Cristo, Nosso Senhor. Amém", "special": true, "title": "Servo de Deus Frei Paolino Maria Baldassari", "rank": "Servo de Deus", "oficio": null}, {"date": "4 de maio", "day": 4, "month": 5, "name": "SÃO PEREGRINO DE FORLI", "bio": "Peregrino nasceu em\n 1265, em Forlì, cidade da\n região italiana da Romanha.\n Na época, Forlì estava sob a\n jurisdição do Estado\n Pontifício, embora nela\n predominassem os Gibelinos,\n opositores do papa. Estes, em\n 1282, levaram a população a\n rebelar-se contra a autoridade\n papal. Por isso, o papa lançou\n o interdito contra a cidade,\n fechando as igrejas e\n proibindo a celebração do\n culto.\n São Filipe Benizi, então prior geral da Ordem, em\nvisita a os frades do convento de Forlì, tentou\nreconduzir os habitantes da cidade à obediência papal,\nmas foi mal recebido. Um grupo de fanáticos exaltados,\nentre os quais o jovem Peregrino, investiram contra São\nFilipe, bateram nele e o expulsaram da cidade. Mas\nPeregrino logo se arrependeu do mal feito e pediu\nperdão ao Santo.\n Anos depois, ingressou na Ordem e foi o próprio\nSão Filipe que o recebeu no convento de Sena, onde\nPeregrino conviveu com dois frades de insigne\nsantidade: os bem-aventurados Joaquim e Francisco de\n\nSena. Depois voltou para Forlì e aí ficou até a morte,\nocorrida em 1345.\n Peregrino, como frade, distinguiu-se no amor à\noração, na devoção a Virgem Maria e na prática da\npenitência e da caridade. Acudia aos irmãos mais\npobres, em favor dos quais Deus lhe concedeu o dom\ndos milagres.\n Acometido por uma ferida cancerosa numa\nperna, foi milagrosamente curado enquanto se\nencontrava em oração diante da imagem do\nCrucificado. Por isso, é invocado como protetor dos\ndoentes, principalmente dos que sofrem de câncer.\nPeregrino foi canonizado em 1726. Seu corpo é\nvenerado na igreja do convento dos Servos de Maria,\nem Forlì.\n Nós, Servos de Maria, vemos concretizado em São\nPeregrino o nosso ideal de vida, ou seja: serviço, oração,\npiedade mariana, amor ao próximo.", "prayer": "Senhor, nosso Deus, vós nos destes em São\nPeregrino um admirável exemplo de penitência e\npaciência. Concedei, benigno, que, seguindo seu\nexemplo e por sua intercessão, suportemos com\ncoragem os sofrimentos da vida presente e alegres\ncaminhemos para a recompensa eterna. Por Cristo\nnosso Senhor. Amém!", "title": "São Peregrino de Forlì", "rank": "São", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor: ele exaltou nossos irmãos, Servos da Virgem Maria. Aleluia!\n\nOfício das Leituras\nHINO\nO Peregrino, irmão nosso e amigo,\nquanta lembrança à memória nos traz\ntua santa vida e o teu testemunho:\ne assim desfazes a nossa tristeza.\nMais do que a outros os Servos te invocam,\npois tu conheces dos jovens o ardor,\nda multidão inflamada o delírio\ne o que é de fato violência e injustiça.\nAté contra santos a mão levantaste,\nantes de seres tu santo também:\nassim compreendes dos dias de hoje\no drama atroz, sem sentido, das guerras,\ndestas inúteis matanças e mortes:\nfalsa é talvez esta voz que provém\nda sarça ardente, uma voz solitária,\núnica voz que liberta e que salva?\nNão foi em vão que Filipe, na praça,\nda humilde serva entoou o poema:\nnova esperança nasceu para os pobres\ne nas fileiras dos Servos brotou.\nCom nossos santos, amigos fiéis,\nteu mesmo canto, ó Mãe, nós cantamos:\num canto novo de graça e louvor\npor toda a Igreja elevamos ao Pai.\n\nSALMODIA — Série A\nAnt. 1 É preferível ser humilde com os pobres que aliar-se aos poderosos.\nAnt. 2 Sábio é temer a Deus e inteligente afastar-se do mal.\nAnt. 3 Vós me convertestes, Senhor meu Deus: diante do vosso apelo à penitência, mudei de vida.\nSérie B (tempo pascal)\nAnt. 1 Pediu-vos a salvação e vós lha destes; escutastes sua oração e o curastes. Aleluia!\nAnt. 2 Os maus vegetam como a erva ressequida; o justo, porém, cresce forte como a palmeira. Aleluia!\nAnt. 3 Plantado na casa do Senhor, Peregrino produziu frutos em abundância. Aleluia!\nSérie C\nAnt. 1 Quem quiser vir após
