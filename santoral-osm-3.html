 mim, renuncie a si mesmo, tome a sua cruz e me siga.\nAnt. 2 Quem quiser salvar a sua vida, vai perdê-la; mas quem a perder por causa de mim e do evangelho, vai salvá-la. Aleluia!\nAnt. 3 Estreita é a porta e apertado o caminho que conduz à vida. Aleluia!\nV. Convertei-vos e fazei penitência.\nR. Criai em vós um coração e um espírito novo.\n\nRESPONSÓRIO Gl 2,20; 1Cor 9,27\nR. Eu vivo pela fé no Filho de Deus, que me amou e se entregou a si mesmo por mim: * fui crucificado junto com Cristo. Aleluia!\nV. Castigo meu corpo para reduzi-lo à servidão.\nR. Fui crucificado junto com Cristo. Aleluia!\n\nLaudes\nHINO\nMultiplica as preces\nquem ao mundo amava;\nquer chegar ao prêmio:\nsuas culpas lava.\nDe Jesus as dores\njunto à cruz medita;\nsente as de Maria\nna su'alma aflita.\nBusca austeridades,\nrepousar recusa;\nao labor se entrega,\ndos jejuns abusa.\nGlória ao Pai e ao Filho\ne ao Espírito Santo;\nà Trindade excelsa\nsuba o nosso canto.\n\nSALMODIA\nAnt. 1 Volto-me para vós, Senhor; para vós levanto os meus olhos. Aleluia!\nAnt. 2 Louvo e glorifico o Rei do céu: justas são as suas obras e retos os seus caminhos. Aleluia!\nAnt. 3 Eu vos louvo, Senhor, porque me destes sabedoria e força. Aleluia!\n\nCântico evangélico (Benedictus)\nAnt. Bendito seja o Senhor Deus, que usou de misericórdia com São Peregrino e guiou os seus passos no caminho da paz. Aleluia!\n\nORAÇÃO\nÓ Deus, vós nos destes em São Peregrino um admirável exemplo de penitência e paciência. Concedei, benigno, que, a seu exemplo e por sua intercessão, suportando corajosamente os sofrimentos desta vida, alegres caminhemos para o reino dos céus. Por nosso Senhor.\n\nVésperas\nHINO (repete-se o hino do Ofício das Leituras)\n\nSALMODIA\nAnt. 1 Não conheço ninguém a não ser Jesus Cristo, o crucificado. Aleluia!\nAnt. 2 Com o jejum e a esmola, Peregrino fazia de sua oração uma oferta agradável a Deus. Aleluia!\nAnt. 3 Peregrino trazia em seu corpo as marcas da paixão de Jesus, a fim de participar de sua glória.\n\nCântico evangélico (Magnificat)\nAnt. Peregrino percorreu decididamente o caminho da conversão e esperou vigilante a vinda do Senhor. Aleluia!"}, {"date": "8 de maio", "day": 8, "month": 5, "name": "B.A. VIRGEM MARIA MÃE E MEDIANEIRA", "title": "B.A. Virgem Maria, Mãe e Medianeira", "rank": "Memória facultativa", "bio": "Por sua maternal caridade, Maria cuida dos irmãos do seu Filho, que ainda peregrinam neste mundo, rodeados de perigos e dificuldades, até que sejam conduzidos à feliz pátria. Por isso, ela é invocada na Igreja como Advogada, Auxiliadora, Protetora e Medianeira. Isso, porém, se entende de tal modo que nada derrogue, nada acrescente à dignidade e eficácia de Cristo, o único Mediador (Lumen Gentium, 62).", "prayer": "Ó Deus, quisestes dar ao mundo o Autor da graça por meio da bem-aventurada Virgem Maria, por vós associada ao mistério da redenção humana: humildes vos suplicamos que ela nos obtenha muitas graças e nos conduza à salvação eterna. Por nosso Senhor.", "oficio": "Invitatório\nAnt. Vinde, adoremos a Cristo, nosso Mediador, que associou a Virgem Maria ao mistério da salvação. Aleluia!\n\nOfício das Leituras\nHINO\nEu te saúdo, ó Virgem,\nMaria, Mãe de Deus,\nestrela do alto mar\ne doce porta do céu.\nAcolhendo aquele Ave\ndo arcanjo Gabriel,\ntrocas o nome de Eva,\nfirmando-nos na paz.\nQuebra os grilhões da culpa,\nos cegos ilumina,\nafasta nossos males,\nalcança-nos o bem.\nMostra que és nossa Mãe\ne leva as nossas preces\na quem por nós nasceu\ne te escolheu por Mãe.\nÓ Virgem singular,\nsuavíssima entre todas,\nnossa alma purifica\ne dá-nos mansidão.\nOrienta a nossa vida\nnum caminho seguro,\npara a extrema ventura\nde ver Jesus no céu.\nHonra e glória a Deus Pai,\nsupremo louvor ao Cristo\ne ao Espírito Santo:\naos três um só amor. Amém!\n\nRESPONSÓRIO\nR. Ó Virgem Maria, entre as filhas de Israel não há nenhuma que se vos compare. Vós sois a serva do Senhor, a Mãe do Mediador e a morada do Espírito Santo. * Bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre. Aleluia!\nV. Ave, oceano de bondade, fonte de misericórdia, refúgio dos pecadores!\nR. Bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre. Aleluia!\n\nLaudes\nHINO\nApós três dias celebram-se bodas:\nCristo também fora então convidado,\ncontigo, ó Mãe, e com seus companheiros:\nvamos, pois, todos a um novo Sinai.\nDo tempo antigo é o sétimo dia,\nmas sua hora inda não irrompera:\no oitavo dia é o seu novo dia,\ndia da última festa do mundo.\nComo Javé se revela no monte\npara que o povo em Moisés acredite:\nassim Jesus manifesta a sua glória,\npara que nele os discípulos creiam.\nMas tudo ainda é simples figura:\nem sangue o vinho haverá de mudar-se,\nserá o banquete da nova aliança\ne tu serás a Mulher junto à cruz!\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\n\nCântico evangélico (Benedictus)\nAnt. Quando Isabel ouviu a saudação de Maria, a criança estremeceu de alegria em seu ventre e ela ficou cheia do Espírito Santo. Aleluia!\n\nORAÇÃO\nÓ Deus, quisestes dar ao mundo o Autor da graça por meio da bem-aventurada Virgem Maria, por vós associada ao mistério da redenção humana: humildes vos suplicamos que ela nos obtenha muitas graças e nos conduza à salvação eterna. Por nosso Senhor.\n\nVésperas\nHINO\nA ti, ó Mãe, ofereço este canto,\nqual um presente que eu quero te dar,\na ti que o Filho levaste a operar\nlá em Cana o milagre primeiro.\n\"Não têm mais o vinho!\" — disseste ansiosa.\nE desde então a primeira és a ver\nir-se a alegria dos nossos convívios:\nagora sabes e podes dar ordens.\nSim, ó Maria, não temos mais vinho:\nnossos amores não têm alegrias,\na nossa sorte perdeu toda a graça\ne nossas festas carecem de fé!\nNa hora de Cristo Maria acredita,\ngraças te damos, por isso, Deus Pai:\ncom vinho novo do Filho nos brindas,\nvinho que é espírito e nossa alegria.\n\nCântico evangélico (Magnificat)\nAnt. Lembrai-vos de nós, Senhor; mostrai-vos no dia da tribulação. E vós, ó Mãe, rogai por nós ao Senhor e salvai-nos da morte. Aleluia!"}, {"date": "11 de maio", "day": 11, "month": 5, "name": "B. BENINCASA DE MONTEPULCIANO", "bio": "Benincasa nasceu em Montepulciano (Toscana,\nItália), por volta de 1375. Ainda jovem, ingressou na\nOrdem dos Servos de Maria e, com 25 anos de idade,\nretirou-se como eremita numa gruta do Monte Amiata,\nperto do lugar onde São Filipe Benizi teria transcorrido\num tempo de sua vida em penitência e oração. O local\nse chama \"Bagni di San Filippo\". Nessa gruta,\nBenincasa morreu em 9 de maio de 1426, quando tinha\n50 anos de idade.\n Benincasa transcorreu a maior parte de sua vida\nem oração, em rígidas práticas penitenciais e na\nsolidão, mantendo, porém, estreita ligação com a\nOrdem e acolhendo com alegria os que o visitavam em\nbusca de aconselhamento e de conforto espiritual. É um\nexemplo vivo da dimensão contemplativa sempre\npresente ao longo dos séculos na espiritualidade da\nOrdem dos Servos de Maria.\n Relatam seus biógrafos que ele trocava o que\nrecebia dos visitantes por pequenos objetos que ele\nmesmo fabricava. Isso mostra o valor do trabalho\nmanual na vida religiosa, que as Constituições da nossa\nOrdem também enfatizam.\n Por sua vida santa e pelos milagres operados\ndurante a vida e após a morte, foi beatificado pelo papa\nPio VII em 1829. Seu corpo é venerado na igreja\nparoquial de Montechiello (Sena).", "prayer": "Senhor Deus, vós chamastes o bem-aventurado\nBenincasa para ser testemunha viva do vosso Filho\nmediante uma vida de solidão e de silêncio, voltada\npara o trabalho e a oração. Concedei que, fortalecidos\npela oração e a penitência, possamos cumprir fielmente\nos deveres da vida cristã. Por Cristo nosso Senhor.\nAmém!", "title": "B. Benincasa de Montepulciano", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO Mt 26,41; Cl 4,2\nR. Vigiai e orai para não cairdes em tentação: * o espírito está pronto, mas a carne é fraca.\nV. Sede perseverantes e vigilantes na oração, rendendo graças ao Senhor.\nR. O espírito está pronto, mas a carne é fraca.\n\nORAÇÃO\nÓ Deus, fizestes do Bem-aventurado Benincasa, com sua vida de solidão operante, uma testemunha viva do vosso Filho; concedei que, mediante a contemplação e a conversão interior, vivamos com maior liberdade o compromisso evangélico. Por nosso Senhor."}, {"date": "12 de maio", "day": 12, "month": 5, "name": "B. FRANCISCO DE SENA", "bio": "Francisco nasceu em Sena (Toscana, Itália), em\n1266. Sua vida é narrada na \"Legenda\" (= biografia)\nescrita por frei Cristóvão de Parma, seu contemporâneo\ne confidente.\n Desde jovem, Francisco sentiu-se atraído pela\nvida religiosa, mas não pôde seguir logo sua vocação,\nporque devia assistir sua mãe que era cega. Quando ela\nmorreu, Francisco, com 22 anos de idade, ingressou no\nconvento dos Servos de Maria de Sena e, três anos\ndepois, foi ordenado presbítero.\n Distinguiu-se na obediência, na pregação da\nPalavra de Deus e, principalmente, na caridade, no amor\nà Eucaristia e na filial devoção a Virgem Maria.\nFrancisco sempre foi atencioso com os confrades, os\npobres e os doentes, aos quais acudia, compartilhando\nseus sofrimentos e ajudando-os com suas obras e\nconselhos.\n\n Celebrava diariamente, com grande devoção, a\nEucaristia, honrava a Virgem Maria - sua \"Senhora\",\ncomo ele costumava dizer - com atos de particular\nveneração, e a ela dedicava toda a sua atividade de frade\ne de presbítero.\n Seu último dia de vida revela, em síntese, as\nprincipais características de sua espiritualidade.\nPressentindo a morte iminente, visitou amigos e\ndevotos; tomou a última refeição com os confrades,\nmostrando assim o afeto que o unia a eles; celebrou\ndevotamente a Eucaristia, por ser a Vigília da\nAscensão; e quis cumprir até o fim o seu compromisso\nde obediência e de zelo apostólico. De fato, embora\ndoente e já sem forças, partiu para um povoado vizinho,\nonde devia fazer uma pregação. Mas, no caminho, ao\ncolocar um buquê de flores diante da imagem de Nossa\nSenhora, caiu de joelhos, extenuado. Levado de volta\nao convento, faleceu. Era o dia 26 de maio de 1328.\n Francisco foi beatificado pelo papa Bento XIV\nem 1743. Seu corpo é venerado em Sena, na basílica\ndos Servos de Maria.", "prayer": "Senhor, nosso Deus, infundi em nós o espírito de\nmansidão e de humildade com que o bem-aventurado\nFrancisco honrou a mãe do vosso Filho e conduziu o\nvosso povo para os bens eternos. Por Cristo nosso\nSenhor. Amém!", "title": "B. Francisco de Sena", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO Jo 19,26-27\nR. Jesus, vendo sua Mãe e perto dela o discípulo a quem amava, disse à Mãe: \"Mulher, eis o teu Filho\"; depois disse ao discípulo: * \"Eis a tua Mãe\". Aleluia!\nV. E a partir daquela hora o discípulo a acolheu junto a si.\nR. \"Eis a tua Mãe\". Aleluia!\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. Buscai o Senhor vós todos os mansos, que fazeis a sua vontade. Procurai a mansidão e praticai a justiça. Aleluia!\n\nORAÇÃO\nSenhor Deus, infundi em nós o espírito de mansidão e de humildade, com que o vosso servo Francisco honrou a Mãe de Cristo e orientou o vosso povo para os bens eternos. Por nosso Senhor.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Francisco, servo do Senhor, na hora da morte assim rezava: \"Tudo está consumado\". \"Pai, em vossas mãos eu entrego o meu espírito\". Aleluia!"}, {"date": "30 de maio", "day": 30, "month": 5, "name": "B. TIAGO FILIPE DE FAENZA", "bio": "Tiago Filipe Bertoni nasceu em Faenza (Emília-\nRomanha, Itália), em 1454. Ainda adolescente,\ningressou no convento dos Servos de Maria de sua\ncidade. Quando pequeno sofria de epilepsia e seu pai fez\na promessa de consagrá-lo ao Senhor, se ficasse curado.\n Tiago Filipe foi ordenado presbítero. No\nconvento, ocupou vários cargos, inclusive de ecônomo.\nDado à leitura dos autores clássicos e dos Padres da\nIgreja, principalmente de São Jerônimo, aplicou-se\ncom afinco no estudo da Sagrada Escritura. Celebrava\na santa Eucaristia com grande fervor. Levou vida\npenitente e ascética. Tinha um caráter manso e\nmaneiras gentis, embora fosse de poucas palavras. Foi\nsempre prudente e reservado no falar.\n Morreu com a idade de 29 anos de idade, em\n1483, vitimado talvez pela tuberculose, como parece\nmostrar a iconografia, que sempre o retrata com o rosto\nmacilento e a pele aderente aos ossos. Fatos\nextraordinários ocorreram junto a seu esquife.\n Seu culto, que começou logo após a morte,\nrecebeu a aprovação formal do papa Clemente XIII em\n1761. Seu corpo é venerado na catedral de Faenza.\n A primeira biografia do bem-aventurado Tiago\nFilipe foi escrita por Nicolau Borghese, humanista e\npolítico da cidade de Sena, que foi agraciado com um\nmilagre obtido pela sua intercessão.", "prayer": "Ó Deus, ornastes o bem-aventurado Tiago Filipe\ncom a riqueza da doutrina sagrada e lhe destes celebrar\ncom fervor os divinos mistérios. Concedei que\ndesejemos somente a vós, única fonte da verdadeira\nsabedoria e autor do divino amor. Por Cristo nosso\nSenhor. Amém!", "title": "B. Tiago Filipe de Faenza", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO cf. 2Tm 2,22-24; Mt 11,29\nR. Buscai a justiça, a fé, a caridade e a paz com aqueles que, de coração puro, invocam o nome do Senhor: o servo do Senhor deve ser manso com todos, apto para instruir, paciente na tribulação.\nV. Tomai sobre vós o meu jugo e aprendei de mim que sou manso e humilde de coração.\nR. O servo do Senhor deve ser manso com todos, apto para instruir, paciente na tribulação.\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. O sacrifício do justo é agradável; a sua memória não será esquecida.\n\nORAÇÃO\nÓ Deus, que ornastes o Bem-aventurado Tiago Filipe com a riqueza da doutrina sagrada e lhe destes celebrar com fervor os divinos mistérios, concedei que desejemos somente a vós, como única fonte da sabedoria e da caridade. Por nosso Senhor.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Aplica-te à leitura, à exortação, à instrução: desvela-te por estas coisas e nelas persevera, para que todos vejam o teu progresso."}, {"date": "19 de junho", "day": 19, "month": 6, "name": "SANTA JULIANA DE FLORENÇA", "bio": "Juliana nasceu em Florença na segunda metade\ndo século XIII. Segundo a tradição, era da mesma\nfamília \"Falconieri\", à qual pertencia Santo Aleixo, um\ndos Sete Fundadores dos Servos de Maria.\n O acontecimento mais importante de sua vida -\npor sinal, pouco conhecido - foi sua conversão quando\ntinha 15 anos de idade, depois de ouvir uma pregação\nde Santo Aleixo sobre o Juízo Final. A partir daí,\nJuliana orientou o coração e a mente unicamente para\no Senhor e, embora residindo com a família, levou vida\nde penitência e contemplação, seguindo o exemplo dos\nprimeiros frades da nossa Ordem. Frequentava a igreja\nde Santa Maria de Cafaggio, futura basílica da\nSantíssima Anunciada. Junto com os frades,\nparticipava dos ofícios litúrgicos e cantava os louvores\nda Mãe do Senhor.\n Depois de muito insistir com os pais e de\nimplorar a Virgem Maria, obteve a graça de receber o\nhábito da Ordem. Logo, outras jovens juntaram-se a ela\nna vida de penitência e de piedade e na partilha do ideal\nde vida dos Servos de Maria.\n A espiritualidade de Santa Juliana caracteriza-\nse por um ardente amor à Eucaristia. No leito de\nmorte, não podendo receber o Corpo do Senhor\ndevido ao seu estado de saúde, pediu que a santa\nHóstia lhe fosse colocada sobre o peito. Diz uma\npiedosa tradição que a santa Hóstia penetrou\n\nmilagrosamente no seu peito e não foi mais\nencontrada.\n Presume-se que Santa Juliana tenha morrido em\n1341. Venerada na Ordem como \"bem-aventurada\"\npelo menos desde o século XV, foi canonizada pelo\npapa Clemente XII em 1737.\n Juliana, a bem da verdade, não fundou nenhuma\ncongregação religiosa. Apesar disso, as mulheres -\nleigas, religiosas e monjas - que ao longo dos séculos\ndedicaram-se ao serviço da Virgem Maria no âmbito da\nFamília Servita, sempre a reconheceram como mãe e\nmestra. Seu mais antigo biógrafo, frei Paulo Attavanti,\na definiu como \"magnum caput\", isto é, como grande\ninspiradora das congregações femininas da Ordem.\n Os membros da Ordem Secular Servita colocam\nSanta Juliana em primeiro lugar na longa lista de leigos\nque viveram como amigos dos Servos de Maria e\ncompartilharam o seu ideal de serviço a Deus, a\nVirgem Maria e aos irmãos.", "prayer": "Ó Deus, por intermédio de Santa Juliana,\nexemplo de castidade e de penitência, suscitastes na\nOrdem dos Servos de Maria uma família de virgens a\nvós consagradas. Fazei que a vossa Igreja, esposa de\nCristo, mantenha sempre viva a chama da virgindade\nfecunda. Por Cristo nosso Senhor. Amém!", "title": "Santa Juliana de Florença", "rank": "Santa", "oficio": "I Vésperas\nHINO\nJuliana deixa o mundo,\nsó procura o que é do céu:\ndas que a Deus são consagradas,\npede a veste, cinge o véu.\nMal comia e mal dormia,\no seu corpo castigou;\npenitente, as boas obras,\nsem cessar multiplicou.\nPelo amor foi traspassada,\ncontemplando o Cristo e a cruz:\ntrouxe impresso em sua alma\no semblante de Jesus.\nGlória ao Pai, o Deus supremo,\nque é de tudo o Criador;\nglória ao Filho, a ele igual,\nao Espírito de amor. Amém!\n\nSALMODIA\nAnt. 1 Encontrei o meu amado. A ele me entrego e jamais o deixarei.\nAnt. 2 Vossa face, Senhor, eu procuro; vós sois, ó Deus, minha luz e minha salvação.\nAnt. 3 Farei de ti minha esposa para sempre, no amor e na fidelidade.\n\nCântico evangélico (Magnificat)\nAnt. Qual virgem prudente, Juliana preparou a sua lâmpada com o óleo do amor. O Senhor a encontrou vigilante e a levou para as núpcias eternas.\n\nORAÇÃO\nÓ Deus, por meio de Santa Juliana, exemplo de castidade e de penitência, suscitastes na Ordem dos Servos de Maria uma família de virgens a vós consagradas; fazei que a vossa Igreja, movida pelo amor do Esposo, mantenha sempre viva a chama da virgindade fecunda. Por nosso Senhor.\nOu: Senhor, alegre vossa Igreja o eminente exemplo de Santa Juliana; por vosso providencial desígnio, ela tornou-se mãe carinhosa e mestra prudente de muitas irmãs no caminho do seguimento de Cristo e no serviço à Virgem Maria. Por nosso Senhor.\n\nInvitatório\nAnt. Vinde, adoremos a Cristo, rei das virgens, fonte de vida e de alegria!\n\nOfício das Leituras\nHINO\nJovem e bela tu eras Juliana,\nlá em Florença, cidade do lírio,\nmas, entre lutas infindas e prantos,\num outro Amor para ti procuravas.\nJá frei Aleixo, teu santo parente,\nneste jardim igualmente crescido,\ngraça irradia do Monte Senário,\nele entre os Sete o santo querido.\nA mesma graça que teu coração\ne todo ser já te invade fecunda,\nde aroma suave o espaço perfuma\ne reverbera nos teus grandes olhos.\nNoss'alma, pois, engrandeça o Senhor,\nque nos faz sócios de santos irmãos:\nServos e Servas de Santa Maria,\nlâmpadas vivas tenhamos nas mãos.\n\nSALMODIA — Série A\nAnt. 1 A virgindade consagrada é um dom do Pai e uma oferta a Deus e aos irmãos.\nAnt. 2 A Virgem prudente escolheu para si a melhor parte, que não lhe será tirada.\nAnt. 3 O Espírito Santo habita no coração da virgem consagrada, cumulando-a dos seus dons.\nSérie B\nAnt. 1 Cristo, sol que dissipa as trevas, estabeleceu sua morada no coração de Juliana.\nAnt. 2 Entre as escolhidas do grande Rei, tu resplandeces de eterna glória.\nAnt. 3 As virgens amigas acompanham-na com danças de alegria e, juntas, entram no palácio real.\nSérie C\nAnt. 1 O mistério que se completou no ventre de Maria, Juliana experimentou-o no íntimo de sua alma.\nAnt. 2 Juliana desejava ardentemente alimentar-se do Pão da vida, o Cristo Jesus.\nAnt. 3 Em seu coração ficou gravada a imagem resplendente de Deus.\n\nRESPONSÓRIO\nR. A virgem consagrada faz da meditação da Sagrada Escritura e da oração perseverante o alimento do seu espírito: * ela é o templo vivo de Deus.\nV. O Espírito Santo mora em seu coração.\nR. Ela é o templo vivo de Deus.\n\nLaudes\nHINO\nMãe de muitos te tornaste,\nimitando a Mãe de Deus;\nés a luz dos que te seguem,\nforça e exemplo para os teus.\nAo morrer, já não podias\nreceber a comunhão;\nmas Jesus, posto em teu peito,\npenetra teu coração.\nQuão imenso o teu afeto\npela Mãe do teu Senhor;\ndá que a ela nós sirvamos,\nsó busquemos seu louvor.\nGlória ao Pai, ao Deus supremo,\nque é de tudo o criador;\nglória ao Filho, a ele igual,\nao Espírito de amor. Amém!\n\nSALMODIA\nAnt. 1 Vós sois a verdadeira fonte da vida e nos saciais com a torrente do vosso amor.\nAnt. 2 Vós sois o alimento da minha alma e fazeis brotar um canto de louvor.\nAnt. 3 Mais suave ressoa o louvor do Senhor quando nosso pensamento prontamente a ele se volta.\n\nCântico evangélico (Benedictus)\nAnt. O Senhor Jesus foi, para Juliana, paciência nas provações, alimento no jejum e remédio na enfermidade.\n\nORAÇÃO (como acima)\n\nVésperas\nHINO (repete-se o hino das I Vésperas)\n\nSALMODIA\nAnt. 1 Vivei no amor como Cristo nos amou.\nAnt. 2 O pão que eu darei é a minha carne para a vida do mundo.\nAnt. 3 Felizes os convidados para as núpcias do Cordeiro.\n\nCântico evangélico (Magnificat)\nAnt. Ó Juliana, serva do Senhor e serva fiel da Virgem Mãe, no cortejo seleto das virgens tu segues o Cordeiro aonde quer que ele vá."}, {"date": "27 de junho", "day": 27, "month": 6, "name": "B. TOMÁS DE ORVIETO", "bio": "Tomás de Orvieto (Úmbria, Itália), movido por\nsingular amor a Virgem Maria e desejando chegar mais\nseguramente à pátria celeste, ingressou na Ordem dos\nServos de Maria, na qual, por sua grande humildade, foi\nrecebido como irmão leigo.\n Era frequentemente mandado de casa em casa\npara pedir esmola, o que ele fazia cm grande espírito de\ncaridade. É por isso que as imagens que o representam -\ne algumas são muito antigas - o mostram sempre com\numa sacola às costas, trazendo na mão um ramo de\nfigueira ou então oferecendo-o a uma mulher grávida,\nem pleno inverno.\n Morreu em Orvieto por volta de 1343 e foi\nsepultado na igreja dos Servos de Maria. O papa\nClemente XIII aprovou seu culto em 1768.", "prayer": "Ó Deus misericordioso, que, em vossa infinita\nbondade, inclinais os ouvidos às súplicas dos humildes,\npelas preces do bem-aventurado Tomás, concedei à\nFamília dos Servos e Servas de Santa Maria\nexperimentar aqui na terra a vossa presença\nconsoladora e obter na vida futura a felicidade eterna.\nPor Cristo nosso Senhor. Amém!", "title": "B. Tomás de Orvieto", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas e salmos do dia da semana corrente.\n\nRESPONSÓRIO\nR. Sede humildes e sinceros entre vós: * Deus resiste aos soberbos, mas dá a graça aos humildes.\nV. Vós, como eleitos de Deus, santos e amados, revesti-vos de sentimentos de compaixão, de bondade, humildade e mansidão.\nR. Deus resiste aos soberbos, mas dá a graça aos humildes.\n\nORAÇÃO\nÓ Deus, que inclinais benignamente vossos ouvidos às preces dos humildes, concedei, pela intercessão do Bem-aventurado Tomás, que vossa família alcance serenidade na vida presente e felicidade eterna na vida futura. Por nosso Senhor."}, {"date": "1º de julho", "day": 1, "month": 7, "name": "B. FERNANDO MARIA BACCILIERI", "bio": "Fernando Maria Baccilieri nasceu em\nCampodoso, na paróquia de Reno Finalese, em\nMódena, Itália, aos 14 de maio de 1821. Desde jovem,\nsentiu o desejo de partir para anunciar o evangelho em\nterras de missão. Ingressou na Companhia de Jesus,\nmas teve que deixar a Congregação por problemas de\nsaúde.\n Ordenado sacerdote diocesano, em 1852 foi\nnomeado pároco de Galeazza Pepoli, na diocese de\nBolonha, comunidade paroquial que ele por 41 anos\nconduziu com abnegação e generosidade pastoral.\n Por sua grande devoção a Nossa Senhora,\ninscreveu-se na Ordem Secular dos Servos de Maria,\nentão chamada Ordem Terceira. E para melhor\nresponder às necessidades mais urgentes do povo,\nfundou a Congregação das irmãs Servas de Maria de\nGaleazza.\n Morreu a 13 de julho de 1893. Em 1º de julho de\n1999 seu corpo foi transladado para a igreja de\nGaleazza Peopoli, onde hoje se encontra. Foi\nbeatificado em 3 de outubro de 1999 pelo papa João\nPaulo II.", "prayer": "Ó Deus, que nos destes no bem-aventurado\nFernando Maria destes uma testemunha admirável de\n\nvida evangélica, a seu exemplo e por sua intercessão,\ndai-nos seguir os passos de Cristo e servir os nossos\nirmãos e irmãs com amor. Por Cristo nosso Senhor.\nAmém", "title": "B. Fernando Maria Baccilieri", "rank": "Beato(a)", "oficio": null}, {"date": "4 de julho", "day": 4, "month": 7, "name": "B. UBALDO DE SANSEPOLCRO", "bio": "Ubaldo nasceu em \"Borgo San Sepolcro\"\n(Toscana, Itália) em meados do século XIII. Ingressou\nna Ordem dos Servos de Maria e foi ordenado\npresbítero, distinguindo-se por uma vida santa e\nlaboriosa. Foi para todos exemplo de bondade e de\ncastidade.\n Era amigo íntimo de São Filipe, o qual, estando\nno leito de morte, ao perceber a chegada de frei Ubaldo,\nrecobrou novo alento e acabou morrendo em seus\nbraços.\n Ubaldo morreu no convento de Monte Senário\npor volta de 1315. Seu culto foi confirmado pelo papa\nPio VII em 1821.", "prayer": "Ó Deus, fonte de castidade e de amor, pelas\npreces e exemplos do bem-aventurado Ubaldo,\nconcedei que vossos servos e servas vos glorifiquem\ncom a santidade de sua vida e com o testemunho de sua\nunidade. Por Cristo nosso Senhor. Amém!", "title": "B. Ubaldo de Sansepolcro", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas e salmos do dia da semana corrente.\n\nRESPONSÓRIO 2Cor 7,6; 1,3-4; Tt 1,4\nR. Deus, consolador dos aflitos, * consola-nos com a chegada de um filho e irmão na fé.\nV. Bendito seja Deus que nos consola em nossas tribulações.\nR. Consola-nos com a chegada de um filho e irmão na fé.\n\nORAÇÃO\nÓ Deus, fonte da castidade e do puro amor, pelas preces e exemplos do Bem-aventurado Ubaldo, concedei que vossos servos vos glorifiquem com a santidade de suas vidas e o testemunho de sua unidade. Por nosso Senhor."}, {"date": "13 de julho", "day": 13, "month": 7, "name": "SANTA CLÉLIA BARBIERI", "bio": "Nasceu em Le Budrie\n de San Giovanni in Persiceto,\n diocese de Bolonha (Itália),\n aos 13 de fevereiro de 1847.\n De família muito pobre,\n quando criança e adolescente,\n enfrentou sérias dificuldades\n de sobrevivência.\n Em 1868, com mais\n três companheiras, iniciou\n uma comunidade que tomou\n sob seus cuidados as jovens\n abandonadas, cuidando de\n sua educação. Dessa pequena\n comunidade inicial originou-\n se a Congregação das irmãs\n Mínimas de Nossa Senhora\n das Dores.\n Morreu aos 23 anos de idade no dia 13 de julho\nde l870, em Le Budrie, onde seu corpo é venerado. Foi\nbeatificada pelo papa Paulo VI em 27 de outubro de\n1968 e canonizada por João Paulo II em 9 de abril de\n1989.", "prayer": "Ó Deus, glória e prêmio dos humildes de coração,\npor intermédio de Santa Clélia, fundastes uma nova\nfamília de virgens consagradas. Concedei, vos pedimos,\nque vivendo nesta terra a humildade e a pequenez,\nmereçamos ser conduzidos às mansões eternas. Por\nCristo nosso Senhor. Amém!", "title": "Santa Clélia Barbieri", "rank": "Santa", "oficio": "Do Comum das Virgens ou do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas e salmos do dia da semana corrente.\n\nRESPONSÓRIO 1Pd 5,5; Mt 11,29\nR. Sede humildes e sinceros entre vós: * Deus resiste aos soberbos, mas dá a sua graça aos humildes.\nV. Aprendei de mim que sou manso e humilde de coração e encontrareis repouso para as vossas almas.\nR. Deus resiste aos soberbos, mas dá a sua graça aos humildes.\n\nORAÇÃO\nÓ Deus, que nos destes em Santa Clélia um exemplo de vida evangélica e de disponibilidade em servir os irmãos, concedei que nós também saibamos imitar a Cristo, manso e humilde de coração, para alcançarmos a herança no vosso reino. Por nosso Senhor."}, {"date": "23 de agosto", "day": 23, "month": 8, "name": "SÃO FILIPE BENÍCIO", "bio": "Solenidade\n Filipe nasceu em Florença (Toscana, Itália), no\ninício do século XIII. Entrou na Ordem dos Servos de\nMaria como irmão leigo. Mais tarde, por um\nprovidencial desígnio de Deus, sua sabedoria tornou-se\nconhecida. Em seguida, foi ordenado presbítero.\n Eleito prior geral em 1267, permaneceu no cargo\naté a morte, ocorrida em 1285. Governou a Ordem com\nprudência, fortaleceu-a com uma sábia legislação,\nsoube defendê-la com determinação diante da ameaça\nda extinção e tornou-a célebre por sua santidade.\n Recebeu na Ordem muitos confrades, eles\ntambém homens de grande zelo na vida religiosa. Para\ntodos, São Filipe foi mestre e modelo de vida\nevangélica e de serviço a Virgem Maria. Com muita\nrazão, portanto, é tido como \"Pai\" da nossa Ordem.\n Morreu em 1285 em Todi (Perúsia), onde ainda\nhoje seu corpo venerado. Foi canonizado em 1671 pelo\npapa Clemente X.", "prayer": "Ó Deus, glória dos humildes, por meio de São\nFilipe, protegestes com amor a família dos Servos de\nSanta Maria, amplamente a propagastes e consolidastes\ncom santas leis. Concedei, benigno, que à imitação de\ntão grande Pai, sirvamos fielmente a Virgem Maria, e\npropaguemos com ardor apostólico o evangelho do\nvosso Filho, Jesus Cristo, que convosco vive e reina na\nunidade do Espírito Santo. Amém!", "title": "São Filipe Benício", "rank": "São", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor, que chamou São Filipe ao serviço da Virgem.\n\nOfício das Leituras\nHINO\nComo podemos, Filipe, narrar\nas maravilhas que fez Deus em ti,\ne dizer quanto a Virgem te amava\ne como tu a este amor respondias?\nJovem tu eras mas já tua vida\nestava marcada por graça divina:\ndiz-se que ainda no colo materno\njá proclamavas o nome dos Servos.\nNada era então para ti tão estranho\ncomo se a ti se dissessem um dia\nestas palavras: \"Vem perto, Filipe,\nvem até o coche, vem, junta-te a mim\".\nEra dos Sete Pais Santos o coche,\nque por Florença festivo rodava:\nera um sinal para todos que o viam\nque a primavera dos santos voltara.\nA Deus que sempre os humildes escolhe\ne aos pequeninos revela estas coisas,\ncomo Filipe doemos a vida\ne o canto, alegres, da Virgem cantemos.\n\nSALMODIA — Série A\nAnt. 1 Quem quiser ser o primeiro entre vós, seja vosso servo.\nAnt. 2 O discípulo não é maior que o mestre, nem o servo é maior que seu patrão.\nAnt. 3 Quem se exalta será humilhado e quem se humilha será exaltado.\n\nRESPONSÓRIO cf. Pr 11,2b; Tg 4,6; Eclo 35,17-18a\nR. Com os humildes está a sabedoria. * Deus resiste aos soberbos, mas dá sua graça aos humildes.\nV. A oração do humilde penetra as nuvens; não desanima até que o Altíssimo não intervenha.\nR. Deus resiste aos soberbos, mas dá sua graça aos humildes.\nHino Te Deum, p. 36.\n\nLaudes\nHINO\nA Igreja louve conosco,\nlouve a bondade do Cristo:\njá Sete estrelas nos dera,\ndá-nos um sol imprevisto.\nFilipe surge em Florença,\nde ilustre estirpe nascido;\nmas à família mais nobre\nvê-se por Deus impelido.\nNas Escrituras versado,\nsua ciência ele oculta;\nhavendo o mundo deixado,\nsó no Cristo é que ele exulta.\nO sol o encontra rezando,\ne o seu caminho percorre;\nmas a Filipe o que inflama\né aquele Sol que não morre.\nSeguir possamos o exemplo\nque tu, Filipe, nos deste:\nque nossas almas se voltem\npara o tesouro celeste.\nHonra e louvor ao Deus Trino,\ne que teu Filho, Maria,\nconduza teus servos todos\ndo céu à grande alegria. Amém!\n\nSALMODIA\nAnt. 1 Como estrela da manhã entre as nuvens, Filipe brilhou no seu tempo.\nAnt. 2 Como sol radiante, Filipe refulgiu na família dos Servos de Santa Maria.\nAnt. 3 Uma coroa de irmãos cercam Filipe: são plantas da Virgem gloriosa na vinha do Senhor.\n\nCântico evangélico (Benedictus)\nAnt. Filipe, servo fiel da Mãe de Deus, serviu ao Senhor e aos irmãos em santidade e justiça todos os dias de sua vida.\n\nORAÇÃO\nÓ Deus, glória dos humildes, por meio de São Filipe protegestes com amor a família dos Servos de Santa Maria, amplamente a propagastes e com santas leis a consolidastes. Concedei-nos que, à imitação de tão grande pai, sirvamos fielmente a Virgem Maria e propaguemos com zelo apostólico a palavra do vosso Filho, Jesus Cristo, que convosco vive e reina, na unidade do Espírito Santo.\n\nVésperas\nHINO\nA ti, Filipe, em teu dia,\nmãos e louvores alçamos:\nda nossa Ordem sagrada\no guia e o pai proclamamos.\nPuxam leão e cordeiro\num carro às nuvens mais altas;\npara o serviço da Virgem,\ndentro do carro tu saltas.\nTeu santo nome ilumina,\no teu exemplo conforta;\no teu viver nos ensina,\no teu valor nos exorta.\nAté os extremos da terra,\nvoam teu nome e presença;\nprostrada aos pés do seu filho,\nlogo o venera Florença.\nCantai, cantai, Tudertinos,\na quem vos deram por pai:\no corpo que ele vos deixa\nentre louvores guardai.\nOh, servi como Filipe,\nServos fiéis a Maria,\nque o serviço desta Serva\nos bens do céu anuncia!\nHonra e louvor ao Deus Trino,\ne que teu Filho, Maria,\nconduza teus servos todos\ndo céu à grande alegria. Amém!\n\nSALMODIA\nAnt. 1 Sede meus imitadores como eu sou de Cristo.\nAnt. 2 Ofereceu-se a nós como exemplo de amor, de fé e de pureza.\nAnt. 3 Deixou-nos um exemplo de caridade fraterna, para que sigamos seus passos.\n\nCântico evangélico (Magnificat)\nAnt. Hoje os coros dos anjos conduziram São Filipe aos céus. Hoje a Rainha do universo mostrou Jesus a seu servo fiel. Hoje o Rei e Senhor elevou seu servo à glória do reino."}, {"date": "25 de agosto (dies natalis)", "day": 25, "month": 8, "name": "SERVO DE DEUS FREI EGÍDIO MARIA MOSCINI", "bio": "* fevereiro de 1884 em Valentano, Itália † 25 de agosto de 1976 em Turvo, SC\n\nFrei Egídio Maria Moscini nasceu em fevereiro de\n1884, em Valentano, Itália. Aos 21 anos, em 1905,\ningressou na Ordem dos Servos de Maria, movido por\num profundo desejo de servir a Deus e à Virgem Maria.\nEm 1921, foi enviado ao Brasil como missionário, após\numa longa viagem de três meses. Ao chegar, serviu\ninicialmente na cidade do Rio de Janeiro, dedicando-se\nà vida comunitária e pastoral com grande zelo.\nEm 1947, foi transferido para Araranguá, em Santa\nCatarina, e em 1952, passou a residir no Seminário de\nTurvo. Frei Egídio viveu uma vida simples e dedicada\nao trabalho. Com frequência, era visto com uma enxada\nnas mãos, cuidando da terra e servindo à comunidade\nlocal. Sua vida de oração e serviço era reconhecida e\napreciada por todos, que viam nele um homem de\nprofunda fé e humildade.\n\nFrei Egídio faleceu em 25 de agosto de 1976, aos 92\nanos, deixando um legado de simplicidade, devoção e\nserviço. Mesmo após décadas de sua morte, sua\nmemória permanece viva, sendo lembrado como um\nfiel intercessor, que, em sua humildade e trabalho,\nrefletia a presença de Deus na vida das pessoas que o\ncercavam. Seu exemplo continua a inspirar aqueles que\nbuscam viver uma vida de fé e serviço ao próximo.", "prayer": "ORAÇÃO PELA BEATIFICAÇÃO E CANONIZAÇÃO\nPai de misericórdia, nós vos damos graças\nporque destes à vossa igreja no Brasil,\nespecialmente em Santa Catarina, o Servo de\nMaria e agora também de Deus, frei Egídio\nMaria Moscini. Com sua vida santa ele nos\nensinou: a persistência na oração, a humildade\nno serviço aos irmãos e a paciência nos\nsofrimentos concedei-nos, ó Pai, por intercessão\nde frei Egídio, a graça que imploramos (dizer a\ngraça). Pedimos e esperamos, ó Pai, que frei\nEgídio seja o quanto antes colocado no número\ndos vossos santos. Por Cristo Nosso Senhor.\nAmém!", "special": true, "title": "Servo de Deus Frei Egídio Maria Moscini", "rank": "Servo de Deus", "oficio": null}, {"date": "28 de agosto", "day": 28, "month": 8, "name": "SANTO AGOSTINHO", "title": "Santo Agostinho", "rank": "Festa · Bispo, Doutor e Legislador Monástico", "bio": "Agostinho nasceu em Tagaste, África, no ano de 354. Quando jovem, deixou-se levar por falsas ideologias e por uma vida moralmente desregrada, até que, em Milão, abraçou a fé católica e foi batizado por Santo Ambrósio. Voltando para a África, entregou-se à vida ascética. Sagrado bispo de Hipona, por 34 anos, até a morte, foi exemplo para a Igreja, em favor da qual empenhou toda a riqueza da sua doutrina e das suas palavras. Foi um dos iniciadores e legisladores da vida monástica no ocidente. Morreu em Hipona, no ano de 430. A Regra para os Servos de Deus, de Santo Agostinho, foi canonicamente entregue aos Sete Primeiros Pais da Ordem em 1245, por Ardingo, então bispo de Florença, e continua sendo, até hoje, a base da vida religiosa dos Servos de Maria.", "prayer": "Ó Deus, conduzistes Santo Agostinho das trevas do erro ao vértice da caridade e da sabedoria e o estabelecestes como admirável testemunha da verdade e sábio legislador da vida monástica: concedei que a vossa família, liberta de toda maldade, refulja sempre de luz eterna e se inflame de amor divino. Por nosso Senhor.", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor, fonte de sabedoria e princípio de amor.\n\nHINO\n\"Sempre te invoque e em ti tenha fé...\":\ncerto, notável foi tua ciência,\nmas de tua vida e do teu caminhar\naos cumes místicos, o que dizer?\nVens, Agostinho, de praias longínquas!\nPaixões ardentes teu corpo corroem,\nteu coração nunca está satisfeito,\namores vãos já te vão consumindo...\nEi-la por certo tua glória maior:\nteres consciência de que és pecador\ndentre os maiores, porém, mais sincero,\num pobre homem assim como nós.\nContudo a graça não foi vã em ti:\né sempre Deus que o fascínio desfaz;\ntodo pecado começas sorrindo,\nmas tu, amigo, chorando o acabas.\n\"O feliz culpa\" também nós cantamos:\naté o pecar para o bem contribui\ndaqueles que amam e choram e buscam.\nAo Senhor graças por tua existência!...\n\nSALMODIA — Série A\nAnt. 1 Vós amastes a verdade e quem age segundo a verdade alcança a luz.\nAnt. 2 Vossa lei é a verdade, e a verdade sois vós, Senhor.\nAnt. 3 Ó verdade eterna! Vós sois o meu Deus e por vós anseio dia e noite!\n\nRESPONSÓRIO\nR. Antes de tudo, irmãos caríssimos, amemos a Deus e amemos o próximo: * estes são os dois principais mandamentos.\nV. Eis as observâncias que vos apresentamos para uma perfeita vida monástica.\nR. Estes são os dois principais mandamentos.\nHino Te Deum, p. 36.\n\nLaudes\nHINO\nTeus fortes gritos ressoam nos céus,\ndentes cerrados, de ardor contraídos!\nMas, quão escuras as trevas da noite!\nQuantas as noites do erro e da dúvida?...\nÉ Ele assim que por dentro te mina,\ndesde o mais fundo do teu coração:\ntu não compreendes quem Ele será,\nnem saberás como hás de aplacá-lo.\n\"Ó Deus bondoso, eu nada seria,\nnada seria se em ti eu não fosse...\"\nTu o interrogas sem teres resposta,\nou a resposta já é outra pergunta.\n\"Mas o que sabem de Deus os humanos,\no que conhecem acerca do homem?\"\n\"Antes o crer e depois o saber,\nou, ao contrário, saber e então crer?\"\nGraças a Deus porque tu exististe:\ntudo concorre afinal para o bem,\naté o pecado e a própria maldade,\npara os que amam e buscam a Deus.\n\nSALMODIA\nAnt. 1 A vós, fonte de misericórdia, meu louvor: quanto mais miserável eu era, mais perto de mim permanecíeis.\nAnt. 2 A vós o louvor do meu coração: minha língua e todo meu ser proclamem: \"Senhor, quem como vós?\"\nAnt. 3 Que eu sempre me lembre de vós, ó meu Deus, e vos dê graças por vossa misericórdia.\n\nCântico evangélico (Benedictus)\nAnt. Senhor, vós chamais o homem para vos louvar, pois nos criastes para vós e nosso coração estará inquieto até não descansar em vós!\n\nORAÇÃO\nÓ Deus, conduzistes Santo Agostinho das trevas do erro ao vértice da caridade e da sabedoria e o estabelecestes como admirável testemunha da verdade e sábio legislador da vida monástica: concedei que a vossa família, liberta de toda maldade, refulja sempre de luz eterna e se inflame de amor divino. Por nosso Senhor.\n\nVésperas\nHINO\n\"Antes de tudo, irmãos meus, amai...\".\n\"Eis o que é o homem\", disseste, Agostinho.\nEsse é o antigo e novo preceito:\ntua santa Regra é assim que começa.\n\"Uma só alma e um só coração:\nassim vivei e que nunca se diga\n'isto é só meu', ao invés, se reparta\ncom cada irmão, segundo ele precise...\"\n\"A enfermidade de todos curai;\ne não se orgulhe o irmão que no claustro\ncoisas melhores vier a encontrar,\na paz, a graça e as boas amizades...\"\nBom Pai e Mestre, dizer não sabemos\no quanto gratos nós todos te somos:\ntua caridade, tuas santas palavras,\nteu grande dom, dom que nos santifica...\nAssim queremos que sejam os claustros,\ne assim também seja a vida da Igreja:\neste é o caminho e um outro não há,\n\"vós tereis vida se assim o fizerdes\".\nJunto com Bento, Francisco e Domingos,\ncom nossos Pais, Agostinho, pedimos:\nque à sua origem os povos retornem,\nantes que vejam seu fim para sempre.\n\nSALMODIA\nAnt. 1 O amor me eleva a vós; convosco quero ficar eternamente.\nAnt. 2 Vosso amor nos inflama e nos leva para o alto; subamos para a paz da Jerusalém celeste.\nAnt. 3 Em vosso amor descansamos: vós sois nosso repouso e nossa morada.\n\nCântico evangélico (Magnificat)\nAnt. Tarde eu vos amei, ó beleza tão antiga e sempre nova! Tarde eu vos amei! Vós me chamastes, gritastes e abristes os meus ouvidos."}, {"date": "31 de agosto", "day": 31, "month": 8, "name": "B. ANDRÉ DE SANSEPOLCRO", "bio": "Atraído pelas palavras e pelo exemplo de São\nFilipe, em 1278 André ingressou no convento dos\nServos de Maria de Sansepolcro (Toscana, Itália), onde\nrecebeu o hábito da Ordem.\n Amante da vida penitente e contemplativa, retirou-\nse num eremitério situado nos arredores da sua cidade\nnatal, atraindo para lá outros eremitas, que se puseram\nsob a sua orientação e se agregaram à Ordem.\n Morreu em 1315 e seu corpo foi levado pelos\neremitas para a igreja dos Servos de Maria da cidade.\nEm 1806, o papa Pio VII aprovou seu culto.", "prayer": "Ó Deus, por intermédio do bem-aventurado\nAndré, agregastes à Ordem dos Servos de Maria muitos\n\neremitas, unindo-os na mesma devoção à Virgem Mãe\ne no amor fraterno. Fazei que nós também, servindo\nfielmente a mesma Virgem Maria, possamos pensar e\nagir concordemente. Por Cristo nosso Senhor. Amém!", "title": "B. André de Sansepolcro", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas e salmos do dia da semana corrente.\n\nRESPONSÓRIO 1Cor 16,11; Cl 3,3\nR. Buscai o Senhor, revesti-vos de sua força, * buscai sempre a sua face.\nV. Morrestes ao pecado e a vossa vida está escondida com Cristo em Deus.\nR. Buscai sempre a sua face.\n\nORAÇÃO\nSenhor Deus, por intermédio do Bem-aventurado André, atraístes outros eremitas à Ordem dos Servos de Maria e os unistes na devoção à Virgem Maria e no amor fraterno. Concedei que nós também, servindo fielmente a Nossa Senhora, possamos pensar e agir concordemente. Por nosso Senhor."}, {"date": "1º de setembro", "day": 1, "month": 9, "name": "B. JOANA DE FLORENÇA", "bio": "Joana de Florença viveu no primeiro século da\nnossa Ordem. Desde jovem, desprezando os atrativos\ndeste mundo, recebeu o hábito da Ordem Terceira dos\nServos de Maria e consagrou-se totalmente a Nossa\nSenhora, tornando-se exemplo de vida casta e\npenitente.\n Algumas imagens muito antigas apresentam-na\nentre os santos mais ilustres da Ordem, às vezes ao lado\nde São Filipe, outras vezes com um lírio e um livro na\nmão. Seu culto foi aprovado pelo papa Leão XII em\n1828.", "prayer": "Ó Deus, concedestes à bem-aventurada virgem\nJoana a graça de guardar a inocência com uma vida\naustera e penitente. Concedei-nos, por sua intercessão,\nproduzir frutos de penitência e servir-vos de coração\npuro. Por Cristo nosso Senhor. Amém!", "title": "B. Joana de Florença", "rank": "Beato(a)", "oficio": "Do Comum das Virgens, ou do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas, salmos e cântico do dia da semana corrente.\n\nRESPONSÓRIO\nR. A virgem seja casta, * e a verdade permaneça intacta em seu coração.\nV. Consagre-se a Deus com jejuns, leituras, oração e obras.\nR. E a verdade permaneça intacta em seu coração.\n\nORAÇÃO\nÓ Deus, concedestes à Bem-aventurada virgem Joana guardar a inocência mediante uma vida austera. Dai-nos, por sua intercessão, produzir frutos de penitência e servir-vos de coração puro. Por nosso Senhor."}, {"date": "5 de setembro", "day": 5, "month": 9, "name": "B. MARIA MADALENA DA PAIXÃO", "bio": "Madalena Starace nasceu aos 5 de setembro de\n1845 em Castellammare di Stabia, Nápoles, Itália. Foi\nbatizada no mesmo dia com o nome de Constança e foi\nconsagrada pela mãe à Nossa Senhora das Dores.\n\nDesde a adolescência alimentou o desejo de ser\nreligiosa, mas não pode concretizá-lo por motivos de\nsaúde.\n Em 1865 ingressou na Ordem Terceira dos Servos\nde Maria, tomando o nome de Maria Madalena da\nPaixão. Dedicou-se com zelo à assistência de órfãos e\nde meninas abandonadas. Nesse serviço juntaram-se a\nela algumas jovens piedosas que formaram o primeiro\nnúcleo do Instituto das irmãs Compassionistas Servas\nde Maria, erigido canonicamente em 27 de maio de\n1871 pelo bispo diocesano de Castellammare, dom\nFrancisco Xavier Petagna. Em 1º de novembro de\n1893, o Instituto foi agregado à Ordem dos Servos de\nMaria. Maria Madalena morreu em 13 de dezembro de\n1921. Foi beatificada em 15 de abril de 2007 pelo papa\nBento XVI. Seu corpo é venerado no santuário do\nSagrado Coração de Jesus e de Nossa Senhora das\nDores, em Castellammare di Stabia.", "prayer": "Deus onipotente e misericordioso, vós quisestes\nque a bem-aventurada Maria Madalena se colocasse\nsempre ao lado da Mãe das Dores junto a Cruz e\nservisse a Cristo nos pobres, nos doentes e nos\nmarginalizados: fazei que, seguindo o seu exemplo,\ncompartilhemos as dores, esperanças e alegrias dos\nnossos irmãos para merecermos ser um dia recebidos\nno vosso Reino. Por Nosso Senhor...", "title": "B. Maria Madalena da Paixão", "rank": "Beato(a)", "oficio": null}, {"date": "6 de setembro", "day": 6, "month": 9, "name": "B. BOAVENTURA DE FORLI", "bio": "Boaventura nasceu em Forlì (Romanha, Itália),\npor volta de 1410. Entrando na Ordem dos Servos de\nMaria, dedicou-se com amor aos estudos e tornou-se\nmestre em teologia.\n Foi célebre orador e percorreu várias cidades,\npregando a palavra de Deus com coragem e sabedoria.\nFoi também prior provincial da Província da Romanha\ne vigário geral da Congregação da Observância, um\nmovimento de reforma da Ordem. Promoveu nas\ncomunidades a observância regular. Amava a\npenitência e a solidão.\nMorreu em 1491 em Údine, onde seu corpo é venerado\nno Santuário de Nossa Senhora das Graças, dos Servos\nde Maria. Pio X aprovou seu culto em 1911.", "prayer": "Ó Deus, iluminados pelo exemplo e pela\npregação evangélica do bem-aventurado Boaventura,\nhumildemente vos pedimos: dobrai a dureza da nossa\ncerviz pela conversão do coração e pela penitência. Por\nCristo nosso Senhor. Amém!", "title": "B. Boaventura de Forlì", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Antífonas e salmos do dia da semana corrente.\n\nRESPONSÓRIO Mc 1,14-15; Fl 1,27\nR. Jesus começou a proclamar o evangelho de Deus e dizia: \"O tempo está realizado e o reino de Deus está próximo. * Convertei-vos e crede no evangelho\".\nV. Comportai-vos de maneira digna do evangelho de Cristo.\nR. \"Convertei-vos e crede no evangelho\".\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. Empunhai a espada de Cristo, que é a Palavra de Deus.\n\nORAÇÃO\nSenhor, iluminados pelo exemplo de vida e pela pregação evangélica do Bem-aventurado Boaventura, humildemente vos pedimos: dobrai a dureza da nossa cerviz pela conversão do coração e pela penitência. Por nosso Senhor.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Minhas palavras são como o fogo, diz o Senhor, como o martelo que despedaça a pedra."}, {"date": "15 de setembro", "day": 15, "month": 9, "name": "NOSSA SENHORA DAS DORES", "title": "Nossa Senhora das Dores", "rank": "Solenidade · Padroeira principal da Ordem", "bio": "Padroeira principal da Ordem dos Servos de Maria. Ao pé da cruz, a Mãe de Jesus permaneceu unida ao Filho na hora do seu sacrifício, associada de modo singular à obra da redenção. Desde as origens, os Sete Santos Fundadores contemplaram e propagaram a devoção às dores de Maria; por isso a Ordem é chamada \"dos Servos de Santa Maria das Dores\". Esta solenidade celebra o mistério da Mãe corajosa que, na fé e na dor, permaneceu ao lado do Filho até a cruz, tornando-se por vontade de Jesus Mãe de toda a Igreja.", "prayer": "Ó Deus, quando vosso Filho foi crucificado, quisestes que a sua Mãe dolorosa estivesse junto com ele, ao pé da cruz. Fazei que a vossa Igreja, unida a ela na paixão de Cristo, participe também da glória da ressurreição. Ele que convosco vive e reina.", "oficio": "I Vésperas\nHINO\nLogo que astuta serpente\nferira Adão inocente,\nquando ao pecado o levou;\npara salvar-nos da falta,\npor uma paga mais alta,\nDeus um remédio encontrou.\nDo réu apague-se o agravo,\nmorra o Senhor pelo escravo,\ntorne-se o Filho Jesus;\ntombe o Cordeiro inocente,\nmorra um só, não toda a gente,\nabra os seus braços na cruz.\nPara de modo mais pleno\nsanar da morte o veneno,\nnovo Adão não fique só;\nem vez de Eva, Maria,\na quem a dor da agonia\ntraspassara o peito sem dó.\nCorredentora te tornas,\nó Mãe de Deus, que te adornas\ncom os punhais da paixão;\njunto a Jesus permaneces,\ne o Filho ao Pai ofereces\nna mais completa oblação.\nJesus de nós não se esquece:\npor nossa Mãe te oferece,\nquando te entrega a João;\ntornas-te assim Mãe da Igreja,\na doce Mãe benfazeja\nde todo o povo cristão.\nAo Pai e ao Filho igualmente\nsuba o louvor reverente,\ne ao que de ambos provém;\nassim da Santa Trindade\nlouvemos nós a unidade,\ntodo louvor lhe convém. Amém!\n\nSALMODIA\nAnt. 1 Ó admirável benevolência do vosso amor! Por meio do vosso Filho unigénito e de sua Mãe, transformastes a dor em instrumento de salvação.\nSalmo 112 — A Igreja, mãe feliz pela santidade dos filhos\nLouvai, louvai, ó servos do Senhor, * louvai, louvai o nome do Senhor! Bendito seja o nome do Senhor, * agora e por toda a eternidade!\nDo nascer do sol até o seu ocaso, * louvado seja o nome do Senhor! O Senhor está acima das nações, * sua glória vai além dos altos céus.\nQuem pode comparar-se ao nosso Deus, † ao Senhor, que no alto céu tem o seu trono * e se inclina para olhar o céu e a terra?\nLevanta da poeira o indigente * e retira o pobrezinho do monturo, para fazê-lo assentar-se com os nobres, * assentar-se com os nobres do seu povo.\nFaz a estéril mãe feliz em sua casa, * vivendo rodeada de seus filhos.\nAnt. 1 Ó admirável benevolência do vosso amor! Por meio do vosso Filho unigénito e de sua Mãe transformastes a dor em instrumento de salvação.\nOração sálmica: Senhor, todos os povos bendizem o vosso nome, porque exaltastes os humildes e dispersastes os orgulhosos: glorificastes a Virgem, vossa serva, que na terra partilhou a pobreza e o sofrimento humano e a entregastes à Igreja como Mãe fecunda de muitos filhos. Por Cristo Senhor nosso.\n\nAnt. 2 Ó Santa Mãe, permanecestes sempre unida ao Salvador, desde seu nascimento até a humilhação da cruz.\nSalmo 147 — Hino à cidade santa renovada\nGlorifica o Senhor, Jerusalém! * Ó Sião, canta louvores ao teu Deus! Pois reforçou com segurança as tuas portas, * e os teus filhos em teu seio abençoou;\na paz em teus limites garantiu, * e te dá como alimento a flor do trigo.\nEle envia suas ordens para a terra, * e a palavra que ele diz corre veloz. Ele faz cair a neve como lã * e espalha a geada como cinza.\nComo de pão lança as migalhas do granizo, * a seu frio ficam as águas congeladas. Ele envia sua palavra e as derrete, * sopra o vento e de novo as águas correm.\nAnuncia a Jacó sua palavra, * seus preceitos, suas leis a Israel. Nenhum povo mereceu tanto carinho, * a nenhum outro revelou os seus preceitos.\nAnt. 2 Ó Santa Mãe, permanecestes sempre unida ao Salvador, desde seu nascimento até a humilhação da cruz.\nOração sálmica: Nós vos bendizemos, Senhor, porque vossa Palavra se propaga veloz para anunciar a todos os povos a salvação. Vosso Filho, nascido da Virgem Maria e crucificado por nós, ressuscitou verdadeiramente da morte e, sentado à vossa direita, derrama sobre a Igreja o dom do Espírito Santo. Por Cristo Senhor nosso.\n\nAnt. 3 Alegrai-vos, ó Mãe aflita! Depois de muito sofrer, estais sentada ao lado do vosso Filho, coroada de glória, qual Rainha do universo!\nCântico (Fl 2,6-11) — Cristo, servo de Deus\nEmbora fosse de divina condição, † Cristo Jesus não se apegou ciosamente * a ser igual em natureza a Deus Pai.\nPorém esvaziou-se de sua glória † e assumiu a condição de um escravo, * fazendo-se aos homens semelhante.\nReconhecido exteriormente como homem, † humilhou-se, obedecendo até a morte, * até a morte humilhante numa cruz.\nPor isso Deus o exaltou sobremaneira † e deu-lhe o nome mais excelso, mais sublime, * e elevado muito acima de outro nome.\nPara que ao nome de Jesus, nosso Senhor, † se dobre reverente todo joelho, * seja nos céus, seja na terra ou nos abismos.\nE toda língua reconheça, confessando, † para a glória de Deus Pai e seu louvor: * \"Na verdade, Jesus Cristo é o Senhor!\"\nAnt. 3 Alegrai-vos, ó Mãe aflita! Depois de muito sofrer, estais sentada ao lado do vosso Filho, coroada de glória, qual Rainha do universo!\nOração sobre o cântico: Ó Pai, toda língua proclame que vosso Filho, humilhando-se por nós, mereceu sentar-se à vossa direita. Ele operou maravilhosamente nossa salvação, curando com amor nossas feridas; qual novo Adão, uniu a si a nova Eva para que o homem, condenado pela desobediência da mulher, fosse resgatado pela obediência da Virgem Maria. Ele que convosco vive e reina.\n\nRESPONSÓRIO BREVE\nR. Senhor, eu sou o vosso servo, * sou vosso servo e filho de vossa serva.\nV. Quebrastes as minhas algemas: oferecer-vos-ei um sacrifício de louvor.\nR. Sou o vosso servo e filho de vossa serva.\n\nCântico evangélico (Magnificat)\nAnt. Alegrai-vos, ó mulher, que tanto nos amastes! Para abrir-nos a fonte da eterna alegria, não hesitastes aceitar a dor, respondendo com fé ao anjo: \"Faça-se em mim segundo a vossa palavra\".\n\nORAÇÃO\nÓ Deus, quando vosso Filho foi crucificado, quisestes que a sua Mãe dolorosa estivesse junto com ele, ao pé da cruz. Fazei que a vossa Igreja, unida a ela na paixão de Cristo, participe também da glória da ressurreição. Ele que convosco vive e reina.\nOu: Ó Deus, quisestes que a Mãe participasse da paixão do vosso Filho, para redimir a humanidade seduzida pelo demónio. Concedei que o vosso povo, livre dos laços do pecado, se revista da vida nova, reconquistada pela obra da salvação. Por nosso Senhor.\n\nInvitatório\nAnt. Vinde, adoremos o Salvador do mundo: na sua paixão, uniu a si a Virgem Mãe.\n\nOfício das Leituras\nHINO\nA mãe estava de pé junto à cruz,\num pouco à parte e envolta em silêncio,\nqual uma sombra de negro vestida:\ntudo era imóvel e o vento parado.\nPerdida, ao longe fixava sua vista:\nó Mãe, que vias do alto do Monte?\nVias talvez uma selva de cruzes\nou tu também nada mais percebias?\nTu és, ó Mãe, toda a mãe que hoje ama,\ntu és, ó Mãe, toda a mãe que hoje chora\nseu filho morto, seu filho traído:\nmães aos milhares, mães amortalhadas!\nFilhos que sempre se estão a matar,\nfilhos vendidos, traídos sem número,\nfilhos feridos e em cruzes pregados,\nímpia bandeira de um ímpio poder.\nJá densas trevas cobriam a cidade,\ninda mais pálido fez-se seu rosto;\ntodo seu corpo coberto de sangue\nrubro de sangue também era o céu,\nqual lençol negro de sangue estirado,\npara envolver sua Ausência infinita,\nque inda mais triste o silêncio a tornava\ne se adensava e fluía nos ares.\nNada pedimos, ó Mãe, para nós:\ncrermos apenas, por quanto possível,\ne junto à cruz ao teu lado ficarmos:\nesta é a resposta ao mistério do mundo.\n\nSALMODIA\nAnt. 1 Ele será motivo de queda e de soerguimento para muitos em Israel. E a ti, Maria, uma espada de dor traspassará tua alma.\nSalmo 15 — O Senhor é a porção da minha herança\nGuardai-me, ó Deus, porque em vós me refugio! † Digo ao Senhor: \"Somente vós sois meu Senhor: * nenhum bem eu posso achar fora de vós!\"\nDeus me inspirou uma admirável afeição * pelos santos que habitam sua terra.\nMultiplicam, no entanto, suas dores, * os que correm para os deuses estrangeiros; seus sacrifícios sanguinários não partilho, * nem seus nomes passarão pelos meus lábios.\nÓ Senhor, sois minha herança e minha taça, * meu destino está seguro em vossas mãos! Foi demarcada para mim a melhor terra * e eu exulto de alegria em minha herança!\nEu bendigo o Senhor, que me aconselha, * e até de noite me adverte o coração. Tenho sempre o Senhor ante meus olhos, * pois se o tenho a meu lado não vacilo.\nEis porque meu coração está em festa, † minha alma rejubila de alegria, * e até meu corpo no repouso está seguro;\npois não haveis de me deixar entregue à morte, * nem vosso amigo conhecer a corrupção.\nVós me ensinais vosso caminho para a vida; † junto de vós, felicidade sem limites, * delícia eterna e alegria ao vosso lado!\nAnt. 1 Ele será motivo de queda e de soerguimento para muitos em Israel. E a ti, Maria, uma espada de dor traspassará tua alma.\nOração sálmica: Guardai-nos, Senhor, pois em vós depositamos nossa esperança. Renovai em nós o mistério que veneramos na santa Virgem Maria, para que, unidos à paixão de Cristo, possamos alegrar-nos com a sua ressurreição. Por Cristo nosso Senhor.\n\nAnt. 2 Filho, por que agiste assim conosco? Olha que teu pai e eu, aflitos, te procurávamos.\nSalmo 30 (I) — Súplica confiante na angústia\nSenhor, eu ponho em vós minha esperança; * que eu não fique envergonhado eternamente!\nPorque sois justo, defendei-me e libertai-me, † inclinai o vosso ouvido para mim; * apressai-vos, ó Senhor, em socorrer-me!\nSede uma rocha protetora para mim, * um abrigo bem seguro que me salve. Sim, vós sois a minha rocha e fortaleza; * por vossa honra orientai-me e conduzi-me!\nRetirai-me desta rede traiçoeira, * porque sois o meu refúgio e protetor. Em vossas mãos, Senhor, entrego o meu espírito, * porque vós me salvareis, ó Deus fiel.\nDetestais os que adoram deuses falsos; * quanto a mim, é ao Senhor que me confio.\nVosso amor me faz saltar de alegria, † pois olhastes para as minhas aflições * e conhecestes as angústias de minh'alma.\nNão me entregastes entre as mãos do inimigo, * mas colocastes os meus pés em lugar amplo!\nAnt. 2 Filho, por que agiste assim conosco? Olha que teu pai e eu, aflitos, te procurávamos.\nOração sálmica: Senhor, vossa Igreja exulte e se alegre por vossa misericórdia, pois olhastes para a humildade da vossa Serva e a escolhestes como Mãe do vosso Unigénito. Vós lhe destes força na dor ao pé da cruz e a alegrastes na ressurreição do Filho. Ele que convosco vive e reina.\n\nAnt. 3 Quando chegaram ao lugar chamado Calvário, crucificaram Jesus. Perto da cruz estava sua Mãe.\nSalmo 30 (II)\nComo é grande, ó Senhor, vossa bondade, * que reservastes para aqueles que vos temem! Para aqueles que em vós se refugiam, * mostrando, assim, o vosso amor perante os homens.\nNa proteção de vossa face os defendeis, * bem longe das intrigas dos mortais. No interior de vossa tenda os escondeis, * protegendo-os contra as línguas maldizentes.\nSeja bendito o Senhor Deus, que me mostrou * seu grande amor numa cidade protegida! Eu que dizia quando estava perturbado: * \"Fui expulso da presença do Senhor!\"\nVejo agora que ouvistes a minha súplica, * quando a vós eu elevei o meu clamor.\nAmai o Senhor Deus, seus santos todos, † ele guarda com carinho os seus fiéis, * mas pune os orgulhosos com rigor.\nFortalecei os corações, tende coragem, * todos vós que ao Senhor vos confiais!\nAnt. 3 Quando chegaram ao lugar chamado Calvário, crucificaram Jesus. Perto da cruz estava sua Mãe.\nOração sálmica: Senhor, pelo exemplo da Virgem Maria, aprendemos a depositar em vós nossa alegria e nossa esperança. Vós sois bondoso com quem vos ama, dais força a quem em vós acredita e salvais os que em vós esperam. Por Cristo nosso Senhor.\n\nRESPONSÓRIO\nR. A santa Virgem Maria, unida a Cristo Redentor e obediente à vontade do Pai, * tornou-se causa de salvação para si e para todos os homens.\nV. O que Eva atou com sua incredulidade, Maria desatou com sua fé.\nR. Tornou-se causa de salvação para si e para todos os homens.\nHino Te Deum, p. 36.\n\nLaudes\nHINO\nJesus, Redentor de todos,\ndo mundo o crime lavaste,\nsuspenso no alto do monte,\nem que na cruz te ofertaste.\nInfunde em nós tua graça,\nem nosso pranto gememos:\nnossas culpas confessamos,\ntua justiça tememos.\nVenha ajudar-nos a Virgem,\nde coração traspassada,\nque no Calvário nos deste,\nque ali estava a teu lado.\nMaria, quantos flagelos\nem teu Filho não sentiste!\nA sua vida nos deste,\nà sua morte te uniste.\nComova todas as almas\nteu sofrimento materno;\ndo amor ardendo nas chamas,\nsejamos livres do inferno.\nA ti, Jesus, que sofreste,\npelos teus servos, louvamos,\ne ao Pai e ao Espírito Santo,\na mesma glória nós damos. Amém!\n\nSALMODIA\nAnt. 1 O Senhor reina do alto da cruz, Aleluia! A Virgem, sofrendo a seu lado, esmaga a antiga serpente.\nAnt. 2 Contigo, ó Maria, bendizemos o Senhor, que na cruz te entregou como nossa Mãe.\nAnt. 3 Louvemos ao Senhor: ressurgindo, levou para a glória a Mãe, que lhe fora companheira na dor.\n\nCântico evangélico (Benedictus)\nAnt. Bendita és tu, Rainha dos mártires! Recebeste Cristo em teu braços e, associada à sua Paixão, te tornaste, em espírito, Mãe de todos os cristãos!\n\nORAÇÃO (como acima)\n\nII Vésperas\nHINO\n\"Tudo acabado!\", ele grita na ardência\ndo corpo em chamas de dor e martírio:\ndepois lhe cai como pedra a cabeça,\nentrega ao Pai seu espírito santo.\nPouco mais tarde da cruz o tiraram\ne o depuseram, ó Mãe, em teu colo:\nnão parecias gerá-lo de novo e,\nqual criança de peito, aleitá-lo?\nEra o regaço de todas as mães:\nvendo-te assim, quem não há de chorar?\nEra uma cena jamais antes vista:\nés \"a Piedade\" que ampara os que sofrem!\nPara o sepulcro o carregam amigos,\nnão mais que sete, segundo João:\neste é o enterro mais pobre do mundo,\nouve-se apenas a pedra rolar...\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\n\nSALMODIA\nAnt. 1 A Mãe disse a Jesus: \"Eles não têm mais vinho!\"; e o Filho respondeu: \"Minha hora ainda não chegou!\"\nSalmo 110 — Grandes são as obras do Senhor\nEu agradeço a Deus de todo o coração * junto com todos os seus justos reunidos! Que grandiosas são as obras do Senhor, * elas merecem todo amor e admiração!\nQue beleza e esplendor são os seus feitos; * sua justiça permanece eternamente! O Senhor bom e clemente nos deixou * a lembrança de suas grandes maravilhas.\nEle dá o alimento aos que o temem, * e jamais esquecerá sua Aliança. Ao seu povo manifesta seu poder, * dando a ele a herança das nações.\nSuas obras são verdade e são justiça, * seus preceitos, todos eles, são estáveis, confirmados para sempre e pelos séculos, * realizados na verdade e retidão.\nEnviou libertação para o seu povo, † confirmou sua Aliança para sempre. * Seu nome é santo e é digno de respeito.\nTemer a Deus é o princípio do saber, † e é sábio todo aquele que o pratica. * Permaneça eternamente o seu louvor.\nAnt. 1 A Mãe disse a Jesus: \"Eles não têm mais vinho!\"; e o Filho respondeu: \"Minha hora ainda não chegou!\"\nOração sálmica: Grandes e admiráveis são as vossas obras, ó Senhor! Compadecido de nós, nos enviastes como Salvador vosso Filho, nascido da Virgem Maria. Tanto amastes a humanidade que deixastes vosso Filho ser crucificado para nossa salvação, associando às suas dores também as da Mãe. E tanto amastes o vosso povo e a igreja nascente que derramastes sobre ela o vosso Santo Espírito. Por Cristo nosso Senhor.\n\nAnt. 2 Chegada a hora, Jesus disse à sua Mãe: \"Mulher, eis aí o teu Filho!\"; e ao discípulo: \"Eis aí a tua Mãe!\"\nSalmo 137 — Ação de graças pelos benefícios recebidos\nÓ Senhor, de coração eu vos dou graças, * porque ouvistes as palavras dos meus lábios! Perante os vossos anjos vou cantar-vos * e ante o vosso templo vou prostrar-me.\nEu agradeço vosso amor, vossa verdade, * porque fizestes muito mais que prometestes; naquele dia em que gritei, vós me escutastes * e aumentastes o vigor da minha alma.\nOs reis de toda a terra hão de louvar-vos, * quando ouvirem, ó Senhor, vossa promessa. Hão de cantar vossos caminhos e dirão: * \"Como a glória do Senhor é grandiosa!\"\nAltíssimo é o Senhor, mas olha os pobres, * e de longe reconhece os orgulhosos.\nSe no meio da desgraça eu caminhar, * vós me fazeis tornar à vida novamente; quando os meus perseguidores me atacarem * e com ira investirem contra mim,\nestendereis o vosso braço em meu auxílio * e havereis de me salvar com vossa destra.\nCompletai em mim a obra começada; * ó Senhor, vossa bondade é para sempre! Eu vos peço: não deixeis inacabada * esta obra que fizeram vossas mãos!\nAnt. 2 Chegada a hora, Jesus disse à sua Mãe: \"Mulher, eis aí o teu Filho!\"; e ao discípulo: \"Eis aí a tua Mãe!\"\nOração sálmica: Todos os povos da terra haverão de crer em vós, Senhor, que voltais vosso olhar para os humildes e libertais os oprimidos. Entre todas as mulheres, exaltastes a Virgem Maria: por sua obediência filial e por sua coragem diante da dor, encontrou graça diante de vós. Por Cristo nosso Senhor.\n\nAnt. 3 Um sinal grandioso apareceu no céu: uma mulher vestida de sol; prestes a dar à luz, ela gritava em dores de parto.\nCântico (1Pd 2,21-24) — A paixão voluntária de Cristo, servo de Deus\nÓ Cristo por nós padeceu, † deixou-nos o exemplo a seguir. * Sigamos, portanto, seus passos! Pecado nenhum cometeu, * nem houve engano em seus lábios.\nInsultado, ele não insultava; † ao sofrer e ao ser maltratado, * ele não ameaçava vingança; entregava, porém, sua causa * àquele que é justo juiz.\nCarregou sobre si nossas culpas * em seu corpo, no lenho da cruz,\npara que, mortos aos nossos pecados, † na justiça de Deus nós vivamos. * Por suas chagas nós fomos curados.\nAnt. 3 Um sinal grandioso apareceu no céu: uma mulher vestida de sol; prestes a dar à luz, ela gritava em dores de parto.\nOração sobre o cântico: Senhor, pregado na cruz, vosso Filho nos deu um eminente exemplo de paciência: Cordeiro inocente, carregou sobre si nossos pecados; Mestre da verdade, suportou injustas calúnias; Juiz do mundo, padeceu um julgamento cruel. Nós vos suplicamos que, seguindo seus passos, enfrentemos com coragem as dificuldades, vencendo o mal com o bem. Por Cristo nosso Senhor.\n\nRESPONSÓRIO BREVE\nR. Gritarei de alegria e meu espírito exultará em Deus, * porque me vestiu com o manto da salvação como uma esposa ornada de jóias.\nV. A tua terra, Sião, não será mais chamada \"Desolada\", mas \"Desposada\".\nR. Porque me vestiu com o manto da salvação como uma esposa ornada de jóias.\n\nCântico evangélico (Magnificat)\nAnt. Nós te louvamos, ó Virgem dolorosa! Tu, glória de toda a criação, filha do homem, Mãe do Senhor Jesus: contigo ele reconciliou a terra com o céu e deu ao mundo a paz."}, {"date": "17 de setembro", "day": 17, "month": 9, "name": "B. CECÍLIA EUSEPI", "bio": "Nasceu aos 17 de\n fevereiro de 1910 em Monte\n Romano, província de\n Viterbo, na região italiana do\n Lácio. Com poucos meses de\n idade, ficou órfã do pai e,\n junto com a mãe, foi acolhida\n na casa do tio materno, em\n Nepi, que a confiou às\n monjas cistercienses, em cujo\n mosteiro fez o curso primário\n e foi iniciada na vida cristã.\n Foi ali que conheceu os\n frades Servos de Maria que\n eram confessores das monjas.\n Em 17 de setembro de 1922 fez a promessa na\nOrdem Secular dos Servos de Maria e, em 1923, foi\nadmitida como postulante na Congregação das Servas\nde Maria de Pistoia, mas depois de três anos, por\nmotivos de saúde, voltou para a casa do tio em Nepi.\nAcometida de grande enfermidade, suportou muitos\nsofrimentos, crescendo no amor a Deus e à Virgem das\nDores. Morreu em 1º de outubro de 1928 e seu culto foi\naprovado pelo papa São João Paulo II em 2012.", "prayer": "Pai Santo, que revelastes os mistérios do vosso\nFilho à Bem-aventurada Cecília, vossa humilde serva,\ne lhe concedestes a graça de vivê-los fielmente, dai-\nnos, por sua intercessão, a sabedoria do coração para\ncrescermos cada dia no amor a Cristo e segui-lo, a\nexemplo da Virgem Maria, até a cruz. Ele que\nconvosco vive reina na unidade do Espírito Santo.\nAmém", "title": "B. Cecília Eusepi", "rank": "Beato(a)", "oficio": null}, {"date": "22 de setembro", "day": 22, "month": 9, "name": "DEDICAÇÃO DA BASÍLICA DE MONTE SENÁRIO", "title": "Dedicação da Basílica de Monte Senário", "rank": "Memória facultativa", "bio": "Monte Senário, nas colinas ao norte de Florença, foi o lugar para onde os Sete Santos Fundadores se retiraram por volta de 1245, dando início à vida eremítica que originou a Ordem dos Servos de Maria. Ali construíram uma pequena casa e um oratório dedicado a Santa Maria. A igrejinha, reconstruída e ampliada ao longo dos séculos, foi consagrada a Nossa Senhora das Dores e a São Filipe em 1717, e elevada a Basílica Menor por Bento XV em 1918. Monte Senário permanece, para os Servos de Maria, o berço espiritual e o lugar sagrado das origens da Ordem, onde repousam os corpos dos Sete Primeiros Pais.", "prayer": "Ó Deus, no alto do Monte Senário quisestes que nossos Sete Primeiros Pais vos construíssem uma igreja, dedicada a Santa Maria. Aos que sobem a este monte para rezar, movidos pelo amor à Virgem, concedei que cresçam no conhecimento do vosso Filho e propaguem em toda parte o seu reino. Por nosso Senhor.", "oficio": "Do Comum da Dedicação de uma Igreja. Antífonas e Salmos do dia da semana corrente.\n\nRESPONSÓRIO\nR. Subindo ao monte, os Sete Primeiros Pais diziam com alegria e temor de Deus: \"Vinde, subamos ao lugar que Deus nos preparou\". * Subamos ao monte do Senhor, ao lugar da nossa penitência.\nV. Vinde, vinde, afastemo-nos do mundo para cumprir a vontade do Senhor.\nR. Subamos ao monte do Senhor, ao lugar da nossa penitência.\n\nLaudes\nHINO\nMonte Senário se torna seu templo,\nlá cada um se recolhe em sua gruta:\ncomo Jacó, também vós, nossos Pais,\nno monte vedes a \"porta do céu\".\nVossa oração do alto monte soprava\nsobre Florença qual vento divino:\na vós bastava uma tenda segura\nque realizasse o convívio fraterno.\nA inteira herança que vós nos deixastes\né só a lembrança dos três tabernáculos:\nvós não pensastes na igreja de pedras,\npois foi a Mãe vossa Igreja primeira.\n\"O próprio Deus levantou esta casa,\nsete colunas com arte entalhou\",\nassim construindo uma nova cidade,\nque do alto monte luzisse p'ra sempre.\nPor vossa súplica, ó Mãe, se prolongue\ntal Pentecostes ao longo dos tempos:\nfazei que nós igualmente sejamos\ntemplos viventes de Deus e dos homens.\n\nCântico evangélico (Benedictus)\nAnt. Brilhe a vossa luz como templo vivo de Deus colocado sobre o monte.\n\nORAÇÃO\nÓ Deus, no alto do Monte Senário quisestes que nossos Sete Primeiros Pais vos construíssem uma igreja, dedicada a Santa Maria. Aos que sobem a este monte para rezar, movidos pelo amor à Virgem, concedei que cresçam no conhecimento do vosso Filho e propaguem em toda parte o seu reino. Por nosso Senhor.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Senhor, fonte da vida, em vossa morada, nossos olhos haverão de contemplar a Beleza, nossos corações abrir-se-ão à Sabedoria e nossas mentes ansiarão pela posse do Sumo Bem."}, {"date": "3 de outubro", "day": 3, "month": 10, "name": "B. MARIA GUADALUPE RICART OLMOS", "bio": "Maria Guadalupe\n Ricart Olmos nasceu em\n Albal (Valência,\n Espanha) aos 23 de\n fevereiro de 1881, filha\n de Francisco Ricart e de\n Maria Olmos, modestos\n agricultores. No batismo\n recebeu o nome de Maria\n Francisca. Aos 4 anos,\n ficou órfã de pai.\n\n Desejosa de consagrar-se ao Senhor, aos 11 de\njunho de 1896, ingressou no mosteiro “Pie de la Cruz”\nde Valência, das monjas Servas de Maria, onde emitiu\nos votos perpétuos em 19 de junho de 1900.\n Ocupou no mosteiro vários cargos: desde roupeira\naté mestra de noviças e priora. Distinguiu-se por uma\nvida simples, fiel aos compromissos, solícita com as\ncoirmãs, principalmente com as mais jovens, e\nciosamente apegada à espiritualidade da Ordem.\n Em 1936, em plena guerra civil espanhola, um\ngrupo de milicianos invadiu o mosteiro. Ela e suas\ncoirmãs foram obrigadas a refugiar-se em casa de\nparentes.\n Na noite de 2 de outubro de 1936, quatro\nmilicianos armados invadiram a casa onde ela se\nencontrava e lhe perguntaram se era religiosa. “Sim -\nrespondeu ela - sou monja e, se tivesse que nascer mil\nvezes, voltaria a sê-lo no mosteiro de «Pie de la Cruz»”.\nFoi então presa pelos milicianos e arrastada para um\nlugar deserto, onde a trucidaram sem piedade. Seu\ncorpo, totalmente desfigurado pelos algozes, foi\nsepultado numa fossa comum do cemitério de Silla, em\nValência. Em fevereiro de 1940, foi trasladado para o\ncemitério de “Pie de la Cruz”. Finalmente, em 1959,\ncom a transferência do mosteiro de Valência para\nMislata, seus restos mortais foram solenemente\nsepultados ao lado do altar-mor da igreja deste\nmosteiro.\n O processo de beatificação e canonização foi\niniciado em 20 de junho de 1959 e seu martírio foi\n\noficialmente reconhecido pela Sé Apostólica em 1999.\nDia 11 de março de 2000 foi beatificada pelo papa João\nPaulo II.", "prayer": "Ó Pai, em cujas mãos está nossa vida, por um\ninsondável desígnio do vosso amor, a bem-aventurada\nMaria Guadalupe, discípula fiel e monja Serva de Santa\nMaria, associou-se à paixão de Cristo. Dai-nos\ncompreender o mistério do Filho do Homem e\npercorrer o caminho estreito que conduz à vida. Por\nCristo nosso Senhor. Amém!", "title": "B. Maria Guadalupe Ricart Olmos", "rank": "Beato(a)", "oficio": null}, {"date": "25 de outubro", "day": 25, "month": 10, "name": "B. JOÃO ÂNGELO DE MILÃO", "bio": "João Ângelo nasceu em Milão em 1451.\nIngressou jovem no convento milanês de Santa Maria\ne depois mudou-se para o convento da Santíssima\nAnunciada, em Florença, onde foi ordenado presbítero.\n Atraído pelo ideal de vida penitente e\ncontemplativa, viveu quase vinte anos no eremitério de\nMonte Senário. Voltou em seguida para Milão, onde\ndedicou-se inteiramente na educação cristã das\ncrianças.\n Morreu aos 23 de outubro de 1505. Seu corpo é\nvenerado na basílica de São Carlos, em Milão. Foi\nbeatificado por Clemente XII em 1737.", "prayer": "Senhor, interceda por nós o bem-aventurado\nJoão Ângelo, que se tornou admirável na prática da\nvida monástica e no ensino da vossa doutrina, a fim de\nque, sempre mais unidos a vós, sejamos perseverantes\nna vida evangélica e dedicados no serviço apostólico.\nPor Cristo nosso Senhor. Amém!", "title": "B. João Ângelo de Milão", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO 1Cor 16,11; 1Rs 19,11; Lm 3,26\nR. Procurai a Deus e a sua força; buscai sem cessar a sua face. * Saí e colocai-vos no alto da montanha, diante do Senhor.\nV. É bom esperar no silêncio a salvação do Senhor.\nR. Saí e colocai-vos no alto da montanha diante do Senhor.\n\nORAÇÃO\nSenhor, interceda por nós o Bem-aventurado João Ângelo, que se tornou admirável na prática de uma autêntica vida monástica e no ensinamento da vossa doutrina, a fim de que, sempre mais unidos a vós, sejamos perseverantes na vida evangélica e no fervor apostólico. Por nosso Senhor.\n\nLaudes\nCântico evangélico (Benedictus)\nAnt. Eu o conduzirei ao meu monte santo e o farei feliz em minha casa de oração.\n\nVésperas\nCântico evangélico (Magnificat)\nAnt. Deixai que as crianças venham a mim, pois a quem se fizer como elas pertence o reino de Deus."}, {"date": "16 de novembro", "day": 16, "month": 11, "name": "TODOS OS SANTOS E SANTAS DA ORDEM", "bio": "[Como a Igreja universal celebra todos os Santos,\ntambém a Família Servita recorda anualmente todos os\nsantos frades, monjas, freiras, irmãos e irmãs da Ordem\nSecular que, em seu tempo, tornaram agradável ao\n\nSenhor e a Virgem Maria a nossa Ordem e que são um\nestímulo de serviço perene].", "prayer": "Ó Deus todo-poderoso, o espírito de amoroso\nserviço que abundantemente derramastes nos santos e\nsantas da Ordem de Nossa Senhora, conservai-o\nsempre vivo em nós, seus filhos e irmãos. Por Cristo\nnosso Senhor. Amém!", "title": "Todos os Santos e Santas da Ordem", "rank": "Solenidade", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor: sua glória resplandece nos Servos de Santa Maria.\n\nOfício das Leituras\nHINO (As Bem-aventuranças)\nDo alto do monte ressoa, Senhor,\na ladainha de todos os santos,\ncoroa e gáudio da vossa paixão.\nJamais como hoje brilhou tanto a terra:\no vosso reino parece chegado\ne doce paz vossa Igreja pervade.\nFelizes vós, pobres: sois os primeiros,\npois sobre as coisas o amor colocastes:\npríncipes sois de linhagem divina.\nFelizes vós que por ora chorais:\npois todo aquele que em pranto semeia,\ncantando alegre haverá de ceifar.\nFelizes vós, desarmados e mansos:\nvós sois a força divina invencível;\na vós será dada a posse da terra.\nFelizes vós, que a justiça buscais\ncomo quem tem fome e sede sagradas:\nda terra a face havereis de mudar.\nFelizes vós, que ao irmão perdoais\nda mesma forma que Deus vos perdoa:\nmisericórdia no céu achareis.\nFelizes vós, que sois puros por dentro,\ncomo em espelho, em vós Deus refletis:\nem toda parte vereis o Senhor.\nFelizes vós, os arautos da paz!\nO vosso rosto, pés, mãos, tudo brilha:\npois de Deus filhos vós sois verdadeiros.\nFelizes vós que violência sofreis\ne dais resposta com gestos de paz:\né assim que se ama e que vence a justiça.\nGlória a vós, Cristo, Cordeiro de Deus,\nem vossa Igreja, através dos eleitos,\nnos dais a graça de sempre esperar.\n\nSALMODIA\nAnt. 1 Felizes os pobres de coração, porque deles é o reino do céu. Felizes os que têm fome e sede de justiça, porque serão saciados. Felizes os mansos, porque serão chamados filhos de Deus.\nAnt. 2 Felizes os que choram, porque serão consolados. Felizes os misericordiosos, porque alcançarão misericórdia. Felizes os que sofrem perseguição por causa da justiça, porque deles é o reino dos céus.\nAnt. 3 Felizes os mansos, porque possuirão a terra. Felizes os puros de coração, porque verão a Deus. Felizes sereis vós quando vos perseguirem por causa de mim: grande será vossa recompensa nos céus.\n\nV. Amai o Senhor, vós que nele acreditais,\nR. e resplendente será vossa esperança.\n\nRESPONSÓRIO\nR. Louvemos os homens ilustres que se consagraram ao serviço da bem-aventurada Virgem Maria; * com seus exemplos, nos mostraram o caminho da vida.\nV. Por suas obras, foram agradáveis a Deus e à Virgem Mãe.\nR. Com seus exemplos, nos mostraram o caminho da vida.\nHino Te Deum, p. 36.\n\nLaudes\nHINO\nNossos louvores subindo,\naqui na terra recordem\nque hoje o dia é chegado\ndos Santos da nossa Ordem.\nOutrora em prantos na terra\niam lançando a semente,\nno céu alegres agora\nrecolhem messe esplendente.\nNossos pecados chorando,\neste pedido fazemos:\num dia unidos a eles,\na glória eterna gozemos.\nHonra e louvor ao Deus trino,\ncomo no céu aqui na terra demos:\nerguendo a nossa voz no mesmo hino,\nsem fim louvemos. Amém!\n\nSALMODIA\nAnt. 1 Ó Deus, eles vos procuraram em vosso santuário: agora contemplam vosso poder e glória.\nAnt. 2 Servos do Senhor, bendizei o Senhor; louvai-o e exaltai-o pelos séculos!\nAnt. 3 Exultem os vossos santos na glória; servos fiéis eles foram de Cristo e da Virgem Maria.\n\nCântico evangélico (Benedictus)\nAnt. Bendito seja o Senhor Deus, que concedeu mi
