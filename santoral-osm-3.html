ruto da Igreja.\nOu: Feliz sois vós, ó Maria, mãe da glória e imagem resplendente da Igreja.\nPRECES\nConfiantes na ajuda da Virgem Maria, invoquemos com fervor o Pai que, pela força do Santo\nEspírito, conduz todos os homens à unidade. Digamos com fé:\nR. Senhor, fazei que todos formem uma só família.\nPai, por meio de Jesus Cristo conduzis os povos à vossa Igreja;\n- fazei que todos nela encontrem a vida.\nVós, na vinha do vosso povo, fizestes germinar a videira verdadeira que é Cristo;\n- ensinai-nos a permanecer unidos a ele.\nVós edificastes a Igreja como \"morada de Deus entre os homens\";\n- fazei que sejamos templos vivos da vossa divindade.\nO Pai, vós nos destes a Igreja como mãe carinhosa;\n- fazei que, na alegria deste novo dia, nos esforcemos para promover a unidade e a concórdia.\nPai Nosso...\nOração\nO Deus, que sois guia do povo eleito, quisestes que a Santa Virgem, Mãe de Cristo, cabeça da\nIgreja, fosse também mãe espiritual dos cristãos; por sua maternal intercessão, concedei que todos\nos povos se tornem vossa Igreja. Por nosso Senhor.", "form2Title": "MARIA E A IGREJA", "form3": "Invitatório\nAnt. Vinde, adoremos o Cristo Jesus: renova-se nele toda a criação.\nOu: Vinde, adoremos a Deus Pai, que em Cristo tudo renova.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\n\"Grande sinal lá no céu aparece:\nmulher formosa vestida de sol,\npor sobre a lua descansa seus pés,\ncoroa de astros lhe enfeita a cabeça.\nLonge ela foge com asas de águia,\npara o deserto por Deus é levada\":\nvolta, ó Senhora, a gerá-lo de novo,\ne volte a terra inda ter esperança!\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDos \"Discursos\" de João XXIII, papa (7 de dezembro de 1959)\nA intimidade do homem com Deus revela-se em Maria na sua perfeição original\nA Imaculada Conceição evoca os fulgores da aurora. Preservada de toda impureza original, Maria\nficou repleta de graça desde o primeiro instante de sua conceição. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Mulher Nova, preservada do pecado original: * de ti nasceu Cristo Jesus, novo Adão!\nV. Salve, Nova Terra, preparada por Deus, fecundada pelo Santo Espírito.\nR. De ti nasceu Cristo Jesus, novo Adão!\nLeitura alternativa\nDa Carta pastoral da Conferência dos Bispos das Ilhas Filipinas sobre a bem-aventurada Virgem\nMaria\nAs palavras de Maria preconizam uma mudança na ordem social do reino de Deus\nNa visitação (Lc 1,39-45.56) Maria, levando em seu seio o Menino, torna-se imagem da Arca da\nAliança e sede da presença permanente de Deus no meio do povo. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO cf. Sl 33,4; 85,13; Lc 1,52\nR. Glorificai comigo o Senhor: * grande foi sua misericórdia.\nV. Depôs os poderosos dos seus tronos e exaltou os humildes.\nR. Grande foi sua misericórdia.\nOração\nO Deus, na Virgem-Mãe, plasmada pelo Espírito Santo, vós nos destes as primícias da nova criação;\nconcedei que, libertos da corrupção do pecado, nos transformemos em Cristo, Homem novo. Ele\nque convosco...\nLaudes\nHINO\n\"Humilde serva eu sou do Senhor,\nem mim se cumpram as tuas palavras\".\nTu és a terra obediente, ó Maria,\nterra que sabe, que ama e que adora.\nDia após dia a Igreja repita\nda humilde serva as sagradas palavras,\ne será tudo como era no início,\nquando o Senhor caminhava no Éden.\nGlória à Trindade, Pai, Filho e Espírito,\nque desde o início renovam o mundo:\npois foi-nos dada uma Virgem e Mãe,\nbeleza intacta de toda a criação.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE cf. 2 Pd 3,13-14\nO que nós esperamos, conforme a sua promessa, são novos céus e nova terra, onde habitará a\njustiça. Assim, visto que tendes esta esperança, esforçai-vos ardorosamente para que ele vos\nencontre em paz, vivendo uma vida sem mácula e irrepreensível.\nRESPONSÓRIO BREVE\nR. Vi um novo céu e uma nova terra: * vi descer do céu, de junto de Deus, a cidade santa.\nV. Vi a nova Jerusalém, resplandecente da glória de Deus.\nR. Vi descer do céu, de junto de Deus, a cidade santa.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Vi um novo céu e uma nova terra: vi descer do céu, de junto de Deus, a cidade santa.\nCântico evangélico\nAnt. Ave, Maria, puríssima Mãe de Deus! Ave, bendita! Tu concebeste o esplendor do Pai. Aleluia!\nOu: Grande é a tua glória, ó Maria, Mulher nova: de ti nasceu Cristo, o Homem novo!\nPRECES\nElevemos nossas súplicas a Deus Pai: na Santa Virgem Maria, mãe do novo Adão, ele nos deu a\nimagem e o início da Igreja. Digamos com fé:\nR. Senhor, renovai em nós o espírito de santidade!\nVós nos trouxestes à luz deste novo dia;\n- dai-nos ver a luz do dia em que todas as criaturas, libertadas da corrupção, haverão de\nconquistar a ditosa liberdade dos filhos de Deus.\nVós nos renovastes na água e no Espírito Santo;\n- fazei que caminhemos numa vida nova, coerentes com nosso batismo.\nNa Virgem Maria reparastes a antiga culpa de Eva;\n- concedei-nos respeitar a dignidade de todas as criaturas.\nPai Nosso...\nOração\nO Deus, na Virgem-Mãe, plasmada pelo Espírito Santo, vós nos destes as primícias da nova criação;\nconcedei que, libertos da corrupção do pecado, nos transformemos em Cristo, Homem novo. Ele\nque convosco...", "form3Title": "MARIA, MULHER NOVA", "form4": "Invitatório\nAnt. Vinde, exultemos no Senhor! Ele derrama sua misericórdia sobre aqueles que o temem.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nComo podermos cantar-te, ó Maria,\nsem ofender a tua santidade?\nsem perturbar o teu grande silêncio?\nNosso desejo é que peças por nós,\nnós cantaremos teu canto de amor:\nfaça-se em nós como tu declaraste.\nTu, chance última desta criação,\ntu, terra santa que o gera de novo,\ntu, tabernáculo vivo do Verbo.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDos \"Sermões\" de São Boaventura, bispo\nCom grande confiança recorramos a Maria\n\"O meu Criador habitou sob a minha tenda\" (Eclo 24,12). Este versículo da Sagrada Escritura, no\nseu sentido literal, bem se aplica à Virgem Maria: em sua tenda habitou fisicamente o Senhor.\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, regina de misericórdia, da vós nasceu o Cristo, nosso Rei: * intercedei para a nossa paz e\nsalvação.\nV. Salve, Mãe do Senhor, conforto do mundo, esperança dos pobres, refúgio dos fracos e oprimidos!\nR. Intercedei para a nossa paz e salvação.\nLeitura alternativa\nDo Tratado \"Sobre os louvores da B. Virgem Maria\", de Ricardo de São Lourenço, presbítero\nRainha e Mãe de misericórdia\nMaria é pródiga e cheia de misericórdia porque é rica e generosa. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Virgem piedosa, em vós nós esperamos! * Dia e noite a vós volvemos nosso olhar\nconfiante.\nV. Salve, rainha de misericórdia: por vossa clemência nos libertastes e vos entregastes a nós como\nmãe amável.\nR. Dia e noite a vós volvemos nosso olhar confiante.\nOração\nO Deus, Pai clemente e misericordioso, que fizestes da Virgem Maria a Arca da Nova Aliança, para\nque o Verbo viesse morar no meio dos homens; concedei-nos ser sempre fiéis à aliança que Cristo\nconfirmou com o seu sangue. Ele que é Deus...\nLaudes\nHINO\nÓ Mãe, tu foste das bodas à festa\njunto co'o Filho e também os discípulos:\noutro festim, porém, ele sonhava,\njá antevendo a colina sangrenta.\nSia gloria al Padre que o novo amor\normai ci dona da allora per sempre:\namor que solo o Filho revela\ne no Espírito é dado a quem ama.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Mq 7,18-20\nQual deus é como tu, que tira a culpa e perdoa o crime, que não guarda para sempre a sua ira,\nporque prefere o amor? Novamente ele nos manifestará a sua misericórdia, calcará aos pés as nossas\nfaltas e lançará no fundo do mar todos os nossos pecados.\nRESPONSÓRIO BREVE\nR. Lembrai-vos, Senhor, da vossa misericórdia, * como prometestes a nossos pais!\nV. Vossa misericórdia de geração em geração para aqueles que vos temem.\nR. Como prometestes a nossos pais!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Lembrai-vos, Senhor, da vossa misericórdia, como prometestes a nossos pais!\nCântico evangélico\nAnt. Virgem santa, rainha da misericórdia e esperança do mundo, escutai os filhos que vos\ninvocam!\nPRECES\nBendigamos a Deus, Pai misericordioso que, em seu Filho Jesus Cristo, nascido da Virgem Maria,\nrealizou plenamente as suas promessas, e digamos com fé:\nR. Nós vos louvamos, Senhor, por vossa misericórdia!\nO Deus bondoso e paciente, que fecundastes o seio da Virgem Maria,\n- fazei que a vossa palavra, acolhida com fé, produza em nós frutos abundantes.\nO Deus justo e misericordioso, que escolhestes Maria dentre os humildes e pobres,\n- dai-nos um coração humilde e pobre para esperarmos confiantes a salvação que vem de Cristo.\nO Deus de misericórdia e de bondade, que nos concedestes ver a luz deste novo dia,\n- fazei que, à imitação da mãe de misericórdia, acolhamos com amor os que precisam de nós.\nPai Nosso...\nOração\nO Deus, Pai clemente e misericordioso, que fizestes da Virgem Maria a Arca da Nova Aliança, para\nque o Verbo viesse morar no meio dos homens; concedei-nos ser sempre fiéis à aliança que Cristo\nconfirmou com o seu sangue. Ele que é Deus...\nOu:\nSenhor, que enviastes o vosso Filho ao mundo para salvar os homens, dando-lhes Maria como Mãe\nde misericórdia, ouvi benigno as preces dos vossos servos que perante vós gemem sob o peso dos\nseus pecados e confiam na vossa clemência. Por nosso Senhor.", "form4Title": "MARIA, RAINHA DA MISERICÓRDIA", "form5": "Invitatório\nAnt. Vinde, adoremos o Senhor, que, por Santa Maria, visitou nossos povos.\nSalmo 94, como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nAmas tua casa, és também peregrina,\ntu és esposa, tu mãe dedicada,\ntrilhas veredas por onde Deus passa,\ntudo o que ocorre tu logo percebes.\nSobes e desces, fiel ao teu \"sim\",\nlá no Calvário e em teu caminhar;\nrumo à morada celeste nós vamos,\nonde contigo queremos chegar.\nGlória a Deus Pai, o Senhor sempiterno,\nglória a Deus Filho, que é nosso Senhor\nao Santo Espírito consolador:\nassim aclame cantando o universo. Amém!\nAntífonas, salmos, versículo e primeira leitura do sábado da semana corrente.\nSEGUNDA LEITURA\nDo \"Documento de Puebla\" da III Conferência do Episcopado Latino-americano\nMaria faz com que a Igreja se sinta uma família\nEm nossos povos, o Evangelho tem sido anunciado, apresentando a Virgem Maria como sua\nrealização mais alta. Desde os primórdios - em sua aparição e invocação de Guadalupe - Maria\ntornou-se o grande sinal, de rosto materno e misericordioso, da proximidade do Pai e de Cristo.\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Serva do Senhor, Mãe de Deus! * Por vós o Evangelho foi proclamado aos nossos povos!\nV. Salve, mãe dos homens, fiel companheira do Senhor! Por vós a Igreja sente-se família.\nR. Por vós o Evangelho foi proclamado aos nossos povos!\nLeitura alternativa\nDo \"Nicán Mopohua\", relato do escritor indígena António Valeriano, do século XVI\nOuviu-se em nossa terra o cantar da rola\nNaquela estação, do ano de 1531, passados poucos dias do mês de dezembro, sucedeu que havia um\nindiozinho, um humilde homem do povo, de nome Juan Diego. Era sábado e, bem de madrugada,\nele vinha em busca de Deus e dos seus mandamentos. [Relato completo do encontro de Nossa\nSenhora de Guadalupe com Juan Diego disponível no ofício impresso da Ordem.]\nRESPONSÓRIO Ct 2,14; Ap 12,1\nR. Pomba minha, que se aninha nos vãos do rochedo, pela fenda dos barrancos, deixa-me ver tua\nface. * Deixa-me ouvir tua voz; pois tua face é tão formosa e tão doce a tua voz!\nV. Um sinal grandioso apareceu no céu: uma mulher vestida com o sol, tendo sobre a cabeça uma\ncoroa de doze estrelas.\nR. Deixa-me ouvir tua voz; pois tua face é tão formosa e tão doce a tua voz!\nOração\nSenhor, nosso Deus, que destes à América Latina a proteção maternal de Maria, Mãe do vosso\nFilho; dai-nos, por sua intercessão, ser firmes na fé e servir os irmãos com amor sincero. Por nosso\nSenhor.\nLaudes\nHINO\nMaria de Guadalupe\npelas trilhas de Juan Diego,\nSenhora de nossa América,\nvem cantando hoje teu povo!\nOlha p'ra nós, Mãe, e escuta:\num sonho acalenta a América\nque nasceu da tua promessa\npara os pobres e famintos.\nAntífona e salmos do sábado da semana corrente.\nLEITURA BREVE Is 52,7-10\nComo são belos sobre os montes os pés do mensageiro que anuncia a paz, que traz as boas novas e\nanuncia a libertação, que diz a Sião: Teu Deus reina!\nRESPONSÓRIO BREVE\nR. Diante dele * prostrar-se-ão todas as nações!\nV. Todos os povos o servirão.\nR. Prostrar-se-ão todas as nações!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Diante dele prostrar-se-ão todas as nações!\nCântico evangélico\nAnt. Colocarei no meio de vós minha morada e enxugarei toda lágrima de vossos olhos. Como a\nmãe acaricia seu filho, assim eu os consolarei.\nPRECES\nUnidos a Santa Maria, Senhora da América Latina, elevemos nossa súplica a Cristo, evangelizador\npor excelência, e digamos juntos:\nR. Senhor da história, guiai os nossos passos!\nSenhor Jesus, Filho do Deus vivo, que proclamastes ao mundo a palavra que nos salva,\n- dai-nos a graça de nos comprometermos na obra da nova evangelização.\nSenhor Jesus, Bom Pastor, que guiais o rebanho pelos caminhos da justiça,\n- fazei que a Igreja latino-americana se torne de fato uma comunidade missionária.\nSenhor Jesus, nosso irmão, que lavastes os pés dos discípulos,\n- dai-nos coragem para nos comprometermos na promoção integral do povo latino-americano.\nPai Nosso...\nOração\nSenhor, nosso Deus, que destes à América Latina a proteção maternal de Maria, Mãe do vosso\nFilho; dai-nos, por sua intercessão, ser firmes na fé e servir os irmãos com amor sincero. Por nosso\nSenhor.", "form5Title": "SANTA MARIA DAS AMÉRICAS"}, "variasHome": [{"title": "Bênção da refeição", "text": "Comum\n Bendito sejais, Senhor Deus, nosso Pai, que\nfazeis germinar os frutos da terra, por estes dons que\ncolocastes sobre a nossa mesa. Abençoai aqueles que,\ncom seu trabalho, os cultivaram, os que os prepararam\ncomo alimento e a nós que estamos para recebê-los\ncom o coração agradecido, enquanto esperamos\nencontrar-nos um dia todos reunidos no vosso Reino\neterno. Por Cristo nosso Senhor. Amém!\nNas festas marianas\n\n Senhor Deus, nosso Pai, que na Virgem Maria\ndestes à Igreja a imagem profética do seu futuro;\nabençoai a nós e ao alimento que estamos para tomar e\nfazei que, celebrando hoje a bendita entre as mulheres,\npossamos refletir em nós sua vida de obediência e de\namor. Por Cristo nosso Senhor. Amém!\nNas visitas de familiares e amigos\n Senhor nosso Deus, que de muitas maneiras\nconvidais os seres humanos, ajudai-nos a compreender\no dom da graça da hospitalidade, para que saibamos\nreconhecer a vossa presença no irmão que nos visita.\nSede bendito agora e sempre. Amém!\n\nNos momentos de alegria\n Ó Deus, fonte da alegria, por meio do vosso\nFilho, nos fazeis participar das vossas maravilhas: nós\nvos bendizemos pelos dons do vosso amor, em modo\nparticular hoje ...[explicitar o motivo da alegria], e vos\npedimos que transformeis as alegrias deste dia em\njúbilo perene no céu. Por Cristo nosso Senhor. Amém!"}, {"title": "Pelas vocações", "text": "I. Ó Maria, que chamastes os nossos Sete Santos\nPais e, ao longo dos séculos, tantos outros homens e\nmulheres, para servir a Cristo e aos irmãos, inspirando-\nse no Evangelho e no vosso exemplo, concedei-nos\nhoje também a graça de muitas vocações para a vossa\nOrdem.\n Fazei que a nossa Família seja sempre a casa por\nvós abençoada e amada, de modo que, quantos a\nescolherem como sua morada, vivam generosamente os\nensinamentos do vosso Filho e se coloquem\ninteiramente a serviço da Igreja e dos seres humanos.\nAmém!\n II. Senhor, humildemente vos pedimos: concedei\nque os Servos e as Servas de Santa Maria vivam uma\nvida fraterna e santa e se tornem neste mundo\ntestemunhas de bondade e de misericórdia.\n\n Que as nossas comunidades e fraternidades sejam\ncaminho, ponte e sinal para os que desejam ir ao vosso\nencontro; sejam luz para os que precisam de luz, paz\npara os que buscam a paz e serviço para os que dele\nprecisam; sejam apelo à oração, fraternidade que\nliberta os seres humanos da solidão e lugar onde a luz\ndo Ressuscitado se irradie em formas de vida humana.\nAmém!"}, {"title": "Pelas missões", "text": "Ó Virgem Maria, Rainha dos apóstolos,\nchamastes os nossos Santos Primeiros Pais ao\nseguimento do vosso Filho Jesus e os enviastes no meio\ndos homens para testemunhar o Evangelho em\ncomunhão fraterna.\n Acompanhai e guiai os nossos irmãos e irmãs que\nassumiram o compromisso de irradiar no mundo o\ncarisma da nossa vocação, e intercedei por nós junto ao\nSenhor, para que a grande messe da humanidade possa\ncontar com operários dignos e em número suficiente\npara a colheita. Amém!"}, {"title": "Pelos doentes", "text": "Ó Deus misericordioso, salvação eterna dos que\ncreem, escutai as preces que vos fazemos por...[diz-se\no nome do(a) doente] e fazei que ele (ela) volte ao\nconvívio da vossa Igreja onde possa render-vos graças\n\ne proclamar as vossas maravilhas. Por Cristo nosso\nSenhor. Amém!"}, {"title": "Pelos defuntos", "text": "Antífona\n\n Senhor, fonte de luz, iluminai as minhas trevas.\nLibertados pelo amor de Cristo, possamos esperar a\nvida eterna. Outros me haviam falado de vós, mas\nagora meus olhos vos veem.\n\nSalmo 129\n- Das profundezas, Senhor, a ti eu clamo. *\n Senhor, escuta o meu apelo;\n- teus ouvidos estejam bem atentos *\n ao clamor de minha súplica.\n- Se levares em conta, Senhor, nossas faltas, *\n Senhor, quem poderá subsistir?\n- Mas em ti encontra-se o perdão, *\n eu temo e espero.\n\n- Minha alma espera no Senhor, *\n em sua palavra tenho confiança;\n- minha alma espera pelo Senhor, *\n mais confiante do que o vigia\n\n esperando pela aurora.\n\n- Que o vigia espere pela aurora, *\n e Israel pelo Senhor.\n\n- Porque no Senhor encontra-se a graça, *\n copiosa redenção\n- é ele quem redimirá Israel *\n de todas as suas faltas.\nOração [reza-se uma das seguintes orações]\n I. Pai Santo, luz e salvação dos homens, vós nos\nrevelastes as riquezas do vosso amor através do mundo\ncriado e, sobretudo, em vosso próprio Filho.\n Concedei, pois, que nossos irmãos e irmãs\ndefuntos, que viveram em comunhão fraterna na busca\nda vossa face, possam entrar em vossa morada e\ncontemplar o que sempre desejaram ver.\n E a nós, que continuamos a buscar-vos, concedei a\ngraça de fortalecer a nossa esperança e de recobrar\nnovo alento no caminho que conduz à terra dos vivos.\nPor Cristo nosso Senhor. Amém!\n II. Ó Deus, em Cristo vosso Filho, destes aos\nhomens, peregrinos nesta terra, o penhor de uma segura\nesperança e a fonte da água viva.\n Sede benigno com os nossos irmãos e irmãs que,\ntendo completado sua peregrinação terrena, partiram\ndeste mundo rumo à morada eterna.\n\n Saciai com vosso amor a sede que eles têm de vós\ne introduzi-os em vossa casa, onde sejam festivamente\nrecebidos no convívio dos santos. Por Cristo nosso\nSenhor. Amém!\n\n III. Senhor, vós conheceis a fraqueza humana e,\ncomo Pai bondoso e rico em misericórdia, não vos\ncansais de esperar nosso retorno para abraçar-nos e dar-\nnos o vosso perdão.\n Tende piedade dos nossos irmãos e irmãs que,\ninvestidos pelo vento da morte, tirastes do meio de nós.\nDai-lhes, Senhor, descanso junto a vós, para que, com\na Virgem Mãe e com os irmãos já transfigurados por\nvosso amor, possam louvar eternamente a vossa\nmisericórdia. Por Cristo nosso Senhor. Amém!"}]}};

</script>
<script>
// ===================== i18n helpers =====================
let LANG = 'pt';
function t(key){
  return (I18N[LANG] && I18N[LANG][key]) || I18N.pt[key] || key;
}

function todayInfo(){
  const d = new Date();
  const months = MONTHS_I18N[LANG] || MONTHS_I18N.pt;
  const weekdays = WEEKDAYS_I18N[LANG] || WEEKDAYS_I18N.pt;
  return { day:d.getDate(), month:d.getMonth()+1, weekday:weekdays[d.getDay()], monthName:months[d.getMonth()] };
}

function findSaintForToday(){
  const t = todayInfo();
  return SANTORAL.find(s => s.day === t.day && s.month === t.month) || null;
}

function findNextSaint(){
  const t = todayInfo();
  const withKey = SANTORAL.map(s => ({...s, key: s.month*100+s.day}));
  const todayKey = t.month*100+t.day;
  const future = withKey.filter(s=>s.key > todayKey).sort((a,b)=>a.key-b.key);
  if(future.length) return future[0];
  return withKey.sort((a,b)=>a.key-b.key)[0];
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// render a prayer block, coloring rubrics
function renderPrayer(text){
  const esc = escapeHtml(text);
  return esc.replace(/^(D\.|T\.|C\.|L\.\d?|L\.|V\.|R\.|\u2123\.|\u211f\.)/gm, '<span class="rubric">$1</span>');
}

// Splits a saint's raw "oficio" text into its canonical-hour sections:
// Invitatório (merged into Ofício), Ofício das Leituras, Laudes, Hora Média, Vésperas (I/II merged).
function splitOficioByHour(text){
  const HEADER_RE = /^(Invitat[oó]rio|Of[ií]cio das Leituras|Laudes|Hora M[eé]dia|I Vésperas|II Vésperas|Vésperas)[ \t]*$/gm;
  const matches = [];
  let m;
  while((m = HEADER_RE.exec(text)) !== null){
    matches.push({ label: m[1], start: m.index, contentStart: m.index + m[0].length });
  }
  const buckets = { oficio: [], laudes: [], horaMedia: [], vesperas: [] };
  function bucketFor(label){
    if(label === 'Laudes') return 'laudes';
    if(label === 'Hora Média' || label === 'Hora Media') return 'horaMedia';
    if(label === 'Vésperas' || label === 'I Vésperas' || label === 'II Vésperas') return 'vesperas';
    return 'oficio'; // Invitatório, Ofício das Leituras
  }
  if(matches.length === 0){
    const trimmed = text.trim();
    if(trimmed) buckets.oficio.push({ label:null, text: trimmed });
    return buckets;
  }
  // text before the first header
  const pre = text.slice(0, matches[0].start).trim();
  if(pre) buckets.oficio.push({ label:null, text: pre });
  for(let i=0;i<matches.length;i++){
    const seg = matches[i];
    const end = (i+1 < matches.length) ? matches[i+1].start : text.length;
    const segText = text.slice(seg.contentStart, end).trim();
    if(!segText) continue;
    // omit the label when it's redundant with the section's own card title
    const skipLabel = (seg.label === 'Ofício das Leituras' || seg.label === 'Laudes' ||
                        seg.label === 'Hora Média' || seg.label === 'Hora Media' ||
                        (seg.label === 'Vésperas'));
    buckets[bucketFor(seg.label)].push({ label: skipLabel ? null : seg.label, text: segText });
  }
  return buckets;
}

function renderOficioTabs(oficioText){
  const buckets = splitOficioByHour(oficioText);
  const order = [
    { key:'oficio', title:t('hourOficio') },
    { key:'laudes', title:t('hourLaudes') },
    { key:'horaMedia', title:t('hourHoraMedia') },
    { key:'vesperas', title:t('hourVesperas') },
  ].filter(o => buckets[o.key] && buckets[o.key].length);

  if(!order.length) return '';
  if(!state.oficioTab || !order.find(o => o.key === state.oficioTab)){
    state.oficioTab = order[0].key;
  }
  const tabs = order.map(o => `<button class="hour-tab-btn ${state.oficioTab===o.key ? 'active' : ''}" onclick="setOficioTab('${o.key}')">${escapeHtml(o.title)}</button>`).join('');
  const active = order.find(o => o.key === state.oficioTab);
  const segs = buckets[active.key];
  const body = segs.map(s => `${s.label ? `<div class="hour-sublabel">${escapeHtml(s.label)}</div>` : ''}<div>${renderPrayer(s.text)}</div>`).join('<div class="hour-divider"></div>');
  return `
    <div class="hour-tabs">${tabs}</div>
    <div class="hour-tab-content fade-in">${body}</div>
  `;
}

// note shown under non-Portuguese-translated content
function langNoteHtml(){
  if(LANG === 'pt') return '';
  return `<p class="lang-note">${escapeHtml(t('langNote'))}</p>`;
}

function dailyPrayerText(which){
  if(LANG === 'pt') return which === 'anjo' ? PRAYERS.daily.anjo : PRAYERS.daily.rainha;
  return DAILY_I18N[which][LANG];
}

function stabatText(){
  if(LANG === 'pt') return PRAYERS.devotions.stabat;
  return STABAT_I18N[LANG];
}

// ===================== state =====================
let state = { tab:'hoje', angelus:'anjo', detailId:null, search:'', devo:null, devoSub:null, showOficio:false, oficioTab:null };

function setTab(tab){
  state.tab = tab; state.detailId = null; state.devo = null; state.devoSub = null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  render();
  window.scrollTo(0,0);
}

function openDetail(id){
  state.detailId = id;
  state.showOficio = false;
  state.oficioTab = null;
  render();
  document.getElementById('view').scrollTop = 0;
  window.scrollTo(0,0);
}

function openDevo(key, sub){
  state.devo = key;
  state.devoSub = sub !== undefined ? sub : null;
  render();
  window.scrollTo(0,0);
}

function closeDevo(){
  if(state.devoSub !== null){ state.devoSub = null; }
  else { state.devo = null; }
  render();
  window.scrollTo(0,0);
}

// ===================== views =====================
function viewHoje(){
  const ti = todayInfo();
  const saint = findSaintForToday();
  const next = saint ? null : findNextSaint();

  let saintHtml;
  if(saint){
    saintHtml = `
      <div class="card saint-card fade-in">
        <span class="rank">${escapeHtml(saint.rank || t('memoriaBadge'))}</span>
        <h2>${escapeHtml(saint.title)}</h2>
        <div class="date-line">${escapeHtml(saint.date)} · Ordo Servorum Mariæ</div>
        ${langNoteHtml()}
        <div class="link-row"><button class="btn-link" onclick="openDetail(${saint._id})">${escapeHtml(t('readBio'))}</button></div>
      </div>`;
  } else {
    saintHtml = `
      <div class="card saint-card fade-in">
        <span class="rank">${escapeHtml(t('hojeBadge'))}</span>
        <p class="empty-note">${escapeHtml(t('noSaintToday'))} <b style="color:var(--gold-soft); font-style:normal;">${escapeHtml(next.title)}</b>, ${escapeHtml(t('em'))} ${escapeHtml(next.date)}.</p>
        <div class="link-row"><button class="btn-link" onclick="openDetail(${next._id})">${escapeHtml(t('viewCelebration'))}</button></div>
      </div>`;
  }

  return `
    <div class="hero-date fade-in">
      <div class="weekday">${escapeHtml(ti.weekday)}</div>
      <div class="day">${ti.day}</div>
      <div class="month">${LANG==='pt'?'de ':''}${escapeHtml(ti.monthName)}</div>
      <div class="hero-divider"></div>
    </div>

    <div class="section-title">${escapeHtml(t('todaySection'))}</div>
    ${saintHtml}

    <div class="section-title">${escapeHtml(t('dailyPrayerSection'))}</div>
    <div class="card fade-in">
      <div class="toggle-row">
        <button class="toggle-btn ${state.angelus==='anjo'?'active':''}" onclick="setAngelus('anjo')">${escapeHtml(t('anjoLabel'))}</button>
        <button class="toggle-btn ${state.angelus==='rainha'?'active':''}" onclick="setAngelus('rainha')">${escapeHtml(t('rainhaLabel'))}</button>
      </div>
      <div class="prayer-block">${renderPrayer(dailyPrayerText(state.angelus))}</div>
    </div>
  `;
}

function viewSantoral(){
  if(state.detailId !== null){
    return viewDetail(state.detailId);
  }
  const q = state.search.trim().toLowerCase();
  const filtered = q ? SANTORAL.filter(s => s.title.toLowerCase().includes(q) || s.date.toLowerCase().includes(q)) : SANTORAL;
  const months = MONTHS_I18N[LANG] || MONTHS_I18N.pt;

  let listHtml = '';
  if(!filtered.length){
    listHtml = `<div class="no-results">${escapeHtml(t('noResults'))} "${escapeHtml(state.search)}".</div>`;
  } else if(q){
    listHtml = filtered.map(rowHtml).join('');
  } else {
    for(let m=1; m<=12; m++){
      const items = filtered.filter(s=>s.month===m);
      if(!items.length) continue;
      listHtml += `<div class="month-group"><div class="month-label">${months[m-1]}</div>${items.map(rowHtml).join('')}</div>`;
    }
  }

  return `
    <div class="section-title">${escapeHtml(t('santoralSection'))}</div>
    <p style="color:var(--text-muted); font-size:0.9688rem; line-height:1.6; margin:-4px 0 18px;">
      ${escapeHtml(t('santoralIntro'))}
    </p>
    ${langNoteHtml()}
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="${escapeHtml(t('searchPlaceholder'))}" value="${escapeHtml(state.search)}" oninput="onSearch(this.value)">
    </div>
    ${listHtml}
  `;
}

function rowHtml(s){
  return `
    <div class="saint-row" onclick="openDetail(${s._id})">
      <div class="daynum">${s.day}</div>
      <div class="rowtext">
        <div class="rowtitle">${escapeHtml(s.title)}</div>
        <div class="rowrank">${escapeHtml(s.rank||'')}</div>
      </div>
      <div class="chev">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>`;
}

function onSearch(val){ state.search = val; render(true); }

function viewDetail(id){
  const s = SANTORAL.find(x=>x._id===id);
  if(!s) return `<div class="no-results">${escapeHtml(t('notFound'))}</div>`;
  return `
    <button class="back-btn" onclick="closeDetail()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
      ${escapeHtml(t('back'))}
    </button>
    <div class="detail-header fade-in">
      <div class="rank">${escapeHtml(s.rank||'')}</div>
      <h2>${escapeHtml(s.title)}</h2>
      <div class="date-line">${escapeHtml(s.date)}</div>
      <div class="detail-divider"></div>
    </div>
    ${langNoteHtml()}
    <div class="bio-text fade-in">${escapeHtml(s.bio)}</div>
    ${s.prayer ? `
    <div class="prayer-card fade-in">
      <div class="label">${escapeHtml(t('oracao'))}</div>
      <div class="text">${escapeHtml(s.prayer)}</div>
    </div>` : ''}
    ${s.oficio ? `
    <div class="section-title" style="margin-top:30px;">${escapeHtml(t('liturgyHours'))}</div>

        ${state.showOficio ? escapeHtml(t('hideOffice')) : escapeHtml(t('showOffice'))}
      </button>

function closeDetail(){ state.detailId = null; state.showOficio = false; state.oficioTab = null; render(); }
function toggleOficio(){ state.showOficio = !state.showOficio; state.oficioTab = null; render(); }
function setOficioTab(key){ state.oficioTab = key; render(); }

function getDevoList(){
  return [
    { key:'vigilia', title:t('vigiliaTitle'), sub:t('vigiliaSub') },
    { key:'sabado', title:t('sabadoTitle'), sub:t('sabadoSub') },
    { key:'coroa', title:t('coroaTitle'), sub:t('coroaSub') },
    { key:'stabat', title:t('stabatTitle'), sub:t('stabatSub') },
    { key:'via_matris', title:t('viaMatrisTitle'), sub:t('viaMatrisSub') },
    { key:'ladainhas', title:t('ladainhasTitle'), sub:t('ladainhasSub') },
  ];
}
function getVariasList(){
  return PRAYERS.devotions.variasHome.map((it,i)=>({key:'varias'+i, title:it.title}));
}

function devoRowHtml(item){
  return `
    <div class="saint-row" onclick="openDevo('${item.key}')">
      <div class="rowtext" style="padding-left:2px;">
        <div class="rowtitle">${escapeHtml(item.title)}</div>

function viewOracoes(){
  if(state.devo) return viewDevoDetail(state.devo);

  return `
    <div class="section-title">${escapeHtml(t('dailyMarianTitle'))}</div>
    <div class="card fade-in">
      <div class="toggle-row">
        <button class="toggle-btn ${state.angelus==='anjo'?'active':''}" onclick="setAngelus('anjo')">${escapeHtml(t('anjoLabel'))}</button>
        <button class="toggle-btn ${state.angelus==='rainha'?'active':''}" onclick="setAngelus('rainha')">${escapeHtml(t('rainhaLabel'))}</button>
      </div>
      <div class="prayer-block">${renderPrayer(dailyPrayerText(state.angelus))}</div>

    <div class="section-title">${escapeHtml(t('marianHomageTitle'))}</div>

      ${getDevoList().map(devoRowHtml).join('')}
    </div>

    <div class="section-title">${escapeHtml(t('variousPrayersTitle'))}</div>
    ${LANG!=='pt' ? langNoteHtml() : ''}
    <div class="card fade-in" style="padding:6px 16px;">
      ${getVariasList().map(devoRowHtml).join('')}
    </div>
  `;
}

function setAngelus(which){ state.angelus = which; render(); }

// ---- devotion detail router ----
function viewDevoDetail(key){
  if(key.startsWith('varias')){
    const idx = parseInt(key.slice('varias'.length));
    const item = PRAYERS.devotions.variasHome[idx];
    return simpleTextDetail(item.title, '', item.text, null, true);
  }
  if(key === 'coroa') return simpleTextDetail(t('coroaTitle'), t('coroaSub'), PRAYERS.devotions.coroa, null, true);
  if(key === 'stabat') return simpleTextDetail(t('stabatTitle'), t('stabatSub'), stabatText());
  if(key === 'vigilia') return viewVigilia();
  if(key === 'sabado') return viewSabado();
  if(key === 'via_matris') return viewViaMatris();
  if(key === 'ladainhas') return viewLadainhas();
  return `<div class="no-results">${escapeHtml(t('notFound'))}</div>`;
}

function backToOracoes(){ state.devo=null; state.devoSub=null; render(); window.scrollTo(0,0); }

function simpleTextDetail(title, sub, text, backFn, showNote){
  const back = backFn || 'backToOracoes()';
  return `
    <button class="back-btn" onclick="${back}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
      ${escapeHtml(t('back'))}
    </button>
    <div class="detail-header fade-in">
      <h2 style="font-size:1.625rem;">${escapeHtml(title)}</h2>
      ${sub ? `<div class="date-line">${escapeHtml(sub)}</div>` : ''}
      <div class="detail-divider"></div>
    </div>
    ${showNote ? langNoteHtml() : ''}
    <div class="card fade-in">
      <div class="prayer-block">${renderPrayer(text)}</div>
    </div>
  `;
}

// ---- Santa Maria no Sábado (5 formularies) ----

    </button>

      <h2 style="font-size:1.625rem;">${escapeHtml(t('sabadoTitle'))}</h2>

      <p>O Santoral reúne a memória litúrgica dos santos, beatos e servos de Deus da Ordem: o hino, a antífona, o salmo comuns, e a breve biografia com a oração própria de cada um deles.</p>

      "Somos servos da Virgem Gloriosa, de cuja viuvez trazemos o hábito. Procuramos modelar a nossa vida segundo o exemplo dos Santos Apóstolos e viver segundo a regra do santo doutor Agostinho."

      <div><b>Edição:</b> 3ª edição revisada, 2024</div>
      <div><b>Publicação:</b> Ordem dos Servos de Maria — Província São Peregrino do Brasil</div>

// ===================== router =====================
function render(){
  const view = document.getElementById('view');
  let html = '';
  if(state.tab === 'hoje') html = viewHoje();
  else if(state.tab === 'santoral') html = viewSantoral();
  else if(state.tab === 'oracoes') html = viewOracoes();
  else if(state.tab === 'sobre') html = viewSobre();
  view.innerHTML = html;
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=> setTab(b.dataset.tab));
});

// ===================== settings panel =====================
function toggleSettings(){
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('settingsBtn');
  const isHidden = panel.hasAttribute('hidden');
  if(isHidden){ panel.removeAttribute('hidden'); btn.classList.add('active'); }
  else { panel.setAttribute('hidden',''); btn.classList.remove('active'); }
}

function applyStaticI18n(){
  document.documentElement.setAttribute('lang', LANG === 'pt' ? 'pt-BR' : LANG);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('#langGroup .chip').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

function setLanguage(lang){
  LANG = lang;
  try{ localStorage.setItem('santoral-osm-lang', lang); }catch(e){}
  applyStaticI18n();
  render();
}

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('santoral-osm-theme', theme); }catch(e){}
  updateThemeChips();
}
function updateThemeChips(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const lightChip = document.getElementById('themeChipLight');
  const darkChip = document.getElementById('themeChipDark');
  if(lightChip) lightChip.classList.toggle('active', current === 'light');
  if(darkChip) darkChip.classList.toggle('active', current === 'dark');
}

// ===================== font size control =====================
const FONT_MIN = 13, FONT_MAX = 22, FONT_STEP = 1;
function changeFontSize(dir){
  const current = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  let next = Math.round(current + dir * FONT_STEP);
  next = Math.max(FONT_MIN, Math.min(FONT_MAX, next));
  document.documentElement.style.fontSize = next + 'px';
  try{ localStorage.setItem('santoral-osm-fontsize', next); }catch(e){}
}

// ===================== init =====================
SANTORAL.forEach((s,i)=> s._id = i);
document.querySelector('.tab-btn[data-tab="hoje"]').classList.add('active');
try{
  const savedLang = localStorage.getItem('santoral-osm-lang');
  if(savedLang && I18N[savedLang]) LANG = savedLang;
}catch(e){}
applyStaticI18n();
updateThemeChips();
render();

</script>
