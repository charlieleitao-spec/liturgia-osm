sericórdia aos nossos irmãos: a exemplo da Virgem Mãe, serviram-no em justiça e santidade.\n\nORAÇÃO\nDeus todo-poderoso, concedei que o espírito de amoroso serviço que abundantemente derramastes sobre os santos da Ordem de Nossa Senhora, continue sempre vivo e presente em cada um de nós, seus filhos e irmãos. Por nosso Senhor.\n\nVésperas\nHINO\nDe nossa Ordem hoje celebramos\nos santos que Maria hão imitado:\ncom ela triunfando, hoje se encontram\nbem a seu lado.\nAssim permitam eles nos lavarmos\nde toda mancha desta caminhada:\na seu pedido seja-nos aberta\ndo céu a entrada.\nTomando-os por modelo nós corremos\nno estádio deste mundo que inda passa,\nna esperança de um dia conquistarmos\na mesma taça.\nGlória e louvor perene a Deus que é trino,\ncomo no céu aqui na terra demos:\nerguendo a voz no mesmo hino,\nsem fim louvemos. Amém!\n\nSALMODIA\nAnt. 1 Louvai o Senhor nosso Deus, ó servos fiéis da Virgem Maria!\nSalmo 112 — Louvai o nome do Senhor\nLouvai, louvai, ó servos do Senhor, * louvai, louvai o nome do Senhor! Bendito seja o nome do Senhor, * agora e por toda a eternidade!\nDo nascer do sol até o seu ocaso, * louvado seja o nome do Senhor! O Senhor está acima das nações, * sua glória vai além dos altos céus.\nQuem pode comparar-se ao nosso Deus, † ao Senhor, que no alto céu tem o seu trono, * e se inclina para olhar o céu e a terra?\nLevanta da poeira o indigente * e retira o pobrezinho do monturo, para fazê-lo assentar-se com os nobres, * assentar-se com os nobres do seu povo.\nFaz a estéril, mãe feliz em sua casa, * vivendo rodeada de seus filhos.\nAnt. 1 Louvai o Senhor nosso Deus, ó servos fiéis da Virgem Maria!\nOração sálmica: Senhor, do nascer ao pôr do sol, ressoe nas fraternidades dos Servos de Maria o louvor do vosso nome. Acolhendo em vosso reino nossos irmãos e irmãs, Servos da vossa Mãe, vós os associastes aos amigos de Cristo, vosso Filho, que convosco vive e reina.\n\nAnt. 2 Alegrai-vos, santos irmãos, na Jerusalém celeste! Fostes fiéis às promessas feitas ao Senhor.\nAnt. 3 Bendito sejais, ó Deus! Vós os fizestes santos e imaculados na vossa presença.\n\nRESPONSÓRIO BREVE\nR. Os santos do céu não cessam de clamar noite e dia: * Santo, santo, santo é o Senhor Deus todo-poderoso.\nV. Aquele que era, que é e que vem.\nR. Santo, santo, santo é o Senhor Deus todo-poderoso.\n\nCântico evangélico (Magnificat)\nAnt. Ó gloriosos Servos de Santa Maria, inspirando-vos constantemente na Virgem Mãe, dela aprendestes a amar a Deus e todas as criaturas."}, {"date": "17 de novembro", "day": 17, "month": 11, "name": "COMEMORAÇÃO DE TODOS OS DEFUNTOS DA ORDEM", "title": "Comemoração dos Defuntos da Ordem", "rank": "Comemoração", "bio": "A Ordem dos Servos de Maria dedica este dia à memória de todos os irmãos, irmãs, parentes e benfeitores defuntos. É um dia de gratidão e de esperança: gratidão pela vida e pelo exemplo de quantos serviram a Deus e a Nossa Senhora antes de nós, e esperança na promessa de Cristo, que ressuscitou dos mortos como primícia de todos os que nele creem. Ao pé da cruz do Filho agonizante, a Serva do Senhor se tornou serva da vida e mãe dos viventes; por isso os Servos de Maria confiam seus defuntos à intercessão materna daquela que primeiro creu na ressurreição.", "prayer": "Ó Deus, glória dos vossos servos, concedei aos nossos irmãos e irmãs defuntos que, pelo batismo e pela profissão religiosa associastes neste mundo à morte de Cristo, possam agora participar da sua ressurreição nos céus. Ele que convosco vive e reina.", "oficio": "Invitatório\nAnt. Vinde, adoremos o Senhor, esperança dos que vivem.\n\nOfício das Leituras\nHINO\nJá dos sepulcros levanta-se a voz;\n\"fazei silêncio, ó vivos, e ouvi\":\nao menos hoje que todos se calem,\ncom nossos mortos está Ele entretido.\n\"Foi por amor que desceu ao sepulcro\",\nsorrindo, agora, Jesus resplandece;\ntodos, alegres, transmitem-se o evento,\nda própria morte o sentido se entende.\n\"Também a morte é presença de Deus!\"\nJesus morrendo mostrou que era assim.\nNada de Cristo teríamos sabido\nse não houvesse baixado ao sepulcro.\nSão nossos mortos que hoje nos falam:\n\"Tende esperança e deixai de chorar!\nAh, se pudésseis vós vê-lo também\ncomo aqui nós contemplando-o já estamos\"\nRefulja, ó Deus, nossa aurora pascal,\nó Pai, ó Espírito em tudo presente;\nvivos e mortos em Cristo se abracem,\ncertos de juntos viverem p'ra sempre!\n\nSALMODIA\nAnt. 1 Senhor, quem morará em vossa casa e em vosso Monte santo habitará?\nAnt. 2 De vossa face é que me venha o julgamento, pois vossos olhos sabem ver o que é justo.\nAnt. 3 Senhor, fazeis brilhar a minha lâmpada e iluminais as minhas trevas.\n\nV. Quem tem ouvidos, ouça o que o Espírito diz às igrejas.\nR. Quem crer, alimentar-se-á dos frutos eternos no meu reino.\n\nRESPONSÓRIO Rm 6,8; 2Cor 4,14\nR. Se morremos com Cristo, * temos fé de que também viveremos com ele.\nV. O Pai, que ressuscitou o Senhor Jesus, ressuscitará também a nós com Jesus.\nR. Temos fé de que também viveremos com ele.\n\nLaudes\nHINO\nSó tu, ó Cristo, és a nossa certeza,\nó tu, que a morte venceste p'ra sempre.\nÀ humanidade as barreiras quebraste\ndo que era ignoto e oculto à ciência.\nO que começa também já se acaba:\né assim que a erva dos campos fenece;\ntambém a estrada dos homens no tempo\ncorre veloz rumo a incerto futuro.\nMas tu explicas o enigma do tempo\ne nos revelas do Pai os desígnios,\nporque dos mortos à vida voltaste:\nés as primícias de quantos morreram.\nEm ti, ó Cristo, está nossa esperança,\npois toda vida em ti ganha sentido\ne toda morte de luz se ilumina,\nque do sepulcro, glorioso, irradias.\nA ti, que foste qual grão posto à terra,\ne ao Santo Espírito sempre vivente\ne ao Pai eterno, que é fonte da vida,\nnós, deste lado, cantamos felizes.\n\nSALMODIA\nAnt. 1 Pastor de nossas almas, conduzi-nos às fontes da vida.\nSalmo 22 — Deus, bom Pastor\nO Senhor é o pastor que me conduz; * não me falta coisa alguma. Pelos prados e campinas verdejantes * ele me leva a descansar.\nPara as águas repousantes me encaminha, * e restaura as minhas forças. Ele me guia no caminho mais seguro, * pela honra do seu nome.\nMesmo que eu passe pelo vale tenebroso, * nenhum mal eu temerei; estais comigo com bastão e com cajado: * eles me dão a segurança!\nPreparais à minha frente uma mesa, * bem à vista do inimigo, e com óleo vós ungis minha cabeça; * o meu cálice transborda.\nFelicidade e todo bem hão de seguir-me * por toda a minha vida; e na casa do Senhor habitarei * pelos tempos infinitos.\nAnt. 1 Pastor de nossas almas, conduzi-nos às fontes da vida.\nOração sálmica: Ó Bom Pastor, que conduzis vossos filhos deste vale tenebroso para as pastagens verdejantes do céu, fortalecei a fé da vossa Igreja. Temos certeza que nossos entes queridos, que morreram na vossa paz, habitarão para sempre em vossa casa. Por Cristo nosso Senhor.\n\nAnt. 2 Confiai no Senhor, fazei o bem, tende fé e tereis a vida.\nAnt. 3 Sede fortes e esperai no Senhor, alente-se o vosso coração e esperai no Senhor.\n\nRESPONSÓRIO\nR. Sei que o meu Redentor vive, * e no último dia eu também ressuscitarei da terra.\nV. Esta esperança repousa no íntimo do meu coração.\nR. E no último dia eu também ressuscitarei da terra.\n\nCântico evangélico (Benedictus)\nAnt. Jesus disse a Maria Madalena: \"Vai a meus irmãos e dize-lhes: subo a meu Pai e vosso Pai, a meu Deus e vosso Deus\".\n\nORAÇÃO\nÓ Deus, glória dos vossos servos, concedei aos nossos irmãos e irmãs defuntos que, pelo batismo e pela profissão religiosa associastes neste mundo à morte de Cristo, possam agora participar da sua ressurreição nos céus. Ele que convosco vive e reina.\n\nVésperas\nHINO\nLágrimas vãs já não mais se derramem:\nde brancas vestes a morte cobri\ndos nossos mortos que tudo doaram\ne de sua vida um batismo fizeram.\nNós somos gratos a nosso Senhor,\npor este dia de santa memória:\nquantas lembranças nos unem ainda\na vós, irmãs e irmãos nossos queridos!\nO dom de graça de alguns nós guardamos,\njunto com outros o ter convivido:\nmais forte é a nossa amizade que o sangue,\nnossa alegria é de ser-vos herdeiros.\nVeraz sufrágio será conformarmos\nas nossas obras aos vossos exemplos:\nesta é a paz que vós todos buscais,\ne sempre fiéis busquem ser vossos filhos.\nA Santa Virgem a quem vós servistes,\nao reino eterno consigo vos leve;\nseu belo canto a nós todos ensine\nque são felizes os pobres e os simples.\n\nSALMODIA\nAnt. 1 Tende piedade de nós, Senhor, pois em vós esperamos!\nAnt. 2 Ouvistes, Senhor, o clamor dos pobres e sustentastes a sua esperança.\nAnt. 3 Vinde, Senhor, em nosso auxílio, tende piedade de nós e salvai-nos!\n\nRESPONSÓRIO\nR. O Senhor é bom e clemente, lento na ira e cheio de bondade.\nV. Não nos trata conforme os nossos pecados.\nR. Lento na ira e cheio de bondade.\n\nCântico evangélico (Magnificat)\nAnt. Já não haverá trevas, pois o Senhor Jesus iluminará o caminho dos seus servos, e eles reinarão pelos séculos eternos."}, {"date": "10 de dezembro", "day": 10, "month": 12, "name": "B. JERÔNIMO DE SANT'ANGELO IN VADO", "bio": "Jerônimo nasceu no início do século XV na\npequena cidade de Sant’Angelo in Vado (Marcas,\nItália). Ingressou jovem no convento local dos Servos\nde Maria, onde recebeu o hábito da Ordem.\n Passou algum tempo fora do convento de\norigem, mas, terminados os estudos e ordenado\npresbítero, para lá voltou novamente.\n Distinguiu-se no amor ao silêncio, à solidão e à\ncontemplação. Foi agraciado por Deus com os dons do\nconselho e da prudência.\n Morreu por volta de 1468. Pio VI aprovou seu\nculto em 1773.\n O", "prayer": "Senhor, humildemente vos pedimos que\ninterceda por nós o bem-aventurado Jerônimo, a quem\nornastes com os dons do vosso Espírito, a fim de que,\nrepletos da sabedoria de Cristo, possamos agir em tudo\ncom maturidade e prudência. Por Cristo nosso Senhor.\nAmém!", "title": "B. Jerônimo de Sant'Angelo in Vado", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO Pr 2,10-11; Tb 4,19; Pr 2,2\nR. Quando a sabedoria entrar no teu coração e o discernimento deleitar a tua alma, * a reflexão te guardará e a inteligência velará sobre ti.\nV. Busca sempre o conselho dos sábios e inclina o teu coração à prudência.\nR. A reflexão te guardará e a inteligência velará sobre ti.\n\nORAÇÃO\nSenhor, interceda por nós o Bem-aventurado Jerônimo, que vós ornastes com os dons do Espírito Santo, a fim de que, repletos da sabedoria de Cristo, possamos agir em tudo com maturidade e prudência. Por nosso Senhor."}, {"date": "14 de dezembro", "day": 14, "month": 12, "name": "B. BOAVENTURA DE PISTOIA", "bio": "Boaventura nasceu na cidade toscana de Pistoia\n(Toscana, Itália), por volta de 1250. Atraído pelas\npalavras e exemplos de São Filipe Benizi, de quem se\ntornou amigo íntimo, ingressou na Ordem dos Servos de\nMaria e foi ordenado presbítero.\n Foi prior em vários conventos, revelando-se\nsempre muito prudente e humano no desempenho do\ncargo. Quando prior em Montepulciano, presidiu à\nprofissão dos votos de Santa Inês, natural dessa cidade,\ne ajudou-a a fundar o mosteiro.\n Morreu em Orvieto em 1315. Seu corpo repousa\nna nossa igreja da Santíssima Anunciada de Pistoia. Pio\nVII aprovou seu culto em 1822.", "prayer": "Deus todo-poderoso, derramai sobre os vossos\nservos o espírito de prudência e de sabedoria, que\niluminou admiravelmente o bem-aventurado\nBoaventura na orientação dos irmãos e irmãs a vós\nconsagrados. Por Cristo nosso Senhor. Amém!", "title": "B. Boaventura de Pistoia", "rank": "Beato(a)", "oficio": "Do Comum dos Santos e Bem-aventurados da nossa Ordem, p. 489. Salmos e antífonas do dia da semana corrente.\n\nRESPONSÓRIO cf. Pr 4,6b; 14,33a; Rm 8,6\nR. Ama a sabedoria e ela te protegerá: * no coração do homem prudente está a sabedoria.\nV. O desejo da carne é a morte; o desejo do espírito é vida e paz.\nR. No coração do homem prudente está a sabedoria.\n\nORAÇÃO\nDeus todo-poderoso, infundi em vossos servos o espírito de prudência, que distinguiu admiravelmente o Bem-aventurado Boaventura na orientação dos seus irmãos e irmãs a vós consagrados. Por nosso Senhor."}];
const PRAYERS = {"daily": {"anjo": "D. O anjo do Senhor anunciou a Maria.\nT. E Ela concebeu do Espírito Santo.\n   Ave Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós pecadores, agora e na hora da nossa morte. Amém.\n\nD. Eis aqui a serva do Senhor.\nT. Faça-se em mim segundo a vossa Palavra.\n   Ave Maria...\n\nD. E o Verbo Divino se fez carne.\nT. E habitou entre nós.\n   Ave Maria...\n\nD. Rogai por nós, Santa Mãe de Deus.\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Derramai, Senhor, a vossa graça em nossas almas, a fim de que nós que, pela anunciação do anjo, viemos ao conhecimento da Encarnação do vosso Filho, cheguemos, por sua paixão e morte, à glória da ressurreição. Pelo mesmo Cristo Senhor nosso.\nT. Amém!\n\nD. Glória ao Pai, ao Filho e ao Espírito Santo.\nT. Como era no princípio, agora e sempre. Amém.", "rainha": "D. Rainha do céu, alegrai-vos, aleluia!\nT. Pois o Senhor que merecestes trazer em vosso seio, aleluia!\n\nD. Ressuscitou como disse, aleluia!\nT. Rogai a Deus por nós, aleluia!\n\nD. Alegrai-vos e exultai, ó Virgem Maria, aleluia!\nT. Porque o Senhor ressuscitou verdadeiramente, aleluia!\n\nOremos\n\nD. Ó Deus que, na gloriosa ressurreição do vosso Filho, destes alegria ao mundo inteiro, por intercessão da Virgem Maria, concedei-nos gozar a alegria perene da vida eterna. Por Cristo nosso Senhor.\nT. Amém!"}, "devotions": {"vigilia": {"formula1": "Primeira fórmula\n Santa Maria,\n Senhora Dos Seus Servos\nSalmodia\n\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n\n SALMO 8\n Majestade de Deus e dignidade do homem\n\"O Todo-Poderoso fez grandes coisas por mim\" (Lc\n1,49).\n– 2Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n– Desdobrastes nos céus vossa glória *\ncom grandeza, esplendor, majestade.\n= 3O perfeito louvor vos é dado †\npelos lábios dos mais pequeninos, *\nde crianças que a mãe amamenta.\n– Eis a força que opondes aos maus, *\nreduzindo o inimigo ao silêncio.\n– 4Contemplando estes céus que plasmastes *\ne formastes com dedos de artista;\n\n– vendo a lua e estrelas brilhantes, *\n perguntamos: ‘Senhor, que é o homem,\n– para dele assim vos lembrardes *\ne o tratardes com tanto carinho?’\n– 6Pouco abaixo de Deus o fizestes, *\ncoroando-o de glória e esplendor;\n– 7vós lhe destes poder sobre tudo, *\nvossas obras aos pés lhe pusestes:\n– 8as ovelhas, os bois, os rebanhos, *\ntodo o gado e as feras da mata;\n– 9passarinhos e peixes dos mares, *\ntodo ser que se move nas águas.\n– 10Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume.\n\n SALMO 18\n Hino ao Criador do universo e Senhor da lei\n\n\"Quando o Verbo se fez carne, como um esposo, uniu-\nse à natureza humana: tálamo das núpcias foram as\nentranhas da Virgem Maria\" (Santo Agostinho)\n– 2Os céus proclamam a glória do Senhor, *\ne o firmamento, a obra de suas mãos;\n– 3o dia ao dia transmite esta mensagem, *\na noite à noite publica esta notícia.\n– 4Não são discursos nem frases ou palavras, *\nnem são vozes que possam ser ouvidas;\n– 5seu som ressoa e se espalha em toda a terra, *\nchega aos confins do universo a sua voz.\n– 6Armou no alto uma tenda para o sol; *\nele desponta no céu e se levanta\n– como um esposo do quarto nupcial, *\ncomo um herói exultante em seu caminho.\n– 7De um extremo do céu põe-se a correr *\ne vai traçando o seu rastro luminoso,\n– até que possa chegar ao outro extremo, *\ne nada pode fugir ao seu calor.\n\n– 8A lei do Senhor Deus é perfeita, *\nconforto para a alma!\n– O testemunho do Senhor é fiel, *\nsabedoria dos humildes.\n\n– 9Os preceitos do Senhor são precisos, *\nalegria ao coração.\n– O mandamento do Senhor é brilhante, *\npara os olhos é uma luz.\n– 10É puro o temor do Senhor, *\nimutável para sempre.\n– Os julgamentos do Senhor são corretos *\ne justos igualmente.\n– 11Mais desejáveis do que o ouro são eles, *\ndo que o ouro refinado.\n– Suas palavras são mais doces que o mel, *\nque o mel que sai dos favos.\n– 12E vosso servo, instruído por elas, *\nse empenha em guardá-las.\n– 13Mas quem pode perceber suas faltas? *\nPerdoai as que não vejo!\n\n– 14E preservai o vosso servo do orgulho: *\nnão domine sobre mim!\n– E assim puro, eu serei preservado *\ndos delitos mais perversos.\n– 15Que vos agrade o cantar dos meus lábios *\ne a voz da minha alma;\n– que ela chegue até vós, ó Senhor, *\n\nmeu Rochedo e Redentor!\n\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume!\n\n3ª Ant. Ao prodígio da tua virgindade elevemos com\n júbilo um hino de alegria!\n\n SALMO 23\n O Senhor entra no seu Templo\n\"As portas do céu abriram-se ao Cristo quando\nassumiu a natureza humana\" (Santo Irineu)\n– 1Ao Senhor pertence a terra e o que ela encerra, *\no mundo inteiro com os seres que o povoam;\n– 2porque ele a tornou firme sobre os mares, *\ne sobre as águas a mantém inabalável.\n\n– 3“Quem subirá até o monte do Senhor, *\nquem ficará em sua santa habitação?”\n= 4“Quem tem mãos puras e inocente coração, †\nquem não dirige sua mente para o crime, *\nnem jura falso para o dano de seu próximo.\n– 5Sobre este desce a bênção do Senhor *\ne a recompensa de seu Deus e Salvador”.\n– 6“É assim a geração dos que o procuram, *\ne do Deus de Israel buscam a face”.\n\n= 7“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 8Dizei-nos: “Quem é este Rei da glória?” †\n“É o Senhor, o valoroso, o onipotente, *\no Senhor, o poderoso nas batalhas!”\n\n= 9“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 10Dizei-nos: “Quem é este Rei da glória?” †\n“O Rei da glória é o Senhor onipotente, *\no Rei da glória é o Senhor Deus do universo!”\n3ª Ant. Ao prodígio da tua virgindade, elevemos com\n júbilo um hino de alegria!\nIntrodução às leituras\nD. Ave Maria, cheia de graça, o Senhor é convosco.\nT. Bendita sois vós entre as mulheres e bendito é o fruto\n do vosso ventre, Jesus!\nAbsolvição\n\nD. Pelas preces e méritos da bem-aventurada Virgem\n Maria e de todos os santos, o Senhor nos conduza ao\n Reino dos céus.\nT. Amém!\n\nPrimeira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Com seu divino Filho proteja-nos a Virgem Mãe.\nT. Amém!\n\nL. Santa Maria, Virgem das virgens, Mãe e Filha do\n Rei dos reis, dá-nos teu conforto nas dificuldades da\n vida. Por tua misericordiosa intercessão, o Senhor\n nos conceda o prêmio do céu e o reino eterno junto\n com seus eleitos. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nResponsório\nT. Como poderei louvar-te, Santa Virgem Maria? *\n Aquele que os céus não podem conter, o encerraste\n em teu seio!\nL. Bendita és tu entre as mulheres e bendito é o fruto\n do teu ventre!\nT. Aquele que os céus não podem conter, o encerraste\n em teu seio!\n\nSegunda leitura\nL. Invoca sobre mim a bênção do Senhor.\n\nD. A Virgem imaculada interceda por nós junto ao\n Senhor.\nT. Amém!\nL. Santa Maria, Mãe piedosa, intercede por nós,\n Virgem santa! Apresenta nossas súplicas ao teu Filho\n que, nascido para a nossa salvação, reina agora nos\n céus. Sua misericordiosa graça apague os nossos\n pecados. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\nResponsório\nT. Feliz és tu, Virgem Maria, pois trouxeste o Criador\n do mundo! * Deste à luz aquele que te criou e\n permaneceste sempre virgem!\nL. Ave, ó cheia de graça, o Senhor é contigo.\nT. Deste à luz aquele que te criou e permaneceste\n sempre virgem!\nTerceira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Pela intercessão da Virgem Maria, o Senhor nos\n conceda a paz e a salvação.\nT. Amém!\nL. Santa Mãe de Deus, tu que foste digna de trazer em\n teu seio aquele que o universo não pode conter, acolhe\n a nossa súplica! Tua misericordiosa intercessão nos\n\n obtenha o perdão das culpas e tua maternal presença\n nos conduza à morada da luz, onde com teu Filho\n reinas eternamente. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nSalve Rainha\n\n Salve, Rainha, Mãe de misericórdia, vida, doçura e\nesperança nossa, salve! A vós bradamos os degredados\nfilhos de Eva. A vós suspiramos, gemendo e chorando\nneste vale de lágrimas. Eia, pois, advogada nossa, esses\nvossos olhos a nós volvei! E depois deste desterro,\nmostrai-nos Jesus, bendito fruto do vosso ventre. Ó\nclemente, ó piedosa, ó doce sempre Virgem Maria!\n\nD. Rogai por nós, santa Mãe de Deus!\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Deus onipotente e eterno, que pela cooperação do\n Espírito Santo, preparastes, no corpo e na alma da\n bem-aventurada Virgem Maria, uma habitação digna\n do vosso Filho, fazei que celebrando com alegria sua\n memória, ela nos livre, por sua maternal intercessão,\n de todos os males da vida presente e da morte eterna.\n Por Cristo nosso Senhor.\nT. Amém!\n\n Oração pela Igreja pela Ordem\n Ó Senhor, por vossa misericórdia, dissolvei os\nvínculos dos nossos pecados e, pela intercessão da\nbem-aventurada Virgem Maria, Mãe de Deus, dos\nnossos Sete Santos Pais, do vosso servo São Filipe e de\ntodos os santos, guardai e santificai o papa NN, o nosso\nprior geral NN, a nós vossos servos, nossas\ncomunidades e benfeitores.\n Afastai do mal nossos pais, parentes e amigos e\nenriquecei-os de virtude. Concedei-nos saúde e paz.\nAfastai os inimigos visíveis e invisíveis e purificai-nos\nde todo desejo mundano. Dai serenidade aos ares e\nfertilidade aos campos.\n Libertai o mundo da fome, da guerra e de qualquer\noutro flagelo. Preservai ilesa de toda calamidade esta\ncidade e seus habitantes. Dai vosso amor a nossos\namigos e também a nossos inimigos, e concedei aos\nfiéis defuntos o eterno repouso. Amém!", "formula2": "Segunda fórmula\n Santa Maria\n Serva Do Senhor\nIntrodução\n\nD. Bendita sois vós entre as mulheres\nT. E bendito é o fruto do vosso ventre.\n\nD. Louvai comigo o Senhor pelas maravilhas que fez\n em Maria.\nT. Grandes e admiráveis são as tuas obras, Senhor\n Deus todo-poderoso! Justos e verdadeiros os teus\n caminhos, ó Rei do universo!\n\nHino\n \"Serva humilde eu sou do Senhor,\n em mim se faça segundo disseste\".\n Terra obediente tu és, ó Maria,\n terra que acolhe, que ama e adora.\n Filha querida do povo escolhido,\n santo rebento que brota em flor,\n flor desejada, esperada por todos,\n flor que embeleza o deserto do mundo.\n\n Dia após dia a Igreja repita\n as santas palavras da serva fiel:\n tudo haverá de voltar como outrora,\n quando Deus Pai caminhava no Éden.\n Glória à Trindade, Pai, Filho e Espírito,\n que desde sempre renovam o mundo:\n pois que nos deram uma Virgem e Mãe,\n beleza intacta de toda a criação.\n1ª Ant. Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\n SALMO 110\n Grandes são as obras do Senhor\n\"A minh'alma engrandece o Senhor, pois o Todo-\npoderoso fez em mim grandes coisas\" (Lc 1,46. 49).\n\n– 1Eu agradeço a Deus de todo o coração *\njunto com todos os seus justos reunidos!\n– 2Que grandiosas são as obras do Senhor, *\nelas merecem todo o amor e admiração!\n\n– 3Que beleza e esplendor são os seus feitos! *\nSua justiça permanece eternamente!\n– 4O Senhor bom e clemente nos deixou *\na lembrança de suas grandes maravilhas.\n\n– 5Ele dá o alimento aos que o temem *\ne jamais esquecerá sua Aliança.\n– 6Ao seu povo manifesta seu poder, *\ndando a ele a herança das nações.\n\n– 7Suas obras são verdade e são justiça, *\nseus preceitos, todos eles, são estáveis,\n– 8confirmados para sempre e pelos séculos, *\nrealizados na verdade e retidão.\n\n= 9Enviou libertação para o seu povo, †\nconfirmou sua Aliança para sempre. *\nSeu nome é santo e é digno de respeito.\n\n= 10Temer a Deus é o princípio do saber, †\ne é sábio todo aquele que o pratica. *\nPermaneça eternamente o seu louvor.\n\n1ª Ant. - Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\nOração sálmica\n Nós vos agradecemos, Senhor, porque por meio de\nMaria, vossa serva fiel, nos destes o Mediador da nova\nAliança. Concedei, vos pedimos, cumprir com amor os\n\nvossos preceitos e ser fiéis à vossa Palavra e ao nosso\ncompromisso de serviço. Por Cristo nosso Senhor.\nAmém!\n2ª Ant. Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\n SALMO 112\n A glória e a misericórdia do Senhor\n\"Olhou para a humildade de sua serva... Exaltou os\nhumildes\" (Lc 1, 48. 52).\n\n– 1Louvai, louvai, ó servos do Senhor, *\nlouvai, louvai o nome do Senhor!\n– 2Bendito seja o nome do Senhor, *\nagora e por toda a eternidade!\n– 3Do nascer do sol até o seu ocaso, *\nlouvado seja o nome do Senhor!\n– 4O Senhor está acima das nações, *\nsua glória vai além dos altos céus.\n= 5Quem pode comparar-se ao nosso Deus, †\nao Senhor, que no alto céu temo seu trono *\n e se inclina para olhar o céu e a terra?\n– 7Levanta da poeira o indigente *\ne do lixo ele retira o pobrezinho,\n– 8para fazê-lo assentar-se com os nobres, *\nassentar-se com os nobres do seu povo.\n\n– 9Faz a estéril, mãe feliz em sua casa, *\nvivendo rodeada de seus filhos.\n2ª Ant. - Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\nOração sálmica\n\nDo nascer ao pôr do sol, louvado seja o vosso nome,\nSenhor, porque escolhestes Maria, mulher humilde e\npobre, para ser a Mãe gloriosa do vosso Filho. Primeira\nentre os remidos, vós a colocastes na Igreja como Mãe\nfeliz de muitos filhos. Por Cristo nosso Senhor. Amém!\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\n SALMO 145\n Bem-aventurado aquele que espera no Senhor\n\"Sua misericórdia perdura de geração em geração\npara aqueles que o temem\" (Lc 1, 50).\n\n= 1Bendize, minh’alma, ao Senhor! †\n Bendirei ao Senhor toda a vida, *\ncantarei ao meu Deus sem cessar!\n\n– 3Não ponhais vossa fé nos que mandam, *\nnão há homem que possa salvar.\n\n = 4Ao faltar-lhe o respiro ele volta †\npara a terra de onde saiu; *\nnesse dia seus planos perecem.\n= 5É feliz todo homem que busca †\nseu auxílio no Deus de Jacó, *\ne que põe no Senhor a esperança.\n– 6O Senhor fez o céu e a terra, *\nfez o mar e o que neles existe.\n\n– O Senhor é fiel para sempre, *\n faz justiça aos que são oprimidos;\n – ele dá alimento aos famintos, *\né o Senhor quem liberta os cativos.\n\n= 8O Senhor abre os olhos aos cegos, †\no Senhor faz erguer-se o caído, *\no Senhor ama aquele que é justo.\n\n= 9É o Senhor quem protege o estrangeiro, †\nquem ampara a viúva e o órfão, *\nmas confunde os caminhos dos maus.\n\n=10O Senhor reinará para sempre! †\nÓ Sião, o teu Deus reinará *\npara sempre e por todos os séculos!\n\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\nOração sálmica\n\n Ó Senhor, suba até vós o louvor perene dos Servos\nde Santa Maria, porque enviastes o vosso Filho para\nanunciar a Boa Nova aos pobres e proclamar a\nliberdade aos cativos. Reavivai em nós o compromisso\nde socorrer aos mais necessitados com amor fraterno e\nde defender os oprimidos com coragem evangélica. Por\nCristo nosso Senhor. Amém!\n\nIntrodução à leitura\n\nD. Bem-aventurada aquela que acreditou.\nT. Nela encarnou-se o Filho de Deus.\n\nPrimeira leitura\n\n À VIRGEM DO SIM\n\nL. Santa Maria, serva humilde do Senhor, gloriosa Mãe\n de Cristo, salve! Virgem fiel, ventre consagrado ao\n Verbo, ensina-nos a ser dóceis à voz do Espírito, a\n viver na escuta da Palavra, atentos a seus apelos no\n segredo do coração, vigilantes em suas\n manifestações na vida dos irmãos, nos\n acontecimentos da história, nos sofrimentos e nas\n\n alegrias da criação. Virgem da escuta, criatura\n orante, acolhe a súplica dos teus servos!\nResponsório\n\nT. Tu és, ó Maria, a terra prometida, figura do Reino\n que há de vir, * Igreja vivente do Verbo.\nL. Tu a terra sagrada que Cristo ainda geras. Tu a\n custódia vivente da Palavra.\nT. Igreja vivente do Verbo.\nSegunda leitura\n À VIRGEM DO \"MAGNIFICAT\"\nL. Santa Maria, mulher humilde e pobre, bendita do\n Altíssimo, salve! Virgem da esperança, profecia dos\n novos tempos, une ao teu canto as nossas vozes e\n acompanha-nos em nosso caminho, para que\n anunciemos a vinda do Reino e a total libertação dos\n seres humanos. Levando Cristo aos irmãos e irmãs e\n realizando com eles uma intensa comunhão de amor,\n glorificaremos contigo a misericórdia do Senhor e\n cantaremos as alegrias da vida e da salvação.\n Virgem, arca da nova Aliança, primícias da Igreja,\n acolhe as súplicas dos teus servos!\n\nResponsório\n\nT. Tu és a voz do antigo Israel, regozijo do pequeno\n resto, * canto de alegria da virgem Igreja.\nL. Por ti sobe o louvor de todos os remidos, dos pobres\n e humildes que esperam em Deus.\nT. Canto de alegria da virgem Igreja.\n\nTerceira leitura\n À VIRGEM AO PÉ DA CRUZ\nL. Santa Maria, mulher da dor, Mãe dos viventes,\n salve! Nova Eva, Virgem esposa junto à cruz, onde\n se consuma o amor e jorra a vida. Mãe dos\n discípulos, sê tu a imagem-guia em nosso\n compromisso de serviço. Ensina-nos a estar a teu\n lado aos pés das infinitas cruzes da humanidade,\n onde teu Filho continua crucificado; a viver e\n testemunhar o amor cristão, acolhendo todo ser\n humano como irmão; a renunciar ao disfarçado\n egoísmo para seguir a Cristo, única luz da\n humanidade. Virgem da Páscoa, glória do Espírito\n Santo, acolhe a súplica dos teus servos!\n\n SÚPLICA DOS SERVOS DE MARIA\n A NOSSA SENHORA\n Bondade, que nos abres o infinito\n tesouro da graça, Santa Mãe,\n infunde em teus servos a esperança.\n\n Virtude, que com bondade nos socorres\n na incerta e difícil caminhada,\n dá-nos a fidelidade em teu serviço!\n Reaviva em nós\n o antigo e sagrado compromisso\n de servir aos irmãos no amor\n e, com o olhar fixo em ti, seguir a Cristo!\nDespedida\nD. Proteja-nos Santa Maria e benigna nos acompanhe\n pelos caminhos da vida.\nT. Amém!"}, "coroa": "Pelo aporte determinante que os Servos de Maria deram à\nsua composição e pelo amor com que a divulgaram na Igreja, a\nCoroa de Nossa Senhora das Dores (ou a Coroa das Sete Dores)\npode ser considerada uma prática de piedade própria da\nOrdem.\n Não se sabe bem como começou. É muito provável que sua\norigem coincida com o crescimento do culto a Nossa Senhora\ndas Dores do início do século XVII.\n Apresentamos aqui duas fórmulas da Coroa: a primeira\né a tradicional; a segunda é nova, também articulada em \"sete\ndores\": é uma fórmula alternativa, que celebra o inesgotável\nmistério da dor da Virgem Maria a partir da categoria bíblica\nda rejeição, de profundo conteúdo teológico e presente na vida\nde Jesus.\n\n PRIMEIRA FÓRMULA\n\nD. Em nome do Pai, do Filho e do Espírito Santo.\nT. Amém!\n\nD. Nós vos louvamos e vos bendizemos, Senhor.\nT. Porque associastes a Virgem Mãe à obra da\n salvação.\nD. Contemplamos a vossa dor, Santa Maria.\nT. Para seguir-vos no caminho da fé.\n1ª DOR: Maria escuta com fé a profecia de Simeão (Lc\n 2,24-35).\n [Pai nosso e 7 Ave-Marias].\n2ª DOR: Maria foge para o Egito com Jesus e José (Mt\n 2,13-14).\n [Pai nosso e 7 Ave-Marias].\n3ª DOR: Maria procura Jesus, perdido em Jerusalém\n (Lc 2,43-45).\n [Pai nosso e 7 Ave-Marias].\n4ª DOR: Maria encontra-se com Jesus no caminho do\n Calvário (Lc 23, 25-27).\n [Pai nosso e 7 Ave-Marias].\n5ª DOR: Maria ao pé da cruz do Filho (Jo 19,25-27).\n [Pai nosso e 7 Ave-Marias].\n\n6ª DOR: Maria recebe nos braços o corpo de Jesus\n descido da cruz (Mc 15, 42-45).\n [Pai nosso e 7 Ave-Marias].\n\n7ª DOR: Maria deposita o corpo de Jesus no sepulcro, à\n espera da ressurreição (Jo 19, 40-42).\n [Pai nosso e 7 Ave-Marias].\nD. Nós vos louvamos, Santa Maria.\nT. Mãe fiel junto à cruz do Filho.\nD. Bendita sois vós, Rainha dos mártires: associada à\n paixão de Cristo, vos tornastes nossa Mãe.\nT. Sinal de esperança em nosso caminho.\n SEGUNDA FÓRMULA\nD. Em nome do Pai, do Filho e do Espírito Santo.\nT. Amém!\nD. Nós vos louvamos e vos bendizemos, Senhor.\nT. Porque associastes a Virgem Mãe à obra da salvação.\nD. Contemplamos a vossa dor, Santa Maria.\nT. Para seguir-vos no caminho da fé.\n\n1ª DOR: Jesus, Filho de Deus, nasce numa gruta: não\n havia lugar para a mãe na hospedaria (Lc 2,6-7).\n [Pai nosso e 7 Ave-Marias].\n\n2ª DOR: Jesus, Salvador dos homens, sinal de\n contradição (Lc 2,33-35).\n [Pai nosso e 7 Ave-Marias].\n3ª DOR: Jesus, Messias recém-nascido, é perseguido\n por Herodes (Mt 2,13-14).\n [Pai nosso e 7 Ave-Marias].\n\n4ª DOR: Jesus, irmão dos homens, é desprezado por\n seus concidadãos (Lc 4,28-29).\n [Pai nosso e 7 Ave-Marias].\n5ª DOR: Jesus, o Santo de Deus, é preso pelos sumos\n sacerdotes e abandonado pelos discípulos (Mt\n 26, 49-50).\n [Pai nosso e 7 Ave-Marias].\n\n6ª DOR: Jesus, o Justo, morre na cruz (Jo 19,25-27).\n [Pai nosso e 7 Ave-Marias].\n7ª DOR: Jesus, Mestre e Senhor, é perseguido nos seus\n discípulos (At 12, 1-3).\n [Pai nosso e 7 Ave-Marias].\nD. Nós vos louvamos, Santa Maria.\nT. Mãe fiel junto à cruz do Filho.\nD. Bendita sois vós, Rainha dos mártires; associada à\n paixão de Cristo, vos tornastes nossa Mãe.\nT. Sinal de esperança em nosso caminho.\n\n LADAINHA\n DE NOSSA SENHORA DAS DORES\nSenhor, tende piedade de nós! [repete-se]\nCristo, tende piedade de nós!\nSenhor, tende piedade de nós!\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai que estais no céu, Tende piedade de nós!\nDeus Filho, Redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nMãe do crucificado, Rogai por nós!\nMãe de coração traspassado,\nMãe do Cristo Redentor,\nMãe dos discípulos de Jesus,\nMãe dos redimidos,\nMãe dos viventes,\nVirgem obediente,\nVirgem oferente,\nVirgem fiel,\nVirgem do silêncio,\nVirgem do perdão,\nVirgem da espera,\n\nMulher do exílio,\nMulher forte,\nMulher intrépida,\nMulher da dor,\nMulher da nova aliança,\nMulher da esperança.\n\nNova Eva,\nCooperadora do Redentor,\nServa da reconciliação,\nDefesa dos inocentes,\nCoragem dos perseguidos,\nFortaleza dos oprimidos,\nEsperança dos pecadores,\nConsolação dos aflitos,\nRefúgio dos marginalizados.\nConforto dos exilados,\nSustentáculo dos fracos,\nAlívio dos enfermos,\n\nRainha dos mártires,\nGlória da Igreja,\nVirgem da Páscoa,\nCordeiro de Deus, que tirais os pecados do mundo\nT. Perdoai-nos, Senhor!\n\nCordeiro de Deus, que tirais os pecados do mundo\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo\nT. Tende piedade de nós!\n\nOração\n\n Ó Deus, quisestes que a vida da Virgem Maria\nfosse marcada pelo mistério da dor. Humildemente vos\npedimos: concedei-nos trilhar a seu lado o caminho da\nfé e unir nossos sofrimentos à paixão de Cristo, para\nque se tornem momentos de graça e instrumentos de\nsalvação. Por Cristo nosso Senhor. Amém!", "stabat": "Estava a Mãe dolorosa,\njunto da cruz, lacrimosa,\nenquanto o filho pendia.\n\nNa sua alma agoniada\nenterrou-se a dura espada\nde uma antiga profecia.\n\nOh! quão triste e quão aflita,\nentre todas, Mãe bendita,\nque só tinha aquele Filho!\n\nQuanta angústia não sentia\nMãe piedosa, quando via\nas penas do Filho seu!\n\nQuem não chora, vendo isto:\ncontemplando a Mãe do Cristo\nnum suplício tão enorme?\n\nQuem haverá que resista,\nse a Mãe assim se contrista\npadecendo com seu Filho?\nPor culpa de sua gente,\nvia Jesus, inocente,\nentregando o seu espírito.\n\nVê agora o seu amado\npelo Pai abandonado,\nao flagelo submetido.\nFaze, ó Mãe, fonte de amor,\nque eu sinta o espinho da dor,\npara contigo chorar.\n\nFaze arder meu coração\ndo Cristo Deus na paixão,\npara que o possa agradar.\nÓ Santa Mãe, dá-me isto:\ntrazer as chagas do Cristo\ngravadas no coração.\nDo teu Filho, que por mim\nentrega-se a morte assim,\ndivide as penas comigo.\nOh! dá-me, enquanto viver,\ncom Cristo compadecer,\nchorando sempre contigo.\nJunto à cruz eu quero estar,\nquero o meu pranto juntar\nàs lágrimas que derramas.\nVirgem, que às virgens aclara,\nnão sejas comigo avara:\ndá-me contigo chorar.\n\nTraga em mim do Cristo a morte,\nda paixão seja consorte,\nsuas chagas celebrando.\n\nPor elas seja eu rasgado,\npela cruz inebriado,\npelo sangue de teu Filho!\nNo julgamento consegue\nque às chamas não se entregue\nquem por ti é defendido.\nQuando do mundo eu partir,\ndai-me, ó Cristo, conseguir,\npor vossa Mãe, a vitória.\n\nQuando o meu corpo morrer,\npossa a alma merecer\ndo Reino celeste a glória. Amém!", "via_matris": {"intro": "Assim como celebramos a Via Sacra, caminho\npercorrido por Jesus na sua paixão e morte de cruz,\ncelebramos também a Via Matris, isto é, o caminho\nde dor percorrido por Maria, desde a profecia do justo\nSimeão, passando pela fuga para o Egito e a perda de\nJesus no Templo até sua paixão e morte na cruz. Foi\no caminho que ela fez ao lado de Jesus, cooperando\ncom ele na obra de redenção humana.\n Celebramos as dores de Maria não para mover-\nnos de compaixão por ela, pelo que ela sofreu, mas\nantes para encher-nos de coragem e enfrentar como\nela, “de pé”, os sofrimentos desta vida e, ao mesmo\ntempo, para colocar-nos, como ela, aos pés das\ninfinitas cruzes que afligem os homens e mulheres de\nhoje, para levar-lhes conforto e esperança de\nlibertação. Não é, portanto, uma celebração para\nprovocar sentimentalismo pietista, mas sim\ncompaixão e solidariedade com os que sofrem.\n\n14 O presente texto da Via Matris foi composto por frei José M. Milanez, seguindo o\n\n roteiro tradicional, isto é: leitura bíblica, reflexão, invocações e canto.\n\n Desde as origens, os Servos de Maria sempre\ntiveram a Virgem Gloriosa, Mãe da Misericórdia, como\nsua Senhora, Fundadora e Guia. A partir do século XVII\naté meados do século XX, a devoção a Nossa Senhora\ndas Dores passou a ser considerada como o aspecto\npredominante do seu carisma mariano.\n A Via Matris é uma expressão dessa devoção e\nfoi introduzida no Brasil em 1920, quando os\nprimeiros Servos de Maria aqui chegaram. Até a\ndécada de sessenta do século passado era celebrada\ntoda sexta-feira em nossas igrejas. Depois, ficou\nalguns anos esquecida e hoje volta a ser valorizada.\n O presente roteiro da Via Matris segue o\nesquema tradicional, isto é: leitura do evangelho, breve\nreflexão, invocações e canto. Esse exercício de piedade\nevoca as sete principais dores da vida de Maria. Como\na Via Sacra, celebra-se em procissão, passando de uma\nestação para outra. Cada estação representa uma das\nsete dores de Maria.\n A origem dessa prática de piedade remonta ao\nséculo XVIII. Era praticada inicialmente, de maneira\nprivada, nas igrejas dos Servos de Maria da Espanha. É\nde 1842 um documento conservado até hoje, que ensina\ncomo celebrar a Via Matris.\n Esse piedoso exercício é conhecido também\ncomo “Novena perpétua de Nossa Senhora das Dores”\ne teve como seu maior propagador frei Tiago M. Keane\n\n(1901-1975), servita norte-americano que, em 1937,\nintroduziu sua celebração toda sexta-feira na igreja dos\nServos de Maria de Chicago, dedicada à Nossa Senhora\ndas Dores. Daí a devoção expandiu-se rapidamente em\n45 Estados do país e em cerca de 20 países do mundo.\nFrei Tiago escreveu um livreto intitulado “Novena em\nhonra de Nossa Mãe Dolorosa” que alcançou a tiragem\nde seis milhões de exemplares e dezessete edições, e\nfoi traduzido em vinte e dois idiomas15.\n A primeira edição em língua portuguesa foi\npublicada em São Paulo, em 1942. No frontispício do\nlivreto diz-se que foi “extraída de fontes aprovadas e\nadaptada para uso do povo pelo Revdo. Frei Thiago M.\nKeane, O.S.M., e traduzida para o português por frei\nThiago M. Mattioli, O.S.M.”16.\n Os trechos evangélicos são tirados da Bíblia\nSagrada, tradução da CNBB. As orações e a breve\nreflexão que segue à leitura evangélica são uma\nhumilde tentativa do autor para adaptar o conteúdo da\nmensagem e da oração à nossa realidade brasileira. A\nestrofe e o refrão do canto entoado enquanto se passa\n\n Esses dados sobre a Via Matris foram extraídos do Dicionário de Mariologia (dirigido por\n Stefano de Fiores e Salvatore Meo), edição em língua portuguesa, Paulus, São Paulo 1995,\n p. 426-427; cf. também ALESSIO MARIA ROSSI, Manuale di storia dell’Ordine dei Servi\n di Maria, Roma 1956, p. 448-449.\n Novena Perpétua em honra de Nossa Senhora das Dores, trad. frei Thiago M. Mattioli,\n Tipografia do Orfanato Cristóvão Colombo, São Paulo, 1942, 26 p.\n\nde uma estação para outra são do cancioneiro popular\ntradicional.", "stations": [{"title": "1ª Dor — Profecia de Simeão", "text": "D. Nós vos adoramos, Senhor Jesus Cristo e vos\n bendizemos\nT. Porque associastes a Virgem Maria à obra da\n Salvação.\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (2, 22.25a.34-35)\n Quando se completaram os dias da purificação,\nsegundo a lei de Moisés, levaram o menino a\nJerusalém para apresentá-lo ao Senhor... Vivia em\nJerusalém um homem piedoso e justo, chamado\nSimeão, que esperava a consolação de Israel. Simeão\nos abençoou e disse a Maria, a Mãe: «Este menino será\n\ncausa de queda e de reerguimento para muitos em\nIsrael. Ele será um sinal de contradição. E a ti, uma\nespada traspassará tua alma, e assim serão revelados\nos pensamentos de muitos corações».\n\nReflexão\n L.1 - Jesus, segundo Simeão, haveria de ser um\nsinal de contradição. De fato, para aqueles que o\nrejeitaram e o levaram à cruz, foi motivo de queda e\nde condenação; para aqueles que o aceitaram e\nacreditaram nele, foi motivo de reerguimento e de\nsalvação. Maria guardava todas essas coisas e as\nmeditava no seu coração (Lc 2,19), mas seu olhar\ndeixava transparecer a dor. O poeta contempla o olhar\nde Maria e canta:\n Num sonho todo feito de incerteza,\n de noturna e indizível ansiedade,\n é que eu vi teu olhar de piedade\n e, mais que piedade, de tristeza 17.\n L.2 - Maria conviveu com Jesus em Nazaré e o\nacompanhou na vida pública. Participou de suas\nalegrias e tristezas, mas principalmente do seu\nsofrimento, quando o viu abandonado pelos seus\ndiscípulos, traído por Judas, negado por Pedro,\ncondenado à morte e pregado na cruz. Tudo isso foi\n Trata-se de ANTERO DE QUENTAL (†1891). É a 1ª estrofe do soneto À Virgem Santíssima,\n cheia de graça, Mãe de misericórdia, citado por CLODOVIS M. BOFF, OSM, Nossa Senhora\n das Bem-aventuranças, Edições Paulinas, São Paulo, 1984, p. 20.\n\ncomo uma espada a lhe traspassar a alma. O célebre\nhino Stabat Mater, que descreve a presença de Maria ao\npé da cruz, assim recorda as palavras do justo Simeão:\n«Na sua alma agoniada / enterrou-se a dura espada / de\numa antiga profecia».\n L.3 - Pensemos nas mães dos dias de hoje que\nveem seus filhos levados à morte, vítimas das guerras,\nda fome e de todo tipo de violência. A “espada”\ncontinua a traspassar o coração de muitas mães. O\nhomem e a mulher foram feitos para ter vida e vida em\nabundância e não para morrer, vítimas das “espadas”\nfabricadas pela maldade humana.\nOração\nC. Senhor Deus, nosso Pai, pelas palavras de Simeão,\n predissestes uma vida de sofrimento para a mãe do\n vosso Filho. Suplicantes, vos pedimos: a exemplo da\n Virgem das Dores, cujo coração foi traspassado pela\n espada da dor, saibamos enfrentar os sofrimentos da\n vida presente e ser solidários com as dores dos\n irmãos. Por Cristo nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n\n C. Nossa Senhora das Dores.\n T. Rogai por nós!\nCanto\n\n De Simeão as vozes no templo escutais\n cruéis profecias. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "2ª Dor — Fuga para o Egito", "text": "D. Nós vos adoramos, Senhor Jesus Cristo e vos\n bendizemos\nT. Porque associastes a Virgem Maria à obra da\n Salvação.\n\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de São Mateus (2,13-15)\n Depois que os magos se retiraram, o anjo do\nSenhor apareceu em sonho a José e lhe disse: «Levanta-\nte, toma o menino e sua mãe e foge para o Egito! Fica\nlá até que eu te avise, porque Herodes vai procurar o\nmenino para matá-lo». José levantou-se, de noite, com\no menino e a mãe, e partiu para o Egito e lá ficou até a\nmorte de Herodes. Assim se cumpriu o que o Senhor\ntinha dito pelo profeta: “Do Egito chamei o meu filho”.\nReflexão\n L.1 - Herodes dissera aos magos: “Quando\nencontrardes o menino, avisai-me para que também eu\nvá adorá-lo” (Mt 2,8). Mas, conhecendo as más\n\nintenções dele, os magos voltaram para suas terras por\noutro caminho. Herodes então encheu-se de furor,\nporque não podia admitir que houvesse outro rei em\nIsrael. Diante das ameaças de Herodes, José, avisado\npelo anjo do Senhor, teve que fugir com a esposa e a\ncriança.\n L.2 - Abandonar a própria terra e casa, a oficina\nde carpinteiro, parentes e amigos, e rumar para uma\nterra longínqua e desconhecida, percorrendo de Belém\nao delta do Nilo mais de 250 quilômetros, foram atos\nde coragem e de fé de Maria e de José. Mas a ordem de\nDeus era clara: “José, toma o menino e sua mãe e foge\npara o Egito! Fica lá até que eu te avise”. Era preciso\nsalvar o filho a qualquer custo.\n L.3 - Quantos são hoje os que vivem exilados ou\nmigrando de um lugar para outro, sempre fugindo dos\nHerodes atuais, que se chamam perseguição, racismo,\nconflitos étnicos, fome, desemprego, falta de moradia,\nde assistência médica e de educação, e sempre\nbuscando, no desconhecido, melhores condições de\nvida. Milhões são os prófugos, exilados e migrantes\nque vagueiam pelo mundo, longe de sua terra, dos\nparentes e amigos, erradicados de sua cultura. A\nhistória se repete. É o desterro forçado da Família de\nNazaré que se prolonga na história da humanidade.\n\nOração\nC. Senhor Deus, nosso Pai, fizestes da Virgem Maria a\n mulher forte que conheceu a pobreza e o sofrimento,\n a fuga e o exílio. Suplicantes, vos pedimos: a exemplo\n da Virgem das Dores, saibamos lutar para defender a\n vida e os direitos da pessoa humana contra as\n injustiças e a perseguição dos prepotentes. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n\nCanto\n Manda o céu um anjo dizer que fujais\n do bárbaro Herodes, Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "3ª Dor — Jesus perdido em Jerusalém", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\n\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\n\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (2, 41-49)\n\n Todos os anos, os pais de Jesus iam a Jerusalém\npara a festa da Páscoa. Quando o menino completou\ndoze anos, eles foram para a festa, como de costume.\nTerminados os dias da festa, enquanto voltavam, Jesus\nficou em Jerusalém, sem que seus pais percebessem.\nPensando que se encontrasse na caravana, caminharam\num dia inteiro. Começaram então a procurá-lo entre os\nparentes e conhecidos. Mas não o encontrando,\nvoltaram a Jerusalém à sua procura. Depois de três dias,\no encontraram no templo, sentado entre os mestres,\nouvindo-os e fazendo-lhes perguntas.\n\nReflexão\n\n L.1 - Aos doze anos, todo menino judeu era\nlevado ao templo e entregue aos mestres da lei para que\nlhe ensinassem a Lei do Senhor, que se encontra no\nPentateuco, os primeiros cinco livros da Bíblia. Assim\nfizeram seus pais com Jesus. Só que os pais, quando já\nestavam no caminho de volta para Nazaré, se dão conta\nque o Menino não está na caravana.\n L.2 - Podemos imaginar a aflição de Maria e José\nque o procuram por toda parte, não o encontram e têm\nque voltar a Jerusalém. E já tinham feito o caminho de\num dia. É bom saber que Nazaré dista de Jerusalém\nmais de cem quilômetros. À angústia une-se o cansaço\nda viagem. Além do mais, Maria e José ainda\nguardavam na memória as ameaças de Herodes e a fuga\npara o Egito.\n L.3 - É dramática hoje a situação de tantas\ncrianças perdidas, que vagueiam pelas ruas e praças das\ncidades, fugidas de casa ou roubadas às suas famílias,\nmatriculadas pelo destino na escola das drogas, da\nprostituição e da violência, alvo elas próprias de todo\ntipo de violência. São as “crianças de rua” que vemos\npor aí: maltrapilhas, sujas, drogadas, dormindo na\ncalçada, pedindo esmola, assaltando os passantes.\nVivendo assim, o que vão aprender para a vida essas\ncrianças? Como poderão crescer sadias? Quando\n\naparecerá alguém que vá procurá-las e resgatá-las dessa\nsituação?\nOração\n\nC. Senhor Deus, nosso Pai, por três dias, Maria e José\n procuraram, aflitos, o filho Jesus. Suplicantes, vos\n pedimos: amparados pela Virgem das Dores,\n busquemos na penitência e na conversão o\n reencontro com o vosso Filho, e sejamos solidários\n com tantas crianças, que vagueiam pelas ruas e\n praças vítimas da injustiça social, da desagregação\n familiar e da violência. Por Cristo nosso Senhor.\nT. Amém!\nInvocações\n\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\nCanto\n Voltando do templo, Jesus não achais.\n Que susto sofrestes! Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "4ª Dor — Encontro no caminho do Calvário", "text": "C. Nós vos louvamos,\n Senhor Jesus Cristo e vos bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (23,26-28)\n Enquanto levavam Jesus, tomaram um certo\nSimão de Cirene, que voltava do campo, e mandaram-\nno carregar a cruz atrás de Jesus. Seguia-o uma grande\nmultidão do povo, bem como de mulheres que batiam\nno peito e choravam por ele. Jesus, porém, voltou-se\npara elas e disse: “Mulheres de Jerusalém, não choreis\npor mim! Chora por vós mesmas e por vossos filhos!”\n\n L.1 – O Evangelho não diz explicitamente se no\nmeio da “grande multidão que o seguia” ou das\n“mulheres que batiam no peito” estava também a mãe\nde Jesus, mas certamente ela devia estar. De fato, logo\ndepois o Evangelho de João diz que ela estava junto à\ncruz do Filho agonizante, ao lado do discípulo amado e\nde outras mulheres.\n\n L.2 - É o encontro doloroso da mãe aflita com o\nfilho condenado à morte. Ao sofrimento físico de Jesus\njunta-se o sofrimento daquela que vê o filho, que passara\na vinda pregando e fazendo o bem, ser incompreendido,\ninjustiçado, caluniado e condenado à morte de cruz.\nJesus e Maria unem-se na dor para realizar a obra de\nredenção da humanidade.\n L.3 - Quem nunca viu, nos dias de hoje, mães\nperderem seus filhos, vítimas da violência e da maldade\nhumana? Referindo-se a Maria, assim canta o poeta18:\n Tu és, ó mãe, toda mãe que hoje ama;\n tu és, ó mãe, toda a mãe que hoje chora\n seu filho morto, seu filho traído,\n mães aos milhares, mães amortalhadas!\n Filhos que sempre se estão a matar,\n Trata-se de frei DAVID M. TUROLDO, escritor e poeta da Ordem dos Servos de Maria, que\n compôs os hinos dos Ofícios Próprios OSM. Esses versos são do hino do Ofício das Leituras\n da festa da “Bem-aventurada Virgem Maria ao pé da Cruz”.\n\n Filhos vendidos, traídos, sem número,\n filhos feridos e em cruzes pregados:\n ímpia bandeira de um ímpio poder.\nOração\nC. Senhor Deus, nosso Pai, no caminho do Calvário,\n vosso filho Jesus e Maria sua mãe se encontram.\n Suplicantes, vos pedimos: a exemplo da Virgem das\n Dores, saibamos ir ao encontro dos que sofrem,\n compreendendo, compartilhando e aliviando suas\n dores. Por Cristo nosso Senhor.\nT. Amém!\n\nInvocações\n\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\nCanto\n\n Que dor indizível quando o encontrais\n com a cruz às costas. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "5ª Dor — Maria ao pé da cruz", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de\n Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de João (19,25-27)\n Junto à cruz de Jesus estavam de pé sua mãe e a\nirmã de sua mãe, Maria de Cléofas, e Maria Madalena.\nJesus, ao ver sua mãe, ao lado dela, o discípulo que ele\namava, disse à mãe: “Mulher, eis o teu filho!” Depois\ndisse ao discípulo: “Eis a tua mãe!” A partir daquela\nhora, o discípulo a acolheu junto de sim\n\nReflexão\n\n L.1 - É a cena clássica do Calvário, descrita por\nJoão e tão comentada pelos santos Padres da Igreja, que\na iconografia ilustrou com as mais variadas formas e\nestilos e que o poeta canta dizendo19: Sim, no\nCalvário, ó Mãe, tu choraste,\n ao pé da cruz, traspassada de dor:\n como pudeste sofrer tanto assim,\n sem sucumbir, nem fugir, nem gritar?\n L.2 - Eram poucos ao pé da Cruz. Dos doze\ndiscípulos, apenas um. De todos os que haviam sido\nbeneficiados pelos milagres e curas de Jesus, ninguém.\nMas lá estava Maria, a mãe, de pé, e outras mulheres.\nColocar-se com Maria aos pés das infinitas cruzes que\nafligem os homens e as mulheres do nosso tempo é\nmissão prioritária do cristão. “Tive fome e me destes de\ncomer; tive sede e me destes de beber; fui peregrino e\nme acolhestes; estive nu e me vestistes, enfermo e me\nvisitastes, preso e viestes ver-me...” (Mt 25,35-36)\n L.3 - Basta olhar ao nosso redor, abrir um jornal\nou ver um noticiário de TV para constatar quantas são\nas cruzes que afligem a humanidade de hoje. “Toda\ncriação espera ser libertada da escravidão”, exclama São\nPaulo (Rm 8,21). Que fazer? É nosso dever de cristãos e\nde Servos de Maria colocar-nos aos pés dessas infinitas\n Do Hino das Vésperas da festa da B. Virgem Maria ao pé da Cruz.\n\ncruzes, onde o Filho do Homem continua sendo\ncrucificado nos irmãos e irmãs, para levar-lhes conforto\ne esperança de libertação. Maria, a mãe da misericórdia\ne da compaixão, nos dá o exemplo. Seja ela a nossa\nimagem-guia.\nOração\nC. Senhor Deus, nosso Pai, que ao pé da cruz\n associastes a Virgem Maria à paixão e morte do\n vosso Filho, fazendo-a corredentora da humanidade.\n Suplicantes, vos pedimos: a exemplo da Virgem das\n Dores, saibamos colocar-nos a seu lado aos pés das\n cruzes da humanidade onde vosso Filho continua\n crucificado em nossos irmãos e irmãs, para levar-\n lhes conforto esperança de libertação. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave Maria, cheia de graça...\n T. Santa Maria, Mãe de Deus...\n C. Nossa Senhora das Dores,\n T. Rogai por nós!\nCanto\n A dor ainda cresce quando contemplais\n Jesus expirando. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "6ª Dor — Jesus depositado nos braços de Maria", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Marcos (15,43-46a)\n José de Arimateia, membro respeitável do\nSinédrio, que também esperava o reino de Deus, cheio\nde coragem foi a Pilatos pedir o corpo de Jesus.\n Pilatos ficou admirado quando soube que Jesus\nestava morto. Chamou o centurião e perguntou se tinha\nmorrido havia muito tempo. Informado pelo centurião,\n\nPilatos entregou o corpo a José. Ele comprou um lençol\nde linho, desceu Jesus da cruz e envolveu-o no lençol.\nReflexão\n L.1 – Eis a “Pietà” (a Piedade), obra-prima de\nMichelangelo, venerada na basílica de São Pedro, no\nVaticano, e reproduzida em milhares de cópias\nespalhadas pelo mundo inteiro. Maria, sentada,\naconchega ao colo seu filho morto. A perfeição dos\ntraços das imagens marmóreas de Jesus e de Maria e a\ndor reproduzida com solenidade e perfeição no rosto da\nmãe despertam piedade e compaixão.\n L.2 - Diante desse quadro, canta o poeta 20:\nPouco mais tarde da cruz o tiraram,\ne o depuseram, ó Mãe, em teu colo.\nNão parecias gerá-lo de novo?\ne qual criança de peito aleitá-lo?\n Eras o colo de todas as mães.\n Vendo-te assim, quem não há de chorar?\n Era uma cena jamais antes vista!\n És a Piedade que abraça quem sofre!\n L.3 - Abraçar a dor do irmão, abraçar a causa dos\npobres, dos excluídos, dos doentes, dos angustiados e\ndeprimidos, não é para os fracos. É para os fortes. Para\naqueles que, como Maria, sabem permanecer de pé junto\nà cruz e não se abalam nem desanimam diante do\nsofrimento. Para aqueles que alicerçam sua vida em Deus\ne na sua Palavra. Para aqueles que, diante da morte,\n Do hino das II Vésperas da solenidade de Nossa Senhora das Dores, 15 de setembro.\n\nacreditam na ressurreição, e por isso lutam para renovar\no mundo e se empenham com obras de caridade e de\nmisericórdia, a exemplo do bom samaritano. Sim, porque\nnão existe fé sem obras. “Mostra-me tua fé sem as obras\nque eu, por minhas obras, te mostrarei a fé“, diz São\nTiago.\nOração\nC. Senhor Deus, nosso Pai, estando “tudo consumado”,\n o corpo do vosso filho foi descido da cruz e entregue\n nos braços de sua mãe. Suplicantes, vos pedimos: a\n exemplo da Virgem das Dores, tenhamos os braços\n sempre abertos para acolher os excluídos da\n sociedade, escutar seus clamores e solidarizar-nos\n com eles na luta pela vida. Por Cristo nosso Senhor.\nT. Amém!\n Invocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, Mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n Canto\n No vosso regaço seu corpo abrigais,\n com ele abraçada, bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores."}, {"title": "7ª Dor — Sepultamento de Jesus", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de João (19,40-42)\n Eles pegaram então o corpo de Jesus e o\nenvolveram, com perfumes, em faixas de linho, do\nmodo como os judeus costumam sepultar. No lugar\nonde Jesus foi crucificado, havia um jardim e, no\njardim, um túmulo novo, onde ninguém tinha sido\nainda sepultado. Por ser dia de preparação para os\n\njudeus, e como o túmulo estava perto, foi lá que eles\ncolocaram Jesus.\n\n Reflexão\n\n L.1 - Foi um enterro de pobre, feito às pressas no\nfinal da tarde, e poucos o acompanharam, como reza a\nLiturgia:\n Para o sepulcro o levam amigos,\n não mais que sete, segundo João:\n foi o enterro mais pobre do mundo,\n ouve-se apenas a pedra a rolar... 21\nTudo parece ter chegado ao fim. A Mãe, João e os\npoucos amigos e amigas, depois que o túmulo foi\nfechado com a pedra, voltam para casa. A desolação é\ntotal. A dor da mãe alcança seu nível mais profundo:\nagora sem marido e sem filho. Estava só! É Nossa\nSenhora da Soledade.\n L.2 - Mas Ela não perde a esperança: seu Filho\nressuscitará, como ele mesmo disse. Ela o deposita no\nsepulcro, sim, mas espera sua ressurreição. Ademais,\nEla toma consciência do alcance das palavras de Jesus:\n«Eis aí o teu filho!» E assume a sua função de mãe de\ntodos os homens e mulheres. No Natal, tornara-se mãe\nde Jesus. Agora, no Calvário, mãe de todos os seres\n\n Hino das II Vésperas do Ofício da Solenidade de Nossa Senhora das Dores.\n\nhumanos. E, mais tarde, em Pentecostes, mãe da Igreja.\nMaria alcança a plenitude da maternidade.\n L.3 - Esta a fé que deve acompanhar-nos quando\nsepultamos uma pessoa querida: o corpo é posto debaixo\nda terra, mas sua “vida” continua. Uma vez gerados no\nventre materno, nossa “vida” dura para sempre: alguns\nanos, envolvida no corpo humano, depois, revestida de\num “corpo incorruptível”. Como será isso? Deus sabe\ne isso nos basta.\nOração\nC. Senhor Deus, nosso Pai, junto com alguns irmãos e\n irmãs, a Virgem Mãe, aflita, acompanhou seu filho à\n sepultura. Suplicantes, vos pedimos: a exemplo da\n Virgem das Dores, saibamos caminhar lado a lado\n com aqueles que sofrem, para criarmos com eles\n uma aliança de amor, que os ajude a superar o medo\n da morte com a esperança da ressurreição. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n\nCanto\n\n Sem filho, e tal filho! Então suportais\n cruel soledade. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores.\n\n[Termina-se a “Via Matris”, recitando a ladainha de\nNossa Senhora das Dores (cf. p.), seguida do oremos\n(cf. p. ) e da bênção final]."}]}, "ladainhas": [{"title": "Ladainha dos Servos de Maria", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nAve Maria, Virgem morada do Espírito, Rogai por nós!\nAve Maria, Virgem Mãe,\nAve Maria, Virgem fiel,\nAve Maria, Virgem sábia,\nAve Maria, Virgem prudente,\nAve Maria, Virgem orante,\nAve Maria, Mãe de Deus,\nAve Maria, Mãe de Cristo,\nAve Maria, Mãe do Salvador,\nAve Maria, Mãe do Homem novo,\nAve Maria, Mãe da graça,\nAve Maria, Mãe da misericórdia,\nAve Maria, sede da sabedoria,\nAve Maria, templo de santidade,\nAve Maria, arca da aliança,\nAve Maria, estrela do mar,\nAve Maria, escada do céu,\nAve Maria, porta do paraíso,\nAve Maria, conforto dos pobres,\nAve Maria, refúgio dos marginalizados,\nAve Maria, saúde dos enfermos,\nAve Maria, guia dos peregrinos,\nAve Maria, esperança dos pecadores,\nAve Maria, alegria dos teus servos,\nAve Maria, mestra da santidade,\nAve Maria, mestra da humildade,\nAve Maria, mestra da obediência,\nAve Maria, mestra da fortaleza,\nAve Maria, mestra da contemplação,\nAve Maria, mestra do serviço,\nAve Maria, fonte de vida,\nAve Maria, fonte de luz,\nAve Maria, fonte de beleza,\nAve Maria, fonte de alegria,\nAve Maria, fonte de perdão,\nAve Maria, fonte de comunhão,\nAve Maria, rainha dos humildes,\nAve Maria, rainha dos mansos,\nAve Maria, rainha dos misericordiosos,\nAve Maria, rainha dos puros de coração,\nAve Maria, rainha dos construtores da paz,\nAve Maria, rainha dos teus servos,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!\n\nOração\n\nÓ Deus, amigo dos homens, fiel à aliança e às promessas, que no anúncio a Maria realizastes a espera da humanidade, escutai a nossa oração: pela disponibilidade que encontrastes na Virgem Maria, filha de Sião e nossa irmã, fazei que nós, vossos servos, sejamos sempre dóceis à Palavra e abertos ao vosso Espírito. Por Cristo nosso Senhor. Amém!"}, {"title": "Ladainha de Santa Maria da Esperança", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nSanta Maria da esperança, Rogai por nós!\nSanta Maria do caminho,\nSanta Maria da luz,\nPlenitude de Israel,\nAurora do mundo novo,\nFonte da alegria messiânica,\nMãe de Deus,\nMãe do Messias libertador,\nMãe dos redimidos,\nMãe de todos os povos,\n\nDiscípula de Cristo,\nTestemunha de Cristo,\nIrmã dos homens,\nInício da Igreja,\nMãe da Igreja,\nModelo da Igreja,\nImagem da Igreja,\nServa do Senhor,\nServa da Palavra,\nServa do Reino,\nVirgem do silêncio,\nVirgem da escuta,\nVirgem do canto,\nVirgem da contemplação,\nMaria, dignidade da mulher,\nMaria, grandeza da mulher,\nMaria, destino da mulher,\nMulher bendita entre as mulheres,\nMulher fiel ao compromisso,\nMulher fiel no seguimento,\nMulher fiel ao pé da cruz,\n\nEstrela da evangelização,\nEducadora da fé,\nMestra da vida,\nPresença luminosa,\nPresença orante,\nPresença acolhedora,\nPresença operante,\nEsperança dos pobres,\nConfiança dos homens,\nSustentáculo da evangelização,\nAlívio dos oprimidos,\nDefesa dos inocentes,\nFortaleza dos perseguidos,\nConforto dos exilados,\nVoz de comunhão,\nVoz dos pobres,\nVoz do Espírito,\n\nSinal do rosto materno de Deus,\nSinal da presença do Pai,\nSinal da misericórdia do Filho,\nSinal da fecundidade do Espírito,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!\n\nOração\n\nPai Santo, que no caminho da Igreja, peregrina sobre a terra, colocastes como sinal luminoso a bem-aventurada Virgem Maria: por sua intercessão, sustentai nossa fé e reacendei nossa esperança, para que nenhum obstáculo nos desvie do caminho que leva à salvação. Por Cristo nosso Senhor. Amém!"}, {"title": "Ladainha de Puebla", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nDiscípula perfeita do Senhor, Libertai vosso povo.\nModelo do cristão,\nRealização mais alta do Evangelho,\nFace materna de Deus,\nRosto do homem novo,\nCoração tão grande quanto o mundo,\nMulher forte do povo,\nMulher pobre e sofredora,\nMulher perseguida e exilada,\nAnunciadora da justiça dos oprimidos,\nInspiradora da opção pelos pobres,\nMulher que dignifica a mulher,\nSinal do nosso corpo glorificado,\nSinal da criação redimida,\nSinal do homem todo salvo,\nIntercessora de todos os povos,\nDespertadora da fé no Cristo,\nEncarnação viva do evangelho,\nFiel companheira do Senhor,\nProtagonista, com Cristo, da história,\nGuarda do destino da América Latina,\nMãe educadora da fé,\nPedagoga do evangelho,\nEstrela da evangelização,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!"}], "sabado": {"intro": "TEMPO COMUM\n\"Falta ainda acenar à possibilidade de uma comemoração litúrgica frequente da Virgem \nSantíssima, mediante o recurso à memória de Santa Maria no sábado: memória antiga e discreta, \nque a flexibilidade do calendário atual e a multiplicidade de formulários do Missal tornam \nextremamente fácil e variada\" (Marialis Cultus, 9).\nNos sábados do Tempo Comum, não havendo outra memória obrigatória, celebra-se a memória de Santa \nMaria, usando-se o formulário da Liturgia das Horas do rito romano ou o Ofício próprio da Ordem.", "form1": "Invitatório\nAnt. Vinde, adoremos o Cristo Jesus, que nos deu Maria como Mãe e Senhora.\nSalmo invitatório como no Ordinário, p. 35. Ofício das Leituras\nHINO\nVamos servir nós também, ó irmãos,\nseguindo atentos o exemplo da Mãe:\nfechar-se em casa não pode sozinho\nquem Cristo traz dentro em seu coração.\nReis e princesas seus tronos já deixem\ne saiam todos dos grandes palácios;\nos sacerdotes, os templos deixando,\nlevem a graça ao encontro dos homens.\nE todos cantem o mesmo seu canto,\ndigam aos pobres: Já veio o Messias,\nem nossa carne mortal veio e vem:\neles serão do seu reino os herdeiros.\nA Igreja acolham os que são os últimos\ncom as palavras que disse Isabel,\ne os filhos inda no ventre das mães\nvibrem alegres por terem nascido.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com o respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDa alocução de Paulo VI aos participantes do Capítulo Geral da Ordem dos Servos de Maria\n(Roma, 12 de outubro de 1974)\nGloriai-vos de ser Servos da Mãe de Deus\nCom a mente e o espírito, tende sempre diante de vós o exemplo eminente e arrebatador da\nVirgem Maria, à qual a vossa Ordem está consagrada por um título especial. [Leitura completa\ndisponível no ofício impresso da Ordem.]\nRESPONSÓRIO cf. Lc 1,38; Mt 6,10\nR. Maria respondeu ao anjo: Eis aqui a serva do Senhor. * Deus faça em mim segundo a tua palavra.\nV. Quando orardes, dizei: Seja feita a vossa vontade assim na terra como no céu.\nR. Deus faça em mim segundo a tua palavra.\nLeitura alternativa\nDa \"Legenda sobre a origem da Ordem dos Servos da bem-aventurada Virgem Maria\"\nConsagram-se de modo especial ao serviço de Nossa Senhora\nA bem-aventurada Virgem Maria, Mãe de nosso Senhor Jesus Cristo, é o refúgio universal de\ntodos os pecadores, mãe universal de todos os justos e é reconhecida como Senhora comum de\ntodos os que servem a Cristo. [Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Unidos pelo vínculo da caridade e da fé, vivamos em comunhão fraterna sob a proteção de Nossa\nSenhora, * para servir a Deus e aos irmãos.\nV. Consagrando nossas vidas à bem-aventurada Virgem, ela será para nós refúgio especial, mãe\nsingular e Senhora nossa.\nR. Para servir a Deus e aos irmãos.\nOração\nÓ Deus misericordioso, atendei a oração dos vossos Servos reunidos para celebrar a memória da\nSanta Virgem Maria. Por sua maternal intercessão, livrai-nos de todos os perigos que nos ameaçam\nneste mundo. Por nosso Senhor.\nOu:\nSenhor, vós quisestes que a Santa Virgem Maria, vossa Serva, fosse mãe de Cristo e a ele estivesse\nsempre unida. Concedei-nos que, inspirados na Senhora nossa, testemunhemos o evangelho,\ncolocando-nos a serviço da salvação dos irmãos. Por nosso Senhor.\nLaudes\nHINO\nCom este nome veneram-te muitos:\nServos chamados de Santa Maria,\nirmãos eleitos p'ra amar e doar-se,\nqual povo nobre dos tempos de outrora.\nPor isso, a vida queremos cantar\nda que se fez do Senhor Serva humilde,\ndo Filho amado descido do céu,\npara ser servo de todos os homens.\nEste é o preceito do Filho divino:\n\"Quem quer seguir-me comece a servir\",\ne aquele que ama a amar recomece,\naté verter o seu sangue primeiro.\nA vida inteira sua Mãe o seguiu\naté a cruz, fielmente e em silêncio:\nassim co'os pobres ao mundo o entregou,\nco'eles cumprindo o comum sacerdócio.\nNão outra Igreja será verdadeira\ne fora disto não há sacramento:\nMaria Virgem é a Igreja primeira,\nela que disse: \"Eis aqui vossa serva\".\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Jt 13,14a.18ab.19\nJudite disse: Louvai a Deus, louvai-o! Louvai a Deus que não afastou a sua misericórdia da casa de\nIsrael. Ozias, príncipe do povo de Israel, disse-lhe: Bendita sejas, filha, pelo Deus Altíssimo, mais\nque todas as mulheres da terra, e bendito seja o Senhor Deus, Criador do céu e da terra.\nRESPONSÓRIO BREVE Lc 1,42.45\nR. Bendita és tu entre as mulheres, * e bendito é o fruto do teu ventre!\nV. Feliz és tu, ó Maria, que acreditaste no cumprimento das palavras do Senhor.\nR. E bendito é o fruto do teu ventre!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Bendita és tu entre as mulheres e bendito é o fruto do teu ventre!\nCântico evangélico\nAnt. Salve, Santa Maria, glória de Jesus Cristo! Vossos servos vos invocam, ó Virgem bendita!\nOu: Salve, fonte de clemência, Rainha do céu! Vosso olhar misericordioso a nós volvei.\nPRECES\nRenovados pela luz matinal, confiemos a Deus Pai, fonte do eterno esplendor, todas as esperanças e\npropósitos deste novo dia. Digamos juntos:\nR. Senhor, fazei-nos testemunhas da ressurreição de Cristo.\nPor intercessão de Santa Maria, vossa Serva, fazei que vos amemos de coração sincero,\n- e aceitemos vossa vontade com amor filial.\nPor intercessão de Santa Maria, Senhora nossa, inspirai-nos as palavras, sustentai o nosso trabalho e\nguiai-nos em tudo o que fizermos neste dia,\n- para que, gratos pelo dom da vida, façamos dela um instrumento de generoso serviço aos irmãos.\nPor intercessão de Santa Maria, sede da Sabedoria, derramai a luz da vossa verdade,\n- para que compreendamos sempre melhor os valores humanos e sagrados representados pela\nVirgem Maria.\nPor intercessão de Santa Maria, morada do Espírito Santo, fazei de nós templos do divino Paráclito,\n- para que a retidão da nossa conduta suba até vós como sacrifício de agradável odor.\nPai Nosso...\nOração\nO Deus misericordioso, atendei a oração dos vossos Servos reunidos para celebrar a memória da\nSanta Virgem Maria. Por sua maternal intercessão, livrai-nos de todos os perigos que nos ameaçam\nneste mundo. Por nosso Senhor.\nOu:\nSenhor, vós quisestes que a Santa Virgem Maria, vossa Serva, fosse mãe de Cristo e a ele estivesse\nsempre unida. Concedei-nos que, inspirados na Senhora nossa, testemunhemos o evangelho,\ncolocando-nos a serviço da salvação dos irmãos. Por nosso Senhor.", "form1Title": "SANTA MARIA DOS SEUS SERVOS", "form2": "Invitatório\nAnt. Vinde, adoremos a Cristo! Ele salvou a humanidade unindo a si Maria e a Igreja.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nVenham, irmãos, procurá-lo conosco:\nhá muitos séculos nós o perdemos,\njá não choramos assim como a Mãe,\nque por três dias ansiosa o procura!\nSem Jesus Cristo não temos mais Deus\ne nem irmãos uns dos outros nós somos:\na nossa casa tornou-se um deserto,\n\"Toda Sião é um funesto deserto!\"\nA própria Mãe pela mão nos conduza,\nricos ou pobres, ateus ou fiéis:\nMãe sendo ela de todos os crentes,\nmostre-nos onde poder encontrá-lo.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDa Constituição dogmática \"Lúmen Gentium\" do Concílio Vaticano II sobre a Igreja (n° 63-65)\nA Virgem Maria precedeu à Igreja qual seu protótipo\nEm virtude da graça da divina maternidade e da missão pela qual ela está unida com seu Filho\nRedentor, a bem-aventurada Virgem está também intimamente relacionada com a Igreja. Já Santo\nAmbrósio ensinava que a Mãe de Deus é o tipo da Igreja na ordem da fé, da caridade e da perfeita\nunião com Cristo. [Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. O Filho unigénito do Pai fez-se Filho da Virgem e Senhor de sua Mãe. * A cabeça foi gerada por\nMaria e os membros são frutos da Igreja.\nV. Cristo, em Maria se torna pequeno, e na Igreja se torna admiravelmente grande.\nR. A cabeça foi gerada por Maria e os membros são frutos da Igreja.\nLeitura alternativa\nDos \"Sermões\" de Santo Agostinho, bispo\nA Igreja: mãe santa e honrada, semelhante a Maria\nMeus irmãos, prestai bem atenção, rogo-vos, prestai bem atenção ao que disse Jesus, apontando\npara os discípulos: \"Aqui estão a minha mãe e os meus irmãos, porque aquele que fizer a vontade de\nmeu Pai que está nos céus, esse é meu irmão, irmã e mãe\" (cf. Mc 3,34-35; Mt 12,49-50).\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Santa Maria, Virgem e Mãe, no coração e no ventre gerais para o mundo o Filho do Pai; * à\nsombra do Espírito Santo, confiais plenamente na palavra de Deus.\nV. Feliz vós também, santa Igreja, virgem e mãe: cumprindo fielmente a vontade do Pai, na fonte\nbatismal gerais muitos filhos de Deus para a vida eterna.\nR. À sombra do Espírito Santo, confiais plenamente na palavra de Deus.\nOração\nO Deus, que sois guia do povo eleito, quisestes que a Santa Virgem, Mãe de Cristo, cabeça da\nIgreja, fosse também mãe espiritual dos cristãos; por sua maternal intercessão, concedei que todos\nos povos se tornem vossa Igreja. Por nosso Senhor.\nLaudes\nHINO\n\"Ventre feliz o de quem te gerou!\",\nem meio ao povo gritou a mulher,\ntoda inflamada com Suas palavras:\nporém só tu conhecias as coisas!\nDize, ó Mãe, o que foi que provaste,\nem Nazaré quando o Livro ele leu:\n\"Em mim repousa o Espírito Santo,\npalavra que hoje se cumpre!\" - dizia.\nContigo, ó Mãe, nós queremos segui-lo\npelos caminhos cantando a Deus Pai:\ntu a primeira que creste no Filho\ne nós a Igreja que escuta e caminha.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Ap 12,3a.4cd.5-6a\nApareceu um outro sinal no céu: um dragão colocou-se diante da mulher que estava para dar à luz, a\nfim de lhe devorar o filho, tão logo nascesse. Ela deu à luz o filho, um varão, que irá reger todas as\nnações com um cetro de ferro.\nRESPONSÓRIO BREVE\nR. Rios de água alegram a cidade de Deus, * a morada santa do Altíssimo.\nV. Deus aí está: nunca a cidade será destruída.\nR. A morada santa do Altíssimo.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Rios de água alegram a cidade de Deus, a morada santa do Altíssimo.\nCântico evangélico\nAnt. Ó Pai, vosso Filho unigénito tornou-se Filho de sua Serva e Senhor de sua Mãe: gerado por\nMaria e f
