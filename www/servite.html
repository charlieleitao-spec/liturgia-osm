z cair sobre ele a iniquidade de todos nós.\nR. Suas feridas nos curaram.\nSegunda leitura\nDas \"Homilias\" de Santo Amadeu de Lousana, bispo (Hom. V de laudibus b. Mariae V., passim; SC 72, p. 138-156)\nEstava junto à cruz mergulhada num vale de lágrimas\nHá dois tipos de martírio: um é externo, outro não; um é conhecido, outro não; um atormenta a carne, outro aflige a alma. Os apóstolos e os mártires passaram pelo martírio da carne, sacrificando suas vidas por amor à verdade e testemunhando a pessoa de Jesus. Vítimas por causa de Cristo, tomaram o cálice do Senhor e mereceram subir para a glória do céu pela cruz, e participar da vida eterna pela morte temporal.\nAo contrário, padeceram o martírio no espírito aqueles que suportaram em sua alma dores mais atrozes do que o sofrimento do corpo. Abraão sofreu no espírito, quando Deus lhe pediu que sacrificasse o seu filho Isaque, que tanto amava. Angustiava-se pelo intenso afeto paternal e pelo profundo amor que tinha para o filho. A gloriosa Virgem Maria passou pelo mesmo sofrimento, quando estava ao pé da cruz do Senhor. Mais próxima à cruz do que os outros, tornou-se mais bemaventurada.\nTomou o cálice, sofreu toda a paixão e, mitigando a sede na torrente da dor, suportou um sofrimento sem par. Ela seguiu Jesus, não apenas na alegria das consolações, mas também na angústia dos sofrimentos.\nEstava, pois, junto à cruz, contemplando o triste espetá-culo da cabeça do seu amado Filho, ungida com óleo entre os seus companheiros (SI 44,8), espancada com caniço e coroada de espinhos. Ela via seu Filho, o mais belo entre os filhos dos homens, sem nenhuma aparência humana e sem dignidade. Via o mais excelso entre todos desprezado e exposto à execração pública. Via o santo dos santos crucificado entre dois malfeitores. Via os olhos do homem mais insigne sendo humilhados. Via a cabeça daquele que tudo sustenta, caída sobre o ombro. Via a face de Deus desfigurada e sua beleza extinta.\nO santa memória, repleta de piedade e de lágrimas! Recordar o sofrimento glorioso desta santa alma e as angústias suportadas na morte de Cristo, enche-nos de amor por ela! A palidez do rosto de Jesus refletia-se no rosto de Maria. Ele padecia na carne, ela no coração. A morte do Senhor foi para ela mais amarga que a sua própria morte. Iluminada pelo Espírito Santo, Maria não duvidava que o Filho haveria de ressuscitar. Todavia, foi necessário beber o cálice do Pai e viver até o fim a Paixão. Esses acontecimentos foram profetizados pelo velho Simeão quando disse: \"Uma espada traspassará tua alma\" (Lc 2,35). Senhor Jesus, nem sequer tua Mãe poupaste da espada que lhe traspassou o coração!\nMaria podia, pois, fazer suas as palavras que se aplicam primeiramente a Cristo: \"O vós todos que passais pelo caminho, olhai e vede se há dor semelhante à minha dor!\" (Lm 1,12). Grande foi a dor de Maria e grande foi Maria na dor! Tudo era diferente do dia em que venerou o Filho, aclamado pelo coro dos anjos, glorificado pelos pastores e adorado pelos magos, que lhe ofereciam místicos dons! Agora, tudo era diferente: não, porém, na virtude, mas na tristeza; não na graça, mas na aflição. Ao pé da cruz, Maria crescia na virtude e se fortalecia na graça.\nCaríssimos, nas dificuldades imitemos a Mãe do Senhor e lembremos sua postura e sua fortaleza diante do sofrimento.\nRESPONSÓRIO\nR. Enquanto Jesus morria na cruz, Maria lá estava, sofrendo o martírio no coração. * Sustentada pelo amor maternal, ela abraçava a cruz do Filho.\nV. Uma lança traspassou o lado de Cristo; uma espada traspassou a alma de Maria.\nR. Sustentada pelo amor maternal, ela abraçava a cruz do Filho.\nLeitura alternativa\nDo Tratado \"Sobre o triunfo de Cristo\", de São Lourenço Giustiniani, bispo (Cap. 18; Opera omnia, ed. Venetiis 1720, p. 271-272)\nA ti eu confio minha Igreja na pessoa do discípulo\nNo Calvário, em tudo Maria via sinais da dor cruel que estava sofrendo. Mesmo assim, permanecia firme ao pé da cruz. Aí, como por um tríplice laço, sentia-se presa pela dor, pelo espanto e pelo amor.\nPela dor, porque a espada da paixão do Filho lhe traspassava a alma. E para onde ir com uma espada a traspas-sar-lhe a alma, e crucificada ela própria no coração?\nPelo espanto, porque, em silêncio, meditava sobre o Filho suspenso na cruz. Sabia que ele era o verdadeiro Deus e, portanto, por sua natureza, imune do sofrimento, imortal, invisível e santo. E quando meditava dentro de si essas verdades, e se deva conta que ele era ao mesmo tempo sujeito à dor e imune dela, mortal e imortal, visível e invisível, frágil e glorioso mais que todos, o espanto tomava conta dela. Como podia ficar atónita e imóvel pelo espanto? Quem perscruta a majestade divina - diz a Escritura -fica absorvido pela luz de sua glória (cf. Pr 25,27).\nPelo amor, por fim, porque tinha um só Filho, o mais belo e mais santo de todos, rico de virtudes e repleto de graças, ao qual estava intimamente ligada pelos laços do amor maternal.\nO espanto e o amor eram como dois riachos que fluíam sem parar até o rio da dor, e daí, qual torrente impetuosa de aflição, desaguava no coração da Virgem Maria. Por isso, nela aconteceu o que se lê nas Lamentações de Jeremias: \"O vós todos que passais pelo caminho, olhai e vede se existe dor igual à dor que me atormenta\" (Lm 1,12).\nJesus via sua Mãe abatida sob o pesado fardo da dor e, a seu lado, o discípulo amado que a consolava. Movido de compaixão, condoeu-se pelos dois mais do que sofria por suas próprias dores. Por isso, disse à Mãe: \"Mulher, eis aí teu filho\" (Jo 19,26). Entrego-te como filho o discípulo predileto, para que permaneça contigo: ele te obedecerá como filho, e nele, assim como em mim, encontrarás consolo.\nA entrega que te faço do discípulo encerra em si um mistério admirável. Ele representa, com efeito, a Igreja, virgem e pura. Eu a entrego a ti, na pessoa do discípulo. Ama-a, assim como me amas. Fortalece-a com tuas exortações. Anima-a com teus conselhos e ensina-lhe com teus exemplos. Quero que tu a tenhas em conta de filha; prote-ge-a com tuas orações e orienta-a para mim, enriquecida de todas as virtudes. A ela pedirei que te venere como mãe, te ame e encontre em ti o seu refúgio.\nDepois disse ao discípulo: \"Eis aí tua mãe\" (Jo 19,27). Serve-a, honra-a e toma meu lugar junto a ela. Qualquer reverência ou homenagem feita a ela, eu a considero feita a mim. Neste momento de aflição, conforta-a, sê-lhe amigo fiel e filho obediente.\nDepois de pronunciar essas palavras, intensificando-se a agonia da paixão e aproximando-se a hora da morte, ele se calou. A partir de então, segundo a ordem do Senhor, o discípulo a levou para sua casa (cf. Jo 19,27).\nRESPONSÓRIO\nR. Maria, aflita junto à cruz do Senhor, recebeu o testamento do amor de Deus: * tornou-se mãe de todos os homens.\nV. A todos ela abraça com amor de mãe, estejam ou não conscientes da redenção de Cristo.\nR. Tornou-se mãe de todos os homens.\nHino Te Deum, p. 36. Oração\nO Deus, quisestes que junto à cruz do vosso Filho estivesse sua Mãe, compartilhando de sua paixão. Guardai e aumentai na família humana os frutos de tão grande mistério. Por nosso Senhor.\nOu:\nO Deus, por vosso admirável desígnio, dispusestes prolongar a Paixão do vosso Filho nas infinitas cruzes da humanidade. Nós vos pedimos: assim como quisestes que ao pé da cruz de Jesus estivesse sua Mãe como companheira na dor, nós também, a exemplo da Virgem das Dores, possamos estar sempre ao lado dos irmãos que sofrem, para le-var-lhes conforto e esperança de libertação. Por nosso Senhor...\n\n\nLaudes\nHino\n\nEis que o silêncio no céu se propaga desde que o sangue parou de escorrer: ora até o Filho, inda vivo, emudece, enquanto a Mãe já há tempo calara.\nTodos agora parecem calar-se:\nvós que sois justos, tomai a palavra! O Mãe do justo, por que tu não falas?\nCumpre-se assim o mistério do mundo.\nQuando lançou o seu último grito, eis que do templo a cortina se rasga de cima a baixo, e a terra tremeu; grito como este jamais se escutara!\nAbrem-se então os sepulcros e as rochas, pelas estradas os mortos vagueiam:\nde corpos santos e brancos fantasmas vê-se invadida a cidade maldita.\nTudo mergulha nas trevas escuras da negra noite que cai sobre a terra:\ntão tenebrosa é a ausência de Deus, esta é a noite que a todos envolve.\nA Mãe também mergulhada nas trevas? Ela sozinha por nós todos crê: nós,\nao invés, hesitantes ficamos, sem decidir entre o medo e a fé.\nEscuta, ó Mãe, entre tanta miséria,\nos que confessam num grito incontido:\nFilho de Deus verdadeiro ele era e toda vítima é sempre teu filho.\nSALMODIA\nAnt. 1 Se morrermos com Cristo, nós cremos que com ele haveremos de viver.\nSalmos e cântico do domingo da Ia semana, p. 514.\n\nAnt. 2 Trazemos sempre em nosso corpo a morte de Jesus, a fim de que sua vida em nós se manifeste.\nAnt. 3 A mensagem da cruz é loucura para os que se opõem a Deus, mas é poder divino para os que buscam a salvação.\n\nLEITURA BREVE Zc 12,10\nDerramarei sobre a casa de Davi e sobre todo o habitante de Jerusalém um espírito de graça e de súplica, e eles olharão para mim. Quanto ao que traspassaram, eles o lamentarão como na lamentação de um filho único; eles chorarão como se chora o primogénito.\n\nRESPONSÓRIO BREVE\nR. Eis o Senhor que vem entre as nuvens e hão de vê-lo todos aqueles que o traspassaram. * E sobre ele hão de chorar todas as nações da terra.\nV. Eis o Cordeiro imolado, que tira o pecado do mundo.\nR. E sobre ele hão de chorar todas as nações.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Eis que o Senhor vem entre as nuvens e hão de vê-lo todos aqueles que o traspassaram. E sobre\nele hão de chorar todas as nações da terra.\n\nCântico evangélico\nAnt. Alegra-te agora, santa Mãe, tu que sempre estiveste intimamente unida ao Filho: com o sacrifício do teu coração no Calvário, tu o ofereceste ao Pai para a salvação de todos os povos.\nPreces\nElevemos nossas súplicas a Deus Pai, criador da vida, que, para salvar o mundo, associou a seu Filho a Virgem Maria, mulher forte. Digamos juntos:\n\nR. Salvai-nos, ó Deus, por vosso amor!\nPai, vosso Filho, nascido da Virgem Maria, é luz dos povos e sinal de contradição;\n    • concedei-nos que, caminhando pelas estradas do mundo, sigamos a Cristo, luz nas trevas, e o tenhamos sempre como nosso guia.\nPai, muitos rejeitam vosso Filho, Salvador do mundo, assim como no passado foram rejeitados os profetas;\n    • fazei que o acolhamos sempre de braços abertos em nossas casas.\nPai, vós concedestes um profundo espírito de fé a Maria, quando estava junto à cruz do Filho;\n    • dai-nos enxugar as lágrimas de nossos irmãos, transmi tindo-lhes esperança, e afastar o seu medo, suscitando a fé.\nMaria, Mãe de Cristo, esteve ao lado da igreja primitiva, massacrada pela perseguição;\n    • como ela, ajudai-nos a caminhar, ao lado dos pobres e oprimidos, rumo à conquista da tão esperada e sofrida liberdade.\nO pai, vós nunca nos impondes um peso superior às nossas forças;\n    • fazei que compreendamos o valor da nossa cruz e pos samos carregá-la confortados por Maria nossa Mãe.\n[A exemplo de Cristo que, pregado na cruz, abandonou-se à vontade do Pai e rezou por seus algozes, nós também supliquemos o Pai celestial, dizendo: Pai nosso...].\n\nOração\nO Deus, quisestes que junto à cruz do vosso Filho estivesse sua Mãe, compartilhando de sua Paixão. Guardai e aumentai na família humana os frutos de tão grande mistério. Por nosso Senhor...\n\nOu:\nO Deus, por vosso admirável desígnio, dispusestes prolongar a Paixão do vosso Filho nas infinitas cruzes da humanidade. Nós vos pedimos: assim como quisestes que ao pé da Cruz de Jesus estivesse sua Mãe como companheira na dor, nós também possamos estar sempre ao lado dos irmãos que sofrem, para levar-lhes conforto e esperança de libertação. Por nosso Senhor...\n\n\nHora Média\nAntífonas e salmos do dia da semana corrente. Hinos como no Ordinário, p. 40.\n\nOração das Nove Horas\nLEITURA BREVE Lm 1,12a\nÓ vós todos que passais pelo caminho, olhai e vede: há dor semelhante à minha dor? Como me maltrataram! O Senhor me afligiu no dia da sua ardente ira.\nV. Senhor, eu vos abri meu coração,\nR. e vós tivestes piedade de minhas lágrimas.\nOração das Doze Horas\nLEITURA BREVE Lm 1,16-17 a\nEis que choro, vertem lágrimas os meus olhos, pois longe de mim está quem me consola, animando meu coração. Maus filhos estão consternados porque o inimigo triunfou. Sião estende sua mão, sem que ninguém a console.\nV. Ouvi, povos todos, e vede a minha dor.\nR. Ouvi meus gemidos; não há ninguém que me console.\n\nOração das Quinze Horas\nLEITURA BREVE Lm l,20a.2,13\nOlha, Senhor, quão angustiado estou: fervem as minhas entranhas, revolve-se dentro de mim o coração. A quem te igualarei para consolar-te, virgem, filha de Sião? Porque grande como o mar é tua ruína: quem poderá curar-te?\nV. Chorando, vão semear a semente.\nR. Quem semeia com lágrimas, cantando há de ceifar.\n\nOração\n\nVésperas\nHino\n\nSim, no Calvário, ó Mãe, tu choraste, ao pé da cruz, traspassada de dor:\ncomo pudeste sofrer tanto assim,\nsem sucumbir, nem fugir, nem gritar?\n\nNada, porém, nos relata a Escritura\nque Filho ou Mãe então tenham chorado; do Filho diz-se que exorta as mulheres:\n\"Por mim não chorem, mas sim por seus filhos!\"\n\nDo alto do monte, no entanto, ele chora sobre a cidade que o amor recusara; chora também pela morte de Lázaro: lamenta a perda do amigo querido!\n\nMas, por que choram as trevas da noite suor de sangue e de lamentações?\nMãe, por acaso, tu lá não estavas? Sem Mãe, se sente perdido até Cristo!\n\nNão diz o Texto que tenhas chorado, recorda apenas o que tu disseste, quando no templo teu Filho perderas: \"Teu pai e eu, tão aflitos...\", e basta!\n\nO Mãe, ó Cristo, ensinai-nos também como é difícil chorar retamente:\nchorar sabermos o pranto dos justos e no alto monte mantermos silêncio.\n\nNão se profanem a dor, nem a morte:\ncoisa mais bela no mundo não há\nque o pranto humano sabermos chorar, sermos assim tua igreja silente.\nSalmodia\nAnt. 1 Junto à cruz de Jesus estava Maria, sua Mãe.\nSalmo 115\nLamentação do justo sofredor que confia no Senhor.\nDeixarei de beber o cálice que o Pai me deu? (Jo 18,11).\n    • Guardei a minha fé, mesmo dizendo:\n* \"É demais o sofrimento em minha vida!\"\n    • Confiei, quando dizia na aflição: *\n\"Todo homem é mentiroso! Todo homem!\"\n    • Que poderei retribuir ao Senhor Deus * por tudo aquilo que ele fez em meu favor?\n    • Elevo o cálice da minha salvação, * invocando o nome santo do Senhor.\n    • Vou cumprir minhas promessas ao Senhor * na presença de seu povo reunido.\n    • É sentida por demais pelo Senhor * a morte de seus santos, seus amigos.\n= Eis que sou o vosso servo, ó Senhor, † vosso servo que nasceu de vossa serva; * mas me quebrastes os grilhões da escravidão!\n    • Por isso oferto um sacrifício de louvor, * invocando o nome santo do Senhor.\n    • Vou cumprir minhas promessas ao Senhor * na presença de seu povo reunido;\n    • nos átrios da casa do Senhor, * em teu meio, ó cidade de Sião!\nAnt. 1 Junto à cruz de Jesus estava Maria, sua Mãe. Oração sálmica\nSenhor, vosso Filho pregado na cruz aceitou o cálice da nossa salvação. Inocente, entregou-se por nós pecadores, e sua morte foi preciosa aos vossos olhos. Por isso, vos pedimos: dai-nos beber cada dia o cálice da paixão, para que, ao findar esta vida, nos apresentemos diante de vós como oferta agradável. Por Cristo nosso Senhor.\n\nAnt. 2 Jesus, do alto da cruz, entrega à Virgem Maria o discípulo amado, e a proclama Mãe de todos os homens.\nSalmo 140,1-9\nA oração do justo sofredor sobe como incenso até junto de Deus\nEntregou-se por nós a Deus, como oferta e sacrifício de suave odor (Ef 5,2).\n-Senhor, eu clamo por vós, socorrei-me; * quando eu grito, escutai minha voz.\n    • Minha oração suba a vós como incenso, * e minhas mãos, como oferta da tarde!\n    • Ponde uma guarda em minha boca, Senhor, * e vigias às portas dos lábios!.\n\n    • Meu coração não deixeis inclinar-se * às obras más nem às tramas do crime;\n    • que eu não seja aliado dos ímpios, * nem partilhe de suas delícias!\n= Se o justo me bate é um favor;† porém jamais os perfumes dos ímpios * sejam usados na minha cabeça!\n    • Continuarei a orar fielmente, * enquanto eles se entregam ao mal!\n= Seus juízes, que tinham ouvido † as suaves palavras que eu disse, * do rochedo já foram lançados.\n= Como a mó rebentada por terra, † os seus ossos estão espalhados *\ne dispersos à boca do abismo.\n    • A vós, Senhor, se dirigem meus olhos, * em vós me abrigo: poupai minha vida.\n    • Senhor, guardai-me do laço que armaram * e da armadilha dos homens malvados.\n\nAnt. 2 Jesus, do alto da cruz, entrega à Virgem Maria o discípulo amado, e a proclama Mãe de todos os homens.\nOração sálmica\nPai santo, ao Cordeiro sem mancha, imolado no altar da cruz, quisestes associar a Virgem sua Mãe; concedei-nos que, unidos a ela, possamos transformar este sacrifício vespertino na oferta de uma vida santa. Por Cristo nosso Senhor.\nAnt.3 Ao discípulo amado e a toda a humanidade Cristo entrega a Virgem Maria para que a recebam como mãe.\nCântico (lPd 2,21-24)\nCristo, servo de Deus, ntregou-se voluntariamente à paixão.\n= O Cristo por nós padeceu, †\ndeixou-nos o exemplo a seguir. * Sigamos, portanto, seus passos!\nPecado nenhum cometeu, *\nnem houve engano em seus lábios.\n= Insultado, ele não insultava; † ao sofrer e ao ser maltratado, * ele não ameaçava vingança; entregava, porém, sua causa * Aquele que é justo juiz.\nCarregou sobre si nossas culpas * em seu corpo, no lenho da cruz,\n= para que, mortos aos nossos pecados, † na justiça de Deus nós vivamos. *\nPor suas chagas nós fomos curados.\nAnt.3 Ao discípulo amado e a toda a humanidade Cristo entrega a Virgem Maria para que a recebam como mãe.\nOração sobre o cântico\nSenhor, ao contemplarmos Cristo suspenso na cruz, suscitai nosso amor por ele. Inocente, carregou o peso dos nossos pecados e, manso, sujeitou-se à condenação injusta. Ajudai-nos, Senhor, a enfrentar as dificuldades da vida e a nunca retribuir mal com mal. Por Cristo nosso Senhor.\nLEITURA BREVE Hb 9,26-28\nIrmãos, foi uma vez por todas, no fim dos tempos, que Cristo se manifestou para abolir o pecado através do seu próprio sacrifício. E como é um fato que os homens devem morrer uma só vez, depois do que vem o julgamento, do mesmo modo, Cristo foi oferecido uma vez por todas para tirar os pecados da multidão. Ele aparecerá uma segunda vez, exclusão feita ao pecado, àqueles que o esperam para a salvação.\nRESPONSÓRIO BREVE\nR. Aproximemo-nos confiantes de Cristo, * para alcançarmos misericórdia e graça e obtermos a ajuda necessária.\nV. Dele a Virgem Maria nos obtém o dom da eterna salvação.\nR. Para alcançarmos misericórdia e graça e obtermos a ajuda necessária.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Aproximemo-nos confiantes de Cristo, para alcançarmos misericórdia e graça e obtermos a ajuda necessária.\nCântico evangélico\nAnt. Ao cair da tarde, o Senhor Jesus resgata com seu sangue o povo de Deus; Maria, Mãe da Igreja, sofre a seu lado.\nPreces\nRecordando o sacrifício vespertino que Jesus, na cruz, ofereceu ao Pai pela salvação do mundo, rezemos dizendo:\n\nR. Não permitais que se percam, Senhor, os irmãos que redimistes.\nCristo nosso Salvador, em vossa paixão, uma espada traspassou o coração da Virgem Maria;\n    • não permitais que nossa fé esmoreça na dúvida e nossa esperança se abale.\nJesus, nosso irmão, vós que no Calvário nos entregastes como mãe a vossa própria Mãe;\n    • concedei que possamos amá-la como vós a amastes, para sermos seus filhos verdadeiros. Cristo, nosso Mestre, do alto da cruz, nos revelastes plenamente o vosso mistério;\n    • fazei que, desprezando a sabedoria deste mundo, assi milemos a loucura da cruz. Cristo, nosso Rei, que transformastes o patíbulo da cruz em trono de glória;\n    • convertei nossos corações à vossa mensagem, para que, servindo-nos uns aos outros, possamos ser os primeiros a reinar junto convosco.\nCristo, nosso Sacerdote, que do altar da cruz descestes para libertar os justos das trevas da morte;\n    • fazei que nossos irmãos e irmãs defuntos ouçam a voz que os chama para a glória eterna.\n[A oração que Jesus havia ensinado ressoa em suas palavras na cruz: para que possamos ter seus mesmos sentimentos, contemplando-o na cruz, rezemos como ele nos ensinou: Pai nosso...].\n\nOração\n    15 de setembro"}]}};

const STABAT_I18N = {
  la: `Stabat Mater dolorósa\niuxta crucem lacrimósa,\ndum pendébat Fílius.\n\nCuius ánimam geméntem,\ncontristátam et doléntem\npertransívit gládius.\n\nO quam tristis et afflícta\nfuit illa benedícta\nMater Unigéniti!\n\nQuæ mærébat et dolébat,\nPia Mater, dum vidébat\nnati pœnas íncliti.\n\nQuis est homo qui non fleret,\nMatrem Christi si vidéret\nin tanto supplício?\n\nQuis non posset contristári,\nChristi Matrem contemplári\ndoléntem cum Fílio?\n\nPro peccátis suæ gentis\nvidit Iésum in torméntis\net flagéllis súbditum.\n\nVidit suum dulcem natum\nmoriéndo desolátum,\ndum emísit spíritum.\n\nEia Mater, fons amóris,\nme sentíre vim dolóris\nfac, ut tecum lúgeam.\n\nFac, ut árdeat cor meum\nin amándo Christum Deum,\nut sibi compláceam.\n\nSancta Mater, istud agas,\ncrucifíxi fige plagas\ncordi meo válide.\n\nTui nati vulneráti,\ntam dignáti pro me pati,\npœnas mecum divide.\n\nFac me tecum pie flere,\ncrucifíxo condolére,\ndonec ego víxero.\n\nIuxta crucem tecum stare,\nte libénter sociáre\nin planctu desídero.\n\nVirgo vírginum præclára,\nmihi iam non sis amára,\nfac me tecum plángere.\n\nFac, ut portem Christi mortem,\npassiónis fac consórtem,\net plagas recólere.\n\nFac me plagis vulnerári,\nfac me cruce inebriári\net cruóre Fílii.\n\nFlammis ne urar succénsus,\nper te, Virgo, sim defénsus\nin die iudícii.\n\nChriste, cum sit hinc exíre,\nda per Matrem me veníre\nad palmam victóriæ.\n\nQuando corpus moriétur,\nfac, ut ánimæ donétur\nparadísi glória. Amen.`,
  it: `Stava la Madre addolorata\nin lacrime accanto alla croce\nmentre il Figlio vi pendeva.\n\nE la sua anima gemente,\ncontristata e dolente,\nfu trapassata da una spada.\n\nOh, quanto triste e afflitta\nfu quella benedetta\nMadre dell'Unigenito!\n\nEssa piangeva e si doleva,\nla pia Madre, nel vedere\nle pene del suo Figlio glorioso.\n\nChi non piangerebbe\nse vedesse la Madre di Cristo\nin un tale supplizio?\n\nChi potrebbe non rattristarsi\ncontemplando la pia Madre\nsoffrire accanto al Figlio?\n\nPer i peccati del suo popolo\nvide Gesù nei tormenti\ne sottoposto ai flagelli.\n\nVide il suo dolce Figlio\nmorire abbandonato,\nquando rese lo spirito.\n\nO Madre, fonte d'amore,\nfammi sentire la forza del dolore,\nperché pianga con te.\n\nFa' che il mio cuore arda\nnell'amare Cristo Dio,\nperché io gli sia gradito.\n\nSanta Madre, fa' questo:\nimprimi le piaghe del Crocifisso\nfortemente nel mio cuore.\n\nDel tuo Figlio ferito,\nche si degnò di soffrire per me,\ndividi con me le pene.\n\nFammi piangere teneramente con te,\ncompiangere il Crocifisso,\nfinché io vivrò.\n\nStare accanto alla croce con te,\nunirmi volentieri a te\nnel pianto, desidero.\n\nVergine, gloria fra le vergini,\nnon essere ora amara con me,\nfammi piangere con te.\n\nFa' che io porti la morte di Cristo,\nfammi partecipe della sua passione\ne che io ricordi le sue piaghe.\n\nFammi ferire dalle sue piaghe,\nfammi inebriare dalla croce\ne dal sangue del Figlio.\n\nChe io non sia bruciato dalle fiamme,\nper te, Vergine, sia difeso\nnel giorno del giudizio.\n\nO Cristo, quando dovrò partire da qui,\nfa' che per mezzo della Madre io giunga\nalla palma della vittoria.\n\nQuando il corpo morirà,\nfa' che all'anima sia donata\nla gloria del paradiso. Amen.`,
  en: `At the Cross her station keeping,\nstood the mournful Mother weeping,\nclose to Jesus to the last.\n\nThrough her heart, His sorrow sharing,\nall His bitter anguish bearing,\nnow at length the sword has passed.\n\nO how sad and sore distressed\nwas that Mother, highly blessed,\nof the sole-begotten One!\n\nChrist above in torment hangs,\nshe beneath beholds the pangs\nof her dying glorious Son.\n\nIs there one who would not weep,\nwhelmed in miseries so deep,\nChrist's dear Mother to behold?\n\nCan the human heart refrain\nfrom partaking in her pain,\nin that Mother's pain untold?\n\nFor the sins of His own nation,\nshe saw Jesus wracked with torment,\nall with scourges rent.\n\nShe beheld her tender child,\nsaw Him hang in desolation,\ntill His spirit forth He sent.\n\nO thou Mother, fount of love,\ntouch my spirit from above,\nmake my heart with thine accord.\n\nMake me feel as thou hast felt,\nmake my soul to glow and melt\nwith the love of Christ my Lord.\n\nHoly Mother, pierce me through,\nin my heart each wound renew\nof my Savior crucified.\n\nLet me share with thee His pain,\nwho for all our sins was slain,\nwho for me in torments died.\n\nLet me mingle tears with thee,\nmourning Him who mourned for me,\nall the days that I may live.\n\nBy the Cross with thee to stay,\nthere with thee to weep and pray,\nis all I ask of thee to give.\n\nVirgin of all virgins blest,\nlisten to my fond request:\nlet me share thy grief divine.\n\nLet me, to my latest breath,\nin my body bear the death\nof that dying Son of thine.\n\nWound my heart with His who died,\nlet me share with thee His pain,\nInebriate me with the Cross and\nthe blood of thy dear Son.\n\nLest in flames I burn and die,\nin His awful judgment day,\nbe Thy Virgin, my defense.\n\nChrist, when I must hence depart,\ngrant that through thy Mother's merit\nI may reach the palm of victory.\n\nWhen to dust my body turns,\ngrant that to my soul be given\nthe glory of paradise. Amen.`

- Ao seu encontro caminhemos com louvores, *
e com cantos de alegria o celebremos!

- Na verdade, o Senhor é o grande Deus, *
o grande Rei, muito maior que os deuses todos.

- Tem nas mãos as profundezas dos abismos, *
as alturas das montanhas lhe pertencem;

- o mar é dele, pois foi ele quem o fez, *
e a terra firme suas mãos a modelaram.

= Vinde adoremos e prostremo-nos por terra, *
e ajoelhemos ante o Deus que nos criou!

= Porque ele é o nosso Deus, nosso Pastor, †
e nós somos o seu povo e seu rebanho, *
as ovelhas que conduz com sua mão.

= Oxalá ouvísseis hoje a sua voz: †
"Não fecheis os corações como em Meriba, *
como em Massa, no deserto, aquele dia,

- em que outrora vossos pais me provocaram, *
apesar de terem visto as minhas obras".

- Quarenta anos desgostou-me aquela raça †
e eu disse: "Eis um povo transviado, *
seu coração não conheceu os meus caminhos!"

- E por isso lhes jurei na minha ira: *
"Não entrarão no meu repouso prometido!"

- Glória ao Pai, ao Filho e ao Espírito Santo, *
como era no princípio, agora e sempre. Amém!`;

// ===================== i18n helpers =====================
let LANG = 'pt';
function t(key){
  return (I18N[LANG] && I18N[LANG][key]) || I18N.pt[key] || key;
}

function todayInfo(){
  const d = new Date();
  const months = MONTHS_I18N[LANG] || MONTHS_I18N.pt;
  const weekdays = WEEKDAYS_I18N[LANG] || WEEKDAYS_I18N.pt;
  return { day:d.getDate(), month:d.getMonth()+1, weekday:weekdays[d.getDay()], monthName:months[d.getMonth()] };
}

function findSaintForToday(){
  const t = todayInfo();
  return SANTORAL.find(s => s.day === t.day && s.month === t.month) || null;
}

function findNextSaint(){
  const t = todayInfo();
  const withKey = SANTORAL.map(s => ({...s, key: s.month*100+s.day}));
  const todayKey = t.month*100+t.day;
  const future = withKey.filter(s=>s.key > todayKey).sort((a,b)=>a.key-b.key);
  if(future.length) return future[0];
  return withKey.sort((a,b)=>a.key-b.key)[0];
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Preserva integralmente a composição do texto-fonte.
// Estrofes são separadas somente pelas linhas em branco já existentes;
// *, †, hífens e outros sinais litúrgicos nunca são usados para reconstruí-las.
function formatLiturgicalStanzas(value){
  return String(value || '')
    .replace(/\r\n?/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .trim();
}
function formatLitanyStanzas(value){
  return formatLiturgicalStanzas(value);
}
function renderWithLitanySpacing(text){
  return renderPrayer(text);
}
// render a prayer block, separating paragraphs while preserving line breaks inside each paragraph
function renderPrayer(text){
  const formatted = formatLiturgicalStanzas(text);
  const paragraphs = formatted
    .split(/\n[ \t]*\n+/)
    .map(paragraph => paragraph.trim())
    .filter(Boolean);
  return paragraphs.map(paragraph => {
    const esc = escapeHtml(paragraph);
    const marked = esc.replace(/^(D\.|T\.|C\.|L\.\d?|L\.|V\.|R\.|\u2123\.|\u211f\.)/gm, '<span class="rubric">$1</span>');
    return `<p class="prayer-paragraph">${marked}</p>`;
  }).join('');
}

const LITURGICAL_HEAD_RE = /^(?:\d+[.)-]?\s*)?(HINO|SALMODIA|PRIMEIRA LEITURA|SEGUNDA LEITURA|LEITURA BREVE|RESPONS[ÓO]RIO(?: BREVE)?(?:\s+.*)?|C[ÂA]NTICO EVANG[ÉE]LICO|PRECES|PAI[- ]NOSSO|ORA[ÇC][ÃA]O|CONCLUS[ÃA]O)\s*[:.-]?\s*$/i;

// Estrutura o ofício sem alterar, completar ou reconstruir o texto-fonte.
// Linhas e estrofes procedem exclusivamente das quebras existentes na fonte.
function renderLiturgicalHourContent(text){
  const root = document.createElement('div');
  root.className = 'today-servita-reader';
  const lines = formatLiturgicalStanzas(text).split('\n');
  let block = null;
  let currentHead = '';
  let stanza = null;
  let precesCount = 0;

  function startBlock(label){
    block = document.createElement('section');
    block.className = 'litblock';
    currentHead = String(label || '').replace(/^\d+[.)-]?\s*/, '').replace(/\s*[:.-]?\s*$/, '').toUpperCase();
    precesCount = 0;
    stanza = null;
    if(label){
      const heading = document.createElement('div');
      heading.className = 'litheading';
      heading.textContent = label;
      block.appendChild(heading);
    }
    root.appendChild(block);
  }
  function add(value, className='littext', target=block){
    if(!target){ startBlock(''); target = block; }
    const node = document.createElement('div');
    node.className = className;
    node.textContent = value;
    target.appendChild(node);
    return node;
  }
  function addStanzaLine(line){
    if(!stanza){
      stanza = document.createElement('div');
      stanza.className = currentHead === 'HINO' ? 'hymn-stanza' : 'psalm-stanza';
      block.appendChild(stanza);
    }
    add(line, currentHead === 'HINO' ? 'hymn-stanza-line' : 'psalm-verse', stanza);
  }
  function splitReadingLine(line){
    const match = line.match(/^((?:cf\.\s*)?(?:[1-3]\s*)?[A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-Za-zÁ-ú.]*\s+\d{1,3}[,.:]\d{1,3}[a-z]?(?:[-–]\d{1,3}[a-z]?)?(?:\.\d{1,3}[a-z]?(?:[-–]\d{1,3}[a-z]?)?)*(?:\s*;\s*(?:\d{1,3}[,.:])?\d{1,3}[a-z]?(?:[-–]\d{1,3}[a-z]?)?)*)\s+(.*)$/i);
    if(!match) return false;
    add(match[1].trim(), 'reading-ref');
    add(match[2].trim(), 'reading-body');
    return true;
  }
  function addPrecesLine(line){
    // Mantém o texto integral e recupera apenas as intenções explicitamente
    // iniciadas por uma nova invocação na própria fonte.
    const intentions = line.split(/(?<=\.)\s+(?=(?:Pastor eterno|Senhor Jesus|Cristo(?: ressuscitado)?),)/);
    intentions.forEach(intention => add(intention, precesCount++ === 0 ? 'preces-intro' : 'preces-intention'));
  }

  lines.forEach(raw => {
    if(!raw.trim()){
      stanza = null;
      return;
    }
    const line = raw.trim().replace(/^[•▪◦]\s*/, '');
    let match;

    if((match = line.match(/^(ORA[ÇC][ÃA]O|C[ÂA]NTICO EVANG[ÉE]LICO)\s*(\([^)]*\))\s*$/i))){
      startBlock(match[1]);
      add(match[2].slice(1,-1).trim(), 'rubric');
      return;
    }
    if((match = line.match(/^(LEITURA BREVE|RESPONS[ÓO]RIO BREVE|RESPONS[ÓO]RIO|SALMODIA)\b\s*[:.–—-]?\s*(.*)$/i))){
      startBlock(match[1]);
      const rest = match[2].trim();
      if(rest){
        if(/^LEITURA/i.test(match[1])){
          if(!splitReadingLine(rest)) add(rest, 'reading-body');
        }else{
          add(rest, /^RESPONS/i.test(match[1]) ? 'response' : 'rubric');
        }
      }
      return;
    }
    if(LITURGICAL_HEAD_RE.test(line)){
      startBlock(line);
      return;
    }
    if((match = line.match(/^HINO\b\s*(\([^)]*\))?\s*(.*)$/i))){
      startBlock('HINO');
      if(match[1]) add(match[1].slice(1,-1).trim(), 'rubric');
      if(match[2]) addStanzaLine(match[2].trim());
      return;
    }
    if(!block) startBlock('');

    if(/^(?:Ant\.|Antífona)\s*\d*/i.test(line)){ stanza=null; add(line,'antiphon'); return; }
    if(/^(Salmo|Cântico|C[âa]ntico)\s+/i.test(line)){ stanza=null; add(line,'psalm-title'); return; }
    if(/^(V\.|R\.|℣\.|℟\.)\s*/.test(line)){ stanza=null; add(line, currentHead==='PRECES'?'preces-response':'response'); return; }
    if(/^(Escolhe-se|Salmos? do|Salmos? e cântico|Como no (?:Comum|Ordinário|Próprio)|Do Comum|Quando esta memória|Antífona e salmos|Salmodia complementar)/i.test(line)){
      stanza=null; add(line,'rubric'); return;
    }
    if(/^(PRIMEIRA LEITURA|SEGUNDA LEITURA|LEITURA BREVE)$/.test(currentHead)){
      if(splitReadingLine(line)) return;
      if(/^(Da|Do|Dos|Das)\s+/.test(line) && line.length < 180) add(line,'reading-ref');
      else add(line,'reading-body');
      return;
    }
    if(currentHead==='HINO' || currentHead==='SALMODIA'){
      addStanzaLine(line);
      return;
    }
    if(currentHead==='PRECES'){
      addPrecesLine(line);
      return;
    }
    if(/^(ORAÇÃO|PAI[- ]NOSSO|CONCLUSÃO)$/.test(currentHead)){
      add(line,'liturgical-prayer');
      return;
    }
    add(line);
  });
  // O invólucro carrega o escopo visual canônico do Hoje na Família Servita.
  // Devolver somente innerHTML descartava essa classe e reativava o cartão antigo.
  return root.outerHTML;
}

// Splits a saint's raw "oficio" text into its canonical-hour sections:
// Invitatório (merged into Ofício), Ofício das Leituras, Laudes, Hora Média, Vésperas (I/II merged).
function splitOficioByHour(text){
  const HEADER_RE = /^(Invitat[oó]rio|Of[ií]cio das Leituras|Laudes|Hora M[eé]dia|I Vésperas|II Vésperas|Vésperas)[ \t]*$/gm;
  const matches = [];
  let m;
  while((m = HEADER_RE.exec(text)) !== null){
    matches.push({ label: m[1], start: m.index, contentStart: m.index + m[0].length });
  }
  const buckets = { invitatorio: [], oficio: [], laudes: [], horaMedia: [], vesperas: [] };
  function bucketFor(label){
    if(label === 'Laudes') return 'laudes';
    if(label === 'Hora Média' || label === 'Hora Media') return 'horaMedia';
    if(label === 'Vésperas' || label === 'I Vésperas' || label === 'II Vésperas') return 'vesperas';
    if(label === 'Invitatório' || label === 'Invitatorio') return 'invitatorio';
    return 'oficio'; // Ofício das Leituras
  }
  if(matches.length === 0){
    const trimmed = text.trim();
    if(trimmed) buckets.oficio.push({ label:null, text: trimmed });
    return buckets;
  }
  // text before the first header
  const pre = text.slice(0, matches[0].start).trim();
  if(pre) buckets.oficio.push({ label:null, text: pre });
  for(let i=0;i<matches.length;i++){
    const seg = matches[i];
    const end = (i+1 < matches.length) ? matches[i+1].start : text.length;
    const segText = text.slice(seg.contentStart, end).trim();
    if(!segText) continue;
    // omit the label when it's redundant with the section's own card title
    const skipLabel = (seg.label === 'Invitatório' || seg.label === 'Invitatorio' || seg.label === 'Ofício das Leituras' || seg.label === 'Laudes' ||
                        seg.label === 'Hora Média' || seg.label === 'Hora Media' ||
                        (seg.label === 'Vésperas'));
    buckets[bucketFor(seg.label)].push({ label: skipLabel ? null : seg.label, text: segText });
  }
  return buckets;
}

function renderFinalAntifonaBlock(){
  if(!state.finalAntifona || !FINAL_ANTIFONAS.find(a => a.key === state.finalAntifona)){
    state.finalAntifona = 'salve';

  const tabs = FINAL_ANTIFONAS.map(a => `<button class="hour-tab-btn small ${state.finalAntifona===a.key ? 'active' : ''}" onclick="setFinalAntifona('${a.key}')">${escapeHtml(a.season)}</button>`).join('');
  const active = FINAL_ANTIFONAS.find(a => a.key === state.finalAntifona);
  return `
    <div class="hour-divider"></div>

    <div class="hour-tabs" style="margin-bottom:10px;">${tabs}</div>

      <div style="font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:.04em; color:var(--text-faint); margin-bottom:6px;">${escapeHtml(active.titleLat)}</div>
      <div>${renderPrayer(active.pt)}</div>
    </div>
  `;
}

function insertCanticleAfterAntiphon(text, canticleText){
  const re = /(C[âÂ]ntico [Ee]vang[eé]lico[^\n]*\n[^\n]*)/;
  if(re.test(text)){
    return text.replace(re, (m) => `${m}\n\n${canticleText}`);
  }
  return text; // no antiphon found in this segment; leave unchanged
}

function wrapSection(text){ return text ? [{label:null,text}] : []; }

function renderOficioTabs(oficioData){
  let buckets;
  if(oficioData && typeof oficioData==='object' && oficioData.horas){
    const h=oficioData.horas;
    const wrap=(value,label=null)=>{
      if(!value)return [];
      if(typeof value==='string')return value.trim()?[{label,text:value}]:[];
      const entries=[value,...(Array.isArray(value.alternativas)?value.alternativas:[])];
      return entries.filter(item=>item&&typeof item==='object'&&(item.texto||item.text)).map((item,index)=>({
        label:item.titulo||item.title||(index===0?label:'Leitura alternativa'),
        text:item.texto||item.text
      }));
    };
    buckets={
      invitatorio:wrap(h.invitatorio),
      oficio:wrap(h.oficio_leituras),
      laudes:wrap(h.laudes),
      horaMedia:wrap(h.hora_media),
      vesperas:wrap(h.vesperas)
    };
  }else if(oficioData && typeof oficioData==='object' && Array.isArray(oficioData.secoes)){
    const text=oficioData.secoes.map(s=>[s.titulo||'',s.texto||s.text||''].filter(Boolean).join('\n')).join('\n\n');
    buckets={invitatorio:[],oficio:wrapSection(text),laudes:[],horaMedia:[],vesperas:[]};
  }else if(oficioData && typeof oficioData==='object' && (oficioData.oficio_leituras||oficioData.oracao)){
    const reading=oficioData.oficio_leituras||{},alternatives=Array.isArray(reading.alternativas)?reading.alternativas:[];
    const sections=alternatives.filter(item=>item&&item.texto).map(item=>({label:item.titulo||'Leitura',text:item.texto}));
    if(typeof oficioData.oracao==='string'&&oficioData.oracao.trim())sections.push({label:'Oração',text:oficioData.oracao});
    buckets={invitatorio:[],oficio:sections,laudes:[],horaMedia:[],vesperas:[]};
  }else{
    buckets = splitOficioByHour(String(oficioData||''));
  }
  const order = [
    { key:'invitatorio', title:t('hourInvitatorio') },
    { key:'oficio', title:t('hourOficio') },
    { key:'laudes', title:t('hourLaudes') },
    { key:'horaMedia', title:t('hourHoraMedia') },
    { key:'vesperas', title:t('hourVesperas') },
  ].filter(o => buckets[o.key] && buckets[o.key].length);

  if(!order.length) return '';
  if(!state.oficioTab || !order.find(o => o.key === state.oficioTab)){
    state.oficioTab = order[0].key;
  }
  const tabs = order.map(o => `<button class="hour-tab-btn ${state.oficioTab===o.key ? 'active' : ''}" onclick="setOficioTab('${o.key}')">${escapeHtml(o.title)}</button>`).join('');
  const active = order.find(o => o.key === state.oficioTab);
  const segs = buckets[active.key];
  const canticleText = active.key === 'laudes' ? BENEDICTUS_TEXT : (active.key === 'vesperas' ? MAGNIFICAT_TEXT : null);
  const body = segs.map(s => {
    const txt = active.key === 'invitatorio' ? `${s.text}\n\n${INVITATORIO_SALMO}` : (canticleText ? insertCanticleAfterAntiphon(s.text, canticleText) : s.text);
    return `${s.label ? `<div class="hour-sublabel">${escapeHtml(s.label)}</div>` : ''}<div>${renderLiturgicalHourContent(txt)}</div>`;
  }).join('<div class="hour-divider"></div>');
  const finalAntifona = active.key === 'vesperas' ? renderFinalAntifonaBlock() : '';
  return `
    <div class="hour-tabs">${tabs}</div>
    <div class="hour-tab-content fade-in ${active.key==='invitatorio'?'invitatorio-content':active.key==='oficio'?'oficio-leituras-content':active.key==='laudes'?'laudes-content':active.key==='horaMedia'?'hora-media-content':active.key==='vesperas'?'vesperas-content':''}">${body}${finalAntifona}</div>
  `;
}

  state.detailId = id;
  state.showOficio = false;
  state.oficioTab = null;
  state.finalAntifona = null;
  render();

  window.scrollTo(0,0);

  state.devo = key;
  state.devoSub = sub !== undefined ? sub : null;
  state.oficioTab = null;

function viewHoje(){
  const ti = todayInfo();
  const saint = findSaintForToday();
  const next = saint ? null : findNextSaint();

  let saintHtml;
  if(saint){
    saintHtml = `
      <div class="card saint-card fade-in">
        <span class="rank">${escapeHtml(saint.rank || t('memoriaBadge'))}</span>
        <h2>${escapeHtml(saint.title)}</h2>
        <div class="date-line">${escapeHtml(saint.date)} · Ordo Servorum Mariæ</div>
        ${langNoteHtml()}
        <div class="link-row"><button class="btn-link" onclick="openDetail(${saint._id})">${escapeHtml(t('readBio'))}</button></div>
      </div>`;
  } else {
    saintHtml = `
      <div class="card saint-card fade-in">
        <span class="rank">${escapeHtml(t('hojeBadge'))}</span>
        <p class="empty-note">${escapeHtml(t('noSaintToday'))} <b style="color:var(--gold-soft); font-style:normal;">${escapeHtml(next.title)}</b>, ${escapeHtml(t('em'))} ${escapeHtml(next.date)}.</p>
        <div class="link-row"><button class="btn-link" onclick="openDetail(${next._id})">${escapeHtml(t('viewCelebration'))}</button></div>
      </div>`;
  }

  return `
    <div class="hero-date fade-in">
      <div class="weekday">${escapeHtml(ti.weekday)}</div>
      <div class="day">${ti.day}</div>
      <div class="month">${LANG==='pt'?'de ':''}${escapeHtml(ti.monthName)}</div>
      <div class="hero-divider"></div>
    </div>

    <div class="section-title">${escapeHtml(t('todaySection'))}</div>
    ${saintHtml}

    <div class="section-title">${escapeHtml(t('dailyPrayerSection'))}</div>
    <div class="card fade-in">
      <div class="toggle-row">
        <button class="toggle-btn ${state.angelus==='anjo'?'active':''}" onclick="setAngelus('anjo')">${escapeHtml(t('anjoLabel'))}</button>
        <button class="toggle-btn ${state.angelus==='rainha'?'active':''}" onclick="setAngelus('rainha')">${escapeHtml(t('rainhaLabel'))}</button>
      </div>
      <div class="prayer-block">${renderPrayer(dailyPrayerText(state.angelus))}</div>
    </div>
  `;
}

function viewSantoral(){
  if(state.detailId !== null){
    return viewDetail(state.detailId);
  }
  const q = state.search.trim().toLowerCase();
  const filtered = q ? SANTORAL.filter(s => s.title.toLowerCase().includes(q) || s.date.toLowerCase().includes(q)) : SANTORAL;
  const months = MONTHS_I18N[LANG] || MONTHS_I18N.pt;

  let listHtml = '';
  if(!filtered.length){
    listHtml = `<div class="no-results">${escapeHtml(t('noResults'))} "${escapeHtml(state.search)}".</div>`;
  } else if(q){
    listHtml = filtered.map(rowHtml).join('');
  } else {
    for(let m=1; m<=12; m++){
      const items = filtered.filter(s=>s.month===m);
      if(!items.length) continue;
      listHtml += `<div class="month-group"><div class="month-label">${months[m-1]}</div>${items.map(rowHtml).join('')}</div>`;
    }
  }

  return `
    <div class="section-title">${escapeHtml(t('santoralSection'))}</div>
    <p style="color:var(--text-muted); font-size:0.9688rem; line-height:1.6; margin:-4px 0 18px;">
      ${escapeHtml(t('santoralIntro'))}
    </p>
    ${langNoteHtml()}
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="${escapeHtml(t('searchPlaceholder'))}" value="${escapeHtml(state.search)}" oninput="onSearch(this.value)">
    </div>
    ${listHtml}
  `;
}

function coroaGuidedSteps(text){
  const source = String(text || '').trim();
  const litaniaAt = source.indexOf('LADAINHA');
  const beforeLitania = litaniaAt >= 0 ? source.slice(0, litaniaAt).trim() : source;
  const painRe = /(?=\dª DOR:)/g;
  const firstPain = beforeLitania.search(painRe);
  const opening = firstPain >= 0 ? beforeLitania.slice(0, firstPain).trim() : beforeLitania;
  const pains = firstPain >= 0 ? beforeLitania.slice(firstPain).split(painRe).map(s=>s.trim()).filter(Boolean) : [];
  const steps = [{kind:'intro', title:'Prepare-se para rezar', text:'Faça o sinal da cruz e coloque-se na presença de Deus. Em seguida, contemple com Maria o mistério da Paixão de Cristo.', body:opening}];
  pains.forEach((pain, index)=>steps.push({kind:'pain', number:index+1, title:'Dor de Nossa Senhora', text:pain}));
  if(litaniaAt >= 0) steps.push({kind:'litania', title:'Ladainha de Nossa Senhora das Dores', text:source.slice(litaniaAt).trim()});
  steps.push({kind:'finish', title:'Coroa concluída', text:'Permaneça alguns instantes em silêncio e agradeça a Deus pela companhia de Maria no caminho da cruz.'});
  return steps;
}

  const max = coroaGuidedSteps(raw).length - 1;
  state.coroaGuidedStep = Math.min(max, state.coroaGuidedStep + 1); render(); window.scrollTo(0,0);
}

// ===================== settings panel =====================
function toggleSettings(){
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('settingsBtn');
  const isHidden = panel.hasAttribute('hidden');
  if(isHidden){ panel.removeAttribute('hidden'); btn.classList.add('active'); }
  else { panel.setAttribute('hidden',''); btn.classList.remove('active'); }
}

function applyStaticI18n(){
  document.documentElement.setAttribute('lang', LANG === 'pt' ? 'pt-BR' : LANG);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('#langGroup .chip').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

function setLanguage(lang){
  LANG = lang;
  try{ localStorage.setItem('santoral-osm-lang', lang); }catch(e){}
  applyStaticI18n();
  render();
}

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('osmTheme', theme); localStorage.setItem('santoral-osm-theme', theme); }catch(e){}
  updateThemeChips();
}
function updateThemeChips(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const lightChip = document.getElementById('themeChipLight');
  const darkChip = document.getElementById('themeChipDark');
  if(lightChip) lightChip.classList.toggle('active', current === 'light');
  if(darkChip) darkChip.classList.toggle('active', current === 'dark');
}

// ===================== font size control =====================
const FONT_MIN = 13, FONT_MAX = 22, FONT_STEP = 1;
function changeFontSize(dir){
  const current = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  let next = Math.round(current + dir * FONT_STEP);
  next = Math.max(FONT_MIN, Math.min(FONT_MAX, next));
  document.documentElement.style.fontSize = next + 'px';
  try{ localStorage.setItem('santoral-osm-fontsize', next); localStorage.setItem('osmReaderScale', (next/16).toFixed(2)); }catch(e){}
}

// ===================== init =====================
async function initServite(){
  const [santoralData, oficiosData] = await Promise.all([
    fetch('data/santoral.json').then(r=>r.json()),
    fetch('data/oficios-osm.json').then(r=>r.json())
  ]);
  const celebracoes = oficiosData && oficiosData.schema_version===2 ? oficiosData.celebracoes : {};
  SANTORAL = santoralData.map((item,index)=>{
    const key=String(item.month).padStart(2,'0')+'-'+String(item.day).padStart(2,'0');
    const lit=celebracoes[key]||null;
    return {...item, special:item.special??'', oficio:lit&&lit.tipo_material!=='sem_material_proprio' ? lit.material : null, tipo_material:lit?.tipo_material||'sem_material_proprio', _id:index};
  });
  SANTORAL.forEach((s,i)=> s._id = i);
document.querySelector('.tab-btn[data-tab="hoje"]').classList.add('active');
try{
  const savedLang = localStorage.getItem('santoral-osm-lang');
  if(savedLang && I18N[savedLang]) LANG = savedLang;
}catch(e){}
applyStaticI18n();
updateThemeChips();
render();
  window.dispatchEvent(new Event('servite-ready'));
}
initServite().catch(error=>{document.getElementById('view').innerHTML='<div class="empty-note">Não foi possível carregar os textos offline.</div>';console.error(error);});

</script>


<script>
window.addEventListener('servite-ready', function(){
  var q=window.__SERVITE_VIEW__||'';
  try{
    if(q==='regra' && typeof setTab==='function') setTab('regra');
    else if(q==='rosario' && typeof setTab==='function' && typeof openDevo==='function'){setTab('oracoes');openDevo('rosario');}
    else if(q==='coroa' && typeof setTab==='function' && typeof openDevo==='function'){setTab('oracoes');openDevo('coroa');}
    else if(typeof q==='string' && q.indexOf('oficio:')===0){
      var parts=q.split(':');
      var saintId=parseInt(parts[1],10);
      var hour=parts[2]||'invitatorio';
      if(Number.isFinite(saintId)){
        document.body.classList.add('direct-office-view');
        state.tab='santoral';
        state.detailId=saintId;
        state.devo=null;
        state.devoSub=null;
        state.showOficio=true;
        state.oficioTab=hour;
        state.finalAntifona=null;
        document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active', b.dataset.tab==='santoral');});
        render();
        window.scrollTo(0,0);
      }
    }
    else if(q==='oficio' && typeof setTab==='function' && typeof openDevo==='function'){setTab('oracoes');openDevo('oficio');}
    else if(q==='sabado' && typeof setTab==='function' && typeof openDevo==='function'){setTab('oracoes');openDevo('sabado');}
    else if(q==='idioma') { if(typeof setTab==='function') setTab('sobre'); setTimeout(function(){var p=document.getElementById('settingsPanel'); var b=document.getElementById('settingsBtn'); if(p){p.removeAttribute('hidden');} if(b){b.classList.add('active');}},60); }
  }catch(e){}
});
</script>
