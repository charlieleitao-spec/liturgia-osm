e Fiores e Salvatore Meo), edição em língua portuguesa, Paulus, São Paulo 1995,\n p. 426-427; cf. também ALESSIO MARIA ROSSI, Manuale di storia dell’Ordine dei Servi\n di Maria, Roma 1956, p. 448-449.\n Novena Perpétua em honra de Nossa Senhora das Dores, trad. frei Thiago M. Mattioli,\n Tipografia do Orfanato Cristóvão Colombo, São Paulo, 1942, 26 p.\n\nde uma estação para outra são do cancioneiro popular\ntradicional.", "stations": [{"title": "1ª Dor — Profecia de Simeão", "text": "D. Nós vos adoramos, Senhor Jesus Cristo e vos\n bendizemos\nT. Porque associastes a Virgem Maria à obra da\n Salvação.\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (2, 22.25a.34-35)\n Quando se completaram os dias da purificação,\nsegundo a lei de Moisés, levaram o menino a\nJerusalém para apresentá-lo ao Senhor... Vivia em\nJerusalém um homem piedoso e justo, chamado\nSimeão, que esperava a consolação de Israel. Simeão\nos abençoou e disse a Maria, a Mãe: «Este menino será\n\ncausa de queda e de reerguimento para muitos em\nIsrael. Ele será um sinal de contradição. E a ti, uma\nespada traspassará tua alma, e assim serão revelados\nos pensamentos de muitos corações».\n\nReflexão\n L.1 - Jesus, segundo Simeão, haveria de ser um\nsinal de contradição. De fato, para aqueles que o\nrejeitaram e o levaram à cruz, foi motivo de queda e\nde condenação; para aqueles que o aceitaram e\nacreditaram nele, foi motivo de reerguimento e de\nsalvação. Maria guardava todas essas coisas e as\nmeditava no seu coração (Lc 2,19), mas seu olhar\ndeixava transparecer a dor. O poeta contempla o olhar\nde Maria e canta:\n Num sonho todo feito de incerteza,\n de noturna e indizível ansiedade,\n é que eu vi teu olhar de piedade\n e, mais que piedade, de tristeza 17.\n L.2 - Maria conviveu com Jesus em Nazaré e o\nacompanhou na vida pública. Participou de suas\nalegrias e tristezas, mas principalmente do seu\nsofrimento, quando o viu abandonado pelos seus\ndiscípulos, traído por Judas, negado por Pedro,\ncondenado à morte e pregado na cruz. Tudo isso foi\n Trata-se de ANTERO DE QUENTAL (†1891). É a 1ª estrofe do soneto À Virgem Santíssima,\n cheia de graça, Mãe de misericórdia, citado por CLODOVIS M. BOFF, OSM, Nossa Senhora\n das Bem-aventuranças, Edições Paulinas, São Paulo, 1984, p. 20.\n\ncomo uma espada a lhe traspassar a alma. O célebre\nhino Stabat Mater, que descreve a presença de Maria ao\npé da cruz, assim recorda as palavras do justo Simeão:\n«Na sua alma agoniada / enterrou-se a dura espada / de\numa antiga profecia».\n L.3 - Pensemos nas mães dos dias de hoje que\nveem seus filhos levados à morte, vítimas das guerras,\nda fome e de todo tipo de violência. A “espada”\ncontinua a traspassar o coração de muitas mães. O\nhomem e a mulher foram feitos para ter vida e vida em\nabundância e não para morrer, vítimas das “espadas”\nfabricadas pela maldade humana.\nOração\nC. Senhor Deus, nosso Pai, pelas palavras de Simeão,\n predissestes uma vida de sofrimento para a mãe do\n vosso Filho. Suplicantes, vos pedimos: a exemplo da\n Virgem das Dores, cujo coração foi traspassado pela\n espada da dor, saibamos enfrentar os sofrimentos da\n vida presente e ser solidários com as dores dos\n irmãos. Por Cristo nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n\n C. Nossa Senhora das Dores.\n T. Rogai por nós!\nCanto\n\n De Simeão as vozes no templo escutais\n cruéis profecias. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "2ª Dor — Fuga para o Egito", "text": "D. Nós vos adoramos, Senhor Jesus Cristo e vos\n bendizemos\nT. Porque associastes a Virgem Maria à obra da\n Salvação.\n\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de São Mateus (2,13-15)\n Depois que os magos se retiraram, o anjo do\nSenhor apareceu em sonho a José e lhe disse: «Levanta-\nte, toma o menino e sua mãe e foge para o Egito! Fica\nlá até que eu te avise, porque Herodes vai procurar o\nmenino para matá-lo». José levantou-se, de noite, com\no menino e a mãe, e partiu para o Egito e lá ficou até a\nmorte de Herodes. Assim se cumpriu o que o Senhor\ntinha dito pelo profeta: “Do Egito chamei o meu filho”.\nReflexão\n L.1 - Herodes dissera aos magos: “Quando\nencontrardes o menino, avisai-me para que também eu\nvá adorá-lo” (Mt 2,8). Mas, conhecendo as más\n\nintenções dele, os magos voltaram para suas terras por\noutro caminho. Herodes então encheu-se de furor,\nporque não podia admitir que houvesse outro rei em\nIsrael. Diante das ameaças de Herodes, José, avisado\npelo anjo do Senhor, teve que fugir com a esposa e a\ncriança.\n L.2 - Abandonar a própria terra e casa, a oficina\nde carpinteiro, parentes e amigos, e rumar para uma\nterra longínqua e desconhecida, percorrendo de Belém\nao delta do Nilo mais de 250 quilômetros, foram atos\nde coragem e de fé de Maria e de José. Mas a ordem de\nDeus era clara: “José, toma o menino e sua mãe e foge\npara o Egito! Fica lá até que eu te avise”. Era preciso\nsalvar o filho a qualquer custo.\n L.3 - Quantos são hoje os que vivem exilados ou\nmigrando de um lugar para outro, sempre fugindo dos\nHerodes atuais, que se chamam perseguição, racismo,\nconflitos étnicos, fome, desemprego, falta de moradia,\nde assistência médica e de educação, e sempre\nbuscando, no desconhecido, melhores condições de\nvida. Milhões são os prófugos, exilados e migrantes\nque vagueiam pelo mundo, longe de sua terra, dos\nparentes e amigos, erradicados de sua cultura. A\nhistória se repete. É o desterro forçado da Família de\nNazaré que se prolonga na história da humanidade.\n\nOração\nC. Senhor Deus, nosso Pai, fizestes da Virgem Maria a\n mulher forte que conheceu a pobreza e o sofrimento,\n a fuga e o exílio. Suplicantes, vos pedimos: a exemplo\n da Virgem das Dores, saibamos lutar para defender a\n vida e os direitos da pessoa humana contra as\n injustiças e a perseguição dos prepotentes. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n\nCanto\n Manda o céu um anjo dizer que fujais\n do bárbaro Herodes, Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "3ª Dor — Jesus perdido em Jerusalém", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\n\nC. Contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\n\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (2, 41-49)\n\n Todos os anos, os pais de Jesus iam a Jerusalém\npara a festa da Páscoa. Quando o menino completou\ndoze anos, eles foram para a festa, como de costume.\nTerminados os dias da festa, enquanto voltavam, Jesus\nficou em Jerusalém, sem que seus pais percebessem.\nPensando que se encontrasse na caravana, caminharam\num dia inteiro. Começaram então a procurá-lo entre os\nparentes e conhecidos. Mas não o encontrando,\nvoltaram a Jerusalém à sua procura. Depois de três dias,\no encontraram no templo, sentado entre os mestres,\nouvindo-os e fazendo-lhes perguntas.\n\nReflexão\n\n L.1 - Aos doze anos, todo menino judeu era\nlevado ao templo e entregue aos mestres da lei para que\nlhe ensinassem a Lei do Senhor, que se encontra no\nPentateuco, os primeiros cinco livros da Bíblia. Assim\nfizeram seus pais com Jesus. Só que os pais, quando já\nestavam no caminho de volta para Nazaré, se dão conta\nque o Menino não está na caravana.\n L.2 - Podemos imaginar a aflição de Maria e José\nque o procuram por toda parte, não o encontram e têm\nque voltar a Jerusalém. E já tinham feito o caminho de\num dia. É bom saber que Nazaré dista de Jerusalém\nmais de cem quilômetros. À angústia une-se o cansaço\nda viagem. Além do mais, Maria e José ainda\nguardavam na memória as ameaças de Herodes e a fuga\npara o Egito.\n L.3 - É dramática hoje a situação de tantas\ncrianças perdidas, que vagueiam pelas ruas e praças das\ncidades, fugidas de casa ou roubadas às suas famílias,\nmatriculadas pelo destino na escola das drogas, da\nprostituição e da violência, alvo elas próprias de todo\ntipo de violência. São as “crianças de rua” que vemos\npor aí: maltrapilhas, sujas, drogadas, dormindo na\ncalçada, pedindo esmola, assaltando os passantes.\nVivendo assim, o que vão aprender para a vida essas\ncrianças? Como poderão crescer sadias? Quando\n\naparecerá alguém que vá procurá-las e resgatá-las dessa\nsituação?\nOração\n\nC. Senhor Deus, nosso Pai, por três dias, Maria e José\n procuraram, aflitos, o filho Jesus. Suplicantes, vos\n pedimos: amparados pela Virgem das Dores,\n busquemos na penitência e na conversão o\n reencontro com o vosso Filho, e sejamos solidários\n com tantas crianças, que vagueiam pelas ruas e\n praças vítimas da injustiça social, da desagregação\n familiar e da violência. Por Cristo nosso Senhor.\nT. Amém!\nInvocações\n\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\nCanto\n Voltando do templo, Jesus não achais.\n Que susto sofrestes! Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "4ª Dor — Encontro no caminho do Calvário", "text": "C. Nós vos louvamos,\n Senhor Jesus Cristo e vos bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Lucas (23,26-28)\n Enquanto levavam Jesus, tomaram um certo\nSimão de Cirene, que voltava do campo, e mandaram-\nno carregar a cruz atrás de Jesus. Seguia-o uma grande\nmultidão do povo, bem como de mulheres que batiam\nno peito e choravam por ele. Jesus, porém, voltou-se\npara elas e disse: “Mulheres de Jerusalém, não choreis\npor mim! Chora por vós mesmas e por vossos filhos!”\n\n L.1 – O Evangelho não diz explicitamente se no\nmeio da “grande multidão que o seguia” ou das\n“mulheres que batiam no peito” estava também a mãe\nde Jesus, mas certamente ela devia estar. De fato, logo\ndepois o Evangelho de João diz que ela estava junto à\ncruz do Filho agonizante, ao lado do discípulo amado e\nde outras mulheres.\n\n L.2 - É o encontro doloroso da mãe aflita com o\nfilho condenado à morte. Ao sofrimento físico de Jesus\njunta-se o sofrimento daquela que vê o filho, que passara\na vinda pregando e fazendo o bem, ser incompreendido,\ninjustiçado, caluniado e condenado à morte de cruz.\nJesus e Maria unem-se na dor para realizar a obra de\nredenção da humanidade.\n L.3 - Quem nunca viu, nos dias de hoje, mães\nperderem seus filhos, vítimas da violência e da maldade\nhumana? Referindo-se a Maria, assim canta o poeta18:\n Tu és, ó mãe, toda mãe que hoje ama;\n tu és, ó mãe, toda a mãe que hoje chora\n seu filho morto, seu filho traído,\n mães aos milhares, mães amortalhadas!\n Filhos que sempre se estão a matar,\n Trata-se de frei DAVID M. TUROLDO, escritor e poeta da Ordem dos Servos de Maria, que\n compôs os hinos dos Ofícios Próprios OSM. Esses versos são do hino do Ofício das Leituras\n da festa da “Bem-aventurada Virgem Maria ao pé da Cruz”.\n\n Filhos vendidos, traídos, sem número,\n filhos feridos e em cruzes pregados:\n ímpia bandeira de um ímpio poder.\nOração\nC. Senhor Deus, nosso Pai, no caminho do Calvário,\n vosso filho Jesus e Maria sua mãe se encontram.\n Suplicantes, vos pedimos: a exemplo da Virgem das\n Dores, saibamos ir ao encontro dos que sofrem,\n compreendendo, compartilhando e aliviando suas\n dores. Por Cristo nosso Senhor.\nT. Amém!\n\nInvocações\n\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\nCanto\n\n Que dor indizível quando o encontrais\n com a cruz às costas. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "5ª Dor — Maria ao pé da cruz", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de\n Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de João (19,25-27)\n Junto à cruz de Jesus estavam de pé sua mãe e a\nirmã de sua mãe, Maria de Cléofas, e Maria Madalena.\nJesus, ao ver sua mãe, ao lado dela, o discípulo que ele\namava, disse à mãe: “Mulher, eis o teu filho!” Depois\ndisse ao discípulo: “Eis a tua mãe!” A partir daquela\nhora, o discípulo a acolheu junto de sim\n\nReflexão\n\n L.1 - É a cena clássica do Calvário, descrita por\nJoão e tão comentada pelos santos Padres da Igreja, que\na iconografia ilustrou com as mais variadas formas e\nestilos e que o poeta canta dizendo19: Sim, no\nCalvário, ó Mãe, tu choraste,\n ao pé da cruz, traspassada de dor:\n como pudeste sofrer tanto assim,\n sem sucumbir, nem fugir, nem gritar?\n L.2 - Eram poucos ao pé da Cruz. Dos doze\ndiscípulos, apenas um. De todos os que haviam sido\nbeneficiados pelos milagres e curas de Jesus, ninguém.\nMas lá estava Maria, a mãe, de pé, e outras mulheres.\nColocar-se com Maria aos pés das infinitas cruzes que\nafligem os homens e as mulheres do nosso tempo é\nmissão prioritária do cristão. “Tive fome e me destes de\ncomer; tive sede e me destes de beber; fui peregrino e\nme acolhestes; estive nu e me vestistes, enfermo e me\nvisitastes, preso e viestes ver-me...” (Mt 25,35-36)\n L.3 - Basta olhar ao nosso redor, abrir um jornal\nou ver um noticiário de TV para constatar quantas são\nas cruzes que afligem a humanidade de hoje. “Toda\ncriação espera ser libertada da escravidão”, exclama São\nPaulo (Rm 8,21). Que fazer? É nosso dever de cristãos e\nde Servos de Maria colocar-nos aos pés dessas infinitas\n Do Hino das Vésperas da festa da B. Virgem Maria ao pé da Cruz.\n\ncruzes, onde o Filho do Homem continua sendo\ncrucificado nos irmãos e irmãs, para levar-lhes conforto\ne esperança de libertação. Maria, a mãe da misericórdia\ne da compaixão, nos dá o exemplo. Seja ela a nossa\nimagem-guia.\nOração\nC. Senhor Deus, nosso Pai, que ao pé da cruz\n associastes a Virgem Maria à paixão e morte do\n vosso Filho, fazendo-a corredentora da humanidade.\n Suplicantes, vos pedimos: a exemplo da Virgem das\n Dores, saibamos colocar-nos a seu lado aos pés das\n cruzes da humanidade onde vosso Filho continua\n crucificado em nossos irmãos e irmãs, para levar-\n lhes conforto esperança de libertação. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave Maria, cheia de graça...\n T. Santa Maria, Mãe de Deus...\n C. Nossa Senhora das Dores,\n T. Rogai por nós!\nCanto\n A dor ainda cresce quando contemplais\n Jesus expirando. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores!"}, {"title": "6ª Dor — Jesus depositado nos braços de Maria", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de Marcos (15,43-46a)\n José de Arimateia, membro respeitável do\nSinédrio, que também esperava o reino de Deus, cheio\nde coragem foi a Pilatos pedir o corpo de Jesus.\n Pilatos ficou admirado quando soube que Jesus\nestava morto. Chamou o centurião e perguntou se tinha\nmorrido havia muito tempo. Informado pelo centurião,\n\nPilatos entregou o corpo a José. Ele comprou um lençol\nde linho, desceu Jesus da cruz e envolveu-o no lençol.\nReflexão\n L.1 – Eis a “Pietà” (a Piedade), obra-prima de\nMichelangelo, venerada na basílica de São Pedro, no\nVaticano, e reproduzida em milhares de cópias\nespalhadas pelo mundo inteiro. Maria, sentada,\naconchega ao colo seu filho morto. A perfeição dos\ntraços das imagens marmóreas de Jesus e de Maria e a\ndor reproduzida com solenidade e perfeição no rosto da\nmãe despertam piedade e compaixão.\n L.2 - Diante desse quadro, canta o poeta 20:\nPouco mais tarde da cruz o tiraram,\ne o depuseram, ó Mãe, em teu colo.\nNão parecias gerá-lo de novo?\ne qual criança de peito aleitá-lo?\n Eras o colo de todas as mães.\n Vendo-te assim, quem não há de chorar?\n Era uma cena jamais antes vista!\n És a Piedade que abraça quem sofre!\n L.3 - Abraçar a dor do irmão, abraçar a causa dos\npobres, dos excluídos, dos doentes, dos angustiados e\ndeprimidos, não é para os fracos. É para os fortes. Para\naqueles que, como Maria, sabem permanecer de pé junto\nà cruz e não se abalam nem desanimam diante do\nsofrimento. Para aqueles que alicerçam sua vida em Deus\ne na sua Palavra. Para aqueles que, diante da morte,\n Do hino das II Vésperas da solenidade de Nossa Senhora das Dores, 15 de setembro.\n\nacreditam na ressurreição, e por isso lutam para renovar\no mundo e se empenham com obras de caridade e de\nmisericórdia, a exemplo do bom samaritano. Sim, porque\nnão existe fé sem obras. “Mostra-me tua fé sem as obras\nque eu, por minhas obras, te mostrarei a fé“, diz São\nTiago.\nOração\nC. Senhor Deus, nosso Pai, estando “tudo consumado”,\n o corpo do vosso filho foi descido da cruz e entregue\n nos braços de sua mãe. Suplicantes, vos pedimos: a\n exemplo da Virgem das Dores, tenhamos os braços\n sempre abertos para acolher os excluídos da\n sociedade, escutar seus clamores e solidarizar-nos\n com eles na luta pela vida. Por Cristo nosso Senhor.\nT. Amém!\n Invocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, Mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n Canto\n No vosso regaço seu corpo abrigais,\n com ele abraçada, bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores."}, {"title": "7ª Dor — Sepultamento de Jesus", "text": "C. Nós vos louvamos, Senhor Jesus Cristo e vos\n bendizemos.\nT. Porque associastes a Virgem Maria à obra da\n salvação.\nC. Nós contemplamos vossas dores, ó Mãe de Deus!\nT. Queremos seguir-vos no caminho da fé.\nC. Santa Maria, Mãe de Deus!\nT. Rogai por nós, pecadores.\nEvangelho de João (19,40-42)\n Eles pegaram então o corpo de Jesus e o\nenvolveram, com perfumes, em faixas de linho, do\nmodo como os judeus costumam sepultar. No lugar\nonde Jesus foi crucificado, havia um jardim e, no\njardim, um túmulo novo, onde ninguém tinha sido\nainda sepultado. Por ser dia de preparação para os\n\njudeus, e como o túmulo estava perto, foi lá que eles\ncolocaram Jesus.\n\n Reflexão\n\n L.1 - Foi um enterro de pobre, feito às pressas no\nfinal da tarde, e poucos o acompanharam, como reza a\nLiturgia:\n Para o sepulcro o levam amigos,\n não mais que sete, segundo João:\n foi o enterro mais pobre do mundo,\n ouve-se apenas a pedra a rolar... 21\nTudo parece ter chegado ao fim. A Mãe, João e os\npoucos amigos e amigas, depois que o túmulo foi\nfechado com a pedra, voltam para casa. A desolação é\ntotal. A dor da mãe alcança seu nível mais profundo:\nagora sem marido e sem filho. Estava só! É Nossa\nSenhora da Soledade.\n L.2 - Mas Ela não perde a esperança: seu Filho\nressuscitará, como ele mesmo disse. Ela o deposita no\nsepulcro, sim, mas espera sua ressurreição. Ademais,\nEla toma consciência do alcance das palavras de Jesus:\n«Eis aí o teu filho!» E assume a sua função de mãe de\ntodos os homens e mulheres. No Natal, tornara-se mãe\nde Jesus. Agora, no Calvário, mãe de todos os seres\n\n Hino das II Vésperas do Ofício da Solenidade de Nossa Senhora das Dores.\n\nhumanos. E, mais tarde, em Pentecostes, mãe da Igreja.\nMaria alcança a plenitude da maternidade.\n L.3 - Esta a fé que deve acompanhar-nos quando\nsepultamos uma pessoa querida: o corpo é posto debaixo\nda terra, mas sua “vida” continua. Uma vez gerados no\nventre materno, nossa “vida” dura para sempre: alguns\nanos, envolvida no corpo humano, depois, revestida de\num “corpo incorruptível”. Como será isso? Deus sabe\ne isso nos basta.\nOração\nC. Senhor Deus, nosso Pai, junto com alguns irmãos e\n irmãs, a Virgem Mãe, aflita, acompanhou seu filho à\n sepultura. Suplicantes, vos pedimos: a exemplo da\n Virgem das Dores, saibamos caminhar lado a lado\n com aqueles que sofrem, para criarmos com eles\n uma aliança de amor, que os ajude a superar o medo\n da morte com a esperança da ressurreição. Por Cristo\n nosso Senhor.\nT. Amém!\nInvocações\n C. Ave, Maria, cheia de graça...\n T. Santa Maria, mãe de Deus...\n C. Nossa Senhora das Dores\n T. Rogai por nós!\n\nCanto\n\n Sem filho, e tal filho! Então suportais\n cruel soledade. Bendita sejais!\n Bendita sejais, Senhora das Dores,\n ouvi nossos rogos, mãe dos pecadores.\n\n[Termina-se a “Via Matris”, recitando a ladainha de\nNossa Senhora das Dores (cf. p.), seguida do oremos\n(cf. p. ) e da bênção final]."}]}, "ladainhas": [{"title": "Ladainha dos Servos de Maria", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nAve Maria, Virgem morada do Espírito, Rogai por nós!\nAve Maria, Virgem Mãe,\nAve Maria, Virgem fiel,\nAve Maria, Virgem sábia,\nAve Maria, Virgem prudente,\nAve Maria, Virgem orante,\nAve Maria, Mãe de Deus,\nAve Maria, Mãe de Cristo,\nAve Maria, Mãe do Salvador,\nAve Maria, Mãe do Homem novo,\nAve Maria, Mãe da graça,\nAve Maria, Mãe da misericórdia,\nAve Maria, sede da sabedoria,\nAve Maria, templo de santidade,\nAve Maria, arca da aliança,\nAve Maria, estrela do mar,\nAve Maria, escada do céu,\nAve Maria, porta do paraíso,\nAve Maria, conforto dos pobres,\nAve Maria, refúgio dos marginalizados,\nAve Maria, saúde dos enfermos,\nAve Maria, guia dos peregrinos,\nAve Maria, esperança dos pecadores,\nAve Maria, alegria dos teus servos,\nAve Maria, mestra da santidade,\nAve Maria, mestra da humildade,\nAve Maria, mestra da obediência,\nAve Maria, mestra da fortaleza,\nAve Maria, mestra da contemplação,\nAve Maria, mestra do serviço,\nAve Maria, fonte de vida,\nAve Maria, fonte de luz,\nAve Maria, fonte de beleza,\nAve Maria, fonte de alegria,\nAve Maria, fonte de perdão,\nAve Maria, fonte de comunhão,\nAve Maria, rainha dos humildes,\nAve Maria, rainha dos mansos,\nAve Maria, rainha dos misericordiosos,\nAve Maria, rainha dos puros de coração,\nAve Maria, rainha dos construtores da paz,\nAve Maria, rainha dos teus servos,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!\n\nOração\n\nÓ Deus, amigo dos homens, fiel à aliança e às promessas, que no anúncio a Maria realizastes a espera da humanidade, escutai a nossa oração: pela disponibilidade que encontrastes na Virgem Maria, filha de Sião e nossa irmã, fazei que nós, vossos servos, sejamos sempre dóceis à Palavra e abertos ao vosso Espírito. Por Cristo nosso Senhor. Amém!"}, {"title": "Ladainha de Santa Maria da Esperança", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nSanta Maria da esperança, Rogai por nós!\nSanta Maria do caminho,\nSanta Maria da luz,\nPlenitude de Israel,\nAurora do mundo novo,\nFonte da alegria messiânica,\nMãe de Deus,\nMãe do Messias libertador,\nMãe dos redimidos,\nMãe de todos os povos,\n\nDiscípula de Cristo,\nTestemunha de Cristo,\nIrmã dos homens,\nInício da Igreja,\nMãe da Igreja,\nModelo da Igreja,\nImagem da Igreja,\nServa do Senhor,\nServa da Palavra,\nServa do Reino,\nVirgem do silêncio,\nVirgem da escuta,\nVirgem do canto,\nVirgem da contemplação,\nMaria, dignidade da mulher,\nMaria, grandeza da mulher,\nMaria, destino da mulher,\nMulher bendita entre as mulheres,\nMulher fiel ao compromisso,\nMulher fiel no seguimento,\nMulher fiel ao pé da cruz,\n\nEstrela da evangelização,\nEducadora da fé,\nMestra da vida,\nPresença luminosa,\nPresença orante,\nPresença acolhedora,\nPresença operante,\nEsperança dos pobres,\nConfiança dos homens,\nSustentáculo da evangelização,\nAlívio dos oprimidos,\nDefesa dos inocentes,\nFortaleza dos perseguidos,\nConforto dos exilados,\nVoz de comunhão,\nVoz dos pobres,\nVoz do Espírito,\n\nSinal do rosto materno de Deus,\nSinal da presença do Pai,\nSinal da misericórdia do Filho,\nSinal da fecundidade do Espírito,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!\n\nOração\n\nPai Santo, que no caminho da Igreja, peregrina sobre a terra, colocastes como sinal luminoso a bem-aventurada Virgem Maria: por sua intercessão, sustentai nossa fé e reacendei nossa esperança, para que nenhum obstáculo nos desvie do caminho que leva à salvação. Por Cristo nosso Senhor. Amém!"}, {"title": "Ladainha de Puebla", "text": "Senhor, tende piedade de nós. [repete-se]\nCristo, tende piedade de nós.\nSenhor, tende piedade de nós.\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai do céu, Tende piedade de nós!\nDeus Filho, redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nDiscípula perfeita do Senhor, Libertai vosso povo.\nModelo do cristão,\nRealização mais alta do Evangelho,\nFace materna de Deus,\nRosto do homem novo,\nCoração tão grande quanto o mundo,\nMulher forte do povo,\nMulher pobre e sofredora,\nMulher perseguida e exilada,\nAnunciadora da justiça dos oprimidos,\nInspiradora da opção pelos pobres,\nMulher que dignifica a mulher,\nSinal do nosso corpo glorificado,\nSinal da criação redimida,\nSinal do homem todo salvo,\nIntercessora de todos os povos,\nDespertadora da fé no Cristo,\nEncarnação viva do evangelho,\nFiel companheira do Senhor,\nProtagonista, com Cristo, da história,\nGuarda do destino da América Latina,\nMãe educadora da fé,\nPedagoga do evangelho,\nEstrela da evangelização,\n\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Perdoai-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo,\nT. Tende piedade de nós!"}], "sabado": {"intro": "TEMPO COMUM\n\"Falta ainda acenar à possibilidade de uma comemoração litúrgica frequente da Virgem \nSantíssima, mediante o recurso à memória de Santa Maria no sábado: memória antiga e discreta, \nque a flexibilidade do calendário atual e a multiplicidade de formulários do Missal tornam \nextremamente fácil e variada\" (Marialis Cultus, 9).\nNos sábados do Tempo Comum, não havendo outra memória obrigatória, celebra-se a memória de Santa \nMaria, usando-se o formulário da Liturgia das Horas do rito romano ou o Ofício próprio da Ordem.", "form1": "Invitatório\nAnt. Vinde, adoremos o Cristo Jesus, que nos deu Maria como Mãe e Senhora.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nVamos servir nós também, ó irmãos,\nseguindo atentos o exemplo da Mãe:\nfechar-se em casa não pode sozinho\nquem Cristo traz dentro em seu coração.\nReis e princesas seus tronos já deixem\ne saiam todos dos grandes palácios;\nos sacerdotes, os templos deixando,\nlevem a graça ao encontro dos homens.\nE todos cantem o mesmo seu canto,\ndigam aos pobres: Já veio o Messias,\nem nossa carne mortal veio e vem:\neles serão do seu reino os herdeiros.\nA Igreja acolham os que são os últimos\ncom as palavras que disse Isabel,\ne os filhos inda no ventre das mães\nvibrem alegres por terem nascido.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com o respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDa alocução de Paulo VI aos participantes do Capítulo Geral da Ordem dos Servos de Maria\n(Roma, 12 de outubro de 1974)\nGloriai-vos de ser Servos da Mãe de Deus\nCom a mente e o espírito, tende sempre diante de vós o exemplo eminente e arrebatador da\nVirgem Maria, à qual a vossa Ordem está consagrada por um título especial. [Leitura completa\ndisponível no ofício impresso da Ordem.]\nRESPONSÓRIO cf. Lc 1,38; Mt 6,10\nR. Maria respondeu ao anjo: Eis aqui a serva do Senhor. * Deus faça em mim segundo a tua palavra.\nV. Quando orardes, dizei: Seja feita a vossa vontade assim na terra como no céu.\nR. Deus faça em mim segundo a tua palavra.\nLeitura alternativa\nDa \"Legenda sobre a origem da Ordem dos Servos da bem-aventurada Virgem Maria\"\nConsagram-se de modo especial ao serviço de Nossa Senhora\nA bem-aventurada Virgem Maria, Mãe de nosso Senhor Jesus Cristo, é o refúgio universal de\ntodos os pecadores, mãe universal de todos os justos e é reconhecida como Senhora comum de\ntodos os que servem a Cristo. [Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Unidos pelo vínculo da caridade e da fé, vivamos em comunhão fraterna sob a proteção de Nossa\nSenhora, * para servir a Deus e aos irmãos.\nV. Consagrando nossas vidas à bem-aventurada Virgem, ela será para nós refúgio especial, mãe\nsingular e Senhora nossa.\nR. Para servir a Deus e aos irmãos.\nOração\nÓ Deus misericordioso, atendei a oração dos vossos Servos reunidos para celebrar a memória da\nSanta Virgem Maria. Por sua maternal intercessão, livrai-nos de todos os perigos que nos ameaçam\nneste mundo. Por nosso Senhor.\nOu:\nSenhor, vós quisestes que a Santa Virgem Maria, vossa Serva, fosse mãe de Cristo e a ele estivesse\nsempre unida. Concedei-nos que, inspirados na Senhora nossa, testemunhemos o evangelho,\ncolocando-nos a serviço da salvação dos irmãos. Por nosso Senhor.\nLaudes\nHINO\nCom este nome veneram-te muitos:\nServos chamados de Santa Maria,\nirmãos eleitos p'ra amar e doar-se,\nqual povo nobre dos tempos de outrora.\nPor isso, a vida queremos cantar\nda que se fez do Senhor Serva humilde,\ndo Filho amado descido do céu,\npara ser servo de todos os homens.\nEste é o preceito do Filho divino:\n\"Quem quer seguir-me comece a servir\",\ne aquele que ama a amar recomece,\naté verter o seu sangue primeiro.\nA vida inteira sua Mãe o seguiu\naté a cruz, fielmente e em silêncio:\nassim co'os pobres ao mundo o entregou,\nco'eles cumprindo o comum sacerdócio.\nNão outra Igreja será verdadeira\ne fora disto não há sacramento:\nMaria Virgem é a Igreja primeira,\nela que disse: \"Eis aqui vossa serva\".\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Jt 13,14a.18ab.19\nJudite disse: Louvai a Deus, louvai-o! Louvai a Deus que não afastou a sua misericórdia da casa de\nIsrael. Ozias, príncipe do povo de Israel, disse-lhe: Bendita sejas, filha, pelo Deus Altíssimo, mais\nque todas as mulheres da terra, e bendito seja o Senhor Deus, Criador do céu e da terra.\nRESPONSÓRIO BREVE Lc 1,42.45\nR. Bendita és tu entre as mulheres, * e bendito é o fruto do teu ventre!\nV. Feliz és tu, ó Maria, que acreditaste no cumprimento das palavras do Senhor.\nR. E bendito é o fruto do teu ventre!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Bendita és tu entre as mulheres e bendito é o fruto do teu ventre!\nCântico evangélico\nAnt. Salve, Santa Maria, glória de Jesus Cristo! Vossos servos vos invocam, ó Virgem bendita!\nOu: Salve, fonte de clemência, Rainha do céu! Vosso olhar misericordioso a nós volvei.\nPRECES\nRenovados pela luz matinal, confiemos a Deus Pai, fonte do eterno esplendor, todas as esperanças e\npropósitos deste novo dia. Digamos juntos:\nR. Senhor, fazei-nos testemunhas da ressurreição de Cristo.\nPor intercessão de Santa Maria, vossa Serva, fazei que vos amemos de coração sincero,\n- e aceitemos vossa vontade com amor filial.\nPor intercessão de Santa Maria, Senhora nossa, inspirai-nos as palavras, sustentai o nosso trabalho e\nguiai-nos em tudo o que fizermos neste dia,\n- para que, gratos pelo dom da vida, façamos dela um instrumento de generoso serviço aos irmãos.\nPor intercessão de Santa Maria, sede da Sabedoria, derramai a luz da vossa verdade,\n- para que compreendamos sempre melhor os valores humanos e sagrados representados pela\nVirgem Maria.\nPor intercessão de Santa Maria, morada do Espírito Santo, fazei de nós templos do divino Paráclito,\n- para que a retidão da nossa conduta suba até vós como sacrifício de agradável odor.\nPai Nosso...\nOração\nO Deus misericordioso, atendei a oração dos vossos Servos reunidos para celebrar a memória da\nSanta Virgem Maria. Por sua maternal intercessão, livrai-nos de todos os perigos que nos ameaçam\nneste mundo. Por nosso Senhor.\nOu:\nSenhor, vós quisestes que a Santa Virgem Maria, vossa Serva, fosse mãe de Cristo e a ele estivesse\nsempre unida. Concedei-nos que, inspirados na Senhora nossa, testemunhemos o evangelho,\ncolocando-nos a serviço da salvação dos irmãos. Por nosso Senhor.", "form1Title": "SANTA MARIA DOS SEUS SERVOS", "form2": "Invitatório\nAnt. Vinde, adoremos a Cristo! Ele salvou a humanidade unindo a si Maria e a Igreja.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nVenham, irmãos, procurá-lo conosco:\nhá muitos séculos nós o perdemos,\njá não choramos assim como a Mãe,\nque por três dias ansiosa o procura!\nSem Jesus Cristo não temos mais Deus\ne nem irmãos uns dos outros nós somos:\na nossa casa tornou-se um deserto,\n\"Toda Sião é um funesto deserto!\"\nA própria Mãe pela mão nos conduza,\nricos ou pobres, ateus ou fiéis:\nMãe sendo ela de todos os crentes,\nmostre-nos onde poder encontrá-lo.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDa Constituição dogmática \"Lúmen Gentium\" do Concílio Vaticano II sobre a Igreja (n° 63-65)\nA Virgem Maria precedeu à Igreja qual seu protótipo\nEm virtude da graça da divina maternidade e da missão pela qual ela está unida com seu Filho\nRedentor, a bem-aventurada Virgem está também intimamente relacionada com a Igreja. Já Santo\nAmbrósio ensinava que a Mãe de Deus é o tipo da Igreja na ordem da fé, da caridade e da perfeita\nunião com Cristo. [Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. O Filho unigénito do Pai fez-se Filho da Virgem e Senhor de sua Mãe. * A cabeça foi gerada por\nMaria e os membros são frutos da Igreja.\nV. Cristo, em Maria se torna pequeno, e na Igreja se torna admiravelmente grande.\nR. A cabeça foi gerada por Maria e os membros são frutos da Igreja.\nLeitura alternativa\nDos \"Sermões\" de Santo Agostinho, bispo\nA Igreja: mãe santa e honrada, semelhante a Maria\nMeus irmãos, prestai bem atenção, rogo-vos, prestai bem atenção ao que disse Jesus, apontando\npara os discípulos: \"Aqui estão a minha mãe e os meus irmãos, porque aquele que fizer a vontade de\nmeu Pai que está nos céus, esse é meu irmão, irmã e mãe\" (cf. Mc 3,34-35; Mt 12,49-50).\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Santa Maria, Virgem e Mãe, no coração e no ventre gerais para o mundo o Filho do Pai; * à\nsombra do Espírito Santo, confiais plenamente na palavra de Deus.\nV. Feliz vós também, santa Igreja, virgem e mãe: cumprindo fielmente a vontade do Pai, na fonte\nbatismal gerais muitos filhos de Deus para a vida eterna.\nR. À sombra do Espírito Santo, confiais plenamente na palavra de Deus.\nOração\nO Deus, que sois guia do povo eleito, quisestes que a Santa Virgem, Mãe de Cristo, cabeça da\nIgreja, fosse também mãe espiritual dos cristãos; por sua maternal intercessão, concedei que todos\nos povos se tornem vossa Igreja. Por nosso Senhor.\nLaudes\nHINO\n\"Ventre feliz o de quem te gerou!\",\nem meio ao povo gritou a mulher,\ntoda inflamada com Suas palavras:\nporém só tu conhecias as coisas!\nDize, ó Mãe, o que foi que provaste,\nem Nazaré quando o Livro ele leu:\n\"Em mim repousa o Espírito Santo,\npalavra que hoje se cumpre!\" - dizia.\nContigo, ó Mãe, nós queremos segui-lo\npelos caminhos cantando a Deus Pai:\ntu a primeira que creste no Filho\ne nós a Igreja que escuta e caminha.\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Ap 12,3a.4cd.5-6a\nApareceu um outro sinal no céu: um dragão colocou-se diante da mulher que estava para dar à luz, a\nfim de lhe devorar o filho, tão logo nascesse. Ela deu à luz o filho, um varão, que irá reger todas as\nnações com um cetro de ferro.\nRESPONSÓRIO BREVE\nR. Rios de água alegram a cidade de Deus, * a morada santa do Altíssimo.\nV. Deus aí está: nunca a cidade será destruída.\nR. A morada santa do Altíssimo.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Rios de água alegram a cidade de Deus, a morada santa do Altíssimo.\nCântico evangélico\nAnt. Ó Pai, vosso Filho unigénito tornou-se Filho de sua Serva e Senhor de sua Mãe: gerado por\nMaria e fruto da Igreja.\nOu: Feliz sois vós, ó Maria, mãe da glória e imagem resplendente da Igreja.\nPRECES\nConfiantes na ajuda da Virgem Maria, invoquemos com fervor o Pai que, pela força do Santo\nEspírito, conduz todos os homens à unidade. Digamos com fé:\nR. Senhor, fazei que todos formem uma só família.\nPai, por meio de Jesus Cristo conduzis os povos à vossa Igreja;\n- fazei que todos nela encontrem a vida.\nVós, na vinha do vosso povo, fizestes germinar a videira verdadeira que é Cristo;\n- ensinai-nos a permanecer unidos a ele.\nVós edificastes a Igreja como \"morada de Deus entre os homens\";\n- fazei que sejamos templos vivos da vossa divindade.\nO Pai, vós nos destes a Igreja como mãe carinhosa;\n- fazei que, na alegria deste novo dia, nos esforcemos para promover a unidade e a concórdia.\nPai Nosso...\nOração\nO Deus, que sois guia do povo eleito, quisestes que a Santa Virgem, Mãe de Cristo, cabeça da\nIgreja, fosse também mãe espiritual dos cristãos; por sua maternal intercessão, concedei que todos\nos povos se tornem vossa Igreja. Por nosso Senhor.", "form2Title": "MARIA E A IGREJA", "form3": "Invitatório\nAnt. Vinde, adoremos o Cristo Jesus: renova-se nele toda a criação.\nOu: Vinde, adoremos a Deus Pai, que em Cristo tudo renova.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\n\"Grande sinal lá no céu aparece:\nmulher formosa vestida de sol,\npor sobre a lua descansa seus pés,\ncoroa de astros lhe enfeita a cabeça.\nLonge ela foge com asas de águia,\npara o deserto por Deus é levada\":\nvolta, ó Senhora, a gerá-lo de novo,\ne volte a terra inda ter esperança!\nA ti, Trindade, mistério supremo,\nnós te louvamos porque nos doaste\na nova aurora que o dia anuncia:\nCristo, que toda a criação glorifica.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDos \"Discursos\" de João XXIII, papa (7 de dezembro de 1959)\nA intimidade do homem com Deus revela-se em Maria na sua perfeição original\nA Imaculada Conceição evoca os fulgores da aurora. Preservada de toda impureza original, Maria\nficou repleta de graça desde o primeiro instante de sua conceição. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Mulher Nova, preservada do pecado original: * de ti nasceu Cristo Jesus, novo Adão!\nV. Salve, Nova Terra, preparada por Deus, fecundada pelo Santo Espírito.\nR. De ti nasceu Cristo Jesus, novo Adão!\nLeitura alternativa\nDa Carta pastoral da Conferência dos Bispos das Ilhas Filipinas sobre a bem-aventurada Virgem\nMaria\nAs palavras de Maria preconizam uma mudança na ordem social do reino de Deus\nNa visitação (Lc 1,39-45.56) Maria, levando em seu seio o Menino, torna-se imagem da Arca da\nAliança e sede da presença permanente de Deus no meio do povo. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO cf. Sl 33,4; 85,13; Lc 1,52\nR. Glorificai comigo o Senhor: * grande foi sua misericórdia.\nV. Depôs os poderosos dos seus tronos e exaltou os humildes.\nR. Grande foi sua misericórdia.\nOração\nO Deus, na Virgem-Mãe, plasmada pelo Espírito Santo, vós nos destes as primícias da nova criação;\nconcedei que, libertos da corrupção do pecado, nos transformemos em Cristo, Homem novo. Ele\nque convosco...\nLaudes\nHINO\n\"Humilde serva eu sou do Senhor,\nem mim se cumpram as tuas palavras\".\nTu és a terra obediente, ó Maria,\nterra que sabe, que ama e que adora.\nDia após dia a Igreja repita\nda humilde serva as sagradas palavras,\ne será tudo como era no início,\nquando o Senhor caminhava no Éden.\nGlória à Trindade, Pai, Filho e Espírito,\nque desde o início renovam o mundo:\npois foi-nos dada uma Virgem e Mãe,\nbeleza intacta de toda a criação.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE cf. 2 Pd 3,13-14\nO que nós esperamos, conforme a sua promessa, são novos céus e nova terra, onde habitará a\njustiça. Assim, visto que tendes esta esperança, esforçai-vos ardorosamente para que ele vos\nencontre em paz, vivendo uma vida sem mácula e irrepreensível.\nRESPONSÓRIO BREVE\nR. Vi um novo céu e uma nova terra: * vi descer do céu, de junto de Deus, a cidade santa.\nV. Vi a nova Jerusalém, resplandecente da glória de Deus.\nR. Vi descer do céu, de junto de Deus, a cidade santa.\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Vi um novo céu e uma nova terra: vi descer do céu, de junto de Deus, a cidade santa.\nCântico evangélico\nAnt. Ave, Maria, puríssima Mãe de Deus! Ave, bendita! Tu concebeste o esplendor do Pai. Aleluia!\nOu: Grande é a tua glória, ó Maria, Mulher nova: de ti nasceu Cristo, o Homem novo!\nPRECES\nElevemos nossas súplicas a Deus Pai: na Santa Virgem Maria, mãe do novo Adão, ele nos deu a\nimagem e o início da Igreja. Digamos com fé:\nR. Senhor, renovai em nós o espírito de santidade!\nVós nos trouxestes à luz deste novo dia;\n- dai-nos ver a luz do dia em que todas as criaturas, libertadas da corrupção, haverão de\nconquistar a ditosa liberdade dos filhos de Deus.\nVós nos renovastes na água e no Espírito Santo;\n- fazei que caminhemos numa vida nova, coerentes com nosso batismo.\nNa Virgem Maria reparastes a antiga culpa de Eva;\n- concedei-nos respeitar a dignidade de todas as criaturas.\nPai Nosso...\nOração\nO Deus, na Virgem-Mãe, plasmada pelo Espírito Santo, vós nos destes as primícias da nova criação;\nconcedei que, libertos da corrupção do pecado, nos transformemos em Cristo, Homem novo. Ele\nque convosco...", "form3Title": "MARIA, MULHER NOVA", "form4": "Invitatório\nAnt. Vinde, exultemos no Senhor! Ele derrama sua misericórdia sobre aqueles que o temem.\nSalmo invitatório como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nComo podermos cantar-te, ó Maria,\nsem ofender a tua santidade?\nsem perturbar o teu grande silêncio?\nNosso desejo é que peças por nós,\nnós cantaremos teu canto de amor:\nfaça-se em nós como tu declaraste.\nTu, chance última desta criação,\ntu, terra santa que o gera de novo,\ntu, tabernáculo vivo do Verbo.\nAntífonas, salmos, versículo e primeira leitura com respectivo responsório, do sábado da semana corrente.\nSEGUNDA LEITURA\nDos \"Sermões\" de São Boaventura, bispo\nCom grande confiança recorramos a Maria\n\"O meu Criador habitou sob a minha tenda\" (Eclo 24,12). Este versículo da Sagrada Escritura, no\nseu sentido literal, bem se aplica à Virgem Maria: em sua tenda habitou fisicamente o Senhor.\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, regina de misericórdia, da vós nasceu o Cristo, nosso Rei: * intercedei para a nossa paz e\nsalvação.\nV. Salve, Mãe do Senhor, conforto do mundo, esperança dos pobres, refúgio dos fracos e oprimidos!\nR. Intercedei para a nossa paz e salvação.\nLeitura alternativa\nDo Tratado \"Sobre os louvores da B. Virgem Maria\", de Ricardo de São Lourenço, presbítero\nRainha e Mãe de misericórdia\nMaria é pródiga e cheia de misericórdia porque é rica e generosa. [Leitura completa disponível no\nofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Virgem piedosa, em vós nós esperamos! * Dia e noite a vós volvemos nosso olhar\nconfiante.\nV. Salve, rainha de misericórdia: por vossa clemência nos libertastes e vos entregastes a nós como\nmãe amável.\nR. Dia e noite a vós volvemos nosso olhar confiante.\nOração\nO Deus, Pai clemente e misericordioso, que fizestes da Virgem Maria a Arca da Nova Aliança, para\nque o Verbo viesse morar no meio dos homens; concedei-nos ser sempre fiéis à aliança que Cristo\nconfirmou com o seu sangue. Ele que é Deus...\nLaudes\nHINO\nÓ Mãe, tu foste das bodas à festa\njunto co'o Filho e também os discípulos:\noutro festim, porém, ele sonhava,\njá antevendo a colina sangrenta.\nSia gloria al Padre que o novo amor\normai ci dona da allora per sempre:\namor que solo o Filho revela\ne no Espírito é dado a quem ama.\nAntífonas e salmos do sábado da semana corrente.\nLEITURA BREVE Mq 7,18-20\nQual deus é como tu, que tira a culpa e perdoa o crime, que não guarda para sempre a sua ira,\nporque prefere o amor? Novamente ele nos manifestará a sua misericórdia, calcará aos pés as nossas\nfaltas e lançará no fundo do mar todos os nossos pecados.\nRESPONSÓRIO BREVE\nR. Lembrai-vos, Senhor, da vossa misericórdia, * como prometestes a nossos pais!\nV. Vossa misericórdia de geração em geração para aqueles que vos temem.\nR. Como prometestes a nossos pais!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Lembrai-vos, Senhor, da vossa misericórdia, como prometestes a nossos pais!\nCântico evangélico\nAnt. Virgem santa, rainha da misericórdia e esperança do mundo, escutai os filhos que vos\ninvocam!\nPRECES\nBendigamos a Deus, Pai misericordioso que, em seu Filho Jesus Cristo, nascido da Virgem Maria,\nrealizou plenamente as suas promessas, e digamos com fé:\nR. Nós vos louvamos, Senhor, por vossa misericórdia!\nO Deus bondoso e paciente, que fecundastes o seio da Virgem Maria,\n- fazei que a vossa palavra, acolhida com fé, produza em nós frutos abundantes.\nO Deus justo e misericordioso, que escolhestes Maria dentre os humildes e pobres,\n- dai-nos um coração humilde e pobre para esperarmos confiantes a salvação que vem de Cristo.\nO Deus de misericórdia e de bondade, que nos concedestes ver a luz deste novo dia,\n- fazei que, à imitação da mãe de misericórdia, acolhamos com amor os que precisam de nós.\nPai Nosso...\nOração\nO Deus, Pai clemente e misericordioso, que fizestes da Virgem Maria a Arca da Nova Aliança, para\nque o Verbo viesse morar no meio dos homens; concedei-nos ser sempre fiéis à aliança que Cristo\nconfirmou com o seu sangue. Ele que é Deus...\nOu:\nSenhor, que enviastes o vosso Filho ao mundo para salvar os homens, dando-lhes Maria como Mãe\nde misericórdia, ouvi benigno as preces dos vossos servos que perante vós gemem sob o peso dos\nseus pecados e confiam na vossa clemência. Por nosso Senhor.", "form4Title": "MARIA, RAINHA DA MISERICÓRDIA", "form5": "Invitatório\nAnt. Vinde, adoremos o Senhor, que, por Santa Maria, visitou nossos povos.\nSalmo 94, como no Ordinário, p. 35.\nOfício das Leituras\nHINO\nAmas tua casa, és também peregrina,\ntu és esposa, tu mãe dedicada,\ntrilhas veredas por onde Deus passa,\ntudo o que ocorre tu logo percebes.\nSobes e desces, fiel ao teu \"sim\",\nlá no Calvário e em teu caminhar;\nrumo à morada celeste nós vamos,\nonde contigo queremos chegar.\nGlória a Deus Pai, o Senhor sempiterno,\nglória a Deus Filho, que é nosso Senhor\nao Santo Espírito consolador:\nassim aclame cantando o universo. Amém!\nAntífonas, salmos, versículo e primeira leitura do sábado da semana corrente.\nSEGUNDA LEITURA\nDo \"Documento de Puebla\" da III Conferência do Episcopado Latino-americano\nMaria faz com que a Igreja se sinta uma família\nEm nossos povos, o Evangelho tem sido anunciado, apresentando a Virgem Maria como sua\nrealização mais alta. Desde os primórdios - em sua aparição e invocação de Guadalupe - Maria\ntornou-se o grande sinal, de rosto materno e misericordioso, da proximidade do Pai e de Cristo.\n[Leitura completa disponível no ofício impresso da Ordem.]\nRESPONSÓRIO\nR. Salve, Serva do Senhor, Mãe de Deus! * Por vós o Evangelho foi proclamado aos nossos povos!\nV. Salve, mãe dos homens, fiel companheira do Senhor! Por vós a Igreja sente-se família.\nR. Por vós o Evangelho foi proclamado aos nossos povos!\nLeitura alternativa\nDo \"Nicán Mopohua\", relato do escritor indígena António Valeriano, do século XVI\nOuviu-se em nossa terra o cantar da rola\nNaquela estação, do ano de 1531, passados poucos dias do mês de dezembro, sucedeu que havia um\nindiozinho, um humilde homem do povo, de nome Juan Diego. Era sábado e, bem de madrugada,\nele vinha em busca de Deus e dos seus mandamentos. [Relato completo do encontro de Nossa\nSenhora de Guadalupe com Juan Diego disponível no ofício impresso da Ordem.]\nRESPONSÓRIO Ct 2,14; Ap 12,1\nR. Pomba minha, que se aninha nos vãos do rochedo, pela fenda dos barrancos, deixa-me ver tua\nface. * Deixa-me ouvir tua voz; pois tua face é tão formosa e tão doce a tua voz!\nV. Um sinal grandioso apareceu no céu: uma mulher vestida com o sol, tendo sobre a cabeça uma\ncoroa de doze estrelas.\nR. Deixa-me ouvir tua voz; pois tua face é tão formosa e tão doce a tua voz!\nOração\nSenhor, nosso Deus, que destes à América Latina a proteção maternal de Maria, Mãe do vosso\nFilho; dai-nos, por sua intercessão, ser firmes na fé e servir os irmãos com amor sincero. Por nosso\nSenhor.\nLaudes\nHINO\nMaria de Guadalupe\npelas trilhas de Juan Diego,\nSenhora de nossa América,\nvem cantando hoje teu povo!\nOlha p'ra nós, Mãe, e escuta:\num sonho acalenta a América\nque nasceu da tua promessa\npara os pobres e famintos.\nAntífona e salmos do sábado da semana corrente.\nLEITURA BREVE Is 52,7-10\nComo são belos sobre os montes os pés do mensageiro que anuncia a paz, que traz as boas novas e\nanuncia a libertação, que diz a Sião: Teu Deus reina!\nRESPONSÓRIO BREVE\nR. Diante dele * prostrar-se-ão todas as nações!\nV. Todos os povos o servirão.\nR. Prostrar-se-ão todas as nações!\nV. Glória ao Pai, ao Filho e ao Espírito Santo.\nR. Diante dele prostrar-se-ão todas as nações!\nCântico evangélico\nAnt. Colocarei no meio de vós minha morada e enxugarei toda lágrima de vossos olhos. Como a\nmãe acaricia seu filho, assim eu os consolarei.\nPRECES\nUnidos a Santa Maria, Senhora da América Latina, elevemos nossa súplica a Cristo, evangelizador\npor excelência, e digamos juntos:\nR. Senhor da história, guiai os nossos passos!\nSenhor Jesus, Filho do Deus vivo, que proclamastes ao mundo a palavra que nos salva,\n- dai-nos a graça de nos comprometermos na obra da nova evangelização.\nSenhor Jesus, Bom Pastor, que guiais o rebanho pelos caminhos da justiça,\n- fazei que a Igreja latino-americana se torne de fato uma comunidade missionária.\nSenhor Jesus, nosso irmão, que lavastes os pés dos discípulos,\n- dai-nos coragem para nos comprometermos na promoção integral do povo latino-americano.\nPai Nosso...\nOração\nSenhor, nosso Deus, que destes à América Latina a proteção maternal de Maria, Mãe do vosso\nFilho; dai-nos, por sua intercessão, ser firmes na fé e servir os irmãos com amor sincero. Por nosso\nSenhor.", "form5Title": "SANTA MARIA DAS AMÉRICAS"}, "adoracao": "Adoração Eucarística\n\"Fala, que o teu servo escuta.\" 1Sm 3, 10\n1. Canto de Exposição do SS.\nSacramento\n2. Convite à Oração\nO sacerdote/diácono inicia a adoração solene ao Santíssimo\nSacramento: faz introdução e apresenta algumas motivações.\nDepois faz-se breve pausa e silêncio.\nD: Queridos irmãos, hoje nos reunimos diante do\nSantíssimo Sacramento para escutar e responder ao\nchamado de Deus em nossas vidas. Neste mês, somos\nconvidados a refletir sobre o tema ouvir e responder ao\nchamado de Deus, confirmando que o Senhor\nconstantemente nos chama a servi-Lo com\ngenerosidade e entrega.\nA exemplo dos nossos Primeiros Pais, que foram\nmovidos pelo Espírito a se comprometerem com o\ntestemunho do Evangelho e a comunhão fraterna, nós\ntambém somos chamados a servir a Deus e aos nossos\nirmãos e irmãs, inspirando-nos em Maria, a Mãe e\nServa do Senhor.\nNeste momento de adoração, peçamos a graça de ouvir\na voz de Deus em nosso coração e a coragem de\nresponder ao Seu chamado com fé e generosidade,\ncomo Maria respondeu com seu \"sim\". Que este tempo\ndiante do Senhor nos fortaleça para seguir Seu caminho\ncom alegria e fidelidade, sendo testemunhas de Seu\namor no mundo.\n3. Ato de Adoração\n(Orações do Anjo de Portugal ao Pastorinhos de\nFátima, em 1916)\nT: \"Meu Deus, eu creio, adoro, espero e amo-Vos.\nPeço-Vos perdão para os que não crêem, não\nadoram, não esperam e não Vos amam\".\n(Meditar alguns minutos em silêncio, pedindo ao\nSenhor a virtude da fé).\nT: \"Meu Deus, eu creio, adoro, espero e amo-Vos.\nPeço-Vos perdão para os que não crêem, não\nadoram, não esperam e não Vos amam\".\n(Meditar alguns minutos em silêncio, pedindo ao\nSenhor a virtude da esperança).\nT: \"Meu Deus, eu creio, adoro, espero e amo-Vos.\nPeço-Vos perdão para os que não crêem, não\nadoram, não esperam e não Vos amam\".\n(Meditar alguns minutos em silêncio, pedindo ao\nSenhor a virtude da caridade).\nT: Santíssima Trindade, Pai, Filho e Espírito Santo,\nadoro-Vos profundamente e ofereço-Vos o\npreciosíssimo Corpo, Sangue, Alma e Divindade de\nJesus Cristo, presente em todos os sacrários da\nterra, em reparação dos ultrajes, sacrilégios e\nindiferenças com que Ele mesmo é ofendido. E pelos\nméritos infinitos do Seu Santíssimo Coração e do\nCoração Imaculado de Maria, peço-Vos a\nconversão dos pobres pecadores.\n4. Canto\n5. Leitura Bíblica\nL1: O leitor lê da Bíblia, de pé, a perícope Bíblica:\n1 Samuel 3, 1-10.\n(Guardar silêncio para oração pessoal)\n6. Oração para Fazer Boa Escolha do\nEstado de Vida (adaptado)\nT: Ó Deus da sabedoria e do conselho, que ledes em\nmeu coração o desejo sincero de só a Vós servir, e\nde ordenar a minha vida segundo o vosso agrado:\nconcedei-me, por intercessão da Bem-aventurada\nVirgem Maria, minha mãe, e de todos os Santos,\nmeus advogados, especialmente nossos Sete Santos\nPais e São Filipe, a graça de conhecer o estado de\nvida que devo escolher e abraçar, de tornar-me apto\npara nêle procurar e aumentar a vossa glória,\ntrabalhar na salvação das almas, e assim merecer a\neterna recompensa, por Vós prometida aos que\ncumprem a vossa santíssima vontade. Assim seja.\n(Guardar silêncio para oração pessoal)\n7. Oração Vocacional\nD: Divino Salvador, que nos ensinastes a rezar:\n\"Mandai, Senhor, operários a vossa messe!\" dignai-vos\nsuscitar nas famílias cristãs muitas vocações\nsacerdotais e religiosas. Ilustrai a fé dos fiéis, a fim de\nque compreendam a grandeza desta santa vocação e\nfortalecei a vontade dos escolhidos, para que sejam\ngenerosos em seguir o vosso chamamento.\nT: Ofereço-Vos, Senhor, pelas mãos de nossa Mãe,\nMaria Santíssima: a adoração, terços, todas as\norações e trabalhos, todas as alegrias e sofrimentos\ndeste dia, pela santificação dos sacerdotes e pelas\nvocações sacerdotais e religiosas.\nD: Enviai, Senhor, à vossa Igreja.\nT: Santos sacerdotes e fervorosos religiosos!\nD: Senhor, dai-nos vocações religiosas. T: Senhor, dai-nos vocações religiosas.\nD: Senhor, dai-nos santas vocações religiosas. T:\nSenhor, dai-nos santas vocações religiosas.\nD: Sete Santos Fundadores, T: rogai por nós!\n8. Oração pelo Prior Geral e Prior\nProvincial\nD: Rezemos pelo nosso Prior Geral, Frei (Nome).\nMaria.\nT: Que o Senhor o ilumine e fortaleça em sua missão\nde guiar nossa Ordem, concedendo-lhe sabedoria e\ndiscernimento.\nD: \"Segui-me, e eu farei de vós pescadores de\nhomens.\" (Mt 4, 19)\nT: Que ele seja sempre um fiel seguidor de Cristo,\nnosso Mestre.\nD: Oremos: Deus Todo-Poderoso, derramai vossas\nbênçãos sobre Frei (nome). Maria, nosso Prior Geral.\nDai-lhe a coragem para liderar com justiça e\ncompaixão, inspirando-nos com seu exemplo de\nserviço e dedicação. Que ele conduza nossa Ordem\npelos caminhos da fé, esperança e caridade. Sob a\nproteção de Nossa Senhora, Mãe e Serva fiel, guardai-o e protegei-o em sua missão. Por Cristo nosso Senhor.\nT: Amém.\nD: Rezemos pelo nosso Prior Provincial, Frei (Nome).\nMaria.\nT: Que ele seja guiado pelo Espírito Santo em sua\nmissão, conduzindo-nos com sabedoria.\nD: \"Eis aqui a serva do Senhor. Faça-se em mim\nsegundo a tua palavra.\" (Lc 1, 38)\nT: Que ele, como Santa Maria, seja sempre fiel à\nvontade de Deus.\nD: Oremos: Ó Deus de bondade, derramai vossas\nbênçãos sobre Frei (Nome). Maria, nosso Prior\nProvincial. Enchei-o de vosso Espírito para que ele\npossa cumprir com alegria e dedicação sua missão de\ncuidar e orientar nossa província. Que seu ministério\nseja sempre um testemunho vivo do vosso amor e\nserviço. Pela intercessão de Nossa Senhora, Rainha dos\nServos, fortalecei-o e inspirai-o em sua caminhada. Por\nCristo, nosso Senhor.\nT: Amém.\nBênção do Santíssimo Sacramento\n(de joelhos)\n{TÃO SUBLIME VERÇÃO COMPLETA}\n(Vamos todos louvar juntos, o mistério de amor\nPois o preço deste mundo, foi o sangue redentor\nRecebido de Maria, que nos deu o salvador\nVeio ao mundo por Maria, foi por nós que ele nasceu\nEnsinou sua doutrina, com os homens conviveu\nNo final de sua vida um presente ele nos deu\nObservando a lei mosaica, se reuniu com os irmãos\nEra noite, despedida numa ceia, refeição\nDeu-se aos doze em alimento pelas suas próprias\nmãos\nA palavra do Deus vivo, transformou o vinho e pão\nNo seu sangue, no seu corpo, para nossa salvação\nO milagre nós não vemos, basta fé no coração\nTão sublime sacramento, adoremos neste altar\nPois o antigo testamento deu ao novo seu lugar\nVenha a fé por suplemento, os sentidos completar\nAo eterno pai cantemos e a Jesus, o salvador\nAo espírito exaltemos, na trindade eterno amor\nAo Deus uno e trino demos a alegria do louvor\nA alegria do louvor, alegria do louvor\nAmém!)\n{TÃO SUBLIME VERÇÃO BREVE}\nTão sublime Sacramento,\nadoremos neste altar.\npois o Antigo Testamento\ndeu ao Novo o seu lugar.\nVenha a fé por suplemento,\nos sentidos completar.\nAo eterno Pai cantemos\ne a Jesus, o redentor,\nAo Espírito exaltemos,\nna Trindade eterno amor.\nAo Deus uno e trino\ndemos a alegria do louvor. Amém!\nD: Do céu lhes destes o Pão. (T. P. Aleluia)\nT: Que contém todo sabor. (T.P. Aleluia)\nSacerdote: Oremos: Deus, que neste admirável\nSacramento, nos deixastes o memorial da vossa paixão,\nconcedei-nos tal veneração pelos sagrados mistérios do\nvosso Corpo e do vosso Sangue, que experimentemos\nsempre em nós a sua eficácia redentora. Vós, que viveis\ne reinais pelos séculos dos séculos.\nT: Amém.\n(Segue-se a bênção do Santíssimo Sacramento)\nD: Bendito seja Deus.\nT: Bendito seja o seu santo nome.\n- Bendito seja Jesus Cristo, verdadeiro Deus e\nverdadeiro homem.\n- Bendito seja o nome de Jesus.\n- Bendito seja o seu Sacratíssimo Coração.\n- Bendito seja o seu Preciosíssimo Sangue.\n- Bendito seja Jesus no Santíssimo Sacramento do\naltar.\n- Bendito seja o Espírito Santo Paráclito.\n- Bendita seja a grande mãe de Deus, Maria\nsantíssima.\n- Bendita seja sua santa e Imaculada Conceição.\n- Bendita seja sua gloriosa Assunção.\n- Bendito seja o nome de Maria, virgem e mãe.\n- Bendito seja são José, seu castíssimo esposo.\n- Bendito seja Deus, nos seus anjos e nos seus santos.\nD: Deus e Senhor nosso,\nT: protegei a vossa Igreja, dai-lhe santos pastores e\ndignos ministros. Derramai as vossas bênçãos sobre\no nosso Santo Padre, o papa, sobre o nosso bispo,\nsobre o nosso pároco e todo o clero, sobre o chefe da\nnação e do Estado e sobre todas as pessoas\nconstituídas em dignidade para que governem com\njustiça. Dai ao povo brasileiro paz constante e\nprosperidade completa. Favorecei com os efeitos\ncontínuos de vossa bondade o Brasil, este bispado, a\nparóquia em que habitamos, cada um de nós em\nparticular e todas as pessoas por quem somos\nobrigados a rezar ou que se recomendaram as\nnossas orações. Tende misericórdia das almas dos\nfiéis que padecem no purgatório. Dai-lhes, Senhor,\no descanso e a luz eterna.\n(Pai-Nosso, Ave-Maria e Glória ao Pai nas intenções do Santo Padre.)", "antifonas": "Antífonas finais de Nossa Senhora\n\nAo final das Vésperas (ou de todo o Ofício do dia), canta-se ou reza-se uma das seguintes antífonas marianas, conforme o tempo litúrgico:\n\nAlma Redemptoris Mater — Advento e Natal\nÓ Mãe do Redentor, do céu ó porta,\nao povo que caiu, socorre e exorta,\npois busca levantar-se, Virgem pura,\nnascendo o Criador da criatura:\ntem piedade de nós e ouve, suave,\no anjo te saudando com seu Ave!\n\n(Latim)\nAlma Redemptóris Mater,\nquae pérvia caeli porta manes,\net stella maris, succúrre cadénti,\nsúrgere qui curat, pópulo;\ntu quae genuísti, natura miránte,\ntuum sanctum Genitórem,\nVirgo prius ac postérius,\nGabriélis ab ore sumens illud Ave,\npeccatórum miserére.\n\nAve, Regina Cælorum — Quaresma\nAve, Rainha do céu;\nave, dos anjos Senhora;\nave, raiz, ave, porta;\nda luz do mundo és aurora.\nExulta, ó Virgem tão bela,\nas outras seguem-te após;\nnós te saudamos: adeus!\nE pede a Cristo por nós!\nVirgem Mãe, ó Maria!\n\n(Latim)\nAve, Regína caelórum\nave, Dómina angelórum,\nsalve, radix, salve, porta,\nex qua mundo lux est orta.\nGaude, Virgo gloriósa,\nsuper omnes speciósa;\nvale, o valde decóra,\net pro nobis Christum exóra.\n\nSalve, Regína — Tempo Comum\nSalve, Rainha, Mãe de misericórdia,\nvida doçura, esperança nossa, Salve!\nA vós bradamos os degredados filhos de Eva,\na vós suspiramos gemendo e chorando\nneste vale de lágrimas!\nEia, pois, Advogada nossa,\nesses vossos olhos misericordiosos a nós volvei,\ne depois deste desterro mostrai-nos Jesus,\nbendito fruto do vosso ventre!\nÓ clemente, ó piedosa,\nó doce sempre Virgem Maria.\n\n(Latim)\nSalve, Regína, mater misericórdiae;\nvita, dulcédo et spes nostra, salve.\nAd te clamámus, éxsules fílii Evae.\nAd te suspirámus, geméntes et flentes\nin hac lacrimárum valle.\nEia ergo, advocáta nostra,\nillos tuos misericórdes óculos\nad nos convérte.\nEt Iesum, benedíctum fructum ventris tui,\nnobis post hoc exsílium osténde.\nO clemens, o pia, o dulcis Virgo Maria.\n\nSub tuum praesídium — Qualquer tempo\nÀ vossa proteção recorremos, santa Mãe de Deus;\nnão desprezeis as nossas súplicas em nossas necessidades,\nmas livrai-nos sempre de todos os perigos,\nó Virgem gloriosa e bendita.\n\n(Latim)\nSub tuum praesídium confúgimus,\nsancta Dei Génitrix;\nnostras deprecatiónes ne despícias in necessitátibus,\nsed a perículis cunctis líbera nos semper,\nVirgo gloriósa et benedícta.\n\nSalve Rainha (versão cantada)\nSalve Rainha mãe de Deus,\nÉs Senhora nossa mãe, nossa doçura,\nNossa luz, doce Virgem Maria.\nNós a ti clamamos, filhos exilados,\nNós a ti voltamos nosso olhar confiante.\nVolta para nós, oh mãe,\nTeu semblante de amor.\nDá-nos teu Jesus, oh mãe,\nquando a noite passar.\nSalve Rainha mãe de Deus,\nÉs auxílio dos cristãos,\nOh mãe clemente, mãe piedosa,\nDoce Virgem Maria.\n\nSúplica dos Servos de Maria\nBondade, que nos abre o infinito,\ntesouro da graça Santa Mãe.\nInfunde em teus servos a esperança.\n\nVirtude, que com bondade nos socorre\nna incerta e difícil caminhada.\nDá-nos a fidelidade em teu serviço.\n\nReaviva em nós o antigo e sagrado compromisso\nde servir aos irmãos no amor,\ne com olhar fixo em ti seguir a Cristo!", "variasHome": [{"title": "Bênção da refeição", "text": "Comum\n Bendito sejais, Senhor Deus, nosso Pai, que\nfazeis germinar os frutos da terra, por estes dons que\ncolocastes sobre a nossa mesa. Abençoai aqueles que,\ncom seu trabalho, os cultivaram, os que os prepararam\ncomo alimento e a nós que estamos para recebê-los\ncom o coração agradecido, enquanto esperamos\nencontrar-nos um dia todos reunidos no vosso Reino\neterno. Por Cristo nosso Senhor. Amém!\nNas festas marianas\n\n Senhor Deus, nosso Pai, que na Virgem Maria\ndestes à Igreja a imagem profética do seu futuro;\nabençoai a nós e ao alimento que estamos para tomar e\nfazei que, celebrando hoje a bendita entre as mulheres,\npossamos refletir em nós sua vida de obediência e de\namor. Por Cristo nosso Senhor. Amém!\nNas visitas de familiares e amigos\n Senhor nosso Deus, que de muitas maneiras\nconvidais os seres humanos, ajudai-nos a compreender\no dom da graça da hospitalidade, para que saibamos\nreconhecer a vossa presença no irmão que nos visita.\nSede bendito agora e sempre. Amém!\n\nNos momentos de alegria\n Ó Deus, fonte da alegria, por meio do vosso\nFilho, nos fazeis participar das vossas maravilhas: nós\nvos bendizemos pelos dons do vosso amor, em modo\nparticular hoje ...[explicitar o motivo da alegria], e vos\npedimos que transformeis as alegrias deste dia em\njúbilo perene no céu. Por Cristo nosso Senhor. Amém!"}, {"title": "Pelas vocações", "text": "I. Ó Maria, que chamastes os nossos Sete Santos\nPais e, ao longo dos séculos, tantos outros homens e\nmulheres, para servir a Cristo e aos irmãos, inspirando-\nse no Evangelho e no vosso exemplo, concedei-nos\nhoje também a graça de muitas vocações para a vossa\nOrdem.\n Fazei que a nossa Família seja sempre a casa por\nvós abençoada e amada, de modo que, quantos a\nescolherem como sua morada, vivam generosamente os\nensinamentos do vosso Filho e se coloquem\ninteiramente a serviço da Igreja e dos seres humanos.\nAmém!\n II. Senhor, humildemente vos pedimos: concedei\nque os Servos e as Servas de Santa Maria vivam uma\nvida fraterna e santa e se tornem neste mundo\ntestemunhas de bondade e de misericórdia.\n\n Que as nossas comunidades e fraternidades sejam\ncaminho, ponte e sinal para os que desejam ir ao vosso\nencontro; sejam luz para os que precisam de luz, paz\npara os que buscam a paz e serviço para os que dele\nprecisam; sejam apelo à oração, fraternidade que\nliberta os seres humanos da solidão e lugar onde a luz\ndo Ressuscitado se irradie em formas de vida humana.\nAmém!"}, {"title": "Pelas missões", "text": "Ó Virgem Maria, Rainha dos apóstolos,\nchamastes os nossos Santos Primeiros Pais ao\nseguimento do vosso Filho Jesus e os enviastes no meio\ndos homens para testemunhar o Evangelho em\ncomunhão fraterna.\n Acompanhai e guiai os nossos irmãos e irmãs que\nassumiram o compromisso de irradiar no mundo o\ncarisma da nossa vocação, e intercedei por nós junto ao\nSenhor, para que a grande messe da humanidade possa\ncontar com operários dignos e em número suficiente\npara a colheita. Amém!"}, {"title": "Pelos doentes", "text": "Ó Deus misericordioso, salvação eterna dos que\ncreem, escutai as preces que vos fazemos por...[diz-se\no nome do(a) doente] e fazei que ele (ela) volte ao\nconvívio da vossa Igreja onde possa render-vos graças\n\ne proclamar as vossas maravilhas. Por Cristo nosso\nSenhor. Amém!"}, {"title": "Pelos defuntos", "text": "Antífona\n\n Senhor, fonte de luz, iluminai as minhas trevas.\nLibertados pelo amor de Cristo, possamos esperar a\nvida eterna. Outros me haviam falado de vós, mas\nagora meus olhos vos veem.\n\nSalmo 129\n- Das profundezas, Senhor, a ti eu clamo. *\n Senhor, escuta o meu apelo;\n- teus ouvidos estejam bem atentos *\n ao clamor de minha súplica.\n- Se levares em conta, Senhor, nossas faltas, *\n Senhor, quem poderá subsistir?\n- Mas em ti encontra-se o perdão, *\n eu temo e espero.\n\n- Minha alma espera no Senhor, *\n em sua palavra tenho confiança;\n- minha alma espera pelo Senhor, *\n mais confiante do que o vigia\n\n esperando pela aurora.\n\n- Que o vigia espere pela aurora, *\n e Israel pelo Senhor.\n\n- Porque no Senhor encontra-se a graça, *\n copiosa redenção\n- é ele quem redimirá Israel *\n de todas as suas faltas.\nOração [reza-se uma das seguintes orações]\n I. Pai Santo, luz e salvação dos homens, vós nos\nrevelastes as riquezas do vosso amor através do mundo\ncriado e, sobretudo, em vosso próprio Filho.\n Concedei, pois, que nossos irmãos e irmãs\ndefuntos, que viveram em comunhão fraterna na busca\nda vossa face, possam entrar em vossa morada e\ncontemplar o que sempre desejaram ver.\n E a nós, que continuamos a buscar-vos, concedei a\ngraça de fortalecer a nossa esperança e de recobrar\nnovo alento no caminho que conduz à terra dos vivos.\nPor Cristo nosso Senhor. Amém!\n II. Ó Deus, em Cristo vosso Filho, destes aos\nhomens, peregrinos nesta terra, o penhor de uma segura\nesperança e a fonte da água viva.\n Sede benigno com os nossos irmãos e irmãs que,\ntendo completado sua peregrinação terrena, partiram\ndeste mundo rumo à morada eterna.\n\n Saciai com vosso amor a sede que eles têm de vós\ne introduzi-os em vossa casa, onde sejam festivamente\nrecebidos no convívio dos santos. Por Cristo nosso\nSenhor. Amém!\n\n III. Senhor, vós conheceis a fraqueza humana e,\ncomo Pai bondoso e rico em misericórdia, não vos\ncansais de esperar nosso retorno para abraçar-nos e dar-\nnos o vosso perdão.\n Tende piedade dos nossos irmãos e irmãs que,\ninvestidos pelo vento da morte, tirastes do meio de nós.\nDai-lhes, Senhor, descanso junto a vós, para que, com\na Virgem Mãe e com os irmãos já transfigurados por\nvosso amor, possam louvar eternamente a vossa\nmisericórdia. Por Cristo nosso Senhor. Amém!"}, {"title": "Bem-aventurada Virgem Maria ao Pé da Cruz", "sub": "Sexta-feira depois do V Domingo de Quaresma", "text": "Festa\nInvitatório\nAnt. Vinde, adoremos o Redentor do mundo: junto à cruz está sua mãe, mergulhada num vale de lágrimas.\nSalmo invitatório, como no Ordinário, p. 35. Ofício das Leituras\n\nHino\n\nA Mãe estava de pé junto à cruz,\num pouco à parte e envolta em silêncio, qual uma sombra de negro vestida: tudo era imóvel e o vento parado.\n\nPerdida, ao longe fixava sua vista: ó Mãe, que vias do alto do Monte?\nVias talvez uma selva de cruzes\nou tu também nada mais percebias?\n\nTu és, ó Mãe, toda a mãe que hoje ama, tu és, ó Mãe, toda a mãe que hoje chora seu filho morto, seu filho traído:\nmães aos milhares, mães amortalhadas!\n\nFilhos que sempre se estão a matar, filhos vendidos, traídos sem número, filhos feridos e em cruzes pregados, ímpia bandeira de um ímpio poder.\n\nJá densas trevas cobriam a cidade, inda mais pálido fez-se seu rosto; todo seu corpo coberto de sangue rubro de sangue também era o céu,\n\nqual lençol negro de sangue estirado, para envolver sua Ausência infinita, que inda mais triste o silêncio a tornava e se adensava e fluía nos ares.\n\nNada pedimos, ó Mãe, para nós: crermos apenas, por quanto possível, e junto à cruz ao teu lado ficarmos:\nesta é a resposta ao mistério do mundo.\n\nSalmodia\nEscolhe-se uma das séries de antífonas seguintes.\nAnt. 1\n    A. Perto da cruz de Jesus estava sua mãe, firme na fé, forte na esperança e ardente na caridade.\n    B. Vós, Senhor, sois o escudo que me protege e o consolo em minha amargura.\n    C. Enquanto Cristo se oferece ao Pai em oblação, Maria se associa a ele pela fé.\nSalmo 3\nMorte e ressurreição do justo\nAquele que eles fizeram perecer, suspendendo-o na cruz, Deus o ressuscitou ao terceiro dia (At 10,39-40).\nQuão numerosos, ó Senhor, os que me atacam; * quanta gente se levanta contra mim!\nMuitos dizem, comentando a meu respeito: * \"Ele não acha a salvação junto a Deus!\"\nMas vós sois o meu escudo protetor, *\na minha glória que levanta minha cabeça! Quando eu chamei em alta voz pelo Senhor, * do monte santo ele me ouviu e respondeu.\nEu me deito e adormeço bem tranquilo; * acordo em paz, pois o Senhor é meu sustento.\n    • Não terei medo de milhares que me cerquem, * e furiosos se levantem contra mim.\n= Levantai-vos, ó Senhor, vinde salvar-me! †\nVós que feristes em seu rosto os que me atacam, * e quebrastes aos malvados os seus dentes.\n    • Em vós, Senhor, nós encontramos salvação; * e repouse a vossa bênção sobre o povo!\nAnt. 1\n    A. Perto da cruz de Jesus estava sua mãe: firme na fé, forte na esperança e ardente na caridade.\n    B. Vós, Senhor, sois o escudo que me protege e o conso lo em minha amargura.\n    C. Enquanto Cristo se oferece ao Pai em oblação, Maria se associa a ele pela fé.\n\nOração sálmica\nOuvi, Senhor, do vosso santo monte, a súplica de quem vos invoca; derramai sobre nós a bênção que Jesus nos mereceu na cruz e confirmai-nos na esperança da salvação, que ele proclamou ao ressuscitar dos mortos. Pelo mesmo Cristo nosso Senhor.\nAnt.2\n    A. Todos fogem, mas a mãe de Jesus permanece firme de pé junto à cruz.\n    B. Voltai para mim vosso olhar, Senhor, e respondei-me: eu confio em vossa misericórdia.\n    C. Da árvore, Eva colhe o fruto da morte e o oferece ao homem; do madeiro da cruz, Maria colhe o alimento da vida e oferece-o a toda a humanidade.\n\nSalmo 12\nLamentação do justo que confia em Deus.\nNa esperança fomos salvos (Rm 8,24).\n- Até quando, ó Senhor, me esquecereis? * Até quando escondereis a vossa face?\n= Até quando estará triste a minha alma? † e o coração angustiado cada dia? *\nAté quando o inimigo se erguerá?\n= Olhai, Senhor meu Deus, e respondei-me! † Não deixeis que se me apague a luz dos olhos * e se fechem, pela morte, adormecidos.\n= Que o inimigo não me diga: \"Eu triunfei!\" Nem exulte o opressor por minha queda, * uma vez que confiei no vosso amor!\n\nMeu coração, por vosso auxílio, rejubile, *\ne que eu vos cante pelo bem que me fizestes.\nAnt.2\n    A. Todos fogem, mas a Mãe de Jesus permanece firme de pé junto à cruz.\n    B. Voltai para mim vosso olhar, Senhor, e respondei-me: eu confio em vossa misericórdia.\n    C. Da árvore, Eva colhe o fruto da morte e o oferece ao homem; do madeiro da cruz, Maria colhe o alimento da vida e oferece-o a toda a humanidade.\nOração sálmica\nO Deus, gravai em nosso coração a lembrança da paixão do vosso Filho e das dores de sua Mãe: na hora da provação, despertai em nós seus mesmos sentimentos para que, confiantes em vossa misericórdia, possamos alegrar-nos pelo dom da vossa salvação. Por Cristo nosso Senhor.\nAnt. 3\n    A. Sua Mãe, em prantos, permanece junto à cruz: sua dor é maior que o martírio.\n    B. Diante dos ímpios que me oprimem, guardai-me, Senhor, qual pupila de vossos olhos.\n    C. Junto à cruz, Maria aceita como filhos todos os ho mens que Deus, em seu amor, lhe confiara.\nSalmo 16\nDeus, esperança do inocente perseguido\nJesus, cheio de angústias, orava com maior insistência (Lc 22,43).\n    • Ó Senhor, ouvi a minha justa causa, * escutai-me e atendei o meu clamor!\n    • Inclinai o vosso ouvido à minha prece, pois não existe falsidade em meus lábios!\n    • De vossa face é que me venha o julgamento, * pois vossos olhos sabem ver o que é justo.\n= Provai meu coração durante a noite, † visitai-o, examinai-o pelo fogo, *\nmas em mim não achareis iniquidade.\n    • Não cometi nenhum pecado por palavras, * como é costume acontecer em meio aos homens.\n    • Seguindo as palavras que dissestes, * andei sempre nos caminhos da Aliança.\n    • Os meus passos eu firmei na vossa estrada, * e por isso os meus pés não vacilaram.\n    • Eu vos chamo, ó meu Deus, porque me ouvis, * inclinai o vosso ouvido e escutai-me.\n= Mostrai-me vosso amor maravilhoso, † vós que salvais e libertais do inimigo * quem procura a proteção junto a vós.\n    • Protegei-me qual dos olhos a pupila * e guardai-me, à proteção de vossa asas,\n    • longe dos ímpios violentos que me oprimem, * dos inimigos furiosos que me cercam.\n    • A abundância lhes fechou o coração, * em sua boca há só palavras orgulhosas.\n    • Os seus passos me perseguem, já me cercam, * voltam seus olhos contra mim: vão derrubar-me,\n    • como um leão impaciente pela presa, * um leãozinho espreitando de emboscada.\n    • Levantai-vos, ó Senhor, contra o malvado, * com vossa espada abatei-o e libertai-me!\n    • Com vosso braço defendei-me desses homens, * que já encontram nesta vida a recompensa.\n= Saciais com vossos bens os ventres deles, † e os seus filhos também hão de saciar-se *\ne ainda as sobras deixarão aos descendentes.\n    • Mas eu verei, justificado, a vossa face * e ao despertar me saciará vossa presença.\nAnt.3\n    A. Sua Mãe, em prantos, permanece junto à Cruz: sua dor é maior que o martírio.\n    B. Diante dos ímpios que me oprimem, guardai-me, Senhor, qual pupila dos vossos olhos.\n    C. Junto à cruz, Maria aceita como filhos todos os homens que Deus, em seu amor, lhe confiara.\nOração sálmica\nAtendei, ó Pai, a súplica que vosso Filho vos faz do alto da cruz: irmão nosso, ele pede por nós; inocente, intercede pelos pecadores. Reconciliados por ele, possamos nós também contemplar vossa face e, no último dia, ao despertar do sono da morte, saciar-nos da vossa presença. Por Cristo nosso Senhor.\nV. Ouvi, povos todos, e vede minha dor.\nR. O Senhor deixou-me desolada e amargurada para sempre.\n\nPrimeira leitura\nDo livro do profeta Isaías (52,13-53.12)\nEle foi traspassado por causa de nossas transgressões\nEis que meu servo será bem sucedido; subirá, será exaltado e elevado bem alto. Assim como muitos se sentiram horrorizados à vista dele - tão desfigurado ele estava que já não parecia homem e seu aspecto já não era o de seres mortais - do mesmo modo muitos povos se admiram, diante dele os reis ficam mudos; pois vêem algo que jamais lhes foi contado, e chegam a saber o que nunca tinham ouvido.\nQuem deu crédito ao que nos era anunciado, e a quem o braço do Senhor foi revelado? Ele vegetava na sua presença como um rebento, como raiz em terra seca: não tinha beleza nem formosura que atraísse os nossos olhares, não tinha apresentação para que desejássemos vê-lo. Era desprezado, era o refugo da humanidade, homem das dores e habituado à enfermidade; era como pessoa de quem se desvia o rosto, tão desprezível que não fizemos caso dele.\nNo entanto, foi ele que carregou as nossas enfermidades, e tomou sobre si as nossas dores. E nós o considerávamos como alguém fulminado, castigado por Deus e humilhado. Mas ele foi traspassado por causa das nossas re-beldias, esmagado por causa dos nossos crimes; caiu sobre ele o castigo que nos salva, e suas feridas nos curaram.\nTodos nós andávamos extraviados como ovelhas, cada um de nós se desviava para o próprio caminho, mas o Senhor fez cair sobre ele a iniquidade de todos nós. Maltratado, ele se humilhava e não abria a boca. Foi eliminado por um julgamento violento, e quem se preocupa com sua sorte? De fato, foi exterminado do país dos vivos; por causa da rebeldia de meu povo foi golpeado de morte. Deram-lhe sepultura em meio aos ímpios e seu túmulo está com os ricos, embora não tivesse praticado violência, nem houvesse falsidade em sua boca. Mas o Senhor quis esmagá-lo com a doença: se fizer de sua vida um sacrifício expiatório, ele verá sua descendência, prolongará seus dias, e a causa do Senhor triunfará graças a ele. Depois de profundos sofrimentos, ele verá a luz, sentir-se-á satisfeito; com seu conhecimento, meu Servo justo justificará a muitos, e tomará sobre si as suas iniquidades.\nPor isso lhe darei uma parte entre os grandes, e com os poderosos ele partilhará os despojos; é que entregou sua vida à morte e se deixou contar entre os rebeldes, quando na realidade carregava o pecado de muitos e intervinha em favor dos rebeldes.\nRESPONSÓRIO Is53,4a.5.6b\nR. Ele carregou as nossas enfermidades e tomou sobre si as nossas dores. Foi traspassado por causa das nossas rebeldias e esmagado por causa dos nossos crimes. * Suas feridas nos curaram.\nV. O Senhor fe
