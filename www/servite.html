<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>window.__SERVITE_VIEW__=new URLSearchParams(location.search).get('view')||'completo';</script>
<script>
(function(){
  try{
    var t = localStorage.getItem('osmTheme') || localStorage.getItem('santoral-osm-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var scale = parseFloat(localStorage.getItem('osmReaderScale') || '1');
    if(isFinite(scale)){ document.documentElement.style.fontSize = (16*scale) + 'px'; }
  }catch(e){}
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santoral OSM — Servos de Maria</title>
<link rel="stylesheet" href="media/fonts/fonts.css">
<style>
:root{
  --bg-deep:#EFE4BC;
  --bg-panel:#F8F1D9;
  --bg-panel-2:#FCF8E9;
  --line:#D9C68F;
  --gold:#8A6A1E;
  --gold-soft:#6E5416;
  --wine:#9A2620;
  --wine-soft:#9A2620;
  --paper:#211A10;
  --paper-dim:#211A10;
  --text:#211A10;
  --text-muted:#7A6A46;
  --text-faint:#93815A;
  --shadow: 0 10px 22px -14px rgba(110,84,22,.35);
  --topbar-bg1: rgba(248,241,217,.92);
  --topbar-bg2: rgba(248,241,217,.55);
  --tabbar-bg: rgba(248,241,217,.92);
  --card-corner: rgba(138,106,30,.35);
  --prayer-card-bg1: rgba(154,38,32,.09);
  --prayer-card-bg2: rgba(154,38,32,.03);
  --prayer-card-border: rgba(154,38,32,.30);
  --ambient-1: rgba(154,38,32,.05);
  --ambient-2: rgba(138,106,30,.10);
  --ambient-3: rgba(154,38,32,.04);
  --ambient-bg: linear-gradient(180deg, #F1E6C1 0%, #EFE3BA 45%, #EADBA9 100%);
  --noise-color:0.36, 0.29, 0.13;
  --noise-opacity:.5;
  --noise-blend:multiply;
  --rank-text:#F6EAD2;
}

[data-theme="dark"]{
  --bg-deep:#0B1626;
  --bg-panel:#101E33;
  --bg-panel-2:#14263F;
  --line:#243652;
  --gold:#D9B65C;
  --gold-soft:#E8CD87;
  --wine:#E2645A;
  --wine-soft:#E2857C;
  --paper:#F1EEE3;
  --paper-dim:#F1EEE3;
  --text:#F1EEE3;
  --text-muted:#9FB0C9;
  --text-faint:#71839E;
  --shadow: 0 12px 26px -14px rgba(0,0,10,.6);
  --topbar-bg1: rgba(11,22,38,.92);
  --topbar-bg2: rgba(11,22,38,.55);
  --tabbar-bg: rgba(11,22,38,.92);
  --card-corner: rgba(217,182,92,.28);
  --prayer-card-bg1: rgba(226,100,90,.14);
  --prayer-card-bg2: rgba(226,100,90,.04);
  --prayer-card-border: rgba(226,100,90,.32);
  --ambient-1: rgba(217,182,92,.07);
  --ambient-2: rgba(70,110,180,.16);
  --ambient-3: rgba(226,100,90,.05);
  --ambient-bg: linear-gradient(180deg, #0D1B2E 0%, #0B1626 45%, #081120 100%);
  --noise-color:0.55, 0.65, 0.85;
  --noise-opacity:.06;
  --noise-blend:screen;
  --rank-text:#1A1008;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'EB Garamond', Georgia, serif;
  min-height:100vh;
  overflow-x:hidden;
  transition:background .25s ease, color .25s ease;
}

#app{
  position:relative;
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== ambient background ===== */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 700px 420px at 12% -5%, var(--ambient-1), transparent 60%),
    radial-gradient(ellipse 620px 520px at 105% 25%, var(--ambient-2), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 110%, var(--ambient-3), transparent 65%),
    var(--ambient-bg);
  transition:background .25s ease;
}
.ambient::after{
  content:"";
  position:absolute; inset:0;
  opacity:var(--noise-opacity);
  mix-blend-mode:var(--noise-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.13  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ===== header ===== */
.topbar{
  position:relative; z-index:2;
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--topbar-bg1), var(--topbar-bg2));
  backdrop-filter: blur(6px);
}
.topbar-inner{display:flex; align-items:center; gap:10px;}
.topbar-text{ min-width:0; flex:1 1 auto; }
.topbar-text .eyebrow, .topbar-text h1{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crest{flex:none; width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
.crest img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(110,84,22,.35));}
.eyebrow{
  margin:0 0 2px; font-family:'Cinzel',serif; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--wine-soft); font-weight:600;
}
.topbar h1{
  margin:0; font-family:'Cinzel',serif; font-size:18px; font-weight:600;
  color:var(--gold-soft); letter-spacing:.02em; line-height:1.15;
}
.theme-toggle{
  flex:none; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.header-controls{ margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; }
.font-toggle{
  display:flex; align-items:center; border:1px solid var(--line); border-radius:20px;
  overflow:hidden; background:var(--bg-panel);
}
.font-btn{
  border:none; background:none; color:var(--gold-soft); cursor:pointer;
  font-family:'Cinzel',serif; font-size:11px; font-weight:600; padding:8px 9px; line-height:1;
}
.font-btn:first-child{ border-right:1px solid var(--line); }
.font-btn:active{ background:rgba(138,106,30,.14); }

.settings-btn{
  flex:none; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-panel); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.settings-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.settings-btn.active{ color:var(--wine); border-color:var(--wine); }

.settings-panel{
  position:relative; z-index:2;
  padding:16px 20px 18px;
  border-bottom:1px solid var(--line);
  background:var(--bg-panel);
  display:flex; flex-direction:column; gap:12px;
}
.settings-panel[hidden]{ display:none; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.settings-label{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); flex:none;
}
.chip-group{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.chip{
  font-family:'EB Garamond',serif; font-size:13px; border:1px solid var(--line); background:var(--bg-panel-2);
  color:var(--text-muted); border-radius:16px; padding:6px 12px; cursor:pointer;
}
.chip.active{ background:rgba(138,106,30,.16); border-color:var(--gold); color:var(--gold-soft); font-weight:600; }

.lang-note{
  font-style:italic; font-size:.85rem; color:var(--text-faint); margin:-6px 0 14px;
}
.theme-toggle svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.theme-toggle .icon-moon{ display:none; }
[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

/* ===== main view ===== */
main#view{
  position:relative; z-index:1;
  flex:1;
  padding:18px 18px 100px;
}

.section-title{
  font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--gold-soft); margin:26px 0 10px; padding-left:2px;
}
.section-title:first-child{margin-top:0;}

/* ===== cards ===== */
.card{
  background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
  position:relative;
}
.card::before{
  content:"";
  position:absolute; inset:0; border-radius:14px; padding:1px;
  background:linear-gradient(160deg, var(--card-corner), transparent 40%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}

/* ---- date hero ---- */
.hero-date{
  text-align:center;
  padding:26px 18px 22px;
}
.hero-date .weekday{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:6px;
}
.hero-date .day{
  font-family:'Cinzel',serif; font-size:3.5rem; line-height:1; color:var(--gold-soft);
  font-weight:600;
}
.hero-date .month{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1875rem; color:var(--text-muted);
  margin-top:6px;
}
.hero-divider{
  width:64px; height:1px; margin:16px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ---- saint of the day card ---- */
.saint-card .rank{
  display:inline-block; font-family:'Cinzel',serif; font-size:0.625rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--rank-text); background:var(--wine);
  padding:3px 9px; border-radius:20px; margin-bottom:10px; font-weight:600;
}
.saint-card h2{
  font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.5625rem; margin:0 0 4px;
  color:var(--paper); line-height:1.2;
}
.saint-card .date-line{
  color:var(--text-muted); font-style:italic; font-size:0.9375rem; margin-bottom:14px;
}
.empty-note{
  color:var(--text-muted); font-size:1rem; line-height:1.6; font-style:italic;
}
.link-row{
  margin-top:14px; display:flex; justify-content:flex-end;
}
.btn-link{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-soft); background:none; border:1px solid var(--line); border-radius:20px;
  padding:9px 16px; cursor:pointer; transition:.2s;
}
.btn-link:active{ background:rgba(138,106,30,.10); }

/* ---- angelus toggle card ---- */
.toggle-row{ display:flex; gap:8px; margin-bottom:14px; }
.toggle-btn{
  flex:1; font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.06em;
  background:var(--bg-panel); border:1px solid var(--line); color:var(--text-muted);
  padding:10px 6px; border-radius:10px; cursor:pointer; text-transform:uppercase;
}
.toggle-btn.active{ background:rgba(138,106,30,.14); border-color:var(--gold); color:var(--gold-soft); }

.prayer-block{
  font-family:'Times New Roman', Times, serif; font-size:1.0625rem; line-height:1.72; color:var(--text);
  white-space:normal;
}
.prayer-block .prayer-paragraph{
  margin:0 0 1.15em;
  line-height:1.72;
  white-space:pre-wrap;
}
.prayer-block .prayer-paragraph:last-child{ margin-bottom:0; }
/* Liturgia das Horas: o espaço entre estrofes e salmos segue o modelo dos documentos litúrgicos fornecidos. */
.prayer-block .prayer-paragraph + .prayer-paragraph{ margin-top:0.18em; }
.prayer-block .rubric{ color:var(--wine); font-weight:700; font-family:'Times New Roman', Times, serif; }

.guided-crown-card{ border:1px solid rgba(138,106,30,.3); background:linear-gradient(135deg, rgba(255,248,220,.95), rgba(255,255,255,.72)); }
.guided-crown-visual{ margin:0 0 16px; padding:10px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.78); box-shadow:0 8px 24px rgba(74,48,24,.08); }
.guided-crown-visual img{ display:block; width:100%; max-height:430px; object-fit:contain; border-radius:9px; background:#fff; }
.guided-crown-visual figcaption{ margin:9px 4px 0; color:var(--text-faint); font-size:.86rem; line-height:1.45; text-align:center; }
@media(max-width:560px){ .guided-crown-visual{ padding:6px; } .guided-crown-visual img{ max-height:300px; } .guided-crown-visual figcaption{ font-size:.78rem; } }
.guided-crown-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.guided-crown-kicker{ font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
.guided-crown-progress{ height:6px; border-radius:999px; background:rgba(138,106,30,.14); overflow:hidden; margin:10px 0 18px; }
.guided-crown-progress > span{ display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--wine),var(--gold)); transition:width .45s ease; }
.guided-crown-step{ animation:guidedCrownIn .42s ease both; }
@keyframes guidedCrownIn{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
.guided-crown-pain{ font-family:'Cinzel',serif; font-size:1.05rem; color:var(--wine); margin:0 0 10px; }
.guided-crown-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
.guided-crown-actions button{ flex:1; }
.guided-crown-dot{ display:inline-flex; width:28px; height:28px; align-items:center; justify-content:center; border-radius:50%; background:rgba(138,106,30,.13); color:var(--wine); font-family:'Cinzel',serif; margin-right:8px; }
.hour-tabs{
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;
  border-bottom:1px solid var(--line); padding-bottom:14px;
}
.hour-tab-btn{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); background:transparent; border:1px solid var(--line);
  border-radius:16px; padding:7px 14px; cursor:pointer; transition:all .2s ease;
}
.hour-tab-btn:hover{ color:var(--wine-soft); border-color:var(--wine-soft); }
.hour-tab-btn.active{
  color:#fff; background:var(--wine); border-color:var(--wine); font-weight:600;
}
.hour-tab-btn.small{ font-size:0.5625rem; padding:5px 10px; }
.hour-tab-content{}
.hour-sublabel{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-faint); margin:12px 0 4px;
}
.hour-sublabel:first-child{ margin-top:0; }
.hour-divider{
  height:1px; margin:14px 0; background:linear-gradient(90deg, var(--line), transparent);
}

/* ===== santoral list ===== */
.search-wrap{ margin-bottom:18px; }
.search-input{
  width:100%; background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
  color:var(--text); font-family:'EB Garamond',serif; font-size:1rem; padding:12px 16px;
  outline:none;
}
.search-input::placeholder{ color:var(--text-faint); }
.search-input:focus{ border-color:var(--gold); }

.month-group{ margin-bottom:6px; }
.month-label{
  font-family:'Cinzel',serif; font-size:0.75rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--wine-soft); margin:22px 2px 8px;
}
.saint-row{
  display:flex; align-items:center; gap:14px;
  padding:13px 4px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.saint-row:active{ background:rgba(138,106,30,.07); }
.saint-thumb{ width:52px; height:62px; flex:0 0 52px; border-radius:9px; overflow:hidden; background:var(--paper-deep); border:1px solid var(--line); }
.saint-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.saint-image-detail{ max-width:430px; margin:0 auto 22px; padding:8px; border-radius:14px; background:var(--paper-deep); border:1px solid var(--line); box-shadow:0 8px 22px rgba(74,48,24,.1); }
.saint-image-detail img{ display:block; width:100%; max-height:520px; object-fit:contain; border-radius:9px; background:#fff; }
.saint-image-caption{ padding:8px 4px 2px; color:var(--text-faint); font-size:.78rem; line-height:1.4; text-align:center; }
@media(max-width:560px){ .saint-thumb{ width:46px; height:56px; flex-basis:46px; } .saint-image-detail{ max-width:100%; } }
.saint-row .daynum{
  font-family:'Cinzel',serif; font-size:1.25rem; color:var(--gold-soft); width:30px; text-align:center; flex:none;
}
.saint-row .rowtext{ flex:1; min-width:0; }
.saint-row .rowtitle{ font-size:1.0625rem; color:var(--paper); }
.saint-row .rowrank{ font-size:0.7812rem; color:var(--text-faint); font-style:italic; }
.saint-row .chev{ color:var(--text-faint); flex:none; }
.no-results{ color:var(--text-faint); font-style:italic; padding:24px 4px; text-align:center; }

/* ===== detail view ===== */
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--gold-soft); font-family:'Cinzel',serif;
  font-size:0.6875rem; letter-spacing:.1em; text-transform:uppercase; padding:8px 2px; margin-bottom:14px; cursor:pointer;
}
.detail-header{ text-align:center; padding:6px 6px 22px; }
.detail-header .rank{
  display:inline-block; font-family:'Cinzel',serif; font-size:0.6562rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--wine); margin-bottom:10px; font-weight:600;
}
.detail-header h2{
  font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.875rem; color:var(--paper);
  margin:0 0 8px; line-height:1.15;
}
.detail-header .date-line{ color:var(--text-muted); font-style:italic; font-size:1rem; }
.detail-divider{
  width:80px; height:1px; margin:18px auto; background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
.bio-text{
  font-family:Georgia,'Times New Roman',serif; font-size:1.125rem; line-height:1.75; color:var(--paper);
  white-space:pre-line; text-align:justify; text-justify:inter-word; hyphens:none; overflow-wrap:break-word;
  margin-bottom:6px;
}
.prayer-card{
  margin-top:10px;
  background:linear-gradient(180deg, var(--prayer-card-bg1), var(--prayer-card-bg2));
  border:1px solid var(--prayer-card-border);
  border-radius:14px; padding:20px;
}
.prayer-card .label{
  font-family:'Cinzel',serif; font-size:0.6875rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--wine-soft); margin-bottom:10px;
}
.prayer-card .text{
  font-family:Georgia,'Times New Roman',serif; font-style:normal; font-size:1.02rem; line-height:1.58; color:var(--text);
  white-space:normal;
  overflow-wrap:break-word;
  word-break:normal;
}

/* ===== about ===== */
.about-text{ font-size:1.0625rem; line-height:1.75; color:var(--paper); }
.about-text p{ margin:0 0 14px; }
.about-quote{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1875rem; text-align:center;
  color:var(--gold-soft); padding:22px 10px; line-height:1.6;
}
.credit-list{ font-size:0.9375rem; color:var(--text-muted); line-height:1.9; }
.credit-list b{ color:var(--text); font-weight:600; }
.social-links{ display:flex; flex-direction:column; gap:10px; }
.social-link{
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  border:1px solid var(--line); border-radius:12px; text-decoration:none;
  color:var(--text); background:var(--bg-panel-2); transition:background .15s ease, border-color .15s ease;
}
.social-link:hover, .social-link:active{ background:var(--ambient-2); border-color:var(--gold); }
.social-link .social-icon{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--gold); color:var(--bg-panel-2);
}
.social-link .social-icon svg{ width:18px; height:18px; }
.social-link .social-label{ font-size:0.9375rem; font-weight:600; color:var(--text); }
.social-link .social-sub{ font-size:0.8125rem; color:var(--text-muted); }

/* ===== tabbar ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  max-width:560px; margin:0 auto;
  display:flex;
  background:var(--tabbar-bg); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-faint); cursor:pointer;
  padding:6px 2px; font-family:'Cinzel',serif; font-size:10px; letter-spacing:.04em;
}
.tab-btn svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.tab-btn.active{ color:var(--gold-soft); }

const PRAYERS = {"regra": {"intro": "Regra de Vida\nda Ordem Secular dos Servos de\nMaria\nOSSM\nAos irmãos e irmãs da Ordem Secular dos\nServos de Maria\nProt. 415/95\nO mesmo Espírito Santo que em 1233 chamou\nos nossos Primeiros Pais, hoje convoca todos vocês,\nirmãos e irmãs, para que deem testemunho do\nEvangelho em comunhão fraterna e se coloquem a\nserviço de Deus e do próximo, inspirando-se\nconstantemente em Maria, Mãe e Serva do Senhor.\nCristo Ressuscitado convida-os a percorrer o\nmesmo caminho de santidade que há 762 anos vem\nsendo trilhado pelos irmãos e irmãs da nossa Ordem, e\na prolongar em suas famílias e comunidades cristãs a\npresença operante de Maria, Mãe de Jesus.\nA Sé Apostólica, ao aprovar em 29 de abril de\n1995 a presente “Regra de Vida”, mostra ter em grande\napreço o caminho que vocês e suas fraternidades\npercorreram, guiados pelas diretrizes do Concílio\nVaticano II e da Regra aprovada experimentalmente\nem 2 de outubro de 1982 pelo Conselho Geral da\nOrdem.\nComo membros vivos da Família dos Servos de\nMaria, vocês assumem o compromisso de viver o\nbatismo à luz desta “Regra de Vida”. Trilhando o\ncaminho da santidade, vocês constroem a igreja-comunhão e anunciam o Evangelho em lugares e\nsituações onde só vocês, leigos, podem testemunhar\nCristo, filho de Maria e primogênito entre muitos\nirmãos. Como Maria, levando aos irmãos e irmãs a\nPalavra que salva e colocando-se ao lado dela aos pés\ndas infinitas cruzes da humanidade, vocês estarão\nlevando conforto e esperança de libertação, cooperando\ncom a missão evangelizadora da Igreja.\nA presente Regra, ora aprovada pela Sé\nApostólica, entrará em vigor dia 15 de agosto de 1995,\nna solenidade da Assunção de Nossa Senhora ao céu, e\ndia em que, segundo a tradição, nossos Primeiros Pais\nchegaram a Monte Senário.\nFazemos votos que no seio das comunidades\ncristãs e das suas fraternidades seculares, vocês sigam\nsempre o caminho de fé e de amor da Virgem do\nMagnificat. Assim fazendo, vocês poderão\ncompartilhar as “maravilhas” que o Senhor fez em\nMaria e um dia juntar-se a Ela no céu, onde reina\ngloriosa e intercede benigna por todos os seus Servos.\nAlegrem-se, pois, e procurem atrair outros para\ncompartilhar a vida de suas fraternidades. Propaguem\nseu carisma de unidade e de harmonia fraterna na\nIgreja e neste mundo tão carente de união, de paz e de\ncompreensão mútua.\nRoma, 4 de maio de 1995, festa de São Peregrino\nLaziosi, OSM e 650° aniversário de sua morte.\nfrei Reinhold M. Bodner, osm\nsecretário da Ordem\nDecreto de Aprovação\nCongregação dos Institutos de Vida\nConsagrada e das Sociedades de Vida\nApostólica\nProt. n. S. 48-1/95\nO Prior Geral da Ordem dos Servos de Maria,\ncom o consenso do seu Conselho, encaminhou à Sé\nApostólica pedido de aprovação da “Regra de Vida” da\nOrdem Secular dos Servos de Maria, revista segundo o\nespírito do Concílio Vaticano II e as normas do Código\nde Direito Canônico.\nA Congregação dos Institutos de Vida\nConsagrada e das Sociedades de Vida Apostólica, vista\na exposição de motivos e estudado atentamente o texto\nem questão, segundo as normas do Direito, com o\npresente decreto aprova e confirma a presente Regra de\nVida, redigida em língua inglesa, conforme exemplar\nguardado nos arquivos deste Dicastério.\nOs membros da Ordem Secular dos Servos de\nMaria, trilhando o caminho dos Sete Santos\nFundadores da Ordem, procurem viver uma vida cristã\nfiel e íntegra e, com renovado ardor, busquem, dia após\ndia, a perfeição do seu estado de vida.\nRevogam-se as disposições em contrário.\nDado em Roma, em 29 de abril de 1995\nEduardo cardeal Martínez Somalo\nPrefeito\nFrancisco Xavier Errázuriz Ossa\nsecretário\nA Ordem Secular na História dos Servos de\nMaria\nAs Constituições da nossa Ordem dizem que “o\nideal dos Servos de Maria suscitou ao redor de nossas\ncomunidades ou associou à Ordem várias famílias ou\ngrupos que, como expressões particulares de vida\nconsagrada ou laical, participam da nossa mesma\nvocação” (art. 15).\nEntre essas expressões particulares está a Ordem\nSecular, até recentemente chamada Ordem Terceira.\nTendo a Ordem nascido de um grupo de sete leigos\nflorentinos, não nos admira que a raiz mais profunda da\nOrdem Secular se confunda e se identifique com a\norigem da Ordem mesma. Todavia, como expressão\nparticular no âmbito da nossa família, a Ordem Secular\nfoi-se configurando aos poucos até assumir um perfil\npróprio. O patrimônio espiritual, porém, foi sempre o\ndas origens, assim como foi vivido pelos Sete\nFundadores e pelos Primeiros Pais, na esteira de uma\nexperiência anterior muito difundida no século XIII: a\ndos Irmãos da Penitência.\nA Legenda sobre as origens da Ordem, citando\num texto anterior, assim fala a respeito dos nossos\nPrimeiros Pais: “Temendo suas imperfeições,\nhumildemente decidiram colocar a si mesmos e seus\ncorações, com toda devoção, aos pés da Rainha dos\ncéus, para que Ela, como mediadora e advogada, os\nsuprindo Ela, com sua grande caridade, as imperfeições\ndeles, lhes obtivesse, misericordiosa, a fecundidade de\nméritos”.\nAinda segundo a Legenda, a experiência de\nnossos Primeiros Pais em Monte Senário caracterizou-se por um estilo de vida simples e, ao mesmo tempo,\nprofundo de vida cristã. Todos os que acorriam a\nMonte Senário “viam que eles não encobriam\nfalsamente seus sentimentos, nem simulavam como\nverdadeiras as coisas falsas, nem como falsas as\nverdadeiras. Viam-nos, pelo contrário, como eles\nverdadeiramente eram: simples, nada faziam por\nostentação, exprimiam com palavras seus sentimentos,\namavam a verdade, evitavam a mentira, distribuíam\ngratuitamente seus bens, sofriam com a maldade antes\nque praticá-la, não se vingavam da ofensa recebida e\nconsideravam um ganho sofrer injúrias por amor à\nverdade”.\nEsses textos primitivos descrevem o espírito do\nque viria a ser no futuro a Ordem secular dos Servos de\nMaria.\nLogo, porém, nossos Primeiros Pais e seus\nseguidores criaram comunidades específicas de\npessoas consagradas e, em poucas décadas, deram vida\nà Ordem dos Servos de Maria que, em 1304, foi\noficialmente aprovada pelo papa Bento XI.\nSabemos que desde as origens houve indivíduos\nou grupos, homens e mulheres, que, ligados aos nossos\nconventos, compartilhavam, como leigos, a vida e a\nespiritualidade dos frades Servos de Maria.\nÉ sintomático a figura de Henrique ou Arrigo de\nSanta Maria de Cafaggio, ligou-se como oblato à igreja\nde Santa Maria de Cafaggio, em Florença. Apesar\ndisso, nada nos autoriza a dizer que houvesse então\numa Regra comum para esses oblatos e oblatas, por\nmais simples que fosse.\nO início por assim-dizer oficial da Ordem\nTerceira dos Servos de Maria é atribuída à bula Sedis\nApostolicae Providentia do papa Martinho V,\npromulgada em 16 de março de 1424. Essa deferência\ndo papa Martinho V em favor dos Servos de Maria\ntalvez se deva ao fato de ele, quando era cardeal Odão\nColonna, ter sido protetor da Ordem de 1407 a 1418.\nO nome mais comum da futura Ordem Terceira\nera Associação ou Companhia dos Servos de Maria.\nEsse nome aparece no final do século XV. Uma prova\ndisso é um livreto de Nicolau Manetti di Pistoia, que\npode ser considerado como o primeiro manual da\nOrdem Terceira.\nA partir do final do século XVI e no início do\nséculo XVII, os priores gerais mais contribuíram para\no crescimento da Ordem Terceira. Embora tendo vários\nnomes, como Associação ou Companhia dos Servos de\nMaria, ela distinguia-se claramente das confrarias.\nNo final do século XIX, com a retomada da\nOrdem subsequente às supressões impostas pelos\ngovernos liberais da Itália, a Ordem Terceira voltou a\ncrescer. Dois escritos do papa Leão XIII modificaram\na antiga Regra de Martinho V. No entanto, só em 1925\nfoi publicada a nova Regra. A esta seguiu-se outra,\ncomposta por iniciativa do prior geral frei Afonso M.\nMontà e aprovada pela Sagrada Congregação dos\nReligiosos em 1º de maio de 1966.\nNa esteira do Concílio Vaticano II, os Servos de\nMaria iniciaram um processo de revisão de suas\nConstituições. O novo texto, aprovado no capítulo\ngeral extraordinário de Majadahonda (Madri), em\n1968, e revisto parcialmente nos capítulos gerais\nseguintes, foi finalmente aprovado pela Sé Apostólica\nem 1987.\nCom relação à Ordem Secular, o Conselho Geral\nda Ordem nomeou uma comissão especial encarregada\nde consultar os membros da Ordem Secular e de ajudá-los na revisão de sua Regra de Vida. Concluído o\ntrabalho, o texto da nova Regra foi aprovado\nexperimentalmente pelo Conselho Geral em outubro de\n1982. Em seguida, a pedido do capítulo geral de 1989,\no Secretariado Geral da Ordem Secular voltou a\nconsultar as bases em vista da redação final do texto a\nser submetida à aprovação da Sagrada Congregação\ndos Institutos de Vida Consagrada e das Sociedades de\nVida Apostólica.\nA presente edição da Regra de Vida da Ordem\nSecular dos Servos de Maria foi aprovada pela Sé\nApostólica em 29 de abril de 1995.\nAo longo de sua história, a Ordem Secular dos\nServos de Maria contou em suas fileiras com muitos\nirmãos e irmãs que se distinguiram por sua santidade,\npelo apego à Família Servita e pela vivência do nosso\ncarisma. Eles são testemunhas vivas e motivo de\nesperança para toda a nossa família.", "chapters": [{"roman": "I", "title": "A Ordem dos Servos de Maria", "text": "1. A Ordem dos Servos de Maria, nascida como\nexpressão de vida evangélico-apostólica, é uma\ncomunidade de homens reunidos em nome do Senhor\nJesus.\nMovidos pelo Espírito, comprometemo-nos, como\nnossos Primeiros Pais, a testemunhar o evangelho em\ncomunhão fraterna e a colocar-nos a serviço de Deus e\ndos seres humanos, inspirando-nos constantemente em\nMaria, Mãe e Serva do Senhor.\n2. Para servir ao Senhor e aos irmãos, os Servos de\nMaria, desde as origens, dedicaram-se à Mãe de Deus,\na Maria, desde as origens, dedicaram-se à Mãe do\nAltíssimo.\nA Ela se voltaram no seu caminho para Cristo e na\nmissão de anunciá-lo aos seres humanos. Do “sim” da\nhumilde serva do Senhor aprenderam a acolher a\nPalavra de Deus e a estar atentos à voz do Espírito; da\nparticipação da Mãe na obra redentora do Filho, servo\nsofredor de Javé, foram induzidos a compreender e\naliviar os sofrimentos humanos.\n3. Sensíveis aos apelos da Igreja, queremos, através do\nestudo, conhecer sempre melhor a Virgem Maria, Mãe\nde Deus e dos seres humanos, e sua missão no mistério\nda Salvação.\nVendo nela o fruto mais sublime da Redenção,\napoiamos com nossas energias as exigências\nlibertadoras dos indivíduos e da sociedade.\nConscientes da divisão entre os cristãos, empenhamo-nos para que a Filha de Sião seja para todos sinal de\nunidade. Às pessoas inseguras, propomos como\nexemplo de confiança dos filhos de Deus, a mulher\nhumilde que pôs no Senhor sua esperança.\n4. Inspirando-se constantemente em Maria, Mãe e\nServa do Senhor, vários institutos religiosos e grupos\nleigos nasceram à sombra das comunidades dos Servos\nde Maria, como expressões particulares de vida\nconsagrada ou laical. Outros institutos e grupos já\nexistentes, atraídos pelo mesmo ideal, agregaram-se à\nOrdem. Cada um deles, quer seja religioso ou leigo,\nvive à sua maneira a mesma vocação que é comum a\ntodos."}, {"roman": "II", "title": "A Ordem Secular dos Servos de Maria e a Vida da Fraternidade", "text": "5. A Ordem Secular dos Servos de Maria congrega\nhomens e mulheres que, unidos pela consagração\nbatismal e movidos pelo Espírito, querem engajar-se no\nserviço a Cristo e aos irmãos deste mundo, inspirando-se em Maria, Mãe e Serva do Senhor. Como membros\nleigos ou seculares da Ordem dos Servos de Maria,\ncomprometem-se, em sua vida familiar e social, a\nseguir o caminho trilhado pelos Sete Santos\nFundadores da Ordem.\n6. Composta de homens e mulheres que vivem sua\nconsagração batismal no mundo, a Ordem Secular é\numa das expressões da mesma vocação da Família dos\nServos de Maria. É parte integrante da Família Servita\ne, como tal, compartilha seus mesmos ideais, o mesmo\ncompromisso de vida evangélico-apostólica e uma\nparticular devoção à Mãe de Deus.\n7. Como membros seculares da Ordem dos Servos de\nMaria, estes irmãos e irmãs são autênticas testemunhas\nda origem laical da nossa Ordem. De fato, foi como\nleigos que os Sete Primeiros Pais iniciaram sua vida\ncomunitária, unidos na oração e no serviço à bem-aventurada Virgem Maria.\n8. Na Igreja, povo santo de Deus, a vocação do irmão e\nda irmã secular dos Servos de Maria é um chamado\nespecial. Comporta um convite gratuito de Deus e uma\nresposta consciente e livre do vocacionado, o qual, ao\ndoar-se, descobre a presença maternal de Maria.\n9. Acolhendo o dom da vocação, que tem suas raízes\nna consagração batismal, o Servo de Maria da Ordem\nSecular compromete-se a seguir a Cristo e a viver\nplenamente o mandamento evangélico do amor.\n10. Os irmãos e irmãs da Ordem secular são homens e\nmulheres que, apoiando-se mutuamente em sua vida\nmatrimonial, familiar e social, plenamente inseridos no\nmundo, esforçam-se para buscar a santidade segundo o\nespírito da Ordem, seguindo suas diretrizes e\nobservando a Regra própria.\n11. Os Servos de Maria da Ordem Secular assumem o\ncompromisso de fazer sua a experiência dos Sete\nPrimeiros Pais, que viveram em comunhão fraterna\npara poderem melhor servir a Deus, à Virgem Maria e\naos irmãos e irmãs. Reunidos em nome do Senhor,\ndescobrem na fraternidade a presença do Senhor e\nencontram nela o apoio necessário para responder ao\nseu chamado específico à santidade.\n12. Os irmãos e irmãs seculares, mediante a escuta da\nPalavra de Deus e a oração, alimentam sua vocação\ncristã e sua missão na Igreja e no mundo. Como\nmembros vivos da comunidade eclesial, esforçam-se\npara conhecer e seguir seus ensinamentos na vida e no\napostolado.\n13. Segundo o espírito da Ordem, os irmãos e irmãs\nseculares inspiram-se constantemente em Maria, Mãe\ne Serva do Senhor. Eles a têm como imagem-guia, que\nos leva a viver uma vida simples, serviçal e voltada\npara Deus. E a se consagram inteiramente, venerando-a de modo especial como Virgem das Dores. Mediante\no estudo e a oração, buscam conhecer mais\nprofundamente a Virgem Maria e sua missão no\nmistério da salvação.\n14. Através da promessa, os irmãos e irmãs da Ordem\nsecular assumem livremente o compromisso de\nfidelidade à sua vocação e de manter-se intimamente\nunidos à Ordem.\n15. À imitação dos primeiros cristãos, que tinham “um\nsó coração e uma só alma”, os irmãos e irmãs da Ordem\nSecular reúnem-se sob o signo da comunhão fraterna,\nno intuito de se apoiarem uns aos outros no caminho\ncomum que os leva à perfeição cristã e ao serviço de\namor a todos os seres humanos.\n16. Todos participem assiduamente dos encontros\nperiódicos que celebram a vida da fraternidade secular.\nCom simplicidade, compartilhem suas idéias e\nexperiências.\n17. A fraternidade secular reúne-se para a leitura e a\nreflexão comum da Palavra de Deus e para o estudo da\nRegra e de outros temas humanos, sociais e religiosos\nconcernentes à vida dos Servos de Maria.\n18. A fraternidade secular mantenha-se intimamente\nunida à Igreja local e à comunidade religiosa da Família\nServita, cuja espiritualidade partilha e com a qual\ncolabora no serviço apostólico.\n19. Os Servos de Maria da fraternidade secular, na\nmedida do possível, participem dos momentos de\noração da comunidade religiosa de frades ou irmãs à\nqual está ligada e, quando convidados, também dos\nencontros de renovação espiritual, do capítulo e da\nrefeição comum.\n20. A fraternidade mantenha estreita ligação com os\nirmãos e irmãs que, por motivos particulares, não\npodem participar dos encontros do grupo. Encoraje-os\ne sustente-os na comunhão fraterna e no crescimento\nreligioso. Da mesma forma, mantenha laços de\ncomunhão, de espírito de família e de união com os\ndemais institutos e grupos que compartilham a mesma\nvocação de Servos de Maria e com os quais formam\numa só família. Dê particular atenção à comunicação e\nà colaboração com as outras associações leigas da\nOrdem.\n21. Segundo o espírito das bem-aventuranças, a\nfraternidade secular pratique a comunhão de bens\ncomuns, e ajudando os irmãos e irmãs que se\nencontram em dificuldades financeiras."}, {"roman": "III", "title": "Oração", "text": "22. A oração é um dever fundamental de todo cristão.\nMas para os Servos de Maria da Ordem Secular, que\nquerem seguir a Cristo e observar os seus\nensinamentos, é um compromisso prioritário, que faz\ncrescer a fé e a esperança e ajuda a viver em plenitude\no mandamento do amor.\n23. Saibam os irmãos e irmãs seculares que, para\nmanter-se sempre na presença de Deus, é necessária a\noração pessoal, silenciosa, oculta, da qual o próprio\nJesus é exemplo admirável.\n24. A oração é o encontro com Deus fundado na fé.\nNisso, a Virgem Maria – eminente exemplo de criatura\norante – é apoio e guia seguro para o irmão e irmã da\nsecular.\n25. Fiéis à sua vocação, os Servos de Maria seculares\ntenham em devido apreço a oração comunitária. Junto\ncom seus irmãos e irmãs procurem descobrir as\nriquezas da Palavra de Deus e rezem pelas\nnecessidades de toda a humanidade e do mundo.\n26. Entre as várias formas de oração, a liturgia\nsobressai como ação sagrada por excelência. Os Servos\nde Maria da Ordem Secular participem ativamente da\nvida litúrgica e sacramental da Igreja.\n27. Na Eucaristia, os irmãos e as irmãs da fraternidade\nsecular atualizam a Páscoa do Senhor e fortalecem os\nlaços de amor que os unem entre si e com todos os seres\nhumanos. A Eucaristia é o sinal sacramental da\ncomunhão e a mais alta expressão de oração.\n28. Os irmãos e irmãs seculares participem ativamente\nda Missa, dando preferência à da comunidade religiosa\nlocal à qual estão ligados. Procurem com frequência a\ncelebração da Liturgia das Horas, pela manhã e à tarde.\n29. Segundo a tradição da Ordem, a fraternidade\nsecular venere a Virgem Maria com atos de particular\ndevoção, como a saudação angélica, a Vigília de Nossa\nSenhora, a Coroa de Nossa Senhora das Dores. Celebre\ncomo festas de família as principais festas litúrgicas da\nOrdem e da Igreja local, a memória de Nossa Senhora\ndas Dores, bem como as solenidades e as memórias dos\nsantos e santas da Ordem.\n30. Os Servos de Maria seculares lembrem\nfrequentemente os irmãos e irmãs defuntos,\nimplorando para eles a misericórdia do Senhor. No dia\nda morte e dos funerais de um irmão ou irmã, sejam\nsolidários com a dor dos familiares e façam as orações\nde sufrágio.\n31. É dever da fraternidade secular programar dias e\nperíodos de recolhimento, dos quais todos os irmãos e\nirmãs procurem participar."}, {"roman": "IV", "title": "Penitência e Conversão", "text": "32. Para os irmãos e irmãs da Ordem Secular, que\nassumiram o compromisso de viver em plenitude o\nmandamento da caridade, a penitência é um valor\nevangélico e um instrumento de conversão.\n33. Segundo o exemplo dos nossos Primeiros Pais e a\ntradição da Ordem, a penitência consiste, sobretudo, na\ncaridade entendida como aceitação mútua e serviço\nfraterno.\n34. Cientes de que o seguimento de Cristo exige um\nesforço constante para cumprir a vontade de Deus, os\nirmãos e irmãs seculares mantenham-se alertas e\naproveitem de todas as ocasiões que diariamente se\nlhes apresentam para praticar a penitência,\nconsiderando-as como sinal da graça e convite à\nconversão. Façam frequente uso do sacramento da\nreconciliação e valorizem as obras de misericórdia, a\nsobriedade e, em particular, os tempos litúrgicos da\nQuaresma e do Advento."}, {"roman": "V", "title": "Testemunho de Pobreza", "text": "35. Segundo o exemplo de Maria, pobre e humilde\nserva do Senhor, os irmãos e irmãs seculares esforcem-se para viver a bem-aventurança evangélica que diz:\n“Felizes os pobres de coração, porque deles é o reino\nde Deus”.\n36. Dedicando-se com afinco ao trabalho, levando uma\nvida simples e austera, sendo sensíveis diante das\nnecessidades do próximo e ajudando os mais\nnecessitados, os irmãos e irmãs seculares, como\nindivíduos e como fraternidade, dão testemunho do seu\namor a Cristo pobre e anunciam aos homens e mulheres\nde hoje que Deus é o único bem necessário e que só ele\npode satisfazer plenamente o coração humano."}, {"roman": "VI", "title": "Apostolado", "text": "37. Fiéis à sua vocação, os irmãos e irmãs seculares\nprocuram irradiar no mundo o amor a Cristo e, a\nexemplo de Maria, sejam testemunhas vivas de doação\naos outros.\n38. Conscientes de que a família é o alicerce da\nsociedade civil e laical, os irmãos e irmãs seculares\npriorizam o apostolado familiar e o testemunho de vida\nda família cristã, na qual o amor mútuo, o respeito aos\npais e o zelo na educação cristã dos filhos, sejam o alvo\nprincipal da oração e do empenho de fraternidade.\n39. Como membros da Igreja e inseridos no mundo, os\nirmãos e irmãs seculares compartilham suas angústias\ne aspirações e, movidos pelo amor a Deus, contribuem\npara a construção de um mundo novo, iluminado pelos\nvalores evangélicos.\n40. Os irmãos e irmãs seculares procurem viver, no seu\ndia-a-dia, a vida do Espírito na oração e em seus\nserviços pastorais, na vida conjugal e familiar, no\ntrabalho e nos momentos de lazer, para que tudo isso se\ntransforme em sacrifício agradável a Deus por Jesus\nCristo.\n41. Os irmãos e irmãs seculares, parcelas vivas da\nfraternidade, colaborem no cumprimento dos\ncompromissos pastorais assumidos pelo grupo, como\nresposta às necessidades do ambiente em que vivem e\nda Igreja local. Colaborem também, segundo suas\ncapacidades, nos trabalhos e serviços eclesiais da\ncomunidade religiosa e paroquial.\n42. Devotos de Nossa Senhora das Dores, os irmãos e\nirmãs seculares aprendam a atender e servir com\ncarinho os doentes, os moribundos e os mais\nnecessitados moral ou fisicamente. Neste compromisso\nde serviço, a presença de Maria ao pé da cruz seja sua\nimagem-guia. Posto que o Filho do Homem continua\nainda crucificado nos seus irmãos e irmãs, os membros\nda Ordem Secular querem estar presentes ao lado dela\naos pés das infinitas cruzes da humanidade.\n43. A fraternidade secular apoie e ajude a Ordem na\nanimação vocacional, no serviço apostólico e, em\nmodo particular, nos seus compromissos missionários."}, {"roman": "VII", "title": "Formação", "text": "44. A vocação do irmão e irmã secular desenvolve-se\nno interior da fraternidade e em comunhão com toda a\nFamília Servita. Para sua formação permanente, os\nirmãos e irmãs seculares procurem estudar com atenção\nos documentos oficiais da Igreja e da Ordem.\n45. A fraternidade secular propicia aos irmãos e irmãs\na experiência da comunhão de vida e a ajuda constante;\npor sua vez, a comunidade da Família Servita lhes\noferece as riquezas da Igreja e da Ordem.\n46. Os irmãos e irmãs seculares sabem que o caminho\nque leva ao amadurecimento pleno de sua vocação\ncomporta esforço pessoal e uso efetivo dos próprios\ndons e talentos para servir e preste um serviço de\nanimação espiritual.\n47. A Virgem Maria viveu nesta terra uma vida normal\ncomo todos, dedicada à família e ao trabalho, e sempre\nse manteve intimamente unida ao seu Filho,\ncooperando de maneira singular com a obra da\nSalvação. Ela é, portanto, modelo de vida para todos os\nServos de Maria da Ordem Secular.\nIngresso na Fraternidade Secular"}, {"roman": "VIII", "title": "Admissão", "text": "48. Podem ser admitidos na Ordem Secular dos Servos\nde Maria todos os que manifestam o desejo sincero de\ncompartilhar o ideal da nossa Ordem e se\ncomprometem a viver e testemunhar, em sua condição\nfamiliar e social, os valores humanos e evangélicos da\nvida cristã, e a honrar e imitar de modo especial a\nVirgem Maria, segundo o espírito da Ordem.\n49. Para ser admitido na Ordem Secular, o candidato\nfará pedido por escrito ao conselho da fraternidade\nsecular, ao qual compete a decisão.\n50. O ingresso na fraternidade celebra-se segundo o\nritual próprio da Ordem Secular dos Servos de Maria.\n51. Ao ser admitido, o candidato inicia sua experiência\nde vida na fraternidade secular, mediante o estudo e a\nprática da Regra, de modo que se possa avaliar a\nautenticidade de sua vocação."}, {"roman": "IX", "title": "Prova ou Noviciado", "text": "52. Prova ou Noviciado é o período de tempo que vai\ndesde a admissão até a promessa. Tenha normalmente\num ano de duração.\n53. Durante a prova ou noviciado, o candidato, sob a\norientação do formador responsável e do assistente,\nprocure:\n– descobrir e assimilar progressivamente a vocação\nespecífica do leigo na Igreja e os aspectos próprios da\nfraternidade secular servita;\n– estudar a Regra e os Estatutos da Ordem Secular\nServita;\n– estudar e assimilar a doutrina sobre a Virgem Maria\nno mistério de Cristo e da Igreja;\n– conhecer os aspectos essenciais da história e a\nespiritualidade da Ordem dos Servos de Maria.\n54. Por motivos justos e de acordo com a capacidade\nde assimilação e de decisão do candidato, o tempo de\nProva pode ser abreviado ou prolongado, a critério do\nconselho da fraternidade secular."}, {"roman": "X", "title": "Promessa", "text": "55. A promessa é o ato pelo qual o candidato renova\nsua consagração batismal, comprometendo-se a vivê-la\nsegundo o espírito da Ordem dos Servos de Maria, em\ncomunhão fraterna com todas as comunidades da\nFamília Servita e segundo a Regra e os Estatutos\npróprios da Ordem Secular.\n56. A promessa incorpora para sempre o candidato à\nOrdem Secular e o torna participante da vida de toda a\nFamília Servita.\n57. Para ser admitido à promessa, o candidato fará\npedido por escrito ao conselho da fraternidade secular.\nO candidato deve ter pelo menos 18 anos de idade.\n58. O rito da promessa segue as normas e a fórmula\nprescritas pelo ritual próprio da Ordem Secular dos\nServos de Maria e é presidido pelo prior da comunidade\nreligiosa ou por um delegado da Ordem.\n59. Por motivos justos e válidos, o conselho da\nfraternidade secular pode dispensar temporária ou\ndefinitivamente da promessa ou mesmo demitir um\nirmão ou irmã que fez a promessa, após expor os\nmotivos ao interessado e ouvir suas razões.\nOrganização da Fraternidade Secular"}, {"roman": "XI", "title": "Organização", "text": "60. A Ordem Secular dos Servos de Maria compõe-se\nde fraternidades locais que, unidas pelo mesmo ideal de\nvida, formam a fraternidade internacional.\n61. As fraternidades seculares podem organizar-se em\ngrupos de fraternidades locais, regionais ou nacionais.\n62. A fraternidade ou o grupo de fraternidades, sob a\norientação dos respectivos priores ou conselhos,\nprograma sua vida interna.\n63. A fraternidade secular mantém-se unida à Ordem\natravés do assistente adrede designado."}, {"roman": "XII", "title": "Reconhecimento e Ereção Canônica da Fraternidade", "text": "64. a) Em se tratando de um grupo criado junto a uma\ncomunidade de frades, compete ao capítulo conventual\ndesta reconhecê-lo como autenticamente servita e\napoiar o seu pedido de ereção canônica.\nb) Qualquer outra entidade da Família Servita\n(mosteiro, Congregação religiosa ou Instituto Secular)\npode reconhecer a autenticidade de um grupo nascido\na seu redor, bem como apoiar seu pedido de ereção\ncanônica.\nc) O reconhecimento de um grupo criado fora do\nâmbito das comunidades da Família Servita compete,\nconforme o caso, ao conselho vicarial, provincial ou\ngeral.\n65. A fraternidade da Ordem Secular é erigida\ncanonicamente por decreto do Prior Geral da Ordem.\n66. Para que uma fraternidade possa ser erigida\ncanonicamente, far-se-á pedido por escrito. Tratando-se de fraternidade nascida fora do âmbito de uma\ncomunidade religiosa da Família Servita, além do\npedido escrito, exige-se a autorização do Ordinário do\nlugar.\n67. O secretário geral da Ordem Secular e dos Grupos\nLeigos deve ser devidamente informado sobre a ereção\ncanônica de uma fraternidade."}, {"roman": "XIII", "title": "Governo", "text": "68. Prior Geral\nO Prior Geral da Ordem, sinal de unidade de toda a\nFamília Servita, tem autoridade sobre toda a Ordem\nSecular dos Servos de Maria e a exerce em espírito de\nserviço, respeitando sua autonomia.\n69. Secretário Geral\n1. O secretário geral é nomeado pelo conselho geral da\nOrdem. É sua missão principal animar e coordenar a\nvida das fraternidades em nível geral.\n2. Em colaboração com os membros do secretariado\ngeral e com os assistentes nos diversos níveis, o\nsecretário geral leve ao conhecimento das fraternidades\nseculares as diretrizes espirituais e pastorais da Igreja\nuniversal e da Ordem, bem como as atividades e as\nexperiências mais significativas da Ordem Secular no\nmundo.\n70. Prior(a) da Fraternidade\n1. O prior ou priora, primeiro entre os irmãos e irmãs,\npreside à fraternidade como um serviço de caridade. É\nresponsável pela fraternidade junto com o conselho e\ncom cada membro da mesma. No exercício do seu\ncargo, lembre-se de dar testemunho de Cristo, que veio\nnão para ser servido, mas para servir e aumentar a vida\ndos seus.\n2. É dever do(a) prior(a):\n– convocar as reuniões da fraternidade e do conselho e\npresidi-las;\n– promover e animar os compromissos espirituais e\napostólicos da fraternidade;\n– zelar pela observância da Regra e dos Estatutos;\n– colaborar com o assistente e com os oficiais da\nfraternidade.\n71. O prior ou priora é eleito segundo as normas dos\nEstatutos próprios da fraternidade secular.\n72. Conselho\n1. Toda fraternidade secular terá um conselho,\ncomposto do prior ou priora e de pelo menos três\nconselheiros eleitos pela fraternidade mesma.\n2. Compete ao conselho:\n– colaborar com o prior na coordenação e animação da\nfraternidade;\n– aceitar um candidato na fraternidade admiti-lo à\npromessa;\n– dispensar da promessa;\n– demitir, quando necessário, um membro da\nfraternidade, após ouvir o interessado.\n73. Assistente\n1. Toda fraternidade secular ou um grupo de\nfraternidades terá um assistente nomeado pela\nautoridade competente da Família Servita. Se o\nassistente não for competente da Ordem, sob proposta\nda fraternidade secular local, e confirmado pelo\nOrdinário do lugar.\n2. O assistente pode ser um irmão ou irmã da Família\nServita (frade, monja, freira, membro de Instituto\nSecular) ou um presbítero membro da nossa Ordem\nSecular ou então outro presbítero.\n3. O assistente seja competente e disponível e, junto\ncom os irmãos e irmãs da fraternidade, cujo caminho\nde fé compartilha, procure conhecer e viver mais\nprofundamente a vocação específica do Servo de Maria\nsecular.\n4. O assistente promova, entre os membros da\nfraternidade, o espírito da Família Servita e preste um\nserviço de animação espiritual.\n74. Secretário\n1. Toda fraternidade terá um secretário.\n2. Cabe ao secretário:\n– lavrar a ata das reuniões da fraternidade e do\nconselho;\n– manter em dia o registro das Admissões e das\nPromessas;\n– guardar e manter atualizado o fichário da\nfraternidade;\n– manter contato com os irmãos e irmãs impedidos de\nparticipar das reuniões.\nEstatutos Próprios da Fraternidade\nSecular\n75. Toda fraternidade secular ou grupo de fraternidades\nterá um Estatuto próprio, por ela mesma aprovado, para\na regulamentação prática das normas da presente\nRegra.\n76. O Estatuto próprio deverá regulamentar:\n– o sistema eletivo e a duração do mandato do prior ou\npriora;\n– o sistema eletivo e a duração do mandato dos\nmembros do conselho;\n– o eventual aumento do número de conselheiros;\n– o número de conselheiros, se forem necessários mais\nde três;\n– o número, as atribuições, o sistema eletivo e a\nduração do mandato dos outros oficiais da fraternidade;\n– outros deveres do secretário."}]}, "daily": {"anjo": "D. O anjo do Senhor anunciou a Maria.\nT. E Ela concebeu do Espírito Santo.\n   Ave Maria, cheia de graça, o Senhor é convosco, bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós pecadores, agora e na hora da nossa morte. Amém.\n\nD. Eis aqui a serva do Senhor.\nT. Faça-se em mim segundo a vossa Palavra.\n   Ave Maria...\n\nD. E o Verbo Divino se fez carne.\nT. E habitou entre nós.\n   Ave Maria...\n\nD. Rogai por nós, Santa Mãe de Deus.\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Derramai, Senhor, a vossa graça em nossas almas, a fim de que nós que, pela anunciação do anjo, viemos ao conhecimento da Encarnação do vosso Filho, cheguemos, por sua paixão e morte, à glória da ressurreição. Pelo mesmo Cristo Senhor nosso.\nT. Amém!\n\nD. Glória ao Pai, ao Filho e ao Espírito Santo.\nT. Como era no princípio, agora e sempre. Amém.", "rainha": "D. Rainha do céu, alegrai-vos, aleluia!\nT. Pois o Senhor que merecestes trazer em vosso seio, aleluia!\n\nD. Ressuscitou como disse, aleluia!\nT. Rogai a Deus por nós, aleluia!\n\nD. Alegrai-vos e exultai, ó Virgem Maria, aleluia!\nT. Porque o Senhor ressuscitou verdadeiramente, aleluia!\n\nOremos\n\nD. Ó Deus que, na gloriosa ressurreição do vosso Filho, destes alegria ao mundo inteiro, por intercessão da Virgem Maria, concedei-nos gozar a alegria perene da vida eterna. Por Cristo nosso Senhor.\nT. Amém!"}, "devotions": {"vigilia": {"formula1": "Primeira fórmula\n Santa Maria,\n Senhora Dos Seus Servos\nSalmodia\n\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n\n SALMO 8\n Majestade de Deus e dignidade do homem\n\"O Todo-Poderoso fez grandes coisas por mim\" (Lc\n1,49).\n– 2Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n– Desdobrastes nos céus vossa glória *\ncom grandeza, esplendor, majestade.\n= 3O perfeito louvor vos é dado †\npelos lábios dos mais pequeninos, *\nde crianças que a mãe amamenta.\n– Eis a força que opondes aos maus, *\nreduzindo o inimigo ao silêncio.\n– 4Contemplando estes céus que plasmastes *\ne formastes com dedos de artista;\n\n– vendo a lua e estrelas brilhantes, *\n perguntamos: ‘Senhor, que é o homem,\n– para dele assim vos lembrardes *\ne o tratardes com tanto carinho?’\n– 6Pouco abaixo de Deus o fizestes, *\ncoroando-o de glória e esplendor;\n– 7vós lhe destes poder sobre tudo, *\nvossas obras aos pés lhe pusestes:\n– 8as ovelhas, os bois, os rebanhos, *\ntodo o gado e as feras da mata;\n– 9passarinhos e peixes dos mares, *\ntodo ser que se move nas águas.\n– 10Ó Senhor nosso Deus, como é grande *\nvosso nome por todo o universo!\n1ª Ant. Bendita és tu entre as mulheres e bendito o fruto\n do teu ventre.\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume.\n\n SALMO 18\n Hino ao Criador do universo e Senhor da lei\n\n\"Quando o Verbo se fez carne, como um esposo, uniu-\nse à natureza humana: tálamo das núpcias foram as\nentranhas da Virgem Maria\" (Santo Agostinho)\n– 2Os céus proclamam a glória do Senhor, *\ne o firmamento, a obra de suas mãos;\n– 3o dia ao dia transmite esta mensagem, *\na noite à noite publica esta notícia.\n– 4Não são discursos nem frases ou palavras, *\nnem são vozes que possam ser ouvidas;\n– 5seu som ressoa e se espalha em toda a terra, *\nchega aos confins do universo a sua voz.\n– 6Armou no alto uma tenda para o sol; *\nele desponta no céu e se levanta\n– como um esposo do quarto nupcial, *\ncomo um herói exultante em seu caminho.\n– 7De um extremo do céu põe-se a correr *\ne vai traçando o seu rastro luminoso,\n– até que possa chegar ao outro extremo, *\ne nada pode fugir ao seu calor.\n\n– 8A lei do Senhor Deus é perfeita, *\nconforto para a alma!\n– O testemunho do Senhor é fiel, *\nsabedoria dos humildes.\n\n– 9Os preceitos do Senhor são precisos, *\nalegria ao coração.\n– O mandamento do Senhor é brilhante, *\npara os olhos é uma luz.\n– 10É puro o temor do Senhor, *\nimutável para sempre.\n– Os julgamentos do Senhor são corretos *\ne justos igualmente.\n– 11Mais desejáveis do que o ouro são eles, *\ndo que o ouro refinado.\n– Suas palavras são mais doces que o mel, *\nque o mel que sai dos favos.\n– 12E vosso servo, instruído por elas, *\nse empenha em guardá-las.\n– 13Mas quem pode perceber suas faltas? *\nPerdoai as que não vejo!\n\n– 14E preservai o vosso servo do orgulho: *\nnão domine sobre mim!\n– E assim puro, eu serei preservado *\ndos delitos mais perversos.\n– 15Que vos agrade o cantar dos meus lábios *\ne a voz da minha alma;\n– que ela chegue até vós, ó Senhor, *\n\nmeu Rochedo e Redentor!\n\n2ª Ant. Santa Mãe de Deus, como aroma precioso\n emanas suave perfume!\n\n3ª Ant. Ao prodígio da tua virgindade elevemos com\n júbilo um hino de alegria!\n\n SALMO 23\n O Senhor entra no seu Templo\n\"As portas do céu abriram-se ao Cristo quando\nassumiu a natureza humana\" (Santo Irineu)\n– 1Ao Senhor pertence a terra e o que ela encerra, *\no mundo inteiro com os seres que o povoam;\n– 2porque ele a tornou firme sobre os mares, *\ne sobre as águas a mantém inabalável.\n\n– 3“Quem subirá até o monte do Senhor, *\nquem ficará em sua santa habitação?”\n= 4“Quem tem mãos puras e inocente coração, †\nquem não dirige sua mente para o crime, *\nnem jura falso para o dano de seu próximo.\n– 5Sobre este desce a bênção do Senhor *\ne a recompensa de seu Deus e Salvador”.\n– 6“É assim a geração dos que o procuram, *\ne do Deus de Israel buscam a face”.\n\n= 7“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 8Dizei-nos: “Quem é este Rei da glória?” †\n“É o Senhor, o valoroso, o onipotente, *\no Senhor, o poderoso nas batalhas!”\n\n= 9“Ó portas, levantai vossos frontões! †\nElevai-vos bem mais alto, antigas portas, *\na fim de que o Rei da glória possa entrar!”\n= 10Dizei-nos: “Quem é este Rei da glória?” †\n“O Rei da glória é o Senhor onipotente, *\no Rei da glória é o Senhor Deus do universo!”\n3ª Ant. Ao prodígio da tua virgindade, elevemos com\n júbilo um hino de alegria!\nIntrodução às leituras\nD. Ave Maria, cheia de graça, o Senhor é convosco.\nT. Bendita sois vós entre as mulheres e bendito é o fruto\n do vosso ventre, Jesus!\nAbsolvição\n\nD. Pelas preces e méritos da bem-aventurada Virgem\n Maria e de todos os santos, o Senhor nos conduza ao\n Reino dos céus.\nT. Amém!\n\nPrimeira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Com seu divino Filho proteja-nos a Virgem Mãe.\nT. Amém!\n\nL. Santa Maria, Virgem das virgens, Mãe e Filha do\n Rei dos reis, dá-nos teu conforto nas dificuldades da\n vida. Por tua misericordiosa intercessão, o Senhor\n nos conceda o prêmio do céu e o reino eterno junto\n com seus eleitos. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nResponsório\nT. Como poderei louvar-te, Santa Virgem Maria? *\n Aquele que os céus não podem conter, o encerraste\n em teu seio!\nL. Bendita és tu entre as mulheres e bendito é o fruto\n do teu ventre!\nT. Aquele que os céus não podem conter, o encerraste\n em teu seio!\n\nSegunda leitura\nL. Invoca sobre mim a bênção do Senhor.\n\nD. A Virgem imaculada interceda por nós junto ao\n Senhor.\nT. Amém!\nL. Santa Maria, Mãe piedosa, intercede por nós,\n Virgem santa! Apresenta nossas súplicas ao teu Filho\n que, nascido para a nossa salvação, reina agora nos\n céus. Sua misericordiosa graça apague os nossos\n pecados. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\nResponsório\nT. Feliz és tu, Virgem Maria, pois trouxeste o Criador\n do mundo! * Deste à luz aquele que te criou e\n permaneceste sempre virgem!\nL. Ave, ó cheia de graça, o Senhor é contigo.\nT. Deste à luz aquele que te criou e permaneceste\n sempre virgem!\nTerceira leitura\nL. Invoca sobre mim a bênção do Senhor.\nD. Pela intercessão da Virgem Maria, o Senhor nos\n conceda a paz e a salvação.\nT. Amém!\nL. Santa Mãe de Deus, tu que foste digna de trazer em\n teu seio aquele que o universo não pode conter, acolhe\n a nossa súplica! Tua misericordiosa intercessão nos\n\n obtenha o perdão das culpas e tua maternal presença\n nos conduza à morada da luz, onde com teu Filho\n reinas eternamente. E tu, Senhor, tem piedade de nós!\nT. Demos graças a Deus!\n\nSalve Rainha\n\n Salve, Rainha, Mãe de misericórdia, vida, doçura e\nesperança nossa, salve! A vós bradamos os degredados\nfilhos de Eva. A vós suspiramos, gemendo e chorando\nneste vale de lágrimas. Eia, pois, advogada nossa, esses\nvossos olhos a nós volvei! E depois deste desterro,\nmostrai-nos Jesus, bendito fruto do vosso ventre. Ó\nclemente, ó piedosa, ó doce sempre Virgem Maria!\n\nD. Rogai por nós, santa Mãe de Deus!\nT. Para que sejamos dignos das promessas de Cristo.\n\nOremos\n\nD. Deus onipotente e eterno, que pela cooperação do\n Espírito Santo, preparastes, no corpo e na alma da\n bem-aventurada Virgem Maria, uma habitação digna\n do vosso Filho, fazei que celebrando com alegria sua\n memória, ela nos livre, por sua maternal intercessão,\n de todos os males da vida presente e da morte eterna.\n Por Cristo nosso Senhor.\nT. Amém!\n\n Oração pela Igreja pela Ordem\n Ó Senhor, por vossa misericórdia, dissolvei os\nvínculos dos nossos pecados e, pela intercessão da\nbem-aventurada Virgem Maria, Mãe de Deus, dos\nnossos Sete Santos Pais, do vosso servo São Filipe e de\ntodos os santos, guardai e santificai o papa NN, o nosso\nprior geral NN, a nós vossos servos, nossas\ncomunidades e benfeitores.\n Afastai do mal nossos pais, parentes e amigos e\nenriquecei-os de virtude. Concedei-nos saúde e paz.\nAfastai os inimigos visíveis e invisíveis e purificai-nos\nde todo desejo mundano. Dai serenidade aos ares e\nfertilidade aos campos.\n Libertai o mundo da fome, da guerra e de qualquer\noutro flagelo. Preservai ilesa de toda calamidade esta\ncidade e seus habitantes. Dai vosso amor a nossos\namigos e também a nossos inimigos, e concedei aos\nfiéis defuntos o eterno repouso. Amém!", "formula2": "Segunda fórmula\n Santa Maria\n Serva Do Senhor\nIntrodução\n\nD. Bendita sois vós entre as mulheres\nT. E bendito é o fruto do vosso ventre.\n\nD. Louvai comigo o Senhor pelas maravilhas que fez\n em Maria.\nT. Grandes e admiráveis são as tuas obras, Senhor\n Deus todo-poderoso! Justos e verdadeiros os teus\n caminhos, ó Rei do universo!\n\nHino\n \"Serva humilde eu sou do Senhor,\n em mim se faça segundo disseste\".\n Terra obediente tu és, ó Maria,\n terra que acolhe, que ama e adora.\n Filha querida do povo escolhido,\n santo rebento que brota em flor,\n flor desejada, esperada por todos,\n flor que embeleza o deserto do mundo.\n\n Dia após dia a Igreja repita\n as santas palavras da serva fiel:\n tudo haverá de voltar como outrora,\n quando Deus Pai caminhava no Éden.\n Glória à Trindade, Pai, Filho e Espírito,\n que desde sempre renovam o mundo:\n pois que nos deram uma Virgem e Mãe,\n beleza intacta de toda a criação.\n1ª Ant. Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\n SALMO 110\n Grandes são as obras do Senhor\n\"A minh'alma engrandece o Senhor, pois o Todo-\npoderoso fez em mim grandes coisas\" (Lc 1,46. 49).\n\n– 1Eu agradeço a Deus de todo o coração *\njunto com todos os seus justos reunidos!\n– 2Que grandiosas são as obras do Senhor, *\nelas merecem todo o amor e admiração!\n\n– 3Que beleza e esplendor são os seus feitos! *\nSua justiça permanece eternamente!\n– 4O Senhor bom e clemente nos deixou *\na lembrança de suas grandes maravilhas.\n\n– 5Ele dá o alimento aos que o temem *\ne jamais esquecerá sua Aliança.\n– 6Ao seu povo manifesta seu poder, *\ndando a ele a herança das nações.\n\n– 7Suas obras são verdade e são justiça, *\nseus preceitos, todos eles, são estáveis,\n– 8confirmados para sempre e pelos séculos, *\nrealizados na verdade e retidão.\n\n= 9Enviou libertação para o seu povo, †\nconfirmou sua Aliança para sempre. *\nSeu nome é santo e é digno de respeito.\n\n= 10Temer a Deus é o princípio do saber, †\ne é sábio todo aquele que o pratica. *\nPermaneça eternamente o seu louvor.\n\n1ª Ant. - Ave, Virgem fiel, mulher da nova aliança,\n primícias do Reino.\nOração sálmica\n Nós vos agradecemos, Senhor, porque por meio de\nMaria, vossa serva fiel, nos destes o Mediador da nova\nAliança. Concedei, vos pedimos, cumprir com amor os\n\nvossos preceitos e ser fiéis à vossa Palavra e ao nosso\ncompromisso de serviço. Por Cristo nosso Senhor.\nAmém!\n2ª Ant. Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\n SALMO 112\n A glória e a misericórdia do Senhor\n\"Olhou para a humildade de sua serva... Exaltou os\nhumildes\" (Lc 1, 48. 52).\n\n– 1Louvai, louvai, ó servos do Senhor, *\nlouvai, louvai o nome do Senhor!\n– 2Bendito seja o nome do Senhor, *\nagora e por toda a eternidade!\n– 3Do nascer do sol até o seu ocaso, *\nlouvado seja o nome do Senhor!\n– 4O Senhor está acima das nações, *\nsua glória vai além dos altos céus.\n= 5Quem pode comparar-se ao nosso Deus, †\nao Senhor, que no alto céu temo seu trono *\n e se inclina para olhar o céu e a terra?\n– 7Levanta da poeira o indigente *\ne do lixo ele retira o pobrezinho,\n– 8para fazê-lo assentar-se com os nobres, *\nassentar-se com os nobres do seu povo.\n\n– 9Faz a estéril, mãe feliz em sua casa, *\nvivendo rodeada de seus filhos.\n2ª Ant. - Ave, gloriosa Mãe de Cristo, em ti os humildes\n são exaltados, por ti renasce a esperança dos\n pobres.\nOração sálmica\n\nDo nascer ao pôr do sol, louvado seja o vosso nome,\nSenhor, porque escolhestes Maria, mulher humilde e\npobre, para ser a Mãe gloriosa do vosso Filho. Primeira\nentre os remidos, vós a colocastes na Igreja como Mãe\nfeliz de muitos filhos. Por Cristo nosso Senhor. Amém!\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\n SALMO 145\n Bem-aventurado aquele que espera no Senhor\n\"Sua misericórdia perdura de geração em geração\npara aqueles que o temem\" (Lc 1, 50).\n\n= 1Bendize, minh’alma, ao Senhor! †\n Bendirei ao Senhor toda a vida, *\ncantarei ao meu Deus sem cessar!\n\n– 3Não ponhais vossa fé nos que mandam, *\nnão há homem que possa salvar.\n\n = 4Ao faltar-lhe o respiro ele volta †\npara a terra de onde saiu; *\nnesse dia seus planos perecem.\n= 5É feliz todo homem que busca †\nseu auxílio no Deus de Jacó, *\ne que põe no Senhor a esperança.\n– 6O Senhor fez o céu e a terra, *\nfez o mar e o que neles existe.\n\n– O Senhor é fiel para sempre, *\n faz justiça aos que são oprimidos;\n – ele dá alimento aos famintos, *\né o Senhor quem liberta os cativos.\n\n= 8O Senhor abre os olhos aos cegos, †\no Senhor faz erguer-se o caído, *\no Senhor ama aquele que é justo.\n\n= 9É o Senhor quem protege o estrangeiro, †\nquem ampara a viúva e o órfão, *\nmas confunde os caminhos dos maus.\n\n=10O Senhor reinará para sempre! †\nÓ Sião, o teu Deus reinará *\npara sempre e por todos os séculos!\n\n3ª Ant. Ave, mulher da esperança! De ti nasceu a luz do\n mundo, por ti nos veio o Pão da vida.\nOração sálmica\n\n Ó Senhor, suba até vós o louvor perene dos Servos\nde Santa Maria, porque enviastes o vosso Filho para\nanunciar a Boa Nova aos pobres e proclamar a\nliberdade aos cativos. Reavivai em nós o compromisso\nde socorrer aos mais necessitados com amor fraterno e\nde defender os oprimidos com coragem evangélica. Por\nCristo nosso Senhor. Amém!\n\nIntrodução à leitura\n\nD. Bem-aventurada aquela que acreditou.\nT. Nela encarnou-se o Filho de Deus.\n\nPrimeira leitura\n\n À VIRGEM DO SIM\n\nL. Santa Maria, serva humilde do Senhor, gloriosa Mãe\n de Cristo, salve! Virgem fiel, ventre consagrado ao\n Verbo, ensina-nos a ser dóceis à voz do Espírito, a\n viver na escuta da Palavra, atentos a seus apelos no\n segredo do coração, vigilantes em suas\n manifestações na vida dos irmãos, nos\n acontecimentos da história, nos sofrimentos e nas\n\n alegrias da criação. Virgem da escuta, criatura\n orante, acolhe a súplica dos teus servos!\nResponsório\n\nT. Tu és, ó Maria, a terra prometida, figura do Reino\n que há de vir, * Igreja vivente do Verbo.\nL. Tu a terra sagrada que Cristo ainda geras. Tu a\n custódia vivente da Palavra.\nT. Igreja vivente do Verbo.\nSegunda leitura\n À VIRGEM DO \"MAGNIFICAT\"\nL. Santa Maria, mulher humilde e pobre, bendita do\n Altíssimo, salve! Virgem da esperança, profecia dos\n novos tempos, une ao teu canto as nossas vozes e\n acompanha-nos em nosso caminho, para que\n anunciemos a vinda do Reino e a total libertação dos\n seres humanos. Levando Cristo aos irmãos e irmãs e\n realizando com eles uma intensa comunhão de amor,\n glorificaremos contigo a misericórdia do Senhor e\n cantaremos as alegrias da vida e da salvação.\n Virgem, arca da nova Aliança, primícias da Igreja,\n acolhe as súplicas dos teus servos!\n\nResponsório\n\nT. Tu és a voz do antigo Israel, regozijo do pequeno\n resto, * canto de alegria da virgem Igreja.\nL. Por ti sobe o louvor de todos os remidos, dos pobres\n e humildes que esperam em Deus.\nT. Canto de alegria da virgem Igreja.\n\nTerceira leitura\n À VIRGEM AO PÉ DA CRUZ\nL. Santa Maria, mulher da dor, Mãe dos viventes,\n salve! Nova Eva, Virgem esposa junto à cruz, onde\n se consuma o amor e jorra a vida. Mãe dos\n discípulos, sê tu a imagem-guia em nosso\n compromisso de serviço. Ensina-nos a estar a teu\n lado aos pés das infinitas cruzes da humanidade,\n onde teu Filho continua crucificado; a viver e\n testemunhar o amor cristão, acolhendo todo ser\n humano como irmão; a renunciar ao disfarçado\n egoísmo para seguir a Cristo, única luz da\n humanidade. Virgem da Páscoa, glória do Espírito\n Santo, acolhe a súplica dos teus servos!\n\n SÚPLICA DOS SERVOS DE MARIA\n A NOSSA SENHORA\n Bondade, que nos abres o infinito\n tesouro da graça, Santa Mãe,\n infunde em teus servos a esperança.\n\n Virtude, que com bondade nos socorres\n na incerta e difícil caminhada,\n dá-nos a fidelidade em teu serviço!\n Reaviva em nós\n o antigo e sagrado compromisso\n de servir aos irmãos no amor\n e, com o olhar fixo em ti, seguir a Cristo!\nDespedida\nD. Proteja-nos Santa Maria e benigna nos acompanhe\n pelos caminhos da vida.\nT. Amém!"}, "coroa": "Pelo aporte determinante que os Servos de Maria deram à\nsua composição e pelo amor com que a divulgaram na Igreja, a\nCoroa de Nossa Senhora das Dores (ou a Coroa das Sete Dores)\npode ser considerada uma prática de piedade própria da\nOrdem.\n Não se sabe bem como começou. É muito provável que sua\norigem coincida com o crescimento do culto a Nossa Senhora\ndas Dores do início do século XVII.\n Apresentamos aqui duas fórmulas da Coroa: a primeira\né a tradicional; a segunda é nova, também articulada em \"sete\ndores\": é uma fórmula alternativa, que celebra o inesgotável\nmistério da dor da Virgem Maria a partir da categoria bíblica\nda rejeição, de profundo conteúdo teológico e presente na vida\nde Jesus.\n\n PRIMEIRA FÓRMULA\n\nD. Em nome do Pai, do Filho e do Espírito Santo.\nT. Amém!\n\nD. Nós vos louvamos e vos bendizemos, Senhor.\nT. Porque associastes a Virgem Mãe à obra da\n salvação.\nD. Contemplamos a vossa dor, Santa Maria.\nT. Para seguir-vos no caminho da fé.\n1ª DOR: Maria escuta com fé a profecia de Simeão (Lc\n 2,24-35).\n [Pai nosso e 7 Ave-Marias].\n2ª DOR: Maria foge para o Egito com Jesus e José (Mt\n 2,13-14).\n [Pai nosso e 7 Ave-Marias].\n3ª DOR: Maria procura Jesus, perdido em Jerusalém\n (Lc 2,43-45).\n [Pai nosso e 7 Ave-Marias].\n4ª DOR: Maria encontra-se com Jesus no caminho do\n Calvário (Lc 23, 25-27).\n [Pai nosso e 7 Ave-Marias].\n5ª DOR: Maria ao pé da cruz do Filho (Jo 19,25-27).\n [Pai nosso e 7 Ave-Marias].\n\n6ª DOR: Maria recebe nos braços o corpo de Jesus\n descido da cruz (Mc 15, 42-45).\n [Pai nosso e 7 Ave-Marias].\n\n7ª DOR: Maria deposita o corpo de Jesus no sepulcro, à\n espera da ressurreição (Jo 19, 40-42).\n [Pai nosso e 7 Ave-Marias].\nD. Nós vos louvamos, Santa Maria.\nT. Mãe fiel junto à cruz do Filho.\nD. Bendita sois vós, Rainha dos mártires: associada à\n paixão de Cristo, vos tornastes nossa Mãe.\nT. Sinal de esperança em nosso caminho.\n SEGUNDA FÓRMULA\nD. Em nome do Pai, do Filho e do Espírito Santo.\nT. Amém!\nD. Nós vos louvamos e vos bendizemos, Senhor.\nT. Porque associastes a Virgem Mãe à obra da salvação.\nD. Contemplamos a vossa dor, Santa Maria.\nT. Para seguir-vos no caminho da fé.\n\n1ª DOR: Jesus, Filho de Deus, nasce numa gruta: não\n havia lugar para a mãe na hospedaria (Lc 2,6-7).\n [Pai nosso e 7 Ave-Marias].\n\n2ª DOR: Jesus, Salvador dos homens, sinal de\n contradição (Lc 2,33-35).\n [Pai nosso e 7 Ave-Marias].\n3ª DOR: Jesus, Messias recém-nascido, é perseguido\n por Herodes (Mt 2,13-14).\n [Pai nosso e 7 Ave-Marias].\n\n4ª DOR: Jesus, irmão dos homens, é desprezado por\n seus concidadãos (Lc 4,28-29).\n [Pai nosso e 7 Ave-Marias].\n5ª DOR: Jesus, o Santo de Deus, é preso pelos sumos\n sacerdotes e abandonado pelos discípulos (Mt\n 26, 49-50).\n [Pai nosso e 7 Ave-Marias].\n\n6ª DOR: Jesus, o Justo, morre na cruz (Jo 19,25-27).\n [Pai nosso e 7 Ave-Marias].\n7ª DOR: Jesus, Mestre e Senhor, é perseguido nos seus\n discípulos (At 12, 1-3).\n [Pai nosso e 7 Ave-Marias].\nD. Nós vos louvamos, Santa Maria.\nT. Mãe fiel junto à cruz do Filho.\nD. Bendita sois vós, Rainha dos mártires; associada à\n paixão de Cristo, vos tornastes nossa Mãe.\nT. Sinal de esperança em nosso caminho.\n\n LADAINHA\n DE NOSSA SENHORA DAS DORES\nSenhor, tende piedade de nós! [repete-se]\nCristo, tende piedade de nós!\nSenhor, tende piedade de nós!\nCristo, ouvi-nos.\nCristo, atendei-nos.\n\nDeus Pai que estais no céu, Tende piedade de nós!\nDeus Filho, Redentor do mundo,\nEspírito Santo Paráclito,\nSantíssima Trindade que sois um só Deus,\n\nMãe do crucificado, Rogai por nós!\nMãe de coração traspassado,\nMãe do Cristo Redentor,\nMãe dos discípulos de Jesus,\nMãe dos redimidos,\nMãe dos viventes,\nVirgem obediente,\nVirgem oferente,\nVirgem fiel,\nVirgem do silêncio,\nVirgem do perdão,\nVirgem da espera,\n\nMulher do exílio,\nMulher forte,\nMulher intrépida,\nMulher da dor,\nMulher da nova aliança,\nMulher da esperança.\n\nNova Eva,\nCooperadora do Redentor,\nServa da reconciliação,\nDefesa dos inocentes,\nCoragem dos perseguidos,\nFortaleza dos oprimidos,\nEsperança dos pecadores,\nConsolação dos aflitos,\nRefúgio dos marginalizados.\nConforto dos exilados,\nSustentáculo dos fracos,\nAlívio dos enfermos,\n\nRainha dos mártires,\nGlória da Igreja,\nVirgem da Páscoa,\nCordeiro de Deus, que tirais os pecados do mundo\nT. Perdoai-nos, Senhor!\n\nCordeiro de Deus, que tirais os pecados do mundo\nT. Ouvi-nos, Senhor!\nCordeiro de Deus, que tirais os pecados do mundo\nT. Tende piedade de nós!\n\nOração\n\n Ó Deus, quisestes que a vida da Virgem Maria\nfosse marcada pelo mistério da dor. Humildemente vos\npedimos: concedei-nos trilhar a seu lado o caminho da\nfé e unir nossos sofrimentos à paixão de Cristo, para\nque se tornem momentos de graça e instrumentos de\nsalvação. Por Cristo nosso Senhor. Amém!", "stabat": "Estava a Mãe dolorosa,\njunto da cruz, lacrimosa,\nenquanto o filho pendia.\n\nNa sua alma agoniada\nenterrou-se a dura espada\nde uma antiga profecia.\n\nOh! quão triste e quão aflita,\nentre todas, Mãe bendita,\nque só tinha aquele Filho!\n\nQuanta angústia não sentia\nMãe piedosa, quando via\nas penas do Filho seu!\n\nQuem não chora, vendo isto:\ncontemplando a Mãe do Cristo\nnum suplício tão enorme?\n\nQuem haverá que resista,\nse a Mãe assim se contrista\npadecendo com seu Filho?\nPor culpa de sua gente,\nvia Jesus, inocente,\nentregando o seu espírito.\n\nVê agora o seu amado\npelo Pai abandonado,\nao flagelo submetido.\nFaze, ó Mãe, fonte de amor,\nque eu sinta o espinho da dor,\npara contigo chorar.\n\nFaze arder meu coração\ndo Cristo Deus na paixão,\npara que o possa agradar.\nÓ Santa Mãe, dá-me isto:\ntrazer as chagas do Cristo\ngravadas no coração.\nDo teu Filho, que por mim\nentrega-se a morte assim,\ndivide as penas comigo.\nOh! dá-me, enquanto viver,\ncom Cristo compadecer,\nchorando sempre contigo.\nJunto à cruz eu quero estar,\nquero o meu pranto juntar\nàs lágrimas que derramas.\nVirgem, que às virgens aclara,\nnão sejas comigo avara:\ndá-me contigo chorar.\n\nTraga em mim do Cristo a morte,\nda paixão seja consorte,\nsuas chagas celebrando.\n\nPor elas seja eu rasgado,\npela cruz inebriado,\npelo sangue de teu Filho!\nNo julgamento consegue\nque às chamas não se entregue\nquem por ti é defendido.\nQuando do mundo eu partir,\ndai-me, ó Cristo, conseguir,\npor vossa Mãe, a vitória.\n\nQuando o meu corpo morrer,\npossa a alma merecer\ndo Reino celeste a glória. Amém!", "via_matris": {"intro": "Assim como celebramos a Via Sacra, caminho\npercorrido por Jesus na sua paixão e morte de cruz,\ncelebramos também a Via Matris, isto é, o caminho\nde dor percorrido por Maria, desde a profecia do justo\nSimeão, passando pela fuga para o Egito e a perda de\nJesus no Templo até sua paixão e morte na cruz. Foi\no caminho que ela fez ao lado de Jesus, cooperando\ncom ele na obra de redenção humana.\n Celebramos as dores de Maria não para mover-\nnos de compaixão por ela, pelo que ela sofreu, mas\nantes para encher-nos de coragem e enfrentar como\nela, “de pé”, os sofrimentos desta vida e, ao mesmo\ntempo, para colocar-nos, como ela, aos pés das\ninfinitas cruzes que afligem os homens e mulheres de\nhoje, para levar-lhes conforto e esperança de\nlibertação. Não é, portanto, uma celebração para\nprovocar sentimentalismo pietista, mas sim\ncompaixão e solidariedade com os que sofrem.\n\n14 O presente texto da Via Matris foi composto por frei José M. Milanez, seguindo o\n\n roteiro tradicional, isto é: leitura bíblica, reflexão, invocações e canto.\n\n Desde as origens, os Servos de Maria sempre\ntiveram a Virgem Gloriosa, Mãe da Misericórdia, como\nsua Senhora, Fundadora e Guia. A partir do século XVII\naté meados do século XX, a devoção a Nossa Senhora\ndas Dores passou a ser considerada como o aspecto\npredominante do seu carisma mariano.\n A Via Matris é uma expressão dessa devoção e\nfoi introduzida no Brasil em 1920, quando os\nprimeiros Servos de Maria aqui chegaram. Até a\ndécada de sessenta do século passado era celebrada\ntoda sexta-feira em nossas igrejas. Depois, ficou\nalguns anos esquecida e hoje volta a ser valorizada.\n O presente roteiro da Via Matris segue o\nesquema tradicional, isto é: leitura do evangelho, breve\nreflexão, invocações e canto. Esse exercício de piedade\nevoca as sete principais dores da vida de Maria. Como\na Via Sacra, celebra-se em procissão, passando de uma\nestação para outra. Cada estação representa uma das\nsete dores de Maria.\n A origem dessa prática de piedade remonta ao\nséculo XVIII. Era praticada inicialmente, de maneira\nprivada, nas igrejas dos Servos de Maria da Espanha. É\nde 1842 um documento conservado até hoje, que ensina\ncomo celebrar a Via Matris.\n Esse piedoso exercício é conhecido também\ncomo “Novena perpétua de Nossa Senhora das Dores”\ne teve como seu maior propagador frei Tiago M. Keane\n\n(1901-1975), servita norte-americano que, em 1937,\nintroduziu sua celebração toda sexta-feira na igreja dos\nServos de Maria de Chicago, dedicada à Nossa Senhora\ndas Dores. Daí a devoção expandiu-se rapidamente em\n45 Estados do país e em cerca de 20 países do mundo.\nFrei Tiago escreveu um livreto intitulado “Novena em\nhonra de Nossa Mãe Dolorosa” que alcançou a tiragem\nde seis milhões de exemplares e dezessete edições, e\nfoi traduzido em vinte e dois idiomas15.\n A primeira edição em língua portuguesa foi\npublicada em São Paulo, em 1942. No frontispício do\nlivreto diz-se que foi “extraída de fontes aprovadas e\nadaptada para uso do povo pelo Revdo. Frei Thiago M.\nKeane, O.S.M., e traduzida para o português por frei\nThiago M. Mattioli, O.S.M.”16.\n Os trechos evangélicos são tirados da Bíblia\nSagrada, tradução da CNBB. As orações e a breve\nreflexão que segue à leitura evangélica são uma\nhumilde tentativa do autor para adaptar o conteúdo da\nmensagem e da oração à nossa realidade brasileira. A\nestrofe e o refrão do canto entoado enquanto se passa\n\n Esses dados sobre a Via Matris foram extraídos do Dicionário de Mariologia (dirigido por\n Stefano d
