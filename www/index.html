<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Liturgia OSM — Servos de Maria</title>
<link rel="stylesheet" href="./app.css">

<link rel="stylesheet" href="liturgical-reader.css">
<link rel="stylesheet" href="typography.css">
</head>
<body>
<a class="skip-link" href="#view">Ir para o conteúdo</a>
<div id="app">

  <!-- ===== Ambient background ornament ===== -->
  <div class="ambient" aria-hidden="true">
    <svg class="star-field" viewBox="0 0 400 800" preserveAspectRatio="none"></svg>
  </div>

  <!-- ===== Header ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-text">
        <h1>Liturgia <span class="brand-tag">OSM</span></h1>
      </div>
      <div class="topbar-tools" aria-label="Menu">
<button class="tool-btn" onclick="openMainMenu()" aria-label="Abrir menu" id="menuBtn" aria-expanded="false" aria-controls="mainMenuOverlay" aria-haspopup="dialog">☰</button>
      </div>
    </div>
  </header>
<main id="view" tabindex="-1" aria-live="polite"></main>
  <button id="floatingBack" class="floating-back" onclick="smartBack()" aria-label="Voltar" title="Voltar">←</button>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
    <button class="tab-btn" data-tab="vida"><svg viewBox="0 0 24 24"><path d="M12 3 L14.2 9.2 L21 9.5 L15.6 13.6 L17.4 20.2 L12 16.4 L6.6 20.2 L8.4 13.6 L3 9.5 L9.8 9.2 Z"/></svg><span>Início</span></button>
    <button class="tab-btn" data-tab="liturgia"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Missa e Ofício</span></button>
    <button class="tab-btn" data-tab="oracoes"><svg viewBox="0 0 24 24"><path d="M12 21c-4-3-8-6.2-8-10.6C4 7 6.4 5 9.1 5c1.2 0 2.3.5 3 1.4C12.6 5.5 13.7 5 14.9 5 17.6 5 20 7 20 10.4 20 14.8 16 18 12 21Z"/></svg><span>Orações</span></button>
  </nav>

</div>

<div id="mainMenuOverlay" role="dialog" aria-modal="true" aria-labelledby="mainMenuTitle" tabindex="-1" class="main-menu-overlay" aria-hidden="true" onclick="if(event.target===this)closeMainMenu()">
 <aside class="main-menu"></aside>
</div>

<div id="serviteOverlay" role="dialog" aria-modal="true" aria-labelledby="serviteTitle" tabindex="-1" class="servite-overlay" aria-hidden="true">
  <div class="servite-head">
    <button class="servite-close" onclick="closeServite()" aria-label="Fechar recurso">✕</button>
    <div class="servite-title" id="serviteTitle">Recurso OSM</div>
    <div class="mini-tools"><button onclick="serviteAdjustFont(-1)" aria-label="Diminuir fonte">A−</button><button onclick="serviteAdjustFont(1)" aria-label="Aumentar fonte">A+</button><button onclick="serviteReload()" aria-label="Recarregar">↻</button></div>
  </div>
  <iframe id="serviteFrame" class="servite-frame" title="Conteúdo OSM"></iframe>
</div>

<button id="celebrationToggle" class="celebration-toggle" onclick="toggleCelebrationMode()">Modo celebração</button>

<div id="dailyLiturgyOverlay" role="dialog" aria-modal="true" aria-labelledby="dailyLiturgyTitle" tabindex="-1" class="daily-liturgy-overlay" aria-hidden="true">
  <div class="daily-liturgy-head"><button onclick="closeDailyLiturgy()" aria-label="Voltar">‹</button><div><b id="dailyLiturgyTitle">Missa do dia</b><small>Consulta online; cópias locais por até 30 dias</small></div><span aria-hidden="true"></span></div>
  <div class="daily-liturgy-body"><div class="daily-date-nav"><button onclick="moveDailyDate(-1)" aria-label="Dia anterior">‹</button><div class="daily-date-field"><span id="dailyLiturgyDateDisplay" class="daily-date-display" aria-hidden="true"></span><span class="daily-date-chevron" aria-hidden="true">⌄</span><input id="dailyLiturgyDate" type="date" aria-label="Selecionar data da liturgia" onchange="loadDailyLiturgy(this.value)"></div><button onclick="moveDailyDate(1)" aria-label="Dia seguinte">›</button></div><div id="dailyLiturgyContent"></div></div>
</div>

<script src="./search.js"></script>
<script src="./reminders.js"></script>
<script src="./widget-links.js"></script>
<script src="./data/load-devotions.js"></script>
<script>loadOSMDevotionalData().then(function(){var script=document.createElement('script');script.src='./app.js';document.body.appendChild(script);}).catch(function(error){console.error('[Liturgia OSM] Falha ao carregar orações.',error);document.getElementById('view').innerHTML='<div class="empty-state">Não foi possível carregar as orações. Verifique o armazenamento do aplicativo.</div>';});</script>
</body>
</html>
